          id, label: pack.label, industry: pack.industry || '—', tenantName: pack.tenantName, tagline: pack.tagline,
          entities: identity.stats.entities, records: identity.stats.sourceRecords,
          edges: graph.edges.length, systems: pack.systems.length, degraded: degraded.length,
          findings: resolution.conflicts.length,
          actionable: resolution.conflicts.filter((c) => c.actionable).length,
          critical: resolution.conflicts.filter((c) => c.severity === 'critical').length,
          queue: identity.stats.needsReview, openTasks,
          alignment: profiles.length ? Math.round(profiles.reduce((a, b) => a + b.alignment, 0) / profiles.length) : 100,
          counts, entityTypes: pack.entityTypes, roles: pack.roles, fields: pack.fields.length,
          policyChanged: Object.keys(state.policies[id] || {}).length,
          syncState: pack.syncState, systemList: pack.systems, recordCounts: pack.recordCounts,
          generated: !!pack.industry && ['salon', 'edu', 'wealth', 'freight'].indexOf(id) >= 0,
        };
      });
      const totals = tenants.reduce((a, t) => ({
        entities: a.entities + t.entities, records: a.records + t.records, edges: a.edges + t.edges,
        systems: a.systems + t.systems, findings: a.findings + t.findings, queue: a.queue + t.queue,
        degraded: a.degraded + t.degraded, critical: a.critical + t.critical,
      }), { entities: 0, records: 0, edges: 0, systems: 0, findings: 0, queue: 0, degraded: 0, critical: 0 });
      platformCache = { tenants, totals };
      return platformCache;
    }

    const api = {
      get state() { return state; },
      get view() { return view || recompute(); },
      packs: Object.keys(packs).map((k) => ({ id: k, label: packs[k].label, tenantName: packs[k].tenantName, tagline: packs[k].tagline })),

      subscribe(fn) { listeners.push(fn); return () => listeners.splice(listeners.indexOf(fn), 1); },

      signIn(roleId) {
        state.roleId = roleId; state.signedIn = true; state.owner = false;
        audit('session.start', 'Signed in as ' + roleId);
        emit();
      },
      signInOwner() {
        state.owner = true; state.signedIn = true;
        audit('session.start', 'Operator console opened', 'platform');
        emit();
      },
      signOut() { state.signedIn = false; state.owner = false; emit(); },
      setRole(roleId) { state.roleId = roleId; audit('session.role', 'Switched to ' + roleId); emit(); },
      platform,
      platformReady: () => !!platformCache,
      get audit() { return state.audit; },
      setPack(packId) {
        if (!packs[packId]) return;
        state.packId = packId;
        const pack = preparePack(packId);
        state.roleId = pack.roles[0].id;
        state.owner = false;
        audit('tenant.open', 'Opened ' + pack.tenantName, packId);
        emit();
      },

      setSystemOfRecord(field, systemId) {
        const pack = view.pack;
        const cur = (state.policies[pack.id] && state.policies[pack.id][field]) || pack.policy[field] || [];
        const next = [systemId].concat(cur.filter((s) => s !== systemId));
        state.policies[pack.id] = Object.assign({}, state.policies[pack.id], { [field]: next });
        audit('policy.change', field + ' → ' + pack.systemById[systemId].name);
        emit();
      },
      resetPolicy() { delete state.policies[view.pack.id]; audit('policy.reset', 'Restored default policy'); emit(); },
      policyChanged() {
        const o = state.policies[view.pack.id] || {};
        return Object.keys(o).filter((k) => o[k].join(',') !== (view.pack.policy[k] || []).join(','));
      },

      setTaskStatus(id, status) { state.taskStatus[view.pack.id + '::' + id] = status; audit('task.' + status, id); emit(); },
      bulkTaskStatus(ids, status) { ids.forEach((id) => { state.taskStatus[view.pack.id + '::' + id] = status; }); audit('task.bulk', ids.length + ' items → ' + status); emit(); },

      confirmLink(entityId, system, nativeId) {
        const e = view.identity.entityById[entityId];
        if (!e) return;
        const anchor = e.links.find((l) => l.method === 'anchor') || e.links[0];
        state.forcedLinks.push({ pack: view.pack.id, a: anchor.system + ':' + anchor.nativeId, b: system + ':' + nativeId });
        audit('identity.confirm', pack_(view).systemById[system].name + ' ' + nativeId + ' → ' + e.displayName);
        emit();
      },
      dismissRecord(system, nativeId) { state.dismissedKeys.push(view.pack.id + '::' + system + ':' + nativeId); audit('identity.dismiss', system + ' ' + nativeId); emit(); },

      resetAll() {
        state.policies = {}; state.taskStatus = {}; state.forcedLinks = []; state.dismissedKeys = [];
        audit('prototype.reset', 'All local changes cleared');
        emit();
      },

      canOpen, visible, formatValue,
      packFor: (id) => preparePack(id),
      /** A coded value that points at another entity, resolved to that entity. */
      resolveCode(fieldKey, value) {
        const ref = (view.pack.codeRefs || {})[fieldKey];
        if (!ref || value == null) return null;
        const id = view.codeIndex[ref[0] + '|' + value];
        return id && canOpen(id) ? view.profiles[id] : null;
      },
      canSee: (sensitivity) => SOT.schema.canSee(api.view.role, sensitivity),
      statsFor: (id) => view.stats[id] || [],
    };

    recompute();
    return api;
  }

  const pack_ = (v) => v.pack;

  SOT.store = { create, formatValue };
})(window.SOT || (window.SOT = {}));
</script>
<script>
/* --- ui/components.js --- */
/* SOT — presentation primitives.
 *
 * Plain functions returning HTML strings. No framework: the dataset is small
 * enough that re-rendering the whole view on any change is imperceptible, and
 * it keeps the prototype dependency-free. In a production build these become
 * components with the same signatures.
 */
(function (SOT) {
  'use strict';

  const esc = (s) =>
    String(s === null || s === undefined ? '' : s)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
  const at = esc;

  /* --------------------------------------------------------------- format */

  const DATEY = /(^|[a-z])(At|Date|Expiry|ExpiresOn|expiresOn|dob|CurrentTo)$|^dob$|^admitAt$|^eventDate$/;

  function date(ts) {
    if (!ts && ts !== 0) return '—';
    return new Date(ts).toLocaleDateString('en-GB', { day: 'numeric', month: 'short', year: 'numeric' });
  }
  function dateTime(ts) {
    if (!ts) return '—';
    return new Date(ts).toLocaleString('en-GB', { day: 'numeric', month: 'short', year: 'numeric', hour: '2-digit', minute: '2-digit' });
  }
  function ago(ts, now) {
    if (!ts) return 'never';
    const d = (now || Date.now()) - ts;
    if (d < 0) return 'in ' + ago(now - (ts - now), now);
    const m = Math.round(d / 60000);
    if (m < 1) return 'just now';
    if (m < 60) return m + ' min ago';
    const hh = Math.round(m / 60);
    if (hh < 24) return hh + (hh === 1 ? ' hour ago' : ' hours ago');
    const dd = Math.round(hh / 24);
    if (dd < 45) return dd + (dd === 1 ? ' day ago' : ' days ago');
    return date(ts);
  }

  /** Field values are stored raw; prose happens here and nowhere else. */
  function value(key, v) {
    if (v === null || v === undefined || v === '') return '—';
    if (typeof v === 'number' && Math.abs(v) > 1e10 && DATEY.test(key)) return date(v);
    if (key === 'lengthOfDays') return v + (v === 1 ? ' day' : ' days');
    if (key === 'beds' || key === 'licensedBeds' || key === 'authorizedStrength') return String(v);
    return String(v);
  }

  function statValue(s) {
    if (s.value === null || s.value === undefined) return '—';
    switch (s.fmt) {
      case 'pct': return s.value + '%';
      case 'days': return s.value + (s.value === 1 ? ' day' : ' days');
      case 'daysAgo': return s.value + 'd';
      case 'years': return s.value + ' yr';
      case 'ratio': return s.value + '×';
      case 'money': {
        const v = Math.abs(s.value);
        if (v >= 1e9) return '$' + (v / 1e9).toFixed(1) + 'bn';
        if (v >= 1e6) return '$' + (v / 1e6).toFixed(v >= 1e7 ? 0 : 1) + 'm';
        if (v >= 1e3) return '$' + Math.round(v / 1e3) + 'k';
        return '$' + Math.round(v);
      }
      case 'miles': return Math.round(s.value).toLocaleString('en-US') + ' mi';
      case 'hours': return s.value + ' h';
      case 'date': return date(s.value);
      default: return typeof s.value === 'number' ? s.value.toLocaleString('en-US') : String(s.value);
    }
  }

  /* -------------------------------------------------------------- visuals */

  function initials(name) {
    return String(name || '?').split(/\s+/).filter(Boolean).slice(0, 2).map((w) => w[0]).join('').toUpperCase();
  }

  /** People get initials, everything else gets its type glyph. */
  function avatar(profile, pack, cls) {
    const t = pack.typeById[profile.type];
    const person = t.kind === 'person';
    return '<span class="av ' + (person ? '' : 'sq ') + (cls || '') + '" aria-hidden="true">' +
      (person ? esc(initials(profile.name)) : esc(t.glyph)) + '</span>';
  }

  function tag(text, cls) { return '<span class="tag ' + (cls || '') + '">' + esc(text) + '</span>'; }
  function severityTag(sev) { return '<span class="tag ' + sev + '"><i class="dot"></i>' + esc(sev) + '</span>'; }
  function kindTag(kind) {
    const label = { divergence: 'Divergence', gap: 'Gap', lag: 'Lag', identity: 'Identity' }[kind] || kind;
    const cls = { divergence: 'critical', gap: 'medium', lag: 'low', identity: 'line' }[kind] || '';
    return '<span class="tag ' + cls + '">' + esc(label) + '</span>';
  }
  function systemTag(pack, id) {
    const s = pack.systemById[id];
    if (!s) return '';
    return '<span class="systag"><i class="sysdot"></i>' + esc(s.name) + '</span>';
  }
  function systemLink(pack, id, nativeId) {
    const s = pack.systemById[id];
    if (!s) return '';
    return '<a class="btn sm" href="' + at(s.deepLink.replace('{id}', encodeURIComponent(nativeId))) +
      '" target="_blank" rel="noopener noreferrer">' + esc(s.name) + ' ↗</a>';
  }

  function ring(pct, size) {
    const s = size || 54;
    const r = s / 2 - 4;
    const c = 2 * Math.PI * r;
    const on = (Math.max(0, Math.min(100, pct)) / 100) * c;
    const colour = pct >= 95 ? 'var(--ok)' : pct >= 80 ? 'var(--sev-medium)' : 'var(--sev-critical)';
    return '<div class="ring" style="width:' + s + 'px;height:' + s + 'px">' +
      '<svg width="' + s + '" height="' + s + '" viewBox="0 0 ' + s + ' ' + s + '" style="transform:rotate(-90deg)">' +
      '<circle cx="' + s / 2 + '" cy="' + s / 2 + '" r="' + r + '" fill="none" stroke="var(--surface-3)" stroke-width="4"/>' +
      '<circle cx="' + s / 2 + '" cy="' + s / 2 + '" r="' + r + '" fill="none" stroke="' + colour +
      '" stroke-width="4" stroke-linecap="round" stroke-dasharray="' + on.toFixed(1) + ' ' + c.toFixed(1) + '"/></svg>' +
      '<span class="v" style="color:' + colour + '">' + Math.round(pct) + '</span></div>';
  }

  function stat(k, v, h, cls) {
    return '<div class="card stat ' + (cls || '') + '"><div class="k">' + esc(k) + '</div>' +
      '<div class="v">' + (typeof v === 'string' && v.indexOf('<') === 0 ? v : esc(String(v))) + '</div>' +
      (h ? '<div class="h">' + esc(h) + '</div>' : '') + '</div>';
  }

  function statTile(s) {
    return '<div class="card stat"><div class="k">' + esc(s.label) + '</div>' +
      '<div class="v">' + esc(statValue(s)) + '</div>' +
      '<div class="h">' + esc(s.hint || '') + '</div></div>';
  }

  function entityLine(profile, pack, sub) {
    const t = pack.typeById[profile.type];
    const subtitle = sub !== undefined ? sub : (t.subtitle || []).map((k) => profile.get(k)).filter(Boolean).join(' · ');
    return '<span class="eline">' + avatar(profile, pack, 'sm') +
      '<span style="min-width:0"><span class="n">' + esc(profile.name) + '</span>' +
      (subtitle ? '<br><span class="s">' + esc(subtitle) + '</span>' : '') + '</span></span>';
  }

  function entityCard(profile, pack, extra) {
    const t = pack.typeById[profile.type];
    const sub = (t.subtitle || []).map((k) => profile.get(k)).filter(Boolean).join(' · ');
    const open = profile.conflicts.filter((c) => c.actionable).length;
    return '<button class="ecard" data-go="#/e/' + at(profile.entity.id) + '">' +
      '<span class="top">' + avatar(profile, pack) +
      '<span style="min-width:0"><span class="nm">' + esc(profile.name) + '</span><br>' +
      '<span class="ti">' + esc(sub || t.label) + '</span></span></span>' +
      '<span class="meta">' + (extra || '') +
      '<span style="margin-left:auto">' +
      (open ? '<span class="tag critical">' + open + ' open</span>' : '<span class="tag ok">' + profile.alignment + '%</span>') +
      '</span></span></button>';
  }

  function tabs(items, current, action) {
    return '<div class="tabs">' + items.map((t) =>
      '<button class="' + (t.id === current ? 'on' : '') + '" data-act="' + at(action) + '" data-tab="' + at(t.id) + '">' +
      esc(t.label) + (t.count !== undefined && t.count !== null ? '<span class="c">' + t.count + '</span>' : '') +
      '</button>').join('') + '</div>';
  }

  function empty(text) { return '<div class="empty">' + esc(text) + '</div>'; }

  const MARK =
    '<svg class="mark" viewBox="0 0 32 32" fill="none" aria-hidden="true">' +
    '<g stroke="currentColor" stroke-width="2.2" stroke-linecap="round">' +
    '<path d="M3 6.5C12 6.5 12.5 16 20 16" opacity=".34"/>' +
    '<path d="M3 16H20" opacity=".62"/>' +
    '<path d="M3 25.5C12 25.5 12.5 16 20 16" opacity=".34"/></g>' +
    '<circle cx="23.4" cy="16" r="4.6" fill="currentColor"/></svg>';

  function wordmark(cls) {
    return '<span class="wordmark">' + MARK.replace('class="mark"', 'class="mark ' + (cls || '') + '"') +
      '<span><span class="wm-name">SOT</span><span class="wm-sub">Source of Truth</span></span></span>';
  }

  SOT.ui = {
    esc, at, date, dateTime, ago, value, statValue, initials, avatar, tag, severityTag, kindTag,
    systemTag, systemLink, ring, stat, statTile, entityLine, entityCard, tabs, empty, wordmark, MARK,
  };
})(window.SOT || (window.SOT = {}));
</script>
<script>
/* --- ui/views.js --- */
/* SOT — dashboard, type browser, and the universal entity page.
 *
 * There is one entity page, not five. A clinician, a patient, a ward, a
 * facility and a visit all render through the same function, because in the
 * model they are the same kind of thing: something with resolved fields,
 * provenance, statistics and typed relationships. That is what lets a user
 * click from a doctor to a ward to a visit to a patient to the nurse who was
 * on that visit without ever leaving the same interface.
 */
(function (SOT) {
  'use strict';

  const U = () => SOT.ui;
  const S = SOT.schema;

  /** A field value, rendered as a link when it points at another entity. */
  function fieldHtml(ctx, key, value) {
    const u = U();
    const target = ctx.store.resolveCode(key, value);
    if (!target) return u.esc(u.value(key, value));
    return '<a class="link" data-go="#/e/' + u.at(target.entity.id) + '" href="#/e/' + u.at(target.entity.id) + '">' +
      u.esc(target.name) + '</a>';
  }

  /* ============================================================= DASHBOARD */

  function dashboard(ctx) {
    const u = U();
    const { view, store } = ctx;
    const pack = view.pack;
    const sum = view.summary;
    const degraded = pack.systems.filter((s) => pack.syncState[s.id].status !== 'healthy');

    const typeCards = pack.entityTypes.map((t) => {
      const n = sum.counts[t.id];
      const denied = view.scope.allowed[t.id] instanceof Set && view.scope.allowed[t.id].size === 0;
      return '<button class="ecard" data-go="#/t/' + u.at(t.id) + '"' + (denied ? ' disabled style="opacity:.45"' : '') + '>' +
        '<span class="top"><span class="av sq">' + u.esc(t.glyph) + '</span>' +
        '<span><span class="nm num">' + (denied ? '—' : n.toLocaleString('en-US')) + '</span><br>' +
        '<span class="ti">' + u.esc(t.plural) + '</span></span></span>' +
        '<span class="meta">' + (denied ? 'Not visible to ' + u.esc(view.role.name) : 'Browse all ' + u.esc(t.plural.toLowerCase())) + '</span></button>';
    }).join('');

    // Most recent event-kind entities in scope — the pulse of the organisation.
    const eventType = pack.entityTypes.find((t) => t.kind === 'event');
    let recent = [];
    if (eventType) {
      recent = store.visible(eventType.id)
        .filter((p) => p.get(eventType.dateField))
        .sort((a, b) => b.get(eventType.dateField) - a.get(eventType.dateField))
        .slice(0, 7);
    }

    const worst = view.conflicts.filter((c) => sum.inScope.has(c.entityId) && c.actionable).slice(0, 6);

    return (
      '<div class="head"><div><h1>' + u.esc(pack.tenantName) + '</h1>' +
      '<div class="sub">' + u.esc(view.role.blurb) + ' Every figure below is resolved from ' + pack.systems.length +
      ' connected systems under the current system-of-record policy — nothing here is stored as a merged record.</div></div>' +
      '<div class="acts"><span class="tag line">As of ' + u.esc(u.date(view.asOf)) + '</span>' +
      '<a class="btn" href="#/integrity">Data integrity</a></div></div>' +

      (degraded.length
        ? '<div class="note medium" style="margin-bottom:12px"><span>▲</span><div><b>' + u.esc(degraded[0].name) +
          ' has not been read in ' + u.esc(u.ago(pack.syncState[degraded[0].id].lastSync, view.asOf).replace(' ago', '')) + '.</b> ' +
          u.esc(pack.syncState[degraded[0].id].message || '') +
          ' Its disagreements are being reported as lag rather than conflict. <a class="link" href="#/systems">Connector status</a></div></div>'
        : '') +

      '<div class="grid g-cards" style="margin-bottom:12px">' + typeCards + '</div>' +

      '<div class="grid g-stat" style="margin-bottom:12px">' +
      u.stat('Open findings', sum.actionable, sum.bySeverity.critical + ' critical · ' + sum.bySeverity.high + ' high', sum.bySeverity.critical ? 'hot' : '') +
      u.stat('Classified as lag', sum.byKind.lag, 'Behind, not wrong — excluded from the queue') +
      u.stat('System alignment', sum.alignment + '%', 'Weighted across every reconciled field') +
      u.stat('Identity queue', sum.identity.needsReview, 'Records awaiting a human decision') +
      u.stat('Relationships', view.graph.edges.length.toLocaleString('en-US'), 'Typed and time-bounded') +
      '</div>' +

      '<div class="split"><div class="grid" style="gap:12px">' +
      '<div class="card"><div class="card-h"><h3>Needs attention</h3>' +
      '<div class="right"><a class="btn sm" href="#/tasks">Remediation queue</a></div></div>' +
      '<div class="card-b flush">' +
      (worst.length
        ? '<table class="tbl"><tbody>' + worst.map((c) =>
            '<tr class="go" data-drawer="conflict:' + u.at(c.id) + '"><td>' +
            '<div style="font-weight:560">' + u.esc(c.fieldLabel) + ' — ' + u.esc(c.entityName) + '</div>' +
            '<div class="dim" style="font-size:11px;margin-top:2px">' +
            u.esc(pack.systemById[c.resolvedSystem].name) + ' says “' + u.esc(store.formatValue(c.field, c.resolvedValue)) + '”, ' +
            u.esc(c.offenders.map((o) => pack.systemById[o.systemId].name + (o.kind === 'gap' ? ' has nothing' : ' says “' + store.formatValue(c.field, o.value) + '”')).join('; ')) +
            '</div></td><td style="text-align:right;white-space:nowrap">' + u.severityTag(c.severity) + '</td></tr>').join('') + '</tbody></table>'
        : u.empty('Nothing outstanding in your scope.')) +
      '</div></div>' +

      (recent.length
        ? '<div class="card"><div class="card-h"><h3>Recent ' + u.esc(eventType.plural.toLowerCase()) + '</h3>' +
          '<div class="right"><a class="btn sm" href="#/t/' + u.at(eventType.id) + '">All</a></div></div>' +
          '<div class="card-b flush"><table class="tbl"><tbody>' +
          recent.map((e) => {
            const unit = view.graph.neighbours(e.entity.id, pack.id === 'health' ? 'occurred_at' : 'conducted_at', { dir: 'out' })[0];
            return '<tr class="go" data-go="#/e/' + u.at(e.entity.id) + '">' +
              '<td>' + u.entityLine(e, pack) + '</td>' +
              '<td class="dim">' + (unit ? u.esc(view.profiles[unit.entity.id].name) : '') + '</td>' +
              '<td style="text-align:right;white-space:nowrap" class="dim">' + u.esc(u.ago(e.get(eventType.dateField), view.asOf)) + '</td></tr>';
          }).join('') + '</tbody></table></div></div>'
        : '') +
      '</div>' +

      '<div class="grid" style="gap:12px">' +
      '<div class="card"><div class="card-h"><h3>Findings by kind</h3></div><div class="card-b">' +
      ['divergence', 'gap', 'lag'].map((k) => {
        const n = sum.byKind[k];
        const total = sum.conflicts || 1;
        return '<div style="margin-bottom:11px"><div style="display:flex;gap:8px;align-items:center;margin-bottom:4px">' +
          u.kindTag(k) + '<span class="num dim" style="margin-left:auto;font-size:12px">' + n + '</span></div>' +
          '<div class="bar"><i style="width:' + Math.round((n / total) * 100) + '%"></i></div>' +
          '<div class="dim" style="font-size:11px;margin-top:4px">' + u.esc(S.CONFLICT_KINDS[k].blurb) + '</div></div>';
      }).join('') +
      '</div></div>' +

      '<div class="card"><div class="card-h"><h3>Connected systems</h3><div class="right"><a class="btn sm" href="#/systems">Details</a></div></div>' +
      '<div class="card-b flush"><table class="tbl"><tbody>' +
      pack.systems.map((s) => {
        const st = pack.syncState[s.id];
        return '<tr><td>' + u.systemTag(pack, s.id) + '</td>' +
          '<td class="dim" style="text-align:right;font-size:11px">' + u.esc(u.ago(st.lastSync, view.asOf)) + '</td>' +
          '<td style="width:1%">' + (st.status === 'healthy' ? u.tag('OK', 'ok') : u.tag('Stale', 'medium')) + '</td></tr>';
      }).join('') + '</tbody></table></div></div>' +
      '</div></div>'
    );
  }

  /* ========================================================== TYPE BROWSER */

  function browse(ctx) {
    const u = U();
    const { view, store, state, route } = ctx;
    const pack = view.pack;
    const type = pack.typeById[route.parts[1]];
    if (!type) return u.empty('Unknown type.');

    let rows = store.visible(type.id);
    const denied = view.scope.allowed[type.id] instanceof Set && view.scope.allowed[type.id].size === 0;
    if (denied) {
      return '<div class="head"><h1>' + u.esc(type.plural) + '</h1></div>' +
        '<div class="note critical"><span>✕</span><div><b>Not visible at your permission level.</b> ' +
        'The ' + u.esc(view.role.name) + ' role has no access to ' + u.esc(type.plural.toLowerCase()) +
        '. This is enforced on the data, not hidden in the interface — the records are not in scope at all.</div></div>';
    }

    const q = (state.browseQ || '').trim().toLowerCase();
    if (q) rows = rows.filter((p) => (p.name + ' ' + (type.keyFacts || []).map((k) => p.get(k)).join(' ')).toLowerCase().includes(q));
    if (state.browseIssues) rows = rows.filter((p) => p.conflicts.some((c) => c.actionable));

    const statDefs = SOT.stats.forType(pack.id, type.id).slice(0, 3);
    const dateField = type.dateField;
    rows = rows.sort((a, b) => (dateField ? (b.get(dateField) || 0) - (a.get(dateField) || 0) : a.name.localeCompare(b.name)));

    const cols = (type.keyFacts || []).slice(0, 3);

    return (
      '<div class="head"><div><h1>' + u.esc(type.plural) + '</h1>' +
      '<div class="sub">' + rows.length.toLocaleString('en-US') + ' in scope. Every row opens a full record — ' +
      'resolved fields, statistics, relationships and the systems each value came from.</div></div>' +
      '<div class="acts">' +
      '<input class="in" id="browse-q" placeholder="Filter…" value="' + u.at(state.browseQ || '') + '" style="width:170px">' +
      '<button class="chip ' + (state.browseIssues ? 'on' : '') + '" data-act="browse-issues">Only with findings</button>' +
      '</div></div>' +

      '<div class="card"><div class="card-b flush"><div class="xs">' +
      (rows.length
        ? '<table class="tbl"><thead><tr><th>' + u.esc(type.label) + '</th>' +
          cols.map((c) => '<th>' + u.esc((pack.fieldByKey[type.id + '.' + c] || { label: c }).label) + '</th>').join('') +
          statDefs.map((s) => '<th class="num">' + u.esc(s.label) + '</th>').join('') +
          '<th class="num">Alignment</th></tr></thead><tbody>' +
          rows.slice(0, 250).map((p) => {
            const stats = store.statsFor(p.entity.id);
            const open = p.conflicts.filter((c) => c.actionable).length;
            return '<tr class="go" data-go="#/e/' + u.at(p.entity.id) + '">' +
              '<td>' + u.entityLine(p, pack) + '</td>' +
              cols.map((c) => {
                const f = pack.fieldByKey[type.id + '.' + c];
                if (f && !store.canSee(f.sensitivity)) return '<td class="dim">restricted</td>';
                return '<td>' + fieldHtml(ctx, c, p.get(c)) + '</td>';
              }).join('') +
              statDefs.map((sd) => {
                const s = stats.find((x) => x.id === sd.id);
                if (s && !store.canSee(s.sensitivity)) return '<td class="num dim">—</td>';
                return '<td class="num">' + u.esc(s ? u.statValue(s) : '—') + '</td>';
              }).join('') +
              '<td class="num">' + (open ? '<span class="tag critical">' + open + '</span>' : '<span class="dim">' + p.alignment + '%</span>') + '</td>' +
              '</tr>';
          }).join('') + '</tbody></table>'
        : u.empty('Nothing matches.')) +
      '</div></div></div>' +
      (rows.length > 250 ? '<div class="dim" style="margin-top:8px;font-size:11.5px">Showing the first 250 of ' + rows.length.toLocaleString('en-US') + '.</div>' : '')
    );
  }

  /* ======================================================== ENTITY PROFILE */

  function entity(ctx) {
    const u = U();
    const { view, store, state, route } = ctx;
    const pack = view.pack;
    const id = route.parts[1];
    const p = view.profiles[id];
    if (!p) return u.empty('Not in the resolved graph.');

    const type = pack.typeById[p.type];

    if (!store.canOpen(id)) {
      return '<div class="head"><h1>' + u.esc(type.label) + '</h1></div>' +
        '<div class="note critical"><span>✕</span><div><b>Outside your permission scope.</b> ' +
        'The ' + u.esc(view.role.name) + ' role can see ' + u.esc(describeScope(view.role, p.type)) +
        '. Switch role in the top bar to open this record.</div></div>';
    }

    const tab = route.query.tab || 'overview';
    const conns = connectionGroups(ctx, p);
    const connCount = conns.reduce((n, g) => n + g.rows.length, 0);
    const timeline = timelineOf(ctx, p);
    const open = p.conflicts.filter((c) => c.actionable).length;

    const facts = (type.keyFacts || []).map((k) => {
      const f = pack.fieldByKey[p.type + '.' + k];
      const label = f ? f.label : k;
      const val = f && !store.canSee(f.sensitivity) ? '<span class="dim">restricted</span>' : fieldHtml(ctx, k, p.get(k));
      return '<div><div class="dim" style="font-size:10.5px">' + u.esc(label) + '</div>' +
        '<div style="font-weight:550;margin-top:1px">' + val + '</div></div>';
    }).join('');

    const statusTags = statusFor(ctx, p).join(' ');

    const header =
      '<div class="card" style="margin-bottom:14px"><div class="card-b" style="display:flex;gap:16px;align-items:flex-start;flex-wrap:wrap">' +
      u.avatar(p, pack, 'lg') +
      '<div style="flex:1;min-width:220px">' +
      '<div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap">' +
      '<h1 style="font-size:20px">' + u.esc(p.name) + '</h1>' + u.tag(type.label, 'line') + statusTags + '</div>' +
      '<div class="muted" style="margin-top:3px;font-size:12.5px">' +
      u.esc((type.subtitle || []).map((k) => p.get(k)).filter(Boolean).join(' · ') || '—') + '</div>' +
      '<div style="display:flex;gap:16px;flex-wrap:wrap;margin-top:12px;font-size:12.5px">' + facts + '</div>' +
      '</div>' +
      '<div style="text-align:center">' + u.ring(p.alignment) +
      '<div class="dim" style="font-size:10px;margin-top:4px">alignment</div></div>' +
      '</div>' +
      '<div style="border-top:1px solid var(--border);padding:9px 14px;display:flex;gap:6px;flex-wrap:wrap;align-items:center">' +
      '<span class="dim" style="font-size:10.5px;letter-spacing:.09em;text-transform:uppercase;margin-right:2px">Open in</span>' +
      pack.systems.map((s) => {
        const link = (p.entity.bySystem[s.id] || [])[0];
        return link ? u.systemLink(pack, s.id, link.nativeId)
          : '<span class="btn sm" style="opacity:.35;cursor:default">' + u.esc(s.name) + '</span>';
      }).join('') +
      (open ? '<a class="btn sm solid" style="margin-left:auto" href="#/e/' + u.at(id) + '?tab=integrity">' + open + ' open</a>' : '') +
      '</div></div>';

    const body =
      tab === 'connections' ? connectionsTab(ctx, p, conns) :
      tab === 'timeline' ? timelineTab(ctx, p, timeline) :
      tab === 'systems' ? systemsTab(ctx, p) :
      tab === 'integrity' ? integrityTab(ctx, p) :
      overviewTab(ctx, p, conns);

    return header + u.tabs([
      { id: 'overview', label: 'Overview' },
      { id: 'connections', label: 'Connections', count: connCount },
      { id: 'timeline', label: 'Timeline', count: timeline.length },
      { id: 'systems', label: 'Systems', count: p.linkedSystems.length },
      { id: 'integrity', label: 'Integrity', count: p.conflicts.length },
    ], tab, 'ent-tab') + body;
  }

  function describeScope(role, typeId) {
    const rule = (role.scopes || {})[typeId];
    if (rule === 'none') return 'no records of this kind at all';
    if (rule === 'unit' || rule === 'group') return 'only records attached to their own group';
    if (rule === 'care' || rule === 'book') return 'only records they personally handle';
    return 'everything';
  }

  function statusFor(ctx, p) {
    const u = U();
    const out = [];
    const status = p.get('employmentStatus') || p.get('patientStatus') || p.get('dutyStatus');
    if (status && /Terminated|Inactive|Deceased/i.test(status)) out.push(u.tag(status, 'critical'));
    const expiry = p.get('licenseExpiry') || p.get('clearanceExpiry');
    if (expiry && expiry < ctx.view.asOf) out.push(u.tag('Expired ' + (p.get('licenseExpiry') ? 'licence' : 'clearance'), 'critical'));
    if (p.get('privilegeStatus') === 'Expired') out.push(u.tag('Privileges lapsed', 'critical'));
    if (p.get('medicalReadiness') === 'Overdue') out.push(u.tag('Readiness overdue', 'high'));
    p.entity.flags.forEach((f) => out.push(u.tag(f.label, f.severity === 'critical' ? 'critical' : 'high')));
    if (p.scheduled.length) out.push(u.tag(p.scheduled.length + ' scheduled change' + (p.scheduled.length === 1 ? '' : 's'), 'low'));
    return out;
  }

  /* ------------------------------------------------------- connections ---
   *
   * Grouped by edge type and direction, split into current and previous. The
   * "previous" half is the point of the whole model: it is how the product
   * answers who used to hold a territory, a ward or a caseload.
   */
  function connectionGroups(ctx, p) {
    const { view, store } = ctx;
    const pack = view.pack;
    const groups = [];
    pack.edgeTypes.forEach((et) => {
      [['out', et.label, et.to], ['in', et.inverse, et.from]].forEach(([dir, label, otherType]) => {
        if ((dir === 'out' && et.from !== p.type) || (dir === 'in' && et.to !== p.type)) return;
        const rows = view.graph.neighbours(p.entity.id, et.id, { dir })
          .filter((n) => store.canOpen(n.entity.id))
          .map((n) => ({
            profile: view.profiles[n.entity.id],
            edge: n.edge,
            current: !et.temporal || S.activeAt(n.edge.fromTs, n.edge.toTs, view.asOf),
          }))
          .sort((a, b) => (b.edge.fromTs || 0) - (a.edge.fromTs || 0));
        if (!rows.length) return;
        groups.push({ edgeType: et, dir, label, otherType, rows });
      });
    });
    return groups;
  }

  function connectionsTab(ctx, p, groups) {
    const u = U();
    const { view, state } = ctx;
    const pack = view.pack;
    if (!groups.length) return '<div class="card"><div class="card-b">' + u.empty('Nothing is connected to this record.') + '</div></div>';

    return '<div class="grid g-2">' + groups.map((g) => {
      const showPast = state.showPast[g.edgeType.id + g.dir] !== false;
      const current = g.rows.filter((r) => r.current);
      const past = g.rows.filter((r) => !r.current);
      const rowHtml = (r) =>
        '<tr class="go" data-go="#/e/' + u.at(r.profile.entity.id) + '">' +
        '<td>' + u.entityLine(r.profile, pack) + '</td>' +
        (g.edgeType.roled ? '<td class="dim">' + u.esc(r.edge.role || '') + '</td>' : '') +
        '<td style="text-align:right;white-space:nowrap" class="dim">' +
        (g.edgeType.temporal
          ? (r.current
              ? (r.edge.fromTs ? 'since ' + u.esc(u.date(r.edge.fromTs)) : 'current')
              : u.esc(u.date(r.edge.fromTs)) + ' – ' + u.esc(u.date(r.edge.toTs)))
          : '') + '</td></tr>';

      return '<div class="card"><div class="card-h"><h3>' + u.esc(g.label) + '</h3>' +
        '<span class="sub">' + current.length + (past.length ? ' current · ' + past.length + ' previous' : '') + '</span>' +
        (past.length ? '<div class="right"><button class="chip ' + (showPast ? 'on' : '') + '" data-act="toggle-past" data-key="' +
          u.at(g.edgeType.id + g.dir) + '">Show previous</button></div>' : '') +
        '</div><div class="card-b flush"><div class="xs"><table class="tbl"><tbody>' +
        current.slice(0, 40).map(rowHtml).join('') +
        (past.length && showPast
          ? '<tr><td colspan="4" style="background:var(--surface-2);font-size:10px;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-3);font-weight:650">Previously</td></tr>' +
            past.slice(0, 40).map(rowHtml).join('')
          : '') +
        '</tbody></table></div></div></div>';
    }).join('') + '</div>';
  }

  /* ---------------------------------------------------------- timeline --- */

  function timelineOf(ctx, p) {
    const { view, store } = ctx;
    const pack = view.pack;
    const events = [];

    pack.edgeTypes.forEach((et) => {
      if (!et.temporal) return;
      [['out', et.label], ['in', et.inverse]].forEach(([dir, label]) => {
        if ((dir === 'out' && et.from !== p.type) || (dir === 'in' && et.to !== p.type)) return;
        view.graph.neighbours(p.entity.id, et.id, { dir }).forEach((n) => {
          if (!store.canOpen(n.entity.id)) return;
          const other = view.profiles[n.entity.id];
          if (n.edge.fromTs) events.push({ ts: n.edge.fromTs, text: label + ' — ' + other.name, href: '#/e/' + other.entity.id, kind: 'start' });
          if (n.edge.toTs) events.push({ ts: n.edge.toTs, text: 'Ended: ' + label.toLowerCase() + ' — ' + other.name, href: '#/e/' + other.entity.id, kind: 'end' });
        });
      });
    });

    // Event-kind entities attached to this one, whichever edge type carries them.
    pack.entityTypes.filter((t) => t.kind === 'event').forEach((et) => {
      pack.edgeTypes.forEach((edge) => {
        const dir = edge.from === et.id && edge.to === p.type ? 'in' : edge.to === et.id && edge.from === p.type ? 'out' : null;
        if (!dir) return;
        view.graph.neighbours(p.entity.id, edge.id, { dir }).forEach((n) => {
          const e = view.profiles[n.entity.id];
          if (!e || e.type !== et.id || !store.canOpen(e.entity.id)) return;
          events.push({
            ts: e.get(et.dateField), text: e.name + (n.edge.role ? ' — ' + n.edge.role : ''),
            href: '#/e/' + e.entity.id, kind: 'event',
          });
        });
      });
    });

    p.scheduled.forEach((s) => events.push({ ts: s.effectiveFrom, text: s.fieldLabel + ' becomes “' + s.value + '”', kind: 'future' }));

    const seen = new Set();
    return events
      .filter((e) => e.ts && !seen.has(e.ts + e.text) && seen.add(e.ts + e.text))
      .sort((a, b) => b.ts - a.ts);
  }

  function timelineTab(ctx, p, events) {
    const u = U();
    const { view } = ctx;
    if (!events.length) return '<div class="card"><div class="card-b">' + u.empty('No dated activity.') + '</div></div>';
    const future = events.filter((e) => e.ts > view.asOf);
    const past = events.filter((e) => e.ts <= view.asOf);
    const row = (e) =>
      '<div class="tev ' + (e.kind === 'event' ? 'open' : '') + '"' + (e.href ? ' data-go="' + u.at(e.href) + '"' : '') + '>' +
      '<span class="when">' + u.esc(u.date(e.ts)) + '</span>' +
      '<span class="what">' + u.esc(e.text) + '</span>' +
      '<span>' + (e.kind === 'future' ? u.tag('scheduled', 'low') : e.kind === 'end' ? u.tag('ended', 'line') : '') + '</span></div>';

    return '<div class="card"><div class="card-h"><h3>Timeline</h3>' +
      '<span class="sub">' + events.length + ' dated events, newest first</span></div>' +
      '<div class="card-b"><div class="tline">' +
      (future.length ? future.map(row).join('') + '<div class="sect" style="margin-left:-18px">Today — ' + u.esc(u.date(view.asOf)) + '</div>' : '') +
      past.slice(0, 120).map(row).join('') +
      '</div>' +
      (past.length > 120 ? '<div class="dim" style="font-size:11.5px;margin-top:8px">Showing the most recent 120 of ' + past.length + '.</div>' : '') +
      '</div></div>';
  }

  /* ----------------------------------------------------------- overview -- */

  function overviewTab(ctx, p, groups) {
    const u = U();
    const { view, store } = ctx;
    const pack = view.pack;
    const stats = store.statsFor(p.entity.id).filter((s) => store.canSee(s.sensitivity));
    const byGroup = {};
    pack.fields.filter((f) => f.entity === p.type).forEach((f) => (byGroup[f.group] || (byGroup[f.group] = [])).push(f));

    const fieldCard = (groupName, fields) =>
      '<div class="card"><div class="card-h"><h3>' + u.esc(groupName[0].toUpperCase() + groupName.slice(1)) + '</h3></div>' +
      '<div class="card-b"><dl class="kv">' + fields.map((f) => {
        const cell = p.fields[f.key];
        if (!store.canSee(f.sensitivity)) return '<dt>' + u.esc(f.label) + '</dt><dd class="dim">restricted at your permission level</dd>';
        if (!cell || cell.absent) return '<dt>' + u.esc(f.label) + '</dt><dd class="dim">—</dd>';
        return '<dt>' + u.esc(f.label) + '</dt><dd>' + fieldHtml(ctx, f.key, cell.value) +
          ' <span class="dim" style="font-size:10.5px">' + u.esc(pack.systemById[cell.systemId].name) + '</span>' +
          (cell.conflict ? ' ' + u.kindTag(cell.conflict.kind) : '') + '</dd>';
      }).join('') + '</dl></div></div>';

    const quickLinks = groups.slice(0, 4).map((g) =>
      '<div style="margin-bottom:10px"><div class="dim" style="font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;margin-bottom:4px">' +
      u.esc(g.label) + '</div>' +
      g.rows.filter((r) => r.current).slice(0, 4).map((r) =>
        '<div class="tev" style="grid-template-columns:1fr auto;padding:4px 6px" data-go="#/e/' + u.at(r.profile.entity.id) + '">' +
        '<span class="what">' + u.esc(r.profile.name) + '</span>' +
        '<span class="dim" style="font-size:11px">' + u.esc(r.edge.role || pack.typeById[r.profile.type].label) + '</span></div>').join('') +
      '</div>').join('');

    return (
      (stats.length ? '<div class="grid g-stat" style="margin-bottom:12px">' + stats.map(u.statTile).join('') + '</div>' : '') +
      '<div class="split"><div class="grid" style="gap:12px">' +
      Object.keys(byGroup).map((g) => fieldCard(g, byGroup[g])).join('') +
      '</div><div class="grid" style="gap:12px">' +
      (quickLinks ? '<div class="card"><div class="card-h"><h3>Connected</h3>' +
        '<div class="right"><a class="btn sm" href="#/e/' + u.at(p.entity.id) + '?tab=connections">All</a></div></div>' +
        '<div class="card-b">' + quickLinks + '</div></div>' : '') +
      (p.scheduled.length
        ? '<div class="card"><div class="card-h"><h3>Scheduled</h3></div><div class="card-b">' +
          '<div class="dim" style="font-size:11.5px;margin-bottom:9px">Future-dated facts. Deliberately not counted as discrepancies.</div>' +
          p.scheduled.map((s) => '<div style="display:flex;gap:8px;align-items:baseline;margin-bottom:6px">' +
            u.tag(u.date(s.effectiveFrom), 'low') + '<div><b>' + u.esc(s.fieldLabel) + '</b> → ' + u.esc(String(s.value)) + '</div></div>').join('') +
          '</div></div>'
        : '') +
      '</div></div>'
    );
  }

  /* ------------------------------------------------------------ systems -- */

  function systemsTab(ctx, p) {
    const u = U();
    const { view } = ctx;
    const pack = view.pack;
    return '<div class="grid g-2">' + pack.systems.map((s) => {
      const links = p.entity.bySystem[s.id] || [];
      const sync = pack.syncState[s.id];
      if (!links.length) {
        return '<div class="card"><div class="card-h">' + u.systemTag(pack, s.id) +
          '<div class="right">' + u.tag('not linked', 'line') + '</div></div>' +
          '<div class="card-b dim" style="font-size:12.5px">No record in ' + u.esc(s.name) + ' resolves to this ' +
          u.esc(pack.typeById[p.type].label.toLowerCase()) + '.</div></div>';
      }
      return links.map((l) => {
        const rows = Object.keys(l.record).filter((k) => k[0] !== '_' && k !== 'observedAt' && l.record[k] !== null && typeof l.record[k] !== 'object');
        return '<div class="card"><div class="card-h">' + u.systemTag(pack, s.id) +
          '<span class="sub mono">' + u.esc(l.nativeId) + '</span>' +
          '<div class="right">' + u.tag(Math.round(l.confidence * 100) + '% match', l.confidence >= 0.95 ? 'ok' : 'medium') +
          u.systemLink(pack, s.id, l.nativeId) + '</div></div>' +
          '<div class="card-b"><dl class="kv">' +
          rows.slice(0, 16).map((k) => {
            let v = l.record[k];
            if (typeof v === 'number' && Math.abs(v) > 1e10) v = u.date(v);
            if (typeof v === 'boolean') v = v ? 'Yes' : 'No';
            return '<dt>' + u.esc(k.replace(/([A-Z])/g, ' $1').replace(/^./, (c) => c.toUpperCase())) + '</dt><dd>' + u.esc(v) + '</dd>';
          }).join('') + '</dl>' +
          '<div class="dim" style="margin-top:10px;padding-top:9px;border-top:1px solid var(--border);font-size:11px">' +
          u.esc(l.methodLabel) + ' · read ' + u.esc(u.ago(sync.lastSync, view.asOf)) + '</div></div></div>';
      }).join('');
    }).join('') + '</div>';
  }

  /* ---------------------------------------------------------- integrity -- */

  function integrityTab(ctx, p) {
    const u = U();
    const { view, store, state } = ctx;
    const pack = view.pack;
    const cells = pack.fields.filter((f) => f.entity === p.type).map((f) => p.fields[f.key]).filter((c) => c && !c.absent);
    const conflicted = cells.filter((c) => c.conflict);

    const glyph = (c) => c.conflict
      ? '<span style="color:var(--' + (c.conflict.kind === 'divergence' ? 'sev-critical' : c.conflict.kind === 'gap' ? 'sev-medium' : 'sev-low') + ')">●</span>'
      : '<span style="color:var(--ok)">●</span>';

    return (
      '<div class="card" style="margin-bottom:12px"><div class="card-b" style="display:flex;gap:18px;align-items:center;flex-wrap:wrap">' +
      u.ring(p.alignment, 66) +
      '<div style="flex:1;min-width:240px">' +
      '<h3 style="font-size:14px">' + (cells.length - conflicted.length) + ' of ' + cells.length + ' fields agree</h3>' +
      '<div class="muted" style="font-size:12.5px;margin-top:4px;line-height:1.55">Weighted by consequence — a disputed reporting line or a wrong date of birth costs far more than a stale phone number, and lag counts as a third of a divergence.</div>' +
      '<div style="display:flex;gap:6px;margin-top:10px;flex-wrap:wrap">' +
      u.tag((cells.length - conflicted.length) + ' aligned', 'ok') +
      u.kindTag('divergence') + '<span class="dim" style="font-size:11.5px;align-self:center">' + conflicted.filter((c) => c.conflict.kind === 'divergence').length + '</span>' +
      u.kindTag('gap') + '<span class="dim" style="font-size:11.5px;align-self:center">' + conflicted.filter((c) => c.conflict.kind === 'gap').length + '</span>' +
      u.kindTag('lag') + '<span class="dim" style="font-size:11.5px;align-self:center">' + conflicted.filter((c) => c.conflict.kind === 'lag').length + '</span>' +
      '</div></div></div></div>' +

      '<div class="prov">' + cells.map((cell) => {
        const f = cell.field;
        const key = 'prov:' + p.entity.id + ':' + f.key;
        const openRow = !!state.expanded[key];
        const redacted = !store.canSee(f.sensitivity);
        const c = cell.conflict;
        return '<div class="prow"><button class="phead" data-act="prov" data-key="' + u.at(key) + '">' +
          '<span>' + glyph(cell) + '</span>' +
          '<span class="fn">' + u.esc(f.label) + '</span>' +
          '<span class="fv">' + (redacted ? '<span class="dim">restricted</span>' : u.esc(u.value(f.key, cell.value))) + '</span>' +
          u.systemTag(pack, cell.systemId) +
          '<span>' + (c ? u.kindTag(c.kind) : u.tag('aligned', 'ok')) + '</span></button>' +
          (openRow
            ? '<div class="pbody"><table><tbody>' +
              cell.assertions.map((a) =>
                '<tr><td style="width:150px">' + u.systemTag(pack, a.systemId) + '</td>' +
                '<td><b>' + (redacted ? '—' : u.esc(u.value(f.key, a.value))) + '</b></td>' +
                '<td class="dim" style="text-align:right;font-size:11px">read ' + u.esc(u.ago(a.observedAt, view.asOf)) +
                (a.effectiveDating && a.effectiveFrom !== a.observedAt ? ' · effective ' + u.esc(u.date(a.effectiveFrom)) : '') + '</td>' +
                '<td style="text-align:right;width:96px">' +
                (a.systemId === cell.systemId ? u.tag('of record', 'solid')
                  : SOT.resolve.sameValue(a.value, cell.value) ? u.tag('agrees', 'ok') : u.tag('differs', 'critical')) +
                '</td></tr>').join('') +
              (c ? c.offenders.filter((o) => o.kind === 'gap').map((o) =>
                '<tr><td>' + u.systemTag(pack, o.systemId) + '</td><td class="dim">empty</td>' +
                '<td colspan="2" style="text-align:right">' + u.kindTag('gap') + '</td></tr>').join('') : '') +
              '</tbody></table>' +
              '<div class="dim" style="margin-top:9px;font-size:11.5px;line-height:1.55">' +
              (c
                ? '<b>' + u.esc(S.CONFLICT_KINDS[c.kind].label) + '.</b> ' + u.esc(S.CONFLICT_KINDS[c.kind].blurb) +
                  (c.kind === 'lag'
                    ? ' No action — it reconciles on the next successful read.'
                    : ' <a class="link" href="#" data-drawer="conflict:' + u.at(c.id) + '">Investigate</a>')
                : 'Every system carrying this field reports the same value. Policy: ' +
                  u.esc((view.policy[f.key] || []).map((s) => pack.systemById[s].name).join(' → '))) +
              '</div></div>'
            : '') + '</div>';
      }).join('') + '</div>'
    );
  }

  SOT.views = Object.assign(SOT.views || {}, { dashboard, browse, entity, connectionGroups });
})(window.SOT || (window.SOT = {}));
</script>
<script>
/* --- ui/views-admin.js --- */
/* SOT — integrity centre, identity queue, systems, remediation, admin, drawer. */
(function (SOT) {
  'use strict';

  const U = () => SOT.ui;
  const S = SOT.schema;

  /* ====================================================== DATA INTEGRITY */

  function integrity(ctx) {
    const u = U();
    const { view, store, state } = ctx;
    const pack = view.pack;
    const f = state.integrity;

    const all = view.conflicts.filter((c) => view.summary.inScope.has(c.entityId));
    let rows = all;
    if (f.severity !== 'all') rows = rows.filter((c) => c.severity === f.severity);
    if (f.kind !== 'all') rows = rows.filter((c) => c.kind === f.kind);
    if (f.system !== 'all') rows = rows.filter((c) => c.systems.indexOf(f.system) >= 0);
    if (f.type !== 'all') rows = rows.filter((c) => c.entityType === f.type);
    if (f.q) rows = rows.filter((c) => (c.entityName + ' ' + c.fieldLabel).toLowerCase().includes(f.q.toLowerCase()));

    const sel = (key, label, opts) =>
      '<label style="display:flex;gap:6px;align-items:center;font-size:11px;color:var(--ink-3)">' + u.esc(label) +
      '<select class="in" data-act="int-sel" data-key="' + key + '">' +
      opts.map((o) => '<option value="' + u.at(o[0]) + '"' + (o[0] === f[key] ? ' selected' : '') + '>' + u.esc(o[1]) + '</option>').join('') +
      '</select></label>';

    return (
      '<div class="head"><div><h1>Data integrity</h1>' +
      '<div class="sub">Every field where the connected systems disagree, classified by <b>why</b>. Lag is separated from divergence ' +
      'deliberately: a system that has not been read since the value changed is behind, not wrong, and mixing the two is how these ' +
      'reports get switched off.</div></div>' +
      '<div class="acts"><a class="btn" href="#/tasks">Remediation</a><a class="btn" href="#/admin">Systems of record</a></div></div>' +

      '<div class="grid g-stat" style="margin-bottom:12px">' +
      u.stat('Findings', all.length, 'Across ' + new Set(all.map((c) => c.entityId)).size + ' records') +
      u.stat('Divergence', all.filter((c) => c.kind === 'divergence').length, 'Both current, both confident', 'hot') +
      u.stat('Gaps', all.filter((c) => c.kind === 'gap').length, 'Expected but empty') +
      u.stat('Lag', all.filter((c) => c.kind === 'lag').length, 'Not queued — resolves on next read') +
      u.stat('Critical + high', all.filter((c) => c.severity === 'critical' || c.severity === 'high').length, 'Safety, access or money') +
      '</div>' +

      '<div class="card" style="margin-bottom:12px"><div class="card-b" style="display:flex;gap:10px;flex-wrap:wrap;align-items:center">' +
      '<div class="chips">' + ['all', 'critical', 'high', 'medium', 'low'].map((s) =>
        '<button class="chip ' + (f.severity === s ? 'on' : '') + '" data-act="int-chip" data-key="severity" data-val="' + s + '">' +
        u.esc(s === 'all' ? 'All severities' : s) + '</button>').join('') + '</div>' +
      '<div class="chips">' + ['all', 'divergence', 'gap', 'lag'].map((k) =>
        '<button class="chip ' + (f.kind === k ? 'on' : '') + '" data-act="int-chip" data-key="kind" data-val="' + k + '">' +
        u.esc(k === 'all' ? 'All kinds' : k) + '</button>').join('') + '</div>' +
      sel('type', 'Record', [['all', 'Any']].concat(pack.entityTypes.map((t) => [t.id, t.label]))) +
      sel('system', 'System', [['all', 'Any']].concat(pack.systems.map((s) => [s.id, s.name]))) +
      '<input class="in" id="int-q" placeholder="Search…" value="' + u.at(f.q) + '" style="flex:1;min-width:150px">' +
      '</div></div>' +

      '<div class="card"><div class="card-h"><h3>' + rows.length + ' findings</h3><span class="sub">most severe first</span></div>' +
      '<div class="card-b flush"><div class="xs">' +
      (rows.length
        ? '<table class="tbl"><thead><tr><th>Record</th><th>Field</th><th>Resolved</th><th>Disagreeing</th><th>Kind</th><th>Severity</th></tr></thead><tbody>' +
          rows.slice(0, 250).map((c) => {
            const p = view.profiles[c.entityId];
            return '<tr class="go" data-drawer="conflict:' + u.at(c.id) + '">' +
              '<td>' + u.entityLine(p, pack) + '</td>' +
              '<td>' + u.esc(c.fieldLabel) + '</td>' +
              '<td><b>' + u.esc(store.formatValue(c.field, c.resolvedValue)) + '</b><br>' +
              '<span class="dim" style="font-size:10.5px">' + u.esc(pack.systemById[c.resolvedSystem].name) + '</span></td>' +
              '<td>' + c.offenders.map((o) => '<div style="font-size:11.5px">' + u.systemTag(pack, o.systemId) + ' ' +
                (o.kind === 'gap' ? '<i class="dim">empty</i>' : u.esc(store.formatValue(c.field, o.value))) + '</div>').join('') + '</td>' +
              '<td>' + u.kindTag(c.kind) + '</td><td>' + u.severityTag(c.severity) + '</td></tr>';
          }).join('') + '</tbody></table>'
        : u.empty('Nothing matches these filters.')) +
      '</div></div></div>'
    );
  }

  /* ================================================== IDENTITY RESOLUTION */

  function identity(ctx) {
    const u = U();
    const { view } = ctx;
    const pack = view.pack;
    const id = view.identity;
    const flagged = id.entities.filter((e) => e.flags.length);

    return (
      '<div class="head"><div><h1>Identity resolution</h1>' +
      '<div class="sub">Nothing downstream works until the platform knows that a record in one system and a record in another describe ' +
      'the same thing. Strong evidence links automatically; anything uncertain waits here. A wrong match does not cause a small error — ' +
      'it causes a confident lie about a person.</div></div></div>' +

      '<div class="grid g-stat" style="margin-bottom:12px">' +
      u.stat('Source records', id.stats.sourceRecords.toLocaleString('en-US'), 'Across ' + pack.systems.length + ' systems') +
      u.stat('Entities resolved', id.stats.entities.toLocaleString('en-US'),
        pack.entityTypes.map((t) => id.stats.byType[t.id] + ' ' + t.plural.toLowerCase()).join(' · ')) +
      u.stat('Links applied', id.stats.autoLinked.toLocaleString('en-US'), 'At or above ' + Math.round(S.AUTO_LINK * 100) + '% confidence') +
      u.stat('Awaiting review', id.stats.needsReview, 'Below the automatic threshold', id.stats.needsReview ? 'hot' : '') +
      u.stat('Flagged', flagged.length, 'Duplicates and missing records') +
      '</div>' +

      '<div class="split"><div class="grid" style="gap:12px">' +
      '<div class="card"><div class="card-h"><h3>Review queue</h3><span class="sub">' + id.unresolved.length + '</span></div>' +
      '<div class="card-b flush"><div class="xs">' +
      (id.unresolved.length
        ? '<table class="tbl"><thead><tr><th>Record</th><th>System</th><th>Proposed match</th><th></th></tr></thead><tbody>' +
          id.unresolved.map((r) => {
            const s = r.suggestions[0];
            return '<tr><td><b>' + u.esc(r.name || '—') + '</b><div class="dim mono">' + u.esc(r.detail || r.nativeId) + '</div></td>' +
              '<td>' + u.systemTag(pack, r.system) + '</td>' +
              '<td>' + (s
                ? '<div style="display:flex;gap:6px;align-items:center">' + u.tag(Math.round(s.score * 100) + '%', 'medium') +
                  '<a class="link" href="#/e/' + u.at(s.entityId) + '">' + u.esc(s.entityName) + '</a></div>' +
                  '<div class="dim" style="font-size:10.5px;margin-top:2px">' + u.esc(s.methodLabel) + '</div>'
                : '<span class="dim">no candidate above ' + Math.round(S.REVIEW * 100) + '%</span>') + '</td>' +
              '<td style="text-align:right;white-space:nowrap">' +
              (s ? '<button class="btn sm solid" data-act="confirm" data-entity="' + u.at(s.entityId) + '" data-system="' + u.at(r.system) +
                '" data-native="' + u.at(r.nativeId) + '">Confirm</button> ' : '') +
              '<button class="btn sm" data-act="dismiss" data-system="' + u.at(r.system) + '" data-native="' + u.at(r.nativeId) + '">Set aside</button>' +
              '</td></tr>';
          }).join('') + '</tbody></table>'
        : u.empty('Queue is clear — every record is linked or explicitly set aside.')) +
      '</div></div></div>' +

      '<div class="card"><div class="card-h"><h3>Flagged records</h3><span class="sub">' + flagged.length + '</span></div>' +
      '<div class="card-b flush">' +
      (flagged.length
        ? '<table class="tbl"><tbody>' + flagged.slice(0, 40).map((e) =>
            '<tr class="go" data-go="#/e/' + u.at(e.id) + '"><td>' + u.entityLine(view.profiles[e.id], pack) + '</td>' +
            '<td>' + e.flags.map((fl) => u.tag(fl.label, fl.severity === 'critical' ? 'critical' : 'high')).join(' ') + '</td></tr>').join('') +
          '</tbody></table>'
        : u.empty('No flags.')) +
      '</div></div></div>' +

      '<div class="card"><div class="card-h"><h3>Matching rules</h3></div><div class="card-b">' +
      '<div class="muted" style="font-size:12.5px;margin-bottom:11px">Rules are scored, not boolean. At or above ' +
      Math.round(S.AUTO_LINK * 100) + '% a link is applied; between ' + Math.round(S.REVIEW * 100) +
      '% and that, a human decides; below, it is not a match.</div>' +
      '<table class="tbl" style="font-size:12px"><tbody>' +
      Object.keys(S.KEY_STRENGTH).filter((k) => k !== 'confirmed').map((k) =>
        '<tr><td style="padding-left:0">' + u.esc(S.KEY_STRENGTH[k].label) + '</td>' +
        '<td style="text-align:right">' + u.tag(Math.round(S.KEY_STRENGTH[k].score * 100) + '%',
          S.KEY_STRENGTH[k].score >= S.AUTO_LINK ? 'ok' : 'medium') + '</td></tr>').join('') +
      '</tbody></table>' +
      '<div class="dim" style="margin-top:12px;padding-top:11px;border-top:1px solid var(--border);font-size:11.5px;line-height:1.6">' +
      'The same code serves every vertical — only the key names change. A hospital matches on medical record and provider numbers; ' +
      'a command matches on service number. Production adds fuzzy name distance, historical aliases and provisioning logs, and the ' +
      'architecture is unchanged: rules produce scores, scores produce links, uncertainty produces a queue.</div>' +
      '</div></div></div>'
    );
  }

  /* ============================================================== SYSTEMS */

  function systems(ctx) {
    const u = U();
    const { view } = ctx;
    const pack = view.pack;

    return (
      '<div class="head"><div><h1>Connected systems</h1>' +
      '<div class="sub">' + pack.systems.length + ' simulated connectors. No live system is contacted and no credentials exist anywhere ' +
      'in this prototype — each one is a fixture behind the same adapter interface a production integration would implement.</div></div></div>' +

      '<div class="grid g-3">' + pack.systems.map((s) => {
        const st = pack.syncState[s.id];
        const sorFields = pack.fields.filter((f) => (view.policy[f.key] || [])[0] === s.id);
        const involved = view.conflicts.filter((c) => c.systems.indexOf(s.id) >= 0).length;
        const linked = view.identity.entities.filter((e) => e.bySystem[s.id]).length;
        return '<div class="card"><div class="card-h"><i class="sysdot"></i><h3>' + u.esc(s.name) + '</h3>' +
          '<div class="right">' + (st.status === 'healthy' ? u.tag('connected', 'ok') : u.tag('degraded', 'critical')) + '</div></div>' +
          '<div class="card-b">' +
          '<div class="dim" style="font-size:11.5px;margin-bottom:11px">' + u.esc(s.category) + ' · ' + u.esc(s.blurb) + '</div>' +
          '<dl class="kv">' +
          '<dt>Last read</dt><dd>' + u.esc(u.ago(st.lastSync, view.asOf)) + '</dd>' +
          '<dt>Cadence</dt><dd>' + u.esc(s.syncCadence) + '</dd>' +
          '<dt>Records</dt><dd class="num">' + pack.recordCounts[s.id].toLocaleString('en-US') + '</dd>' +
          '<dt>Entities linked</dt><dd class="num">' + linked.toLocaleString('en-US') + '</dd>' +
          '<dt>Authoritative for</dt><dd>' + (sorFields.length
            ? u.esc(Array.from(new Set(sorFields.map((f) => f.label))).join(', '))
            : '<span class="dim">nothing — corroboration only</span>') + '</dd>' +
          '<dt>In findings</dt><dd>' + (involved ? u.tag(involved + '', 'medium') : u.tag('none', 'ok')) + '</dd>' +
          '</dl>' +
          (st.message ? '<div class="note ' + (st.status === 'healthy' ? '' : 'medium') + '" style="margin-top:11px">' +
            '<span>' + (st.status === 'healthy' ? 'i' : '▲') + '</span><div>' + u.esc(st.message) + '</div></div>' : '') +
          '</div></div>';
      }).join('') + '</div>' +

      '<div class="card" style="margin-top:12px"><div class="card-h"><h3>How an integration plugs in</h3></div>' +
      '<div class="card-b muted" style="font-size:12.5px;line-height:1.7;max-width:96ch">' +
      'Each connector implements two functions: <span class="mono">identity(record)</span>, returning the keys a record can be matched on, ' +
      'and <span class="mono">assertions(record)</span>, returning that system’s claims about canonical fields with their timestamps. ' +
      'Nothing downstream — resolution, classification, the graph, the statistics, this interface — knows which vendor a value came from. ' +
      'Adding a new source system is one adapter of roughly forty lines. Replacing these fixtures with live API calls changes the fetch ' +
      'and nothing else.</div></div>'
    );
  }

  /* ========================================================== REMEDIATION */

  function tasks(ctx) {
    const u = U();
    const { view, state } = ctx;
    const pack = view.pack;
    const f = state.tasks;
    const all = view.tasks.filter((t) => !t.entityId || view.summary.inScope.has(t.entityId));
    let rows = all;
    if (f.status !== 'all') rows = rows.filter((t) => t.status === f.status);
    if (f.owner !== 'all') rows = rows.filter((t) => t.owner === f.owner);
    const owners = Array.from(new Set(all.map((t) => t.owner))).sort();
    const n = (s) => all.filter((t) => t.status === s).length;

    return (
      '<div class="head"><div><h1>Remediation</h1>' +
      '<div class="sub">Each actionable finding becomes a specific instruction routed to the team that can act on it. The platform ' +
      'deliberately does not write back into source systems — it produces the correction and the audit trail, and the owning team applies it.</div></div>' +
      '<div class="acts"><button class="btn" data-act="task-bulk" data-status="in_progress">Accept all critical</button></div></div>' +

      '<div class="grid g-stat" style="margin-bottom:12px">' +
      u.stat('Open', n('open'), 'Awaiting an owner') +
      u.stat('In progress', n('in_progress'), 'Accepted by a team') +
      u.stat('Resolved', n('resolved'), 'Fixed at source') +
      u.stat('Set aside', n('dismissed'), 'Accepted as intentional') +
      '</div>' +

      '<div class="card" style="margin-bottom:12px"><div class="card-b" style="display:flex;gap:9px;flex-wrap:wrap">' +
      '<div class="chips">' + ['open', 'in_progress', 'resolved', 'dismissed', 'all'].map((s) =>
        '<button class="chip ' + (f.status === s ? 'on' : '') + '" data-act="task-filter" data-key="status" data-val="' + s + '">' +
        u.esc(s === 'in_progress' ? 'in progress' : s) + '</button>').join('') + '</div>' +
      '<div class="chips">' + ['all'].concat(owners).map((o) =>
        '<button class="chip ' + (f.owner === o ? 'on' : '') + '" data-act="task-filter" data-key="owner" data-val="' + u.at(o) + '">' +
        u.esc(o === 'all' ? 'All owners' : o) + '</button>').join('') + '</div>' +
      '</div></div>' +

      '<div class="card"><div class="card-h"><h3>' + rows.length + ' items</h3></div><div class="card-b flush"><div class="xs">' +
      (rows.length
        ? '<table class="tbl"><thead><tr><th>Action</th><th>Record</th><th>Owner</th><th>Fix in</th><th>Severity</th><th>Status</th></tr></thead><tbody>' +
          rows.slice(0, 250).map((t) =>
            '<tr class="go" data-drawer="task:' + u.at(t.id) + '">' +
            '<td><b>' + u.esc(t.title) + '</b><div class="dim" style="font-size:11px;margin-top:2px">' + u.esc(t.fieldLabel) + '</div></td>' +
            '<td>' + u.esc(t.entityName) + '</td><td>' + u.esc(t.owner) + '</td>' +
            '<td>' + t.targets.map((s) => u.systemTag(pack, s)).join(' ') + '</td>' +
            '<td>' + u.severityTag(t.severity) + '</td><td>' + statusTag(t.status) + '</td></tr>').join('') +
          '</tbody></table>'
        : u.empty('Nothing matches.')) +
      '</div></div></div>'
    );
  }

  function statusTag(s) {
    const u = U();
    return { open: u.tag('open', 'medium'), in_progress: u.tag('in progress', 'solid'),
      resolved: u.tag('resolved', 'ok'), dismissed: u.tag('set aside', 'line') }[s];
  }

  /* ================================================================ ADMIN */

  function admin(ctx) {
    const u = U();
    const { view, store, state, route } = ctx;
    const tab = route.query.tab || 'sor';
    const changed = store.policyChanged();

    const head =
      '<div class="head"><div><h1>Administration</h1>' +
      '<div class="sub">Configuration, not code. The policy below decides which system wins for each field; because nothing merged is ' +
      'ever stored, changing it re-answers every screen immediately.</div></div>' +
      '<div class="acts">' + (changed.length ? '<button class="btn" data-act="policy-reset">Restore defaults</button>' : '') +
      '<button class="btn" data-act="reset-all">Reset prototype</button></div></div>' +
      u.tabs([
        { id: 'sor', label: 'Systems of record' },
        { id: 'model', label: 'Model' },
        { id: 'roles', label: 'Roles & permissions' },
      ], tab, 'admin-tab');

    if (tab === 'model') return head + adminModel(ctx);
    if (tab === 'roles') return head + adminRoles(ctx);
    return head + adminSor(ctx, changed);
  }

  function adminSor(ctx, changed) {
    const u = U();
    const { view, store, state } = ctx;
    const pack = view.pack;
    const sel = state.adminField;

    const list = '<div class="card"><div class="card-h"><h3>Field policy</h3><span class="sub">' + pack.fields.length + ' reconciled fields</span></div>' +
      '<div class="card-b flush"><div class="xs"><table class="tbl"><thead><tr><th>Field</th><th>Record</th><th>System of record</th><th>Fallback</th><th class="num">Findings</th></tr></thead><tbody>' +
      pack.fields.map((f) => {
        const order = view.policy[f.key] || [];
        const n = view.conflicts.filter((c) => c.field === f.key && c.entityType === f.entity).length;
        const isSel = sel === f.entity + '.' + f.key;
        return '<tr class="go" data-act="admin-field" data-field="' + u.at(f.entity + '.' + f.key) + '"' +
          (isSel ? ' style="background:var(--surface-3)"' : '') + '>' +
          '<td><b>' + u.esc(f.label) + '</b>' + (changed.indexOf(f.key) >= 0 ? ' ' + u.tag('modified', 'solid') : '') +
          '<div class="dim" style="font-size:10.5px">weight ' + f.weight + ' · ' + u.esc(f.sensitivity) + '</div></td>' +
          '<td class="dim">' + u.esc(pack.typeById[f.entity].label) + '</td>' +
          '<td>' + (order[0] ? u.systemTag(pack, order[0]) : '<span class="dim">none</span>') + '</td>' +
          '<td class="dim" style="font-size:11px">' + u.esc(order.slice(1).map((s) => pack.systemById[s].name).join(' → ') || '—') + '</td>' +
          '<td class="num">' + (n ? u.tag(String(n), 'medium') : '<span class="dim">0</span>') + '</td></tr>';
      }).join('') + '</tbody></table></div></div></div>';

    let detail;
    if (!sel || !pack.fieldByKey[sel]) {
      detail = '<div class="card"><div class="card-h"><h3>Impact preview</h3></div><div class="card-b muted" style="font-size:12.5px;line-height:1.65">' +
        'Choose a field to see what each system would resolve it to if it were authoritative, and how many records would change their ' +
        'answer. The preview runs the resolution engine against the alternative policy — the same code path the live application uses.</div></div>';
    } else {
      const f = pack.fieldByKey[sel];
      const rows = f.contributors.map((sysId) => {
        const alt = {};
        Object.keys(view.policy).forEach((k) => { alt[k] = view.policy[k].slice(); });
        alt[f.key] = [sysId].concat((alt[f.key] || []).filter((s) => s !== sysId));
        const preview = SOT.resolve.resolveAll(pack, view.identity, alt, view.asOf);
        let moved = 0;
        Object.keys(preview.profiles).forEach((id) => {
          if (preview.profiles[id].type !== f.entity) return;
          if (!SOT.resolve.sameValue(preview.profiles[id].get(f.key), view.profiles[id].get(f.key))) moved++;
        });
        return { sysId, current: (view.policy[f.key] || [])[0] === sysId, moved,
          findings: preview.conflicts.filter((c) => c.field === f.key && c.entityType === f.entity).length };
      });

      detail = '<div class="card"><div class="card-h"><h3>' + u.esc(f.label) + '</h3>' +
        '<span class="sub">' + u.esc(pack.typeById[f.entity].label) + '</span></div><div class="card-b">' +
        (pack.rationale[f.key] ? '<div class="note" style="margin-bottom:12px"><span>i</span><div>' + u.esc(pack.rationale[f.key]) + '</div></div>' : '') +
        (f.impact ? '<div class="sect">Why it matters</div><div class="muted" style="font-size:12.5px;line-height:1.6">' + u.esc(f.impact) + '</div>' : '') +
        '<div class="sect">If this system were authoritative</div>' +
        '<table class="tbl" style="font-size:12px"><thead><tr><th>System</th><th class="num">Answers that change</th><th class="num">Findings</th><th></th></tr></thead><tbody>' +
        rows.map((r) => '<tr><td>' + u.systemTag(pack, r.sysId) + (r.current ? ' ' + u.tag('current', 'solid') : '') + '</td>' +
          '<td class="num">' + (r.current ? '—' : r.moved) + '</td><td class="num">' + r.findings + '</td>' +
          '<td style="text-align:right">' + (r.current ? '' :
            '<button class="btn sm solid" data-act="promote" data-field="' + u.at(f.key) + '" data-system="' + u.at(r.sysId) + '">Make authoritative</button>') +
          '</td></tr>').join('') + '</tbody></table>' +
        '<div class="dim" style="margin-top:11px;font-size:11.5px;line-height:1.6">Changing the system of record rarely reduces the number ' +
        'of disagreements. It changes which side is considered wrong, and therefore which team gets the work. That is the honest behaviour, ' +
        'and it is why the policy belongs to the customer rather than to us.</div>' +
        '</div></div>';
    }

    return (changed.length
      ? '<div class="note" style="margin-bottom:12px"><span>i</span><div><b>' + changed.length + ' field' +
        (changed.length === 1 ? '' : 's') + ' differ from the default policy.</b> ' +
        u.esc(changed.map((k) => (view.pack.fields.find((f) => f.key === k) || { label: k }).label + ' → ' +
          view.pack.systemById[view.policy[k][0]].name).join('; ')) + '</div></div>'
      : '') + '<div class="split">' + list + detail + '</div>';
  }

  function adminModel(ctx) {
    const u = U();
    const { view } = ctx;
    const pack = view.pack;
    return '<div class="split">' +
      '<div class="grid" style="gap:12px">' +
      '<div class="card"><div class="card-h"><h3>Entity types</h3><span class="sub">' + pack.entityTypes.length + '</span></div>' +
      '<div class="card-b flush"><table class="tbl"><thead><tr><th>Type</th><th>Kind</th><th>Authoritative source</th><th class="num">Resolved</th></tr></thead><tbody>' +
      pack.entityTypes.map((t) => '<tr class="go" data-go="#/t/' + u.at(t.id) + '"><td><span class="av sq sm" style="display:inline-grid;vertical-align:middle;margin-right:7px">' +
        u.esc(t.glyph) + '</span><b>' + u.esc(t.label) + '</b></td><td class="dim">' + u.esc(t.kind) + '</td>' +
        '<td>' + t.masterSystems.map((s) => u.systemTag(pack, s)).join(' ') + '</td>' +
        '<td class="num">' + (view.identity.stats.byType[t.id] || 0).toLocaleString('en-US') + '</td></tr>').join('') +
      '</tbody></table></div></div>' +

      '<div class="card"><div class="card-h"><h3>Relationship types</h3><span class="sub">' + pack.edgeTypes.length + '</span></div>' +
      '<div class="card-b flush"><table class="tbl"><thead><tr><th>Relationship</th><th>From → to</th><th>Time-bounded</th><th class="num">Edges</th></tr></thead><tbody>' +
      pack.edgeTypes.map((e) => {
        const n = view.graph.edges.filter((x) => x.type === e.id).length;
        return '<tr><td><b>' + u.esc(e.label) + '</b><div class="dim" style="font-size:10.5px">inverse: ' + u.esc(e.inverse) + '</div></td>' +
          '<td class="dim">' + u.esc(pack.typeById[e.from].label) + ' → ' + u.esc(pack.typeById[e.to].label) + '</td>' +
          '<td>' + (e.temporal ? u.tag('yes', 'ok') : '<span class="dim">no</span>') + '</td>' +
          '<td class="num">' + n.toLocaleString('en-US') + '</td></tr>';
      }).join('') + '</tbody></table></div></div></div>' +

      '<div class="card"><div class="card-h"><h3>Why this is configuration</h3></div><div class="card-b muted" style="font-size:12.5px;line-height:1.7">' +
      'Everything on the left is declared by the vertical pack, not built into the engine. A hospital declares staff, patients, units, ' +
      'facilities and visits; a command declares personnel, units, installations and readiness events; a sales organisation declares people, ' +
      'territories and accounts. The resolution engine, the identity matcher, the graph, the statistics runner and this entire interface ' +
      'are identical across all of them.' +
      '<div style="margin-top:12px">Time-bounded relationships are the reason the product can answer questions about the past. ' +
      '“Who used to cover that territory”, “who was on the ward in March”, “which platoon was this member in before the reassignment” ' +
      'are all the same query against the same edge table.</div>' +
      '<div style="margin-top:12px"><a class="btn" href="#/systems">See the connectors</a></div>' +
      '</div></div></div>';
  }

  function adminRoles(ctx) {
    const u = U();
    const { view } = ctx;
    const pack = view.pack;
    return '<div class="card" style="margin-bottom:12px"><div class="card-h"><h3>Roles</h3>' +
      '<span class="sub">Prototype scope: the model is real, the enforcement point is the interface</span></div>' +
      '<div class="card-b flush"><div class="xs"><table class="tbl"><thead><tr><th>Role</th><th>Persona</th>' +
      pack.entityTypes.map((t) => '<th>' + u.esc(t.plural) + '</th>').join('') + '<th>Max sensitivity</th></tr></thead><tbody>' +
      pack.roles.map((r) => '<tr' + (r.id === view.role.id ? ' style="background:var(--surface-3)"' : '') + '>' +
        '<td><b>' + u.esc(r.name) + '</b>' + (r.id === view.role.id ? ' ' + u.tag('you', 'solid') : '') + '</td>' +
        '<td class="dim">' + u.esc(r.persona) + '</td>' +
        pack.entityTypes.map((t) => {
          const rule = (r.scopes || {})[t.id] || 'all';
          return '<td>' + (rule === 'none' ? u.tag('none', 'critical') : rule === 'all' ? u.tag('all', 'ok') : u.tag(rule, 'medium')) + '</td>';
        }).join('') +
        '<td>' + u.tag(r.maxSensitivity, r.maxSensitivity === 'protected' ? 'critical' : 'medium') + '</td></tr>').join('') +
      '</tbody></table></div></div></div>' +

      '<div class="split"><div class="card"><div class="card-h"><h3>Field sensitivity</h3></div><div class="card-b flush"><div class="xs">' +
      '<table class="tbl"><thead><tr><th>Field</th><th>Record</th><th>Sensitivity</th><th>Visible to</th></tr></thead><tbody>' +
      pack.fields.filter((f) => f.sensitivity !== 'public').map((f) =>
        '<tr><td>' + u.esc(f.label) + '</td><td class="dim">' + u.esc(pack.typeById[f.entity].label) + '</td>' +
        '<td>' + u.tag(f.sensitivity, f.sensitivity === 'protected' ? 'critical' : f.sensitivity === 'confidential' ? 'high' : 'medium') + '</td>' +
        '<td class="dim" style="font-size:11px">' + u.esc(pack.roles.filter((r) => S.canSee(r, f.sensitivity)).map((r) => r.name).join(', ') || 'nobody') + '</td></tr>').join('') +
      '</tbody></table></div></div></div>' +

      '<div class="card"><div class="card-h"><h3>What production requires</h3></div><div class="card-b muted" style="font-size:12.5px;line-height:1.7">' +
      'This prototype enforces permissions in the interface, which is not enforcement. A platform that concentrates clinical, personnel and ' +
      'access data in one place is a high-value target, so the real build needs the checks below the API rather than above it:' +
      '<ul style="padding-left:18px;line-height:1.8;margin:10px 0 0">' +
      '<li>Single sign-on with directory-driven provisioning</li>' +
      '<li>Row- and field-level authorisation evaluated server-side on every read</li>' +
      '<li>Per-tenant isolation and separate encryption keys</li>' +
      '<li>Immutable audit log of every value served and every policy change</li>' +
      '<li>Break-glass access with review, and regional data residency</li>' +
      '</ul><div style="margin-top:11px">Every field already carries a sensitivity classification and every role a scope, so enforcement is ' +
      'a filter over labelled data rather than a schema change.</div></div></div></div>';
  }

  /* =============================================================== DRAWER */

  function drawer(ctx) {
    const u = U();
    const { view, store, state } = ctx;
    const pack = view.pack;
    if (!state.drawer) return '';
    const [kind, id] = state.drawer.split(':');

    const shell = (title, tags, body, footer) =>
      '<div class="dw" data-act="close-drawer"><div class="drawer" data-stop="1">' +
      '<header><div style="flex:1"><h3>' + title + '</h3><div style="margin-top:6px;display:flex;gap:5px;flex-wrap:wrap">' + tags + '</div></div>' +
      '<button class="btn ghost" data-act="close-drawer">✕</button></header>' +
      '<div class="body">' + body + '</div><footer>' + (footer || '') + '</footer></div></div>';

    if (kind === 'conflict') {
      const c = view.conflicts.find((x) => x.id === id);
      if (!c) return '';
      const task = view.tasks.find((t) => t.conflictId === c.id);
      return shell(
        u.esc(c.fieldLabel) + ' — ' + u.esc(c.entityName),
        u.kindTag(c.kind) + u.severityTag(c.severity) + u.tag(pack.typeById[c.entityType].label, 'line'),
        '<div class="sect">What each system says</div>' +
        '<table class="tbl" style="font-size:12.5px"><tbody>' +
        '<tr><td>' + u.systemTag(pack, c.resolvedSystem) + '</td><td><b>' + u.esc(store.formatValue(c.field, c.resolvedValue)) + '</b></td>' +
        '<td style="text-align:right">' + u.tag('of record', 'solid') + '</td></tr>' +
        c.offenders.map((o) => '<tr><td>' + u.systemTag(pack, o.systemId) + '</td>' +
          '<td>' + (o.kind === 'gap' ? '<i class="dim">empty</i>' : u.esc(store.formatValue(c.field, o.value))) +
          '<div class="dim" style="font-size:10.5px">read ' + u.esc(u.ago(o.observedAt, view.asOf)) + '</div></td>' +
          '<td style="text-align:right">' + u.kindTag(o.kind) + '</td></tr>').join('') +
        '</tbody></table>' +
        '<div class="sect">Why it is classified this way</div>' +
        '<div class="muted" style="font-size:12.5px;line-height:1.6">' + u.esc(S.CONFLICT_KINDS[c.kind].blurb) + ' ' +
        u.esc(c.kind === 'lag'
          ? 'The disagreeing system was last read before this value changed, so it cannot know about it yet. No task was raised.'
          : c.kind === 'gap'
            ? 'The field is expected in that system and is empty, which breaks any join that depends on it.'
            : 'Both systems have been read recently and both are confident. One of them is wrong.') + '</div>' +
        (c.impact ? '<div class="sect">Consequence</div><div class="muted" style="font-size:12.5px;line-height:1.6">' + u.esc(c.impact) + '</div>' : '') +
        '<div class="sect">Policy applied</div><div class="muted" style="font-size:12.5px">' +
        u.esc((view.policy[c.field] || []).map((s) => pack.systemById[s].name).join(' → ')) +
        (pack.rationale[c.field] ? '<div style="margin-top:6px">' + u.esc(pack.rationale[c.field]) + '</div>' : '') +
