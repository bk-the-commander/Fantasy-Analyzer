<title>SOT — Source of Truth</title>
<meta name="description" content="One resolved record for every person, place and event across every system a company runs. A Kaliris Labs prototype.">
<style>
/* SOT — interface.
 *
 * Monochrome by intent: black, grey, white, and hairline rules. The only
 * colour in the product is signal — severity and conflict kind — so when
 * something is coloured it means something. Everything else earns its
 * hierarchy from weight, size and space.
 *
 * The palette is declared once on :root and re-declared for dark, so the page
 * reads correctly in either theme without any element defining its colour in
 * only one of them.
 */

:root {
  --bg: #f6f6f7;
  --surface: #ffffff;
  --surface-2: #f1f1f3;
  --surface-3: #e7e7ea;
  --border: #e3e3e6;
  --border-2: #d2d2d7;
  --ink: #0b0b0c;
  --ink-2: #5a5c60;
  --ink-3: #8b8d93;
  --invert-bg: #0b0b0c;
  --invert-ink: #fafafa;
  --sev-critical: #b4231d;
  --sev-critical-bg: #fbeceb;
  --sev-high: #98431a;
  --sev-high-bg: #fcf0e8;
  --sev-medium: #6d5713;
  --sev-medium-bg: #f8f2e0;
  --sev-low: #43566b;
  --sev-low-bg: #eef1f5;
  --ok: #2f6b45;
  --ok-bg: #eaf2ec;
  --shadow: 0 1px 2px rgba(0, 0, 0, .05);
  --shadow-lg: 0 24px 60px -18px rgba(0, 0, 0, .3);
  --r: 7px;
  --mono: ui-monospace, "SF Mono", SFMono-Regular, Menlo, Consolas, monospace;
  color-scheme: light;
}

@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #08090a;
    --surface: #101113;
    --surface-2: #17191c;
    --surface-3: #202327;
    --border: #232629;
    --border-2: #33373c;
    --ink: #f3f4f5;
    --ink-2: #9ea3aa;
    --ink-3: #6c7278;
    --invert-bg: #f3f4f5;
    --invert-ink: #0b0b0c;
    --sev-critical: #ef7b74;
    --sev-critical-bg: #2a1514;
    --sev-high: #d99a63;
    --sev-high-bg: #261a11;
    --sev-medium: #cdb264;
    --sev-medium-bg: #22200f;
    --sev-low: #8fa8c0;
    --sev-low-bg: #151b21;
    --ok: #6cc48b;
    --ok-bg: #102016;
    --shadow: 0 1px 2px rgba(0, 0, 0, .5);
    --shadow-lg: 0 24px 60px -18px rgba(0, 0, 0, .8);
    color-scheme: dark;
  }
}

:root[data-theme="dark"] {
  --bg: #08090a; --surface: #101113; --surface-2: #17191c; --surface-3: #202327;
  --border: #232629; --border-2: #33373c; --ink: #f3f4f5; --ink-2: #9ea3aa; --ink-3: #6c7278;
  --invert-bg: #f3f4f5; --invert-ink: #0b0b0c;
  --sev-critical: #ef7b74; --sev-critical-bg: #2a1514;
  --sev-high: #d99a63; --sev-high-bg: #261a11;
  --sev-medium: #cdb264; --sev-medium-bg: #22200f;
  --sev-low: #8fa8c0; --sev-low-bg: #151b21;
  --ok: #6cc48b; --ok-bg: #102016;
  --shadow: 0 1px 2px rgba(0, 0, 0, .5);
  --shadow-lg: 0 24px 60px -18px rgba(0, 0, 0, .8);
  color-scheme: dark;
}

* { box-sizing: border-box; }
body {
  margin: 0; background: var(--bg); color: var(--ink);
  font: 400 13.5px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, Helvetica, Arial, sans-serif;
  -webkit-font-smoothing: antialiased;
}
a { color: inherit; text-decoration: none; }
a.link { text-decoration: underline; text-underline-offset: 2px; text-decoration-color: var(--border-2); }
a.link:hover { text-decoration-color: currentColor; }
button { font: inherit; color: inherit; }
h1, h2, h3, h4 { margin: 0; font-weight: 600; letter-spacing: -.014em; }
.num { font-variant-numeric: tabular-nums; }
.mono { font-family: var(--mono); font-size: 11.5px; }
.muted { color: var(--ink-2); }
.dim { color: var(--ink-3); }

/* ------------------------------------------------------------------ brand */

.mark { display: block; width: 26px; height: 26px; color: var(--ink); flex: none; }
.mark.lg { width: 44px; height: 44px; }
.wordmark { display: flex; align-items: center; gap: 10px; }
.wordmark .wm-name { display: block; font-size: 17px; font-weight: 680; letter-spacing: .01em; line-height: 1; }
.wordmark .wm-sub { display: block; font-size: 9.5px; letter-spacing: .18em; text-transform: uppercase; color: var(--ink-3); margin-top: 3px; }

/* ------------------------------------------------------------------ login */

.login { min-height: 100vh; display: grid; grid-template-columns: 1.1fr .9fr; background: var(--surface); }
.login-left {
  padding: clamp(30px, 6vw, 76px); display: flex; flex-direction: column; justify-content: center; gap: 26px;
  background: var(--invert-bg); color: var(--invert-ink);
}
.login-left .mark, .login-left .wordmark .wm-name { color: var(--invert-ink); }
.login-left .wm-sub { color: rgba(255, 255, 255, .45); }
:root[data-theme="dark"] .login-left .wm-sub, :root:not([data-theme="light"]) .login-left .wm-sub { color: rgba(0, 0, 0, .45); }
.login-left h1 { font-size: clamp(30px, 4.2vw, 46px); line-height: 1.05; letter-spacing: -.032em; }
.login-left p { font-size: 15.5px; line-height: 1.6; opacity: .74; max-width: 46ch; margin: 0; }
.login-left .fine { font-size: 11.5px; opacity: .52; border-top: 1px solid currentColor; padding-top: 16px; max-width: 56ch; line-height: 1.6; }
.login-right { padding: clamp(26px, 4vw, 54px); display: flex; flex-direction: column; justify-content: center; gap: 8px; }
.pick-label { font-size: 10.5px; letter-spacing: .12em; text-transform: uppercase; color: var(--ink-3); font-weight: 650; margin-bottom: 2px; }
.pick-card {
  display: grid; grid-template-columns: 1fr auto; gap: 12px; align-items: center; width: 100%; text-align: left;
  cursor: pointer; background: var(--surface); border: 1px solid var(--border); border-radius: var(--r);
  padding: 12px 14px; transition: border-color .12s, transform .12s;
}
.pick-card:hover { border-color: var(--ink); transform: translateX(2px); }
.pick-card .pc-name { font-weight: 620; }
.pick-card .pc-persona { font-size: 11.5px; color: var(--ink-3); }
.pick-card .pc-blurb { font-size: 12px; color: var(--ink-2); margin-top: 4px; line-height: 1.45; }
.pick-card .pc-go { color: var(--ink-3); }
.seg { display: inline-flex; border: 1px solid var(--border); border-radius: var(--r); overflow: hidden; }
.seg button { background: var(--surface); border: 0; padding: 6px 12px; font-size: 12.5px; cursor: pointer; color: var(--ink-2); }
.seg button + button { border-left: 1px solid var(--border); }
.seg button.on { background: var(--invert-bg); color: var(--invert-ink); font-weight: 600; }

/* ------------------------------------------------------------------ shell */

.shell { display: grid; grid-template-columns: 216px 1fr; min-height: 100vh; }
.rail { background: var(--surface); border-right: 1px solid var(--border); position: sticky; top: 0; height: 100vh; display: flex; flex-direction: column; }
.rail-head { padding: 15px 14px; border-bottom: 1px solid var(--border); }
.nav { padding: 8px; overflow-y: auto; flex: 1; }
.nav-label { font-size: 10px; letter-spacing: .11em; text-transform: uppercase; color: var(--ink-3); padding: 13px 8px 5px; font-weight: 650; }
.nav a { display: flex; align-items: center; gap: 9px; padding: 6px 8px; border-radius: 6px; color: var(--ink-2); font-size: 13px; font-weight: 500; }
.nav a:hover { background: var(--surface-2); color: var(--ink); }
.nav a.on { background: var(--surface-3); color: var(--ink); font-weight: 620; }
.nav a .g { width: 16px; text-align: center; flex: none; opacity: .8; font-size: 12px; }
.nav a .n { margin-left: auto; font-size: 11px; color: var(--ink-3); font-variant-numeric: tabular-nums; }
.nav a .n.hot { color: var(--sev-critical); font-weight: 650; }
.rail-foot { border-top: 1px solid var(--border); padding: 10px 13px; font-size: 11px; color: var(--ink-3); line-height: 1.5; }

.top {
  position: sticky; top: 0; z-index: 30; height: 52px; display: flex; align-items: center; gap: 10px;
  padding: 0 18px; border-bottom: 1px solid var(--border);
  background: color-mix(in srgb, var(--surface) 86%, transparent); backdrop-filter: blur(10px) saturate(1.3);
}
.searchbtn {
  flex: 1; max-width: 420px; min-width: 0; display: flex; align-items: center; gap: 8px; cursor: pointer;
  background: var(--surface-2); border: 1px solid var(--border); border-radius: 6px; padding: 5px 10px;
  color: var(--ink-3); font-size: 12.5px;
}
.searchbtn:hover { border-color: var(--border-2); }
.kbd { font-family: var(--mono); font-size: 10px; border: 1px solid var(--border-2); border-radius: 4px; padding: 1px 4px; color: var(--ink-3); }
.top .right { margin-left: auto; display: flex; align-items: center; gap: 8px; }
.selwrap { display: flex; align-items: center; gap: 6px; background: var(--surface-2); border: 1px solid var(--border); border-radius: 6px; padding: 3px 8px; font-size: 12px; }
.selwrap .lbl { color: var(--ink-3); font-size: 10.5px; letter-spacing: .04em; text-transform: uppercase; }
.selwrap select { border: 0; background: transparent; font: inherit; font-weight: 600; color: var(--ink); cursor: pointer; }

/* the drill trail — the record of what you clicked to get here */
.trail { display: flex; align-items: center; gap: 4px; padding: 7px 18px; border-bottom: 1px solid var(--border); background: var(--surface); overflow-x: auto; font-size: 12px; }
.trail .t-lbl { color: var(--ink-3); font-size: 10.5px; letter-spacing: .1em; text-transform: uppercase; margin-right: 4px; flex: none; }
.trail a, .trail span.cur { display: inline-flex; align-items: center; gap: 5px; padding: 2px 7px; border-radius: 5px; white-space: nowrap; flex: none; }
.trail a { color: var(--ink-2); border: 1px solid transparent; }
.trail a:hover { background: var(--surface-2); color: var(--ink); }
.trail span.cur { background: var(--surface-3); font-weight: 600; }
.trail .sep { color: var(--ink-3); flex: none; }
.trail .g { opacity: .6; }

.main { min-width: 0; }
.content { padding: 20px 22px 70px; max-width: 1460px; }
.head { display: flex; align-items: flex-start; gap: 16px; flex-wrap: wrap; margin-bottom: 16px; }
.head h1 { font-size: 19px; }
.head .sub { color: var(--ink-2); font-size: 12.5px; margin-top: 4px; max-width: 84ch; line-height: 1.55; }
.head .acts { margin-left: auto; display: flex; gap: 7px; align-items: center; flex-wrap: wrap; }

/* --------------------------------------------------------------- controls */

.btn {
  display: inline-flex; align-items: center; gap: 6px; cursor: pointer; background: var(--surface);
  border: 1px solid var(--border-2); border-radius: 6px; padding: 5px 11px; font-size: 12.5px; font-weight: 550;
}
.btn:hover { background: var(--surface-2); }
.btn.solid { background: var(--invert-bg); color: var(--invert-ink); border-color: var(--invert-bg); }
.btn.solid:hover { opacity: .88; }
.btn.sm { padding: 3px 8px; font-size: 11.5px; }
.btn.ghost { border-color: transparent; background: transparent; color: var(--ink-2); }
.btn.ghost:hover { background: var(--surface-2); color: var(--ink); }
.btn:disabled { opacity: .4; cursor: default; }
input.in, select.in {
  background: var(--surface); border: 1px solid var(--border-2); border-radius: 6px;
  padding: 5px 9px; font: inherit; font-size: 12.5px; color: var(--ink);
}
input.in::placeholder { color: var(--ink-3); }
.chips { display: flex; gap: 5px; flex-wrap: wrap; }
.chip { cursor: pointer; border: 1px solid var(--border); background: var(--surface); border-radius: 20px; padding: 3px 10px; font-size: 11.5px; color: var(--ink-2); }
.chip:hover { border-color: var(--border-2); color: var(--ink); }
.chip.on { background: var(--invert-bg); color: var(--invert-ink); border-color: var(--invert-bg); font-weight: 600; }

/* ------------------------------------------------------------------ cards */

.card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--r); box-shadow: var(--shadow); }
.card-h { padding: 11px 14px; border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 9px; }
.card-h h3 { font-size: 13px; }
.card-h .sub { font-size: 11px; color: var(--ink-3); }
.card-h .right { margin-left: auto; display: flex; gap: 7px; align-items: center; }
.card-b { padding: 14px; }
.card-b.flush { padding: 0; }

.grid { display: grid; gap: 12px; }
.g-stat { grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); }
.g-2 { grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); }
.g-3 { grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); }
.g-cards { grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); }
.split { display: grid; grid-template-columns: minmax(0, 1.9fr) minmax(290px, 1fr); gap: 12px; align-items: start; }
.shell > .main, .grid > *, .split > *, .card, .card-b { min-width: 0; }

.stat { padding: 12px 14px; }
.stat .k { font-size: 11px; color: var(--ink-2); font-weight: 550; }
.stat .v { font-size: 24px; font-weight: 640; letter-spacing: -.028em; margin-top: 4px; font-variant-numeric: tabular-nums; line-height: 1.1; }
.stat .h { font-size: 11px; color: var(--ink-3); margin-top: 3px; }
.stat.hot .v { color: var(--sev-critical); }

/* ----------------------------------------------------------------- badges */

.tag {
  display: inline-flex; align-items: center; gap: 5px; white-space: nowrap; font-size: 10.5px; font-weight: 620;
  border-radius: 4px; padding: 2px 6px; background: var(--surface-2); color: var(--ink-2);
  letter-spacing: .01em;
}
.tag.line { background: transparent; border: 1px solid var(--border-2); }
.tag.ok { background: var(--ok-bg); color: var(--ok); }
.tag.critical { background: var(--sev-critical-bg); color: var(--sev-critical); }
.tag.high { background: var(--sev-high-bg); color: var(--sev-high); }
.tag.medium { background: var(--sev-medium-bg); color: var(--sev-medium); }
.tag.low { background: var(--sev-low-bg); color: var(--sev-low); }
.tag.solid { background: var(--invert-bg); color: var(--invert-ink); }
.dot { width: 6px; height: 6px; border-radius: 50%; background: currentColor; flex: none; }
.sysdot { width: 7px; height: 7px; border-radius: 1.5px; background: var(--ink-3); display: inline-block; flex: none; }
.systag { display: inline-flex; align-items: center; gap: 5px; font-size: 11.5px; color: var(--ink-2); font-weight: 540; white-space: nowrap; }

/* ----------------------------------------------------------------- tables */

.tbl { width: 100%; border-collapse: collapse; font-size: 12.5px; }
.tbl th {
  text-align: left; font-size: 10px; text-transform: uppercase; letter-spacing: .08em; color: var(--ink-3);
  font-weight: 650; padding: 7px 13px; border-bottom: 1px solid var(--border); background: var(--surface-2);
}
.tbl td { padding: 8px 13px; border-bottom: 1px solid var(--border); vertical-align: middle; }
.tbl tr:last-child td { border-bottom: 0; }
.tbl tbody tr.go { cursor: pointer; }
.tbl tbody tr.go:hover { background: var(--surface-2); }
.tbl td.num, .tbl th.num { text-align: right; font-variant-numeric: tabular-nums; }
.xs { overflow-x: auto; }

/* --------------------------------------------------------------- entities */

.av {
  width: 30px; height: 30px; border-radius: 50%; flex: none; display: grid; place-items: center;
  font-size: 11px; font-weight: 650; background: var(--surface-3); color: var(--ink-2); user-select: none;
}
.av.sq { border-radius: 6px; }
.av.lg { width: 54px; height: 54px; font-size: 18px; }
.av.sm { width: 22px; height: 22px; font-size: 9px; }
.eline { display: flex; align-items: center; gap: 8px; min-width: 0; }
.eline .n { font-weight: 560; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.eline .s { font-size: 11px; color: var(--ink-3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

.ecard {
  display: block; width: 100%; text-align: left; cursor: pointer; background: var(--surface);
  border: 1px solid var(--border); border-radius: var(--r); padding: 12px;
  transition: border-color .12s, transform .12s;
}
.ecard:hover { border-color: var(--border-2); transform: translateY(-1px); box-shadow: var(--shadow); }
.ecard .top { display: flex; gap: 10px; align-items: center; }
.ecard .nm { font-weight: 620; font-size: 13px; }
.ecard .ti { font-size: 11.5px; color: var(--ink-2); }
.ecard .meta { margin-top: 9px; padding-top: 8px; border-top: 1px solid var(--border); display: flex; gap: 7px; align-items: center; flex-wrap: wrap; font-size: 11px; color: var(--ink-3); }

/* the ring is the only decorative element in the product */
.ring { position: relative; flex: none; }
.ring .v { position: absolute; inset: 0; display: grid; place-items: center; font-size: 13px; font-weight: 650; font-variant-numeric: tabular-nums; }
.bar { height: 5px; border-radius: 3px; background: var(--surface-3); overflow: hidden; }
.bar > i { display: block; height: 100%; background: var(--ink-2); }

.kv { display: grid; grid-template-columns: minmax(110px, 32%) 1fr; gap: 0 14px; font-size: 12.5px; }
.kv dt { color: var(--ink-3); padding: 5px 0; }
.kv dd { margin: 0; padding: 5px 0; font-weight: 520; overflow-wrap: anywhere; }

.tabs { display: flex; gap: 1px; border-bottom: 1px solid var(--border); margin-bottom: 14px; overflow-x: auto; }
.tabs button { background: none; border: 0; cursor: pointer; padding: 8px 12px; font-size: 12.5px; color: var(--ink-2); font-weight: 550; border-bottom: 2px solid transparent; white-space: nowrap; }
.tabs button:hover { color: var(--ink); }
.tabs button.on { color: var(--ink); border-bottom-color: var(--ink); }
.tabs button .c { opacity: .5; margin-left: 3px; }

.empty { text-align: center; padding: 34px 18px; color: var(--ink-3); font-size: 12.5px; }
.note { display: flex; gap: 10px; align-items: flex-start; padding: 10px 13px; border-radius: var(--r); font-size: 12.5px; border: 1px solid var(--border); background: var(--surface-2); line-height: 1.5; }
.note.critical { background: var(--sev-critical-bg); color: var(--sev-critical); border-color: color-mix(in srgb, var(--sev-critical) 26%, transparent); }
.note.medium { background: var(--sev-medium-bg); color: var(--sev-medium); border-color: color-mix(in srgb, var(--sev-medium) 26%, transparent); }
.note.ok { background: var(--ok-bg); color: var(--ok); border-color: color-mix(in srgb, var(--ok) 26%, transparent); }
.note b { font-weight: 650; }

.sect { font-size: 10px; text-transform: uppercase; letter-spacing: .1em; color: var(--ink-3); font-weight: 650; margin: 16px 0 7px; }
.sect:first-child { margin-top: 0; }

/* --------------------------------------------------------- provenance rows */

.prov { border: 1px solid var(--border); border-radius: var(--r); overflow: hidden; }
.prow { border-bottom: 1px solid var(--border); }
.prow:last-child { border-bottom: 0; }
.phead { display: grid; grid-template-columns: 12px minmax(110px, 1fr) minmax(0, 1.5fr) auto auto; gap: 11px; align-items: center; padding: 7px 12px; cursor: pointer; width: 100%; background: none; border: 0; text-align: left; }
.phead:hover { background: var(--surface-2); }
.phead .fn { font-size: 12.5px; font-weight: 550; }
.phead .fv { font-size: 12.5px; overflow-wrap: anywhere; }
.pbody { padding: 4px 12px 12px 35px; background: var(--surface-2); font-size: 12px; }
.pbody table { width: 100%; border-collapse: collapse; }
.pbody td { padding: 5px 8px 5px 0; border-bottom: 1px dashed var(--border); }
.pbody tr:last-child td { border-bottom: 0; }

/* ------------------------------------------------------------- timeline */

.tline { position: relative; padding-left: 18px; }
.tline::before { content: ""; position: absolute; left: 4px; top: 4px; bottom: 4px; width: 1px; background: var(--border); }
.tev { position: relative; padding: 7px 0 7px 4px; display: grid; grid-template-columns: 96px 1fr auto; gap: 12px; align-items: baseline; cursor: pointer; border-radius: 5px; }
.tev:hover { background: var(--surface-2); }
.tev::before { content: ""; position: absolute; left: -18px; top: 13px; width: 7px; height: 7px; border-radius: 50%; background: var(--surface); border: 1.5px solid var(--border-2); }
.tev.open::before { background: var(--ink); border-color: var(--ink); }
.tev .when { font-size: 11.5px; color: var(--ink-3); font-variant-numeric: tabular-nums; }
.tev .what { font-size: 12.5px; }

/* -------------------------------------------------------------- overlays */

.ov { position: fixed; inset: 0; z-index: 60; background: rgba(6, 8, 10, .5); backdrop-filter: blur(2px); display: flex; justify-content: center; padding-top: 11vh; }
.pal { width: min(640px, 93vw); max-height: 70vh; background: var(--surface); border: 1px solid var(--border-2); border-radius: 10px; box-shadow: var(--shadow-lg); display: flex; flex-direction: column; overflow: hidden; height: fit-content; }
.pal input { border: 0; border-bottom: 1px solid var(--border); padding: 14px 16px; font: inherit; font-size: 15px; background: transparent; color: var(--ink); outline: none; }
.pal .res { overflow-y: auto; padding: 6px; }
.pal .r { display: flex; align-items: center; gap: 10px; padding: 7px 10px; border-radius: 6px; cursor: pointer; }
.pal .r.on, .pal .r:hover { background: var(--surface-2); }
.pal .r .t { font-weight: 550; font-size: 13px; }
.pal .r .s { font-size: 11px; color: var(--ink-3); }
.pal .r .ty { margin-left: auto; font-size: 10px; text-transform: uppercase; letter-spacing: .07em; color: var(--ink-3); font-weight: 620; }
.pal .hint { border-top: 1px solid var(--border); padding: 7px 14px; font-size: 10.5px; color: var(--ink-3); display: flex; gap: 14px; }

.dw { position: fixed; inset: 0; z-index: 70; background: rgba(6, 8, 10, .45); display: flex; justify-content: flex-end; }
.drawer { width: min(560px, 96vw); background: var(--surface); height: 100%; border-left: 1px solid var(--border); display: flex; flex-direction: column; box-shadow: var(--shadow-lg); }

<script>
/* --- core/schema.js --- */
/* SOT — schema primitives.
 *
 * Nothing in this file knows about hospitals, battalions or sales teams. It
 * defines the vocabulary every vertical is expressed in:
 *
 *   entity      a thing with an identity — a clinician, a patient, a ward, a
 *               visit, a squad, a territory. Every entity type is equal; there
 *               is no privileged "employee" object.
 *   assertion   one system's claim about one field of one entity, carrying
 *               both when we read it and when the source says it became true.
 *   edge        a typed, directional, *time-bounded* relationship between two
 *               entities.
 *
 * The time bounds on edges are the whole reason this product can answer "who
 * used to cover that territory" or "who was the nurse on that visit". A graph
 * of current-state pointers cannot answer either, and almost every system in a
 * customer's estate stores exactly that.
 */
(function (SOT) {
  'use strict';

  const DAY = 86400000;

  /* ------------------------------------------------------------ sensitivity */

  const SENSITIVITY_RANK = { public: 0, internal: 1, confidential: 2, protected: 3 };

  // `protected` exists for clinical and personal data — PHI in a hospital,
  // personnel records in a defence context. It is the level that must never be
  // visible on a hunch, so roles opt into it explicitly.
  function canSee(role, sensitivity) {
    return SENSITIVITY_RANK[sensitivity] <= SENSITIVITY_RANK[role.maxSensitivity];
  }

  /* --------------------------------------------------------------- conflicts */

  const CONFLICT_KINDS = {
    divergence: { label: 'Divergence', blurb: 'Systems that have both been read recently disagree on the value.' },
    lag: { label: 'Lag', blurb: 'A system has not been read since the value changed. It is behind, not wrong.' },
    gap: { label: 'Gap', blurb: 'A system that should carry this field has no value for it.' },
  };

  const SEVERITY_ORDER = ['critical', 'high', 'medium', 'low'];

  /* ------------------------------------------------------------------ time */

  /** Is an interval open at `ts`? A null end means "still true". */
  function activeAt(from, to, ts) {
    if (from != null && ts < from) return false;
    if (to != null && ts > to) return false;
    return true;
  }

  function overlaps(aFrom, aTo, bFrom, bTo) {
    if (aTo != null && bFrom != null && aTo < bFrom) return false;
    if (bTo != null && aFrom != null && bTo < aFrom) return false;
    return true;
  }

  /* ------------------------------------------------------------- assertions */

  function assertion(entityId, field, value, systemId, observedAt, effectiveFrom, extra) {
    return Object.assign(
      { entityId, field, value, systemId, observedAt, effectiveFrom: effectiveFrom == null ? observedAt : effectiveFrom },
      extra || {}
    );
  }

  /* ------------------------------------------------ identity match strengths
   *
   * Shared across verticals: a national provider number and a medical record
   * number are different strings but the same *kind* of evidence — a strong
   * structural key. Name plus date of birth is the same kind of evidence in a
   * hospital as name plus unit is in a battalion: suggestive, not conclusive.
   */
  const KEY_STRENGTH = {
    code: { score: 0.99, label: 'Structural code matches exactly' },
    email: { score: 0.98, label: 'Work email matches exactly' },
    employeeId: { score: 0.97, label: 'Employee ID cross-referenced' },
    npi: { score: 0.96, label: 'National provider number matches' },
    mrn: { score: 0.95, label: 'Medical record number matches' },
    serviceNumber: { score: 0.96, label: 'Service number matches' },
    badge: { score: 0.92, label: 'Badge / credential number matches' },
    nameDob: { score: 0.72, label: 'Name and date of birth match; no shared identifier' },
    nameGroup: { score: 0.66, label: 'Name and assigned group match; no shared identifier' },
    name: { score: 0.45, label: 'Name matches; nothing else corroborates' },
    confirmed: { score: 1.0, label: 'Confirmed by a reviewer' },
  };

  const AUTO_LINK = 0.9;
  const REVIEW = 0.4;

  /* -------------------------------------------------------------- formatting */

  const norm = {
    text: (s) => (s == null ? '' : String(s).trim().toLowerCase()),
    name: (s) =>
      (s || '')
        .normalize('NFD')
        .replace(/[̀-ͯ]/g, '')
        .toLowerCase()
        .replace(/\b(dr|mr|mrs|ms|prof|sgt|cpl|lt|capt|maj|col)\b\.?/g, '')
        .replace(/[^a-z ]/g, '')
        .replace(/\s+/g, ' ')
        .trim(),
  };

  SOT.schema = {
    DAY,
    SENSITIVITY_RANK,
    CONFLICT_KINDS,
    SEVERITY_ORDER,
    KEY_STRENGTH,
    AUTO_LINK,
    REVIEW,
    canSee,
    activeAt,
    overlaps,
    assertion,
    norm,
  };
})(window.SOT || (window.SOT = {}));
</script>
<script>
/* --- core/graph.js --- */
/* SOT — the entity graph.
 *
 * Every relationship is stored once, typed, directional and time-bounded, and
 * indexed in both directions. That is what makes the interface navigable in
 * the way the product promises: from any entity you can ask "what is attached
 * to this, by what kind of relationship, and when was that true" — and every
 * answer is itself an entity you can open.
 *
 * The time bounds are load-bearing. `neighbours(id, 'assigned_to')` answers
 * "who works this ward"; the same call with `{ when: 'past' }` answers "who
 * used to". No separate history table, no snapshotting.
 */
(function (SOT) {
  'use strict';

  const S = SOT.schema;

  function build(entities, rawEdges, entityIdOf) {
    const byId = {};
    const byType = {};
    entities.forEach((e) => {
      byId[e.id] = e;
      (byType[e.type] || (byType[e.type] = [])).push(e);
    });

    /* Resolve each edge's endpoints from source-native references to entity
       ids. An edge pointing at something identity resolution never matched is
       dropped and counted — silently keeping a dangling pointer would show up
       later as a confidently wrong org chart. */
    const edges = [];
    const dangling = [];
    rawEdges.forEach((raw, i) => {
      const from = entityIdOf(raw.from);
      const to = entityIdOf(raw.to);
      if (!from || !to || from === to) {
        dangling.push(raw);
        return;
      }
      edges.push({
        id: 'E' + i,
        type: raw.type,
        from,
        to,
        fromTs: raw.fromTs == null ? null : raw.fromTs,
        toTs: raw.toTs == null ? null : raw.toTs,
        role: raw.role || null,
        meta: raw.meta || null,
        systemId: raw.systemId || null,
      });
    });

    const out = {}; // fromId -> type -> [edge]
    const inc = {}; // toId   -> type -> [edge]
    edges.forEach((e) => {
      ((out[e.from] || (out[e.from] = {}))[e.type] || (out[e.from][e.type] = [])).push(e);
      ((inc[e.to] || (inc[e.to] = {}))[e.type] || (inc[e.to][e.type] = [])).push(e);
    });

    /**
     * Everything hanging off an entity.
     *
     * @param id        entity id
     * @param type      edge type, or null for every type
     * @param opts.dir  'out' | 'in' | 'both'  (default 'both')
     * @param opts.when 'current' | 'past' | 'all'  (default 'all')
     * @param opts.at   timestamp for 'current' (default asOf)
     */
    function edgesOf(id, type, opts) {
      opts = opts || {};
      const dir = opts.dir || 'both';
      const when = opts.when || 'all';
      const at = opts.at;
      const collect = (index, direction) => {
        const bucket = index[id];
        if (!bucket) return [];
        const lists = type ? [bucket[type] || []] : Object.keys(bucket).map((k) => bucket[k]);
        const flat = [];
        lists.forEach((l) => l.forEach((e) => flat.push({ edge: e, direction })));
        return flat;
      };
      let rows = [];
      if (dir === 'out' || dir === 'both') rows = rows.concat(collect(out, 'out'));
      if (dir === 'in' || dir === 'both') rows = rows.concat(collect(inc, 'in'));
      if (when !== 'all') {
        rows = rows.filter((r) => {
          const live = S.activeAt(r.edge.fromTs, r.edge.toTs, at);
          return when === 'current' ? live : !live;
        });
      }
      return rows;
    }

    /** The same thing, resolved to the entity at the far end. */
    function neighbours(id, type, opts) {
      return edgesOf(id, type, opts)
        .map((r) => {
          const otherId = r.direction === 'out' ? r.edge.to : r.edge.from;
          const entity = byId[otherId];
          return entity ? { entity, edge: r.edge, direction: r.direction } : null;
        })
        .filter(Boolean);
    }

    /** First neighbour of a type, preferring one that is currently active. */
    function neighbour(id, type, opts) {
      const all = neighbours(id, type, opts);
      const live = all.filter((n) => S.activeAt(n.edge.fromTs, n.edge.toTs, (opts && opts.at) || Infinity));
      return (live[0] || all[0] || null);
    }

    /** Walk one edge type upward until it runs out — reporting lines, unit trees. */
    function ancestors(id, type, at) {
      const chain = [];
      const seen = new Set([id]);
      let cur = id;
      for (let i = 0; i < 24; i++) {
        const next = neighbour(cur, type, { dir: 'out', at });
        if (!next || seen.has(next.entity.id)) break;
        chain.push(next.entity);
        seen.add(next.entity.id);
        cur = next.entity.id;
      }
      return chain;
    }

    /** Everything below an entity along one edge type. */
    function descendants(id, type, at) {
      const acc = [];
      const seen = new Set([id]);
      const walk = (cur) => {
        neighbours(cur, type, { dir: 'in', at }).forEach((n) => {
          if (seen.has(n.entity.id)) return;
          seen.add(n.entity.id);
          acc.push(n.entity);
          walk(n.entity.id);
        });
      };
      walk(id);
      return acc;
    }

    return {
      entities,
      byId,
      byType,
      edges,
      dangling,
      edgesOf,
      neighbours,
      neighbour,
      ancestors,
      descendants,
      of: (id) => byId[id] || null,
      typed: (type) => byType[type] || [],
    };
  }

  SOT.graph = { build };
})(window.SOT || (window.SOT = {}));
</script>
<script>
/* --- core/identity.js --- */
/* SOT — identity resolution.
 *
 * Every claim this product makes rests on knowing that an Epic user, a Workday
 * worker and a badge record are one human being — or that two medical record
 * numbers are one patient. A wrong match doesn't cause a small error; it
 * causes a confident lie about a person, and in a hospital that lie can be
 * attached to a chart.
 *
 * So matching is scored rather than boolean, only strong evidence links
 * automatically, and everything in between becomes a queue a human works. The
 * queue is a feature: forty uncertain matches shown honestly beat forty
 * invented facts.
 *
 * The algorithm is vertical-agnostic. It clusters records *within an entity
 * type* on shared identity keys, weighted by how much that kind of key is
 * worth (see KEY_STRENGTH). Hospitals match on MRN and NPI, defence on service
 * number, sales on employee ID — same code, different keys.
 */
(function (SOT) {
  'use strict';

  const S = SOT.schema;

  function resolveIdentities(pack, opts) {
    opts = opts || {};
    const forced = opts.forcedLinks || [];
    const dismissed = new Set(opts.dismissedKeys || []);
    const typeById = Object.fromEntries(pack.entityTypes.map((t) => [t.id, t]));

    /* 1. flatten every source record into a comparable entry */
    const entries = [];
    Object.keys(pack.adapters).forEach((sysId) => {
      const adapter = pack.adapters[sysId];
      (pack.records[adapter.collection] || []).forEach((record) => {
        const ident = adapter.identity(record);
        if (!ident) return;
        entries.push({
          key: sysId + ':' + ident.nativeId,
          system: sysId,
          nativeId: ident.nativeId,
          entityType: record._type,
          record,
          ident,
          keys: ident.keys || {},
        });
      });
    });
    const byKey = Object.fromEntries(entries.map((e) => [e.key, e]));

    /* 2. bucket on every identity key value, then score pairs.
       Blocking on key values keeps this near-linear; a production build uses
       the same strategy against an index. */
    const buckets = {};
    entries.forEach((e) => {
      Object.keys(e.keys).forEach((kind) => {
        const v = e.keys[kind];
        if (v == null || v === '') return;
        const b = kind + '|' + e.entityType + '|' + String(v).toLowerCase();
        (buckets[b] || (buckets[b] = [])).push({ entry: e, kind });
      });
    });

    const edges = new Map();
    Object.keys(buckets).forEach((b) => {
      const group = buckets[b];
      if (group.length < 2 || group.length > 60) return; // a 60-way "match" is a bad key, not a person
      for (let i = 0; i < group.length; i++) {
        for (let j = i + 1; j < group.length; j++) {
          const a = group[i].entry;
          const c = group[j].entry;
          if (a.key === c.key) continue;
          const kind = group[i].kind;
          const strength = S.KEY_STRENGTH[kind];
          if (!strength) continue;
          const id = a.key < c.key ? a.key + '|' + c.key : c.key + '|' + a.key;
          const prev = edges.get(id);
          if (!prev || prev.score < strength.score) edges.set(id, { a: a.key, b: c.key, kind, score: strength.score });
        }
      }
    });

    /* 3. union only what is strong enough to apply without asking */
    const parent = {};
    const find = (x) => {
      if (parent[x] === undefined) parent[x] = x;
      while (parent[x] !== x) { parent[x] = parent[parent[x]]; x = parent[x]; }
      return x;
    };
    const union = (a, b) => { const ra = find(a), rb = find(b); if (ra !== rb) parent[ra] = rb; };
    entries.forEach((e) => find(e.key));

    const strong = [];
    const weak = [];
    const forcedIds = new Set(forced.map((f) => (f.a < f.b ? f.a + '|' + f.b : f.b + '|' + f.a)));
    edges.forEach((edge, id) => {
      if (forcedIds.has(id)) return;
      if (edge.score >= S.AUTO_LINK) { union(edge.a, edge.b); strong.push(edge); }
      else if (edge.score >= S.REVIEW) weak.push(edge);
    });
    forced.forEach((f) => {
      if (!byKey[f.a] || !byKey[f.b]) return;
      union(f.a, f.b);
      strong.push({ a: f.a, b: f.b, kind: 'confirmed', score: 1 });
    });

    /* 4. clusters become entities */
    const clusters = {};
    entries.forEach((e) => {
      const root = find(e.key);
      (clusters[root] || (clusters[root] = [])).push(e);
    });

    // Index the applied links by record key. Scanning the whole edge list for
    // every record is quadratic, and was by a wide margin the slowest step in
    // the pipeline on a large tenant.
    const strongByKey = new Map();
    strong.forEach((e) => {
      if (!strongByKey.has(e.a)) strongByKey.set(e.a, []);
      if (!strongByKey.has(e.b)) strongByKey.set(e.b, []);
      strongByKey.get(e.a).push(e);
      strongByKey.get(e.b).push(e);
    });

    const entities = [];
    const unresolved = [];
    const entityByRecordKey = {};

    Object.values(clusters).forEach((members) => {
      const type = typeById[members[0].entityType];
      if (!type) return;
      const masters = type.masterSystems || [];
      let anchor = null;
      for (let i = 0; i < masters.length && !anchor; i++) {
        anchor = members.find((m) => m.system === masters[i] && m.ident.active !== false);
      }
      if (!anchor) anchor = members.find((m) => m.ident.active !== false) || members[0];

      // A cluster with no evidence from any authoritative system is not an
      // entity yet — it is a question. Ghost seats and orphaned records land
      // here rather than becoming people.
      const hasMaster = members.some((m) => masters.indexOf(m.system) >= 0);
      if (!hasMaster && type.requireMaster) {
        members.forEach((m) => {
          if (dismissed.has(m.key)) return;
          unresolved.push({
            key: m.key,
            system: m.system,
            entityType: m.entityType,
            nativeId: m.nativeId,
            name: m.ident.name,
            detail: m.ident.detail || '',
            reason: 'No record in an authoritative system could be matched to this.',
            recommendation: 'Confirm what this record represents, or retire it.',
            suggestions: [],
          });
        });
        return;
      }

      const id = type.id.toUpperCase().slice(0, 3) + '-' + anchor.nativeId.replace(/[^A-Za-z0-9-]/g, '');
      const links = members.map((m) => {
        const edge = strong.find((e) => (e.a === m.key || e.b === m.key) && (e.a === anchor.key || e.b === anchor.key));
        const kind = m === anchor ? null : edge ? edge.kind : null;
        return {
          system: m.system,
          nativeId: m.nativeId,
          record: m.record,
          confidence: m === anchor ? 1 : edge ? edge.score : 0.9,
          method: m === anchor ? 'anchor' : kind || 'transitive',
          methodLabel:
            m === anchor
              ? 'Authoritative record for this entity'
              : kind
                ? S.KEY_STRENGTH[kind].label
                : 'Linked through another matched system',
          active: m.ident.active !== false,
        };
      });

      const bySystem = {};
      links.forEach((l) => (bySystem[l.system] || (bySystem[l.system] = [])).push(l));

      const flags = [];
      Object.keys(bySystem).forEach((sys) => {
        if (bySystem[sys].length > 1) {
          flags.push({
            kind: 'duplicate-record',
            system: sys,
            severity: 'high',
            label: bySystem[sys].length + ' ' + pack.systemById[sys].name + ' records resolve to this ' + type.label.toLowerCase(),
          });
        }
      });
      (type.expectedSystems || []).forEach((sys) => {
        if (!bySystem[sys]) {
          flags.push({
            kind: 'missing-system',
            system: sys,
            severity: type.id === 'staff' ? 'critical' : 'medium',
            label: 'No ' + pack.systemById[sys].name + ' record',
          });
        }
      });

      entities.push({
        id,
        type: type.id,
        anchorSystem: anchor.system,
        displayName: anchor.ident.name,
        links,
        bySystem,
        flags,
        confidence: Math.min.apply(null, links.map((l) => l.confidence)),
        suggestions: [],
      });
      members.forEach((m) => { entityByRecordKey[m.key] = id; });
    });

    const entityById = Object.fromEntries(entities.map((e) => [e.id, e]));

    /* 5. the middle band becomes proposals rather than assumptions */
    weak.forEach((edge) => {
      const ea = entityByRecordKey[edge.a];
      const eb = entityByRecordKey[edge.b];
      if (ea && eb && ea !== eb) return; // two known entities that merely share a name
      const entityId = ea || eb;
      if (!entityId) return;
      const looseKey = ea ? edge.b : edge.a;
      if (entityByRecordKey[looseKey] || dismissed.has(looseKey)) return;
      const loose = byKey[looseKey];
      if (!loose) return;

      const proposal = {
        entityId,
        entityName: entityById[entityId].displayName,
        system: loose.system,
        entityType: loose.entityType,
        nativeId: loose.nativeId,
        name: loose.ident.name,
        detail: loose.ident.detail || '',
        score: edge.score,
        methodLabel: S.KEY_STRENGTH[edge.kind].label,
      };
      entityById[entityId].suggestions.push(proposal);
      const existing = unresolved.find((x) => x.key === looseKey);
      if (existing) existing.suggestions.push(proposal);
      else
        unresolved.push({
          key: looseKey,
          system: loose.system,
          entityType: loose.entityType,
          nativeId: loose.nativeId,
          name: loose.ident.name,
          detail: loose.ident.detail || '',
          reason: 'Resembles a known record but shares no identifier with it.',
          recommendation: 'Confirm the link so this system starts contributing to ' + proposal.entityName + '.',
          suggestions: [proposal],
        });
    });

    /* 6. reference index — lets edges and manager pointers written in one
          system's dialect find the entity they mean */
    const refIndex = {};
    entries.forEach((e) => {
      const eid = entityByRecordKey[e.key];
      if (!eid) return;
      refIndex[e.entityType + '|' + e.system + '|' + e.nativeId] = eid;
    });

    function entityIdOf(ref) {
      if (!ref) return null;
      return refIndex[ref.type + '|' + ref.sys + '|' + ref.id] || null;
    }

    return {
      entities,
      entityById,
      unresolved,
      entityByRecordKey,
      entityIdOf,
      refIndex,
      stats: {
        sourceRecords: entries.length,
        entities: entities.length,
        autoLinked: strong.length,
        needsReview: unresolved.length,
        byType: pack.entityTypes.reduce((acc, t) => {
          acc[t.id] = entities.filter((e) => e.type === t.id).length;
          return acc;
        }, {}),
      },
      thresholds: { AUTO_LINK: S.AUTO_LINK, REVIEW: S.REVIEW },
    };
  }

  SOT.identity = { resolveIdentities };
})(window.SOT || (window.SOT = {}));
</script>
<script>
/* --- core/resolve.js --- */
/* SOT — resolution and conflict classification.
 *
 * No merged record is ever stored. Each system's claims are kept as immutable
 * assertions, and the value of a field is computed at read time from a policy
 * the customer owns. Change the policy and the entire application re-answers,
 * with no migration and no re-sync, because there was never a golden copy to
 * migrate.
 *
 * Classification is the part that decides whether anyone keeps using this:
 *
 *   Divergence  both systems read recently, both confident, values differ
 *   Lag         a system has not been read since the value changed
 *   Gap         a system that should carry the field is empty
 *
 * Reporting lag as a defect is how reconciliation tools generate four thousand
 * findings, half of which fix themselves overnight, and lose the customer's
 * trust in the other half.
 */
(function (SOT) {
  'use strict';

  const S = SOT.schema;

  function sameValue(a, b) {
    if (a === b) return true;
    if (a == null || b == null) return false;
    if (typeof a === 'number' && typeof b === 'number') return a === b;
    return String(a).trim().toLowerCase() === String(b).trim().toLowerCase();
  }
  const isEmpty = (v) => v === null || v === undefined || v === '';

  function severityFor(field, kind) {
    const w = field.weight;
    const base = w >= 5 ? 0 : w >= 4 ? 1 : w >= 2 ? 2 : 3;
    const shift = kind === 'divergence' ? 0 : kind === 'gap' ? 1 : 2;
    return S.SEVERITY_ORDER[Math.min(3, base + shift)];
  }

  function capabilities(pack) {
    if (pack._capabilities) return pack._capabilities;
    const caps = {};
    Object.keys(pack.adapters).forEach((sysId) => {
      const set = new Set();
      (pack.records[pack.adapters[sysId].collection] || []).forEach((rec) => {
        (pack.adapters[sysId].assertions(rec) || []).forEach((a) => set.add(a.field));
      });
      caps[sysId] = set;
    });
    pack._capabilities = caps;
    return caps;
  }

  function resolveAll(pack, identity, policy, asOf) {
    const caps = capabilities(pack);
    const fieldsByEntity = {};
    pack.fields.forEach((f) => (fieldsByEntity[f.entity] || (fieldsByEntity[f.entity] = [])).push(f));

    const profiles = {};
    const conflicts = [];
    let seq = 0;

    identity.entities.forEach((entity) => {
      const fields = fieldsByEntity[entity.type] || [];
      const bucket = {};
      const linked = new Set();

      entity.links.forEach((link) => {
        linked.add(link.system);
        const adapter = pack.adapters[link.system];
        (adapter.assertions(link.record) || []).forEach((a) => {
          if (isEmpty(a.value)) return;
          (bucket[a.field] || (bucket[a.field] = [])).push({
            field: a.field,
            value: a.value,
            systemId: link.system,
            nativeId: link.nativeId,
            observedAt: a.observedAt,
            effectiveFrom: a.effectiveFrom == null ? a.observedAt : a.effectiveFrom,
            scheduled: !!a.scheduled,
            effectiveDating: !!adapter.effectiveDating,
          });
        });
      });

      const resolved = {};
      const scheduled = [];
      let weightTotal = 0;
      let weightLost = 0;

      fields.forEach((field) => {
        const all = bucket[field.key] || [];
        const current = [];
        all.forEach((a) => {
          if (a.scheduled || a.effectiveFrom > asOf) scheduled.push(Object.assign({ fieldLabel: field.label }, a));
          else current.push(a);
        });
        if (!current.length) {
          resolved[field.key] = { field, value: null, systemId: null, assertions: [], conflict: null, absent: true };
          return;
        }

        const order = policy[field.key] || [];
        let winner = null;
        for (let i = 0; i < order.length && !winner; i++) {
          const cands = current.filter((a) => a.systemId === order[i] && !isEmpty(a.value));
          if (cands.length) {
            cands.sort((x, y) => y.effectiveFrom - x.effectiveFrom);
            winner = cands[0];
          }
        }
        if (!winner) winner = current.slice().sort((x, y) => y.observedAt - x.observedAt)[0];
        if (!winner) {
          resolved[field.key] = { field, value: null, systemId: null, assertions: current, conflict: null, absent: true };
          return;
        }

        weightTotal += field.weight;
        const offenders = [];

        current.forEach((a) => {
          if (a.systemId === winner.systemId || isEmpty(a.value) || sameValue(a.value, winner.value)) return;
          let kind;
          if (winner.effectiveDating && a.observedAt < winner.effectiveFrom) kind = 'lag';
          else if (asOf - a.observedAt > field.tolerance * S.DAY) kind = 'lag';
          else kind = 'divergence';
          offenders.push({ systemId: a.systemId, value: a.value, observedAt: a.observedAt, kind, assertion: a });
        });

        field.contributors.forEach((sysId) => {
          if (sysId === winner.systemId || !linked.has(sysId)) return;
          if (!caps[sysId] || !caps[sysId].has(field.key)) return;
          if (current.some((a) => a.systemId === sysId && !isEmpty(a.value))) return;
          offenders.push({ systemId: sysId, value: null, observedAt: pack.syncState[sysId].lastSync, kind: 'gap' });
        });

        let conflict = null;
        if (offenders.length) {
          const kind = offenders.some((o) => o.kind === 'divergence')
            ? 'divergence'
            : offenders.some((o) => o.kind === 'gap') ? 'gap' : 'lag';
          seq++;
          conflict = {
            id: 'C' + String(seq).padStart(4, '0'),
            entityId: entity.id,
            entityType: entity.type,
            entityName: entity.displayName,
            field: field.key,
            fieldLabel: field.label,
            group: field.group,
            kind,
            severity: field.severity ? field.severity(kind) : severityFor(field, kind),
            resolvedValue: winner.value,
            resolvedSystem: winner.systemId,
            offenders,
            systems: [winner.systemId].concat(offenders.map((o) => o.systemId)),
            actionable: kind !== 'lag',
            impact: field.impact || null,
          };
          conflicts.push(conflict);
          weightLost += field.weight * (kind === 'lag' ? 0.34 : 1);
        }

        resolved[field.key] = {
          field,
          value: winner.value,
          systemId: winner.systemId,
          effectiveFrom: winner.effectiveFrom,
          observedAt: winner.observedAt,
          assertions: current,
          conflict,
          absent: false,
        };
      });

      profiles[entity.id] = {
        entity,
        type: entity.type,
        fields: resolved,
        scheduled,
        linkedSystems: Array.from(linked),
        alignment: weightTotal ? Math.max(0, Math.round((1 - weightLost / weightTotal) * 100)) : 100,
        conflicts: [],
        get: (k) => (resolved[k] ? resolved[k].value : null),
        name: null,
      };
    });

    conflicts.forEach((c) => profiles[c.entityId].conflicts.push(c));
    conflicts.sort(
      (a, b) =>
        S.SEVERITY_ORDER.indexOf(a.severity) - S.SEVERITY_ORDER.indexOf(b.severity) ||
        a.entityName.localeCompare(b.entityName)
    );

    // Display name comes from the entity type's title field once resolved, so
    // a renamed ward or a patient's corrected legal name flows through.
    const typeById = Object.fromEntries(pack.entityTypes.map((t) => [t.id, t]));
    Object.values(profiles).forEach((p) => {
      const t = typeById[p.type];
      p.name = (t && t.titleField && p.get(t.titleField)) || p.entity.displayName;
    });

    return { profiles, conflicts, asOf, policy };
  }

  SOT.resolve = { resolveAll, sameValue, severityFor };
})(window.SOT || (window.SOT = {}));
</script>
<script>
/* --- core/stats.js --- */
/* SOT — statistics.
 *
 * Every entity type carries its own metrics, computed by walking the graph
 * rather than read from a warehouse table. That matters for the product's
 * central promise: if you can click from a clinician to a ward to a visit to a
 * patient and back to a different clinician, then every one of those pages has
 * to be able to answer "and how is this one doing?" without a bespoke report
 * behind it.
 *
 * A stat is a pure function of (profile, context). Adding one is a few lines;
 * it appears on every page of that entity type immediately.
 */
(function (SOT) {
  'use strict';

  const DAY = 86400000;

  const pct = (n, d) => (d ? Math.round((n / d) * 100) : 0);
  const mean = (xs) => (xs.length ? xs.reduce((a, b) => a + b, 0) / xs.length : 0);

  /* Helpers shared by the health stats: the graph walks that keep coming up. */
  function encountersOfStaff(id, ctx) {
    return ctx.graph.neighbours(id, 'care_team', { dir: 'in' }).map((n) => ({ enc: ctx.profiles[n.entity.id], role: n.edge.role }));
  }
  function encountersOfPatient(id, ctx) {
    return ctx.graph.neighbours(id, 'encounter_of', { dir: 'in' }).map((n) => ctx.profiles[n.entity.id]);
  }
  function encountersOfUnit(id, ctx) {
    return ctx.graph.neighbours(id, 'occurred_at', { dir: 'in' }).map((n) => ctx.profiles[n.entity.id]);
  }
  function patientOf(encId, ctx) {
    const n = ctx.graph.neighbour(encId, 'encounter_of', { dir: 'out' });
    return n ? n.entity.id : null;
  }
  function within(encs, days, asOf) {
    return encs.filter((e) => e && e.get('admitAt') && asOf - e.get('admitAt') <= days * DAY);
  }
  /** Share of visits followed by another visit for the same patient inside 30 days. */
  function readmissionRate(encs, ctx) {
    const inpatient = encs.filter((e) => e && e.get('encounterType') === 'Inpatient');
    if (!inpatient.length) return null;
    let hits = 0;
    inpatient.forEach((e) => {
      const pid = patientOf(e.entity.id, ctx);
      if (!pid) return;
      const others = encountersOfPatient(pid, ctx);
      const discharge = e.get('dischargeAt');
      if (others.some((o) => o && o.entity.id !== e.entity.id && o.get('admitAt') > discharge && o.get('admitAt') - discharge <= 30 * DAY)) hits++;
    });
    return pct(hits, inpatient.length);
  }

  const HEALTH = {
    staff: [
      { id: 'visits90', label: 'Visits attended', hint: 'Last 90 days', fmt: 'int',
        calc: (p, ctx) => within(encountersOfStaff(p.entity.id, ctx).map((x) => x.enc), 90, ctx.asOf).length },
      { id: 'patients', label: 'Patients seen', hint: 'All time, distinct', fmt: 'int', sensitivity: 'confidential',
        calc: (p, ctx) => new Set(encountersOfStaff(p.entity.id, ctx).map((x) => patientOf(x.enc.entity.id, ctx)).filter(Boolean)).size },
      { id: 'panel', label: 'Panel size', hint: 'Patients where they are primary', fmt: 'int', sensitivity: 'confidential',
        calc: (p, ctx) => ctx.graph.neighbours(p.entity.id, 'panel_of', { dir: 'in', when: 'current', at: ctx.asOf }).length },
      { id: 'units', label: 'Wards worked', hint: 'Including previous assignments', fmt: 'int',
        calc: (p, ctx) => new Set(ctx.graph.neighbours(p.entity.id, 'assigned_to', { dir: 'out' }).map((n) => n.entity.id)).size },
      { id: 'avgLos', label: 'Average stay', hint: 'Inpatient visits attended', fmt: 'days',
        calc: (p, ctx) => {
          const los = encountersOfStaff(p.entity.id, ctx)
            .map((x) => x.enc).filter((e) => e && e.get('encounterType') === 'Inpatient')
            .map((e) => e.get('lengthOfDays')).filter((v) => v != null);
          return los.length ? Number(mean(los).toFixed(1)) : null;
        } },
      { id: 'readmit', label: 'Readmission rate', hint: 'Within 30 days', fmt: 'pct', invert: true,
        calc: (p, ctx) => readmissionRate(encountersOfStaff(p.entity.id, ctx).map((x) => x.enc), ctx) },
      { id: 'tenure', label: 'Tenure', hint: 'Since start date', fmt: 'years',
        calc: (p, ctx) => (p.get('hireDate') ? Number(((ctx.asOf - p.get('hireDate')) / (365 * DAY)).toFixed(1)) : null) },
    ],

    patient: [
      { id: 'visits', label: 'Visits', hint: 'All time', fmt: 'int', sensitivity: 'protected',
        calc: (p, ctx) => encountersOfPatient(p.entity.id, ctx).length },
      { id: 'visits12', label: 'Visits', hint: 'Last 12 months', fmt: 'int', sensitivity: 'protected',
        calc: (p, ctx) => within(encountersOfPatient(p.entity.id, ctx), 365, ctx.asOf).length },
      { id: 'lastVisit', label: 'Last seen', hint: 'Most recent arrival', fmt: 'date', sensitivity: 'protected',
        calc: (p, ctx) => {
          const ds = encountersOfPatient(p.entity.id, ctx).map((e) => e && e.get('admitAt')).filter(Boolean);
          return ds.length ? Math.max.apply(null, ds) : null;
        } },
      { id: 'inpatientDays', label: 'Inpatient days', hint: 'All time', fmt: 'int', sensitivity: 'protected',
        calc: (p, ctx) => encountersOfPatient(p.entity.id, ctx)
          .filter((e) => e && e.get('encounterType') === 'Inpatient')
          .reduce((s, e) => s + (e.get('lengthOfDays') || 0), 0) },
      { id: 'clinicians', label: 'Clinicians involved', hint: 'Distinct, all visits', fmt: 'int', sensitivity: 'protected',
        calc: (p, ctx) => {
          const set = new Set();
          encountersOfPatient(p.entity.id, ctx).forEach((e) =>
            e && ctx.graph.neighbours(e.entity.id, 'care_team', { dir: 'out' }).forEach((n) => set.add(n.entity.id)));
          return set.size;
        } },
      { id: 'readmit', label: 'Readmissions', hint: 'Return within 30 days', fmt: 'int', invert: true, sensitivity: 'protected',
        calc: (p, ctx) => {
          const encs = encountersOfPatient(p.entity.id, ctx).filter(Boolean).sort((a, b) => a.get('admitAt') - b.get('admitAt'));
          let n = 0;
          for (let i = 1; i < encs.length; i++) {
            const prev = encs[i - 1].get('dischargeAt');
            if (prev && encs[i].get('admitAt') - prev <= 30 * DAY && encs[i - 1].get('encounterType') === 'Inpatient') n++;
          }
          return n;
        } },
    ],

    unit: [
      { id: 'visits90', label: 'Visits', hint: 'Last 90 days', fmt: 'int',
        calc: (p, ctx) => within(encountersOfUnit(p.entity.id, ctx), 90, ctx.asOf).length },
      { id: 'staffNow', label: 'Assigned staff', hint: 'Currently rostered', fmt: 'int',
        calc: (p, ctx) => ctx.graph.neighbours(p.entity.id, 'assigned_to', { dir: 'in', when: 'current', at: ctx.asOf }).length },
      { id: 'staffEver', label: 'Ever assigned', hint: 'Including past staff', fmt: 'int',
        calc: (p, ctx) => new Set(ctx.graph.neighbours(p.entity.id, 'assigned_to', { dir: 'in' }).map((n) => n.entity.id)).size },
      { id: 'avgLos', label: 'Average stay', hint: 'Inpatient visits on this unit', fmt: 'days',
        calc: (p, ctx) => {
          const los = encountersOfUnit(p.entity.id, ctx)
            .filter((e) => e && e.get('encounterType') === 'Inpatient')
            .map((e) => e.get('lengthOfDays')).filter((v) => v != null);
          return los.length ? Number(mean(los).toFixed(1)) : null;
        } },
      { id: 'readmit', label: 'Readmission rate', hint: 'Within 30 days', fmt: 'pct', invert: true,
        calc: (p, ctx) => readmissionRate(encountersOfUnit(p.entity.id, ctx), ctx) },
      { id: 'perBed', label: 'Visits per bed', hint: 'Last 90 days', fmt: 'ratio',
        calc: (p, ctx) => {
          const beds = p.get('beds');
          if (!beds) return null;
          return Number((within(encountersOfUnit(p.entity.id, ctx), 90, ctx.asOf).length / beds).toFixed(1));
        } },
    ],

    facility: [
      { id: 'units', label: 'Units', hint: 'Departments here', fmt: 'int',
        calc: (p, ctx) => ctx.graph.neighbours(p.entity.id, 'part_of', { dir: 'in' }).length },
      { id: 'staff', label: 'Privileged staff', hint: 'Currently privileged', fmt: 'int',
        calc: (p, ctx) => ctx.graph.neighbours(p.entity.id, 'privileged_at', { dir: 'in', when: 'current', at: ctx.asOf }).length },
      { id: 'visits90', label: 'Visits', hint: 'Last 90 days', fmt: 'int',
        calc: (p, ctx) => {
          let n = 0;
          ctx.graph.neighbours(p.entity.id, 'part_of', { dir: 'in' }).forEach((u) => {
            n += within(encountersOfUnit(u.entity.id, ctx), 90, ctx.asOf).length;
          });
          return n;
        } },
      { id: 'beds', label: 'Licensed beds', hint: 'As registered', fmt: 'int', calc: (p) => p.get('licensedBeds') },
    ],

    encounter: [
      { id: 'los', label: 'Length of stay', hint: 'Clinical', fmt: 'days', sensitivity: 'confidential',
        calc: (p) => p.get('lengthOfDays') },
      { id: 'team', label: 'Care team', hint: 'People who touched this visit', fmt: 'int', sensitivity: 'confidential',
        calc: (p, ctx) => ctx.graph.neighbours(p.entity.id, 'care_team', { dir: 'out' }).length },
      { id: 'sinceAdmit', label: 'Time since arrival', hint: 'From admission', fmt: 'daysAgo', sensitivity: 'confidential',
        calc: (p, ctx) => (p.get('admitAt') ? Math.round((ctx.asOf - p.get('admitAt')) / DAY) : null) },
    ],
  };

  const REGISTRY = { health: HEALTH };

  function forType(packId, typeId) {
    return (REGISTRY[packId] && REGISTRY[packId][typeId]) || [];
  }

  function compute(packId, profile, ctx) {
    return forType(packId, profile.type).map((s) => {
      let value = null;
      try { value = s.calc(profile, ctx); } catch (e) { value = null; }
      return { id: s.id, label: s.label, hint: s.hint, fmt: s.fmt, invert: !!s.invert, sensitivity: s.sensitivity || 'internal', value };
    });
  }

  SOT.stats = { REGISTRY, forType, compute, register: (packId, defs) => { REGISTRY[packId] = defs; } };
})(window.SOT || (window.SOT = {}));
</script>
<script>
/* --- core/tasks.js --- */
/* SOT — remediation.
 *
 * A finding nobody owns is a report. Each actionable conflict becomes a
 * specific instruction — which system, which field, which value, why it
 * matters — routed to the team that can actually change it.
 *
 * Deliberately not write-back. Pushing corrections into a customer's EHR or
 * HRIS makes us liable for the state of a clinical record on day one, and no
 * hospital grants a new vendor that access anyway. Land the recommendation and
 * the audit trail first; earn write access later, if ever.
 */
(function (SOT) {
  'use strict';

  const OWNER_BY_FIELD = {
    licenseExpiry: 'Medical Staff Office',
    licenseNumber: 'Medical Staff Office',
    privilegeStatus: 'Medical Staff Office',
    credential: 'Medical Staff Office',
    npi: 'Medical Staff Office',
    employmentStatus: 'Identity Governance',
    accessStatus: 'Identity Governance',
    homeUnit: 'Workforce Operations',
    department: 'Workforce Operations',
    jobTitle: 'Workforce Operations',
    employeeId: 'Workforce Operations',
    dob: 'Health Information Management',
    mrn: 'Health Information Management',
    fullName: 'Health Information Management',
    phone: 'Patient Access',
    address: 'Patient Access',
    insurance: 'Revenue Cycle',
    lengthOfDays: 'Revenue Cycle',
    payer: 'Revenue Cycle',
    claimStatus: 'Revenue Cycle',
  };

  const OWNER_BY_ENTITY = {
    staff: 'Workforce Operations',
    patient: 'Health Information Management',
    unit: 'Workforce Operations',
    facility: 'Workforce Operations',
    encounter: 'Revenue Cycle',
  };

  function generate(pack, resolution, identity, fmtValue) {
    const sysName = (id) => pack.systemById[id].name;
    const tasks = [];

    resolution.conflicts.forEach((c) => {
      if (!c.actionable) return;
      const targets = c.offenders.filter((o) => o.kind !== 'lag').map((o) => o.systemId);
      const names = targets.map(sysName);
      const value = fmtValue(c.field, c.resolvedValue);
      tasks.push({
        id: 'T' + c.id.slice(1),
        conflictId: c.id,
        entityId: c.entityId,
        entityType: c.entityType,
        entityName: c.entityName,
        field: c.field,
        fieldLabel: c.fieldLabel,
        kind: c.kind,
        severity: c.severity,
        owner: OWNER_BY_FIELD[c.field] || OWNER_BY_ENTITY[c.entityType] || 'Data Governance',
        targets,
        title:
          (c.kind === 'gap' ? 'Populate ' : 'Correct ') + c.fieldLabel.toLowerCase() + ' in ' + names.join(' and '),
        instruction:
          (c.kind === 'gap'
            ? 'Write “' + value + '” to ' + c.fieldLabel.toLowerCase() + ' on the ' + names.join(' and ') + ' record. '
            : 'Set ' + c.fieldLabel.toLowerCase() + ' to “' + value + '” in ' + names.join(' and ') + '. ') +
          sysName(c.resolvedSystem) + ' is the system of record for this field.',
        impact: c.impact || 'Anything reading this field will disagree depending on which system it queries.',
        status: 'open',
      });
    });

    identity.unresolved.forEach((u, i) => {
      const s = u.suggestions[0];
      tasks.push({
        id: 'TID' + String(i + 1).padStart(3, '0'),
        conflictId: null,
        entityId: s ? s.entityId : null,
        entityType: u.entityType,
        entityName: u.name,
        field: 'identity',
        fieldLabel: 'Identity',
        kind: 'identity',
        severity: s ? 'medium' : 'high',
        owner: 'Identity Governance',
        targets: [u.system],
        title: s
          ? 'Confirm ' + sysName(u.system) + ' record belongs to ' + s.entityName
          : 'Identify unmatched ' + sysName(u.system) + ' record “' + u.name + '”',
        instruction: u.recommendation,
        impact: 'Until this is resolved its activity and access are attributed to nobody.',
        status: 'open',
      });
    });

    identity.entities.forEach((e) => {
      e.flags.forEach((f, i) => {
        tasks.push({
          id: 'TFL' + e.id.replace(/[^A-Za-z0-9]/g, '') + i,
          conflictId: null,
          entityId: e.id,
          entityType: e.type,
          entityName: e.displayName,
          field: 'identity',
          fieldLabel: 'Identity',
          kind: 'identity',
          severity: f.severity,
          owner: f.kind === 'duplicate-record' ? 'Health Information Management' : 'Identity Governance',
          targets: [f.system],
          title: f.label,
          instruction:
            f.kind === 'duplicate-record'
              ? 'Merge or retire the duplicate so this resolves to a single record per system.'
              : 'Confirm the engagement and create the missing record, or revoke the access it implies.',
          impact:
            f.kind === 'duplicate-record'
              ? 'A split record means half the history is invisible from either side of it.'
              : 'Access without an authoritative record sits outside joiner-mover-leaver, review and audit.',
          status: 'open',
        });
      });
    });

    const order = SOT.schema.SEVERITY_ORDER;
    tasks.sort((a, b) => order.indexOf(a.severity) - order.indexOf(b.severity) || a.entityName.localeCompare(b.entityName));
    return tasks;
  }

  SOT.tasks = { generate, OWNER_BY_FIELD };
})(window.SOT || (window.SOT = {}));
</script>
<script>

/* SOT — shared generator utilities for vertical packs.
 *
 * Deterministic: same seed, same world, every reload. Everything produced here
 * is fictional — names, identifiers, dates and clinical detail are generated
 * and correspond to no real person, patient or organization.
 */
(function (SOT) {
  'use strict';

  const DAY = 86400000;

  function mulberry32(a) {
    return function () {
      a |= 0;
      a = (a + 0x6d2b79f5) | 0;
      let t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };

  const FIRST = ['Amara','Daniel','Priya','Marcus','Elena','Jonah','Keiko','Tobias','Ines','Rafael','Nadia','Curtis','Simone','Aditya','Bridget','Malik','Yuki','Hector','Colette','Devon','Rosa','Nils','Talia','Owen','Farrah','Emeka','Lucia','Grant','Anika','Peter','Sasha','Diego','Meredith','Isaac','Noor','Callum','Beatriz','Hugo','Tessa','Andre','Wren','Kofi','Marina','Silas','Juno','Ravi','Dahlia','Bennett','Solange','Theo','Ingrid','Omar','Cleo','Fintan','Zara','Leland','Mira','Gus','Paloma','Everett','Sunita','Bram','Odile','Kwame','Verity','Aurelio','Nell','Xander','Camila','Reuben','Astrid','Ismael','Greta','Dashiell','Lena','Corbin','Yara','Milo','Freya','Emmett','Rania','Soren','Josefina','Caleb','Delphine','Ruben','Maya','Alistair','Nia','Imani','Bastian','Rosalind','Tarek','Wilhelmina','Jarrah','Selma','Otis','Marisol','Anton'];

  function makeNamer(rand) {
    const shuffle = (arr) => {

<script>
/* --- core/packs/kit.js --- */
/* SOT — vertical pack toolkit.
 *
 * "Works for any industry" is only true if adding one is a declaration rather
 * than a project. This file is what makes that true.
 *
 * Almost every organization that would buy this product has the same shape
 * underneath the vocabulary:
 *
 *     site      somewhere work happens        hospital · campus · branch · terminal · salon
 *     group     a team inside a site          ward · department · desk · lane · chair row
 *     worker    someone who does the work     nurse · lecturer · adviser · driver · stylist
 *     client    someone the work is done for  patient · student · household · shipper · guest
 *     event     a dated thing that joins them visit · enrolment · review · load · appointment
 *
 * A pack declares its vocabulary, its source systems, which system carries
 * which field, how many of everything to generate, and which of the standard
 * data-quality failures to inject. The kit turns that into source records,
 * adapters, a time-bounded edge set and statistics — the same inputs the
 * hand-written health and defence packs produce, so nothing downstream can
 * tell the difference.
 *
 * Everything generated here is synthetic and deterministic.
 */
(function (SOT) {
  'use strict';

  const DAY = 86400000;
  const N = () => SOT.schema.norm;

  /* ---------------------------------------------------------- field catalog
   *
   * Fixed keys, renameable labels. A "credential expiry" is a nursing licence
   * in one pack, a commercial driving medical certificate in another, and a
   * securities registration in a third — same field, same failure mode, same
   * consequence, different word on the screen.
   */
  const FIELD_SPECS = [

    ['worker', 'workEmail', 'Work email', 'identity', 'public', 2, 7],
    ['worker', 'employeeId', 'Employee ID', 'identity', 'internal', 2, 30],
    ['worker', 'jobTitle', 'Job title', 'role', 'public', 2, 14],
    ['worker', 'credential', 'Credential', 'credential', 'public', 3, 14],
    ['worker', 'credentialId', 'Credential number', 'credential', 'internal', 3, 30],
    ['worker', 'credentialExpiry', 'Credential expires', 'credential', 'internal', 5, 7],
    ['worker', 'credentialStatus', 'Credential status', 'credential', 'internal', 5, 7],
    ['worker', 'homeGroup', 'Assigned group', 'role', 'internal', 4, 7],
    ['worker', 'employmentStatus', 'Employment status', 'identity', 'internal', 5, 2],

  const EDGE_SPECS = [

  /* ------------------------------------------------------- statistics library
   *
   * Generic over the skeleton, renameable per pack. `quantityLabel` might be
   * "length of stay", "billable hours", "miles" or "credit hours" — the
   * arithmetic is the same.
   */
  function statsFor(spec) {
    const L = spec.statLabels || {};
    const lbl = (k, d) => L[k] || d;
    const eventsOfWorker = (id, ctx) => ctx.graph.neighbours(id, 'event_team', { dir: 'in' }).map((n) => ctx.profiles[n.entity.id]);
    const eventsOfClient = (id, ctx) => ctx.graph.neighbours(id, 'event_client', { dir: 'in' }).map((n) => ctx.profiles[n.entity.id]);
    const eventsOfGroup = (id, ctx) => ctx.graph.neighbours(id, 'event_group', { dir: 'in' }).map((n) => ctx.profiles[n.entity.id]);
    const within = (list, days, asOf) => list.filter((e) => e && e.get('startAt') && asOf - e.get('startAt') <= days * DAY);
    const avg = (xs) => (xs.length ? Number((xs.reduce((a, b) => a + b, 0) / xs.length).toFixed(1)) : null);
    const qty = (list) => list.map((e) => e.get('quantity')).filter((v) => v != null);

    return {
      worker: [
        { id: 'events90', label: lbl('workerEvents', 'Records handled'), hint: 'Last 90 days', fmt: 'int',
          calc: (p, ctx) => within(eventsOfWorker(p.entity.id, ctx), 90, ctx.asOf).length },
        { id: 'clients', label: lbl('workerClients', 'People served'), hint: 'All time, distinct', fmt: 'int', sensitivity: 'confidential',
          calc: (p, ctx) => new Set(eventsOfWorker(p.entity.id, ctx).map((e) => {
            const c = ctx.graph.neighbour(e.entity.id, 'event_client', { dir: 'out' });
            return c ? c.entity.id : null;
          }).filter(Boolean)).size },
        { id: 'book', label: lbl('workerBook', 'Assigned book'), hint: 'Where they are the primary contact', fmt: 'int', sensitivity: 'confidential',
          calc: (p, ctx) => ctx.graph.neighbours(p.entity.id, 'served_by', { dir: 'in', when: 'current', at: ctx.asOf }).length },
        { id: 'groups', label: lbl('workerGroups', 'Groups worked'), hint: 'Including previous assignments', fmt: 'int',
          calc: (p, ctx) => new Set(ctx.graph.neighbours(p.entity.id, 'assigned_to', { dir: 'out' }).map((n) => n.entity.id)).size },
        { id: 'avgQty', label: lbl('workerAvg', 'Average size'), hint: spec.quantityHint || 'Per record handled', fmt: spec.quantityFmt || 'int',
          calc: (p, ctx) => avg(qty(eventsOfWorker(p.entity.id, ctx))) },
        { id: 'tenure', label: 'Tenure', hint: 'Since start date', fmt: 'years',
          calc: (p, ctx) => (p.get('hireDate') ? Number(((ctx.asOf - p.get('hireDate')) / (365 * DAY)).toFixed(1)) : null) },
      ],
      client: [
        { id: 'events', label: lbl('clientEvents', 'Records'), hint: 'All time', fmt: 'int', sensitivity: 'protected',
          calc: (p, ctx) => eventsOfClient(p.entity.id, ctx).length },
        { id: 'events12', label: lbl('clientEvents', 'Records'), hint: 'Last 12 months', fmt: 'int', sensitivity: 'protected',
          calc: (p, ctx) => within(eventsOfClient(p.entity.id, ctx), 365, ctx.asOf).length },
        { id: 'last', label: lbl('clientLast', 'Last seen'), hint: 'Most recent record', fmt: 'date', sensitivity: 'protected',
          calc: (p, ctx) => {
            const ds = eventsOfClient(p.entity.id, ctx).map((e) => e && e.get('startAt')).filter(Boolean);
            return ds.length ? Math.max.apply(null, ds) : null;
          } },
        { id: 'total', label: lbl('clientTotal', 'Lifetime total'), hint: spec.quantityHint || 'Across every record', fmt: spec.quantityFmt || 'int', sensitivity: 'protected',
          calc: (p, ctx) => {
            const q = qty(eventsOfClient(p.entity.id, ctx));
            return q.length ? Number(q.reduce((a, b) => a + b, 0).toFixed(1)) : null;
          } },
        { id: 'people', label: lbl('clientPeople', 'People involved'), hint: 'Distinct, all records', fmt: 'int', sensitivity: 'protected',
          calc: (p, ctx) => {
            const set = new Set();
            eventsOfClient(p.entity.id, ctx).forEach((e) =>
              e && ctx.graph.neighbours(e.entity.id, 'event_team', { dir: 'out' }).forEach((n) => set.add(n.entity.id)));
            return set.size;
          } },
      ],
      group: [
        { id: 'events90', label: lbl('groupEvents', 'Records'), hint: 'Last 90 days', fmt: 'int',
          calc: (p, ctx) => within(eventsOfGroup(p.entity.id, ctx), 90, ctx.asOf).length },
        { id: 'staffNow', label: lbl('groupStaff', 'Assigned now'), hint: 'Currently on this group', fmt: 'int',
          calc: (p, ctx) => ctx.graph.neighbours(p.entity.id, 'assigned_to', { dir: 'in', when: 'current', at: ctx.asOf }).length },
        { id: 'staffEver', label: lbl('groupEver', 'Ever assigned'), hint: 'Including people who left', fmt: 'int',
          calc: (p, ctx) => new Set(ctx.graph.neighbours(p.entity.id, 'assigned_to', { dir: 'in' }).map((n) => n.entity.id)).size },
        { id: 'avgQty', label: lbl('groupAvg', 'Average size'), hint: spec.quantityHint || 'Per record', fmt: spec.quantityFmt || 'int',
          calc: (p, ctx) => avg(qty(eventsOfGroup(p.entity.id, ctx))) },
        { id: 'perCap', label: lbl('groupPerCap', 'Per unit of capacity'), hint: 'Last 90 days', fmt: 'ratio',
          calc: (p, ctx) => {
            const cap = p.get('capacity');
            return cap ? Number((within(eventsOfGroup(p.entity.id, ctx), 90, ctx.asOf).length / cap).toFixed(1)) : null;
          } },
      ],
      site: [
        { id: 'groups', label: lbl('siteGroups', 'Groups'), hint: 'Based here', fmt: 'int',
          calc: (p, ctx) => ctx.graph.neighbours(p.entity.id, 'part_of', { dir: 'in' }).length },
        { id: 'staff', label: lbl('siteStaff', 'People'), hint: 'Currently assigned across groups', fmt: 'int',
          calc: (p, ctx) => {
            const set = new Set();
            ctx.graph.neighbours(p.entity.id, 'part_of', { dir: 'in' }).forEach((g) =>
              ctx.graph.neighbours(g.entity.id, 'assigned_to', { dir: 'in', when: 'current', at: ctx.asOf }).forEach((w) => set.add(w.entity.id)));
            return set.size;
          } },
        { id: 'events90', label: lbl('siteEvents', 'Records'), hint: 'Last 90 days', fmt: 'int',
          calc: (p, ctx) => {
            let n = 0;
            ctx.graph.neighbours(p.entity.id, 'part_of', { dir: 'in' }).forEach((g) => { n += within(eventsOfGroup(g.entity.id, ctx), 90, ctx.asOf).length; });
            return n;
          } },
      ],
      event: [
        { id: 'qty', label: lbl('eventQty', 'Size'), hint: spec.quantityHint || 'As recorded', fmt: spec.quantityFmt || 'int', sensitivity: 'confidential',
          calc: (p) => p.get('quantity') },
        { id: 'team', label: lbl('eventTeam', 'People involved'), hint: 'Attached to this record', fmt: 'int', sensitivity: 'confidential',
          calc: (p, ctx) => ctx.graph.neighbours(p.entity.id, 'event_team', { dir: 'out' }).length },
        { id: 'daysAgo', label: 'Days ago', hint: 'Since it started', fmt: 'int', sensitivity: 'confidential',
          calc: (p, ctx) => (p.get('startAt') ? Math.round((ctx.asOf - p.get('startAt')) / DAY) : null) },
      ],
