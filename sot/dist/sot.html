  }

  /* ---------------------------------------------------------- world builder */

  function buildWorld(spec) {
    const rand = SOT.gen.mulberry32(spec.seed || 20260210);
    const h = SOT.gen.helpers(rand);
    const namer = SOT.gen.makeNamer(rand);
    const asOf = spec.asOf || Date.parse('2026-02-10T14:20:00Z');
    const w = spec.world;
    const sysRoles = spec.systemRoles || {};

    const syncState = {};
    spec.systems.forEach((s) => {
      syncState[s.id] = Object.assign({ lastSync: asOf - (s.sync && s.sync.agoMs != null ? s.sync.agoMs : h.between(1, 10) * 3600000), status: 'healthy' },
        s.sync || {});
      if (s.sync && s.sync.agoDays != null) syncState[s.id].lastSync = asOf - s.sync.agoDays * DAY;
    });

    let seq = 0;
    const nat = (prefix, i) => prefix + String(100000 + i * 7).slice(-6);
    const entities = { site: [], group: [], worker: [], client: [], event: [] };
    const notes = [];
    const note = (kind, who, detail) => notes.push({ kind, who, detail });

    /* sites */
    w.sites.forEach((s, i) => entities.site.push({
      slot: 'site', key: s.code, idx: i,
      f: { siteName: s.name, siteCode: s.code, city: s.city, siteType: s.type, capacity: s.capacity == null ? null : s.capacity },
      overrides: {}, present: {},
    }));

    /* groups */
    w.groups.forEach((g, i) => entities.group.push({
      slot: 'group', key: g.code, idx: i, site: g.site,
      f: { groupName: g.name, groupCode: g.code, siteCode: g.site, category: g.category,
           capacity: g.capacity == null ? null : g.capacity, costCenter: 'CC-' + g.code },
      overrides: {}, present: {},
    }));

    /* workers: a leadership spine, then each group's roster */
    const workers = entities.worker;
    function addWorker(o) {
      seq++;
      const nm = namer();
      const wk = Object.assign({
        slot: 'worker', idx: seq, key: 'W' + seq,
        f: {
          fullName: nm.full,
          workEmail: (nm.first + '.' + nm.last).toLowerCase() + '@' + (spec.domain || 'example.com'),
          employeeId: 'E' + String(200000 + seq * 13).slice(-6),
          jobTitle: o.title,
          credential: o.credential || null,
          credentialId: o.credential ? 'C' + h.between(100000, 999999) : null,
          credentialExpiry: o.credential ? asOf + h.between(70, 900) * DAY : null,
          credentialStatus: o.credential ? 'Active' : null,
          homeGroup: o.group || null,
          employmentStatus: 'Active',
          employmentType: o.employmentType || 'Employee',
          hireDate: asOf - h.between(180, 3600) * DAY,
          accessStatus: 'Active',
        },
        group: o.group || null,
        managerKey: o.managerKey || null,
        lead: !!o.lead,
        overrides: {}, present: {}, extraRecords: [],
      }, o.extra || {});
      workers.push(wk);
      return wk;
    }

    const exec = addWorker({ title: w.leadership[0], credential: w.leadCredential || null, lead: true });
    const leaders = [exec];
    (w.leadership.slice(1) || []).forEach((t) => leaders.push(addWorker({ title: t, credential: w.leadCredential || null, managerKey: exec.key, lead: true })));

    w.groups.forEach((g, gi) => {
      const boss = leaders[1 + (gi % Math.max(1, leaders.length - 1))] || exec;
      const lead = addWorker({ title: w.groupLeadTitle, credential: w.leadCredential || h.pick(w.credentials), group: g.code, managerKey: boss.key, lead: true });
      (g.roster || w.defaultRoster).forEach((r) => {
        for (let i = 0; i < r.count; i++) {
          addWorker({ title: r.title, credential: r.credential === null ? null : (r.credential || h.pick(w.credentials)), group: g.code, managerKey: lead.key });
        }
      });
    });

    /* clients */
    for (let i = 0; i < w.clients.count; i++) {
      const nm = namer();
      entities.client.push({
        slot: 'client', idx: i, key: 'C' + i,
        f: {
          fullName: nm.full,
          clientRef: (w.clients.refPrefix || 'REF-') + String(400000 + i * 37).slice(-6),
          dob: w.clients.dob === false ? null : Date.parse('1945-01-01') + Math.floor(rand() * (Date.parse('2010-01-01') - Date.parse('1945-01-01'))),
          phone: '(555) ' + h.between(200, 989) + '-' + String(h.between(1000, 9999)),
          email: (nm.first + '.' + nm.last).toLowerCase() + '@' + h.pick(['mailbox.example', 'postbox.example', 'inbox.example']),
          address: h.between(12, 980) + ' ' + h.street() + ', ' + h.pick(w.sites.map((s) => s.city.split(',')[0])),
          plan: h.pick(w.clients.plans),
          clientStatus: 'Active',
        },
        overrides: {}, present: {}, extraRecords: [],
      });
    }

    /* events */
    const groupWorkers = {};
    workers.forEach((wk) => { if (wk.group) (groupWorkers[wk.group] || (groupWorkers[wk.group] = [])).push(wk); });

    let ev = 0;
    entities.client.forEach((c, ci) => {
      const home = w.groups[ci % w.groups.length];
      const count = h.between(w.events.perClient[0], w.events.perClient[1]);
      for (let i = 0; i < count; i++) {
        const g = h.chance(0.6) ? home : h.pick(w.groups);
        const roster = groupWorkers[g.code] || [];
        if (!roster.length) continue;
        const type = h.pick(w.events.types);
        const start = asOf - h.between(2, w.events.windowDays || 700) * DAY - h.between(0, 20) * 3600000;
        const durationH = h.between(type.hours ? type.hours[0] : 1, type.hours ? type.hours[1] : 6);
        const end = start + durationH * 3600000;
        if (end > asOf) continue;
        ev++;
        const team = h.shuffle(roster).slice(0, h.between(1, Math.min(3, roster.length)));
        const leadWorker = roster.find((x) => x.lead) || team[0];
        entities.event.push({
          slot: 'event', idx: ev, key: 'V' + ev,
          clientKey: c.key, groupKey: g.code, siteKey: g.site,
          teamKeys: team.map((t) => t.key), leadKey: leadWorker.key,
          f: {
            eventLabel: type.name + ' · ' + new Date(start).toISOString().slice(0, 10),
            eventType: type.name,
            startAt: start,
            endAt: end,
            outcome: h.pick(w.events.outcomes),
            quantity: type.quantity ? h.between(type.quantity[0], type.quantity[1]) : Number((durationH / 24).toFixed(1)),
            channel: c.f.plan,
            eventStatus: h.pick(w.events.statuses || ['Complete', 'Complete', 'Complete', 'In review', 'Disputed']),
          },
          overrides: {}, present: {}, extraRecords: [],
        });
      }
    });

    /* --------------------------------------------- deliberate imperfections */
    const A = spec.anomalies || {};
    const nonLead = workers.filter((x) => x.group && !x.lead);
    const pickWorkers = (n) => h.shuffle(nonLead).slice(0, n);

    if (A.ghostAccess) {
      pickWorkers(A.ghostAccess).forEach((wk) => {
        wk.f.employmentStatus = 'Terminated';
        wk.terminatedAt = asOf - h.between(20, 80) * DAY;
        [sysRoles.primary, sysRoles.access, sysRoles.schedule].filter(Boolean).forEach((s) => {
          wk.overrides[s] = Object.assign(wk.overrides[s] || {}, { employmentStatus: 'Active', accessStatus: 'Active' });
        });
        note('ghost-access', wk.f.fullName, 'Terminated in the system of record; operational systems still show them active.');
      });
    }

    // Whoever is furthest behind among the systems that carry employment
    // status is the one that will still be showing a leaver as present. Found
    // rather than assumed, so a pack cannot accidentally lose its lag example
    // by changing which connector is slow.
    const statusSystems = spec.systems
      .filter((sy) => sy.provides && sy.provides.worker && sy.provides.worker.fields.employmentStatus)
      .map((sy) => sy.id)
      .sort((a, b) => syncState[a].lastSync - syncState[b].lastSync);
    const stalest = statusSystems.find((sy) => sy !== sysRoles.hr && asOf - syncState[sy].lastSync > 2 * DAY);

    if (A.badgeLag && stalest) {
      pickWorkers(A.badgeLag).forEach((wk) => {
        wk.f.employmentStatus = 'Terminated';
        wk.terminatedAt = asOf - 5 * DAY;
        wk.statusEffectiveFrom = asOf - 5 * DAY;
        wk.overrides[stalest] = Object.assign(wk.overrides[stalest] || {}, { employmentStatus: 'Active', accessStatus: 'Active' });
        note('lag', wk.f.fullName, 'Left five days ago. Only the connector that has not been read since still shows them active — behind, not wrong.');
      });
    }

    if (A.credentialLapsed) {
      pickWorkers(A.credentialLapsed).filter((x) => x.f.credential).forEach((wk) => {
        wk.f.credentialExpiry = asOf - h.between(4, 60) * DAY;
        wk.f.credentialStatus = 'Expired';
        note('credential-lapsed', wk.f.fullName, 'Credential expired but the person is still rostered and still has access.');
      });
    }

    if (A.groupTransfer) {
      pickWorkers(A.groupTransfer).forEach((wk) => {
        const to = h.pick(w.groups.filter((g) => g.code !== wk.group));
        wk.priorGroup = wk.group;
        wk.group = to.code;
        wk.f.homeGroup = to.code;
        wk.groupEffectiveFrom = asOf - 4 * DAY;
        if (sysRoles.hr) wk.overrides[sysRoles.hr] = Object.assign(wk.overrides[sysRoles.hr] || {}, { homeGroup: wk.priorGroup });
        note('transfer', wk.f.fullName, 'Moved groups four days ago; the slower system still carries the old assignment.');
      });
    }

    if (A.credentialDrift && sysRoles.primary) {
      pickWorkers(A.credentialDrift).filter((x) => x.f.credential).forEach((wk) => {
        wk.overrides[sysRoles.primary] = Object.assign(wk.overrides[sysRoles.primary] || {},
          { credential: h.pick(w.credentials.filter((c) => c !== wk.f.credential)) });
        note('credential-drift', wk.f.fullName, 'The operational system shows a credential the person no longer holds.');
      });
    }

    if (A.idGap && sysRoles.primary) {
      pickWorkers(A.idGap).forEach((wk) => {
        wk.overrides[sysRoles.primary] = Object.assign(wk.overrides[sysRoles.primary] || {}, { employeeId: null });
        note('id-gap', wk.f.fullName, 'Employee ID is blank on the operational record, breaking the join to payroll.');
      });
    }

    if (A.titleDrift && sysRoles.primary) {
      pickWorkers(A.titleDrift).forEach((wk) => {
        wk.overrides[sysRoles.primary] = Object.assign(wk.overrides[sysRoles.primary] || {}, { jobTitle: w.staleTitle || 'Associate' });
        note('title-drift', wk.f.fullName, 'A promotion recorded in HR was never reflected downstream.');
      });
    }

    if (A.scheduledChange) {
      pickWorkers(A.scheduledChange).filter((x) => x.f.employmentStatus === 'Active').forEach((wk) => {
        wk.scheduled = { field: 'employmentStatus', value: w.scheduledStatus || 'On leave', from: asOf + h.between(14, 45) * DAY };
        note('scheduled', wk.f.fullName, 'A future-dated change. Recorded, and correctly not counted as a discrepancy.');
      });
    }

    if (A.contractors) {
      for (let i = 0; i < A.contractors; i++) {
        const wk = addWorker({
          title: w.contractorTitle || 'Contractor', credential: h.pick(w.credentials),
          group: h.pick(w.groups).code, employmentType: 'Contractor',
        });
        wk.group = wk.f.homeGroup;
        if (sysRoles.hr) wk.present[sysRoles.hr] = false;
        wk.noHr = true;
        note('no-hr-record', wk.f.fullName, 'Working, scheduled and credentialed with no record in the system of record.');
      }
    }

    if (A.duplicateWorker && sysRoles.primary) {
      const wk = nonLead[Math.floor(nonLead.length / 3)];
      if (wk) {
        wk.extraRecords.push({ system: sysRoles.primary, suffix: 'X', overrides: { workEmail: wk.f.workEmail.replace('@', '.prior@') } });
        note('duplicate-account', wk.f.fullName, 'Two active accounts in the same system share one employee number.');
      }
    }

    if (A.duplicateClient && sysRoles.master) {
      const c = entities.client[7] || entities.client[0];
      if (c) {
        c.extraRecords.push({ system: sysRoles.master, suffix: 'D',
          overrides: { clientRef: (w.clients.refPrefix || 'REF-') + '999999' } });
        note('duplicate-client', c.f.fullName, 'Two references in the same system share a name and date of birth. The history is split across both.');
      }
    }

    if (A.clientMismatch && sysRoles.billing) {
      h.shuffle(entities.client).slice(0, A.clientMismatch).forEach((c) => {
        const o = {};
        if (c.f.dob) o.dob = c.f.dob + h.between(1, 2) * 365 * DAY;
        o.phone = '(555) ' + h.between(200, 989) + '-' + String(h.between(1000, 9999));
        c.overrides[sysRoles.billing] = Object.assign(c.overrides[sysRoles.billing] || {}, o);
        note('client-mismatch', c.f.fullName, 'Registration and billing disagree on identifying details.');
      });
    }

    if (A.quantityMismatch && sysRoles.billing) {
      h.shuffle(entities.event).slice(0, A.quantityMismatch).forEach((e) => {
        const delta = h.pick([-1, 1, 2]);
        const alt = Math.max(1, Number((e.f.quantity + delta).toFixed(1)));
        e.overrides[sysRoles.billing] = Object.assign(e.overrides[sysRoles.billing] || {}, { quantity: alt });
        note('quantity-mismatch', e.f.eventLabel, 'What was delivered and what was billed do not agree on the same record.');
      });
    }

    if (A.orphanAccounts && sysRoles.primary) {
      for (let i = 0; i < A.orphanAccounts; i++) {
        const label = (w.orphanNames || ['Shared Terminal', 'Training Account'])[i % 2];
        entities.worker.push({
          slot: 'worker', idx: 9000 + i, key: 'ORPH' + i, orphanIn: sysRoles.primary,
          f: { fullName: label, workEmail: label.toLowerCase().replace(/[^a-z]/g, '.') + '@' + (spec.domain || 'example.com'),
               employeeId: null, jobTitle: null, credential: null, credentialId: null, credentialExpiry: null,
               credentialStatus: null, homeGroup: h.pick(w.groups).code, employmentStatus: 'Active',
               employmentType: null, hireDate: null, accessStatus: 'Active' },
          group: null, managerKey: null, overrides: {}, present: {}, extraRecords: [],
        });
        note('orphan-account', label, 'A shared login with live access and no owner.');
      }
    }

    /* cost-centre disagreement on exactly one group keeps the structural
       reconciliation honest without flooding the queue */
    if (A.costCentre && sysRoles.schedule) {
      const g = entities.group[Math.min(3, entities.group.length - 1)];
      g.overrides[sysRoles.schedule] = { costCenter: 'CC-' + g.key + '-ALT' };
      note('cost-centre', g.f.groupName, 'Finance and scheduling carry different cost centres for the same group.');
    }

    return { entities, syncState, notes, asOf, h, rand, nat };
  }

  /* ------------------------------------------------------- records + adapters */

  // Which identity keys a record of each kind exposes, given its canonical
  // values and the raw vendor row.
  const KEY_BUILDERS = {
    worker: (c, raw) => ({
      employeeId: c.employeeId, email: c.workEmail, name: N().name(c.fullName), badge: raw._badge || null,
    }),
    client: (c) => ({
      mrn: c.clientRef, nameDob: c.dob ? N().name(c.fullName) + '|' + c.dob : null, name: N().name(c.fullName),
    }),
    group: (c) => ({ code: c.groupCode }),
    site: (c) => ({ code: c.siteCode }),
    event: (c, raw) => ({ code: raw.eventLabelKey }),
  };

  function build(spec) {
    const world = buildWorld(spec);
    const { entities, syncState, notes, asOf } = world;
    const sysRoles = spec.systemRoles || {};
    const records = {};
    spec.systems.forEach((s) => { records[s.id] = []; });

    // Deterministic native identifier per (system, entity).
    const natId = (sys, slot, e, suffix) => {
      const p = (sys.idPrefix || sys.id.slice(0, 3).toUpperCase()) + '-';
      return p + slot[0].toUpperCase() + String(100000 + (e.idx + 1) * 17).slice(-6) + (suffix || '');
    };

    function valueFor(e, sysId, field) {
      const o = e.overrides[sysId];
      if (o && Object.prototype.hasOwnProperty.call(o, field)) return o[field];
      return e.f[field];
    }

    // For every system, for every entity type it carries, emit a native record
    // whose property names are that vendor's, not ours.
    spec.systems.forEach((sys) => {
      Object.keys(sys.provides || {}).forEach((slot) => {
        const p = sys.provides[slot];
        (entities[slot] || []).forEach((e) => {
          if (e.present[sys.id] === false) return;
          if (e.orphanIn && e.orphanIn !== sys.id) return;
          if (p.only && !p.only(e)) return;
          const make = (suffix, extraOverrides) => {
            const generated = natId(sys, slot, e, suffix);
            const rec = { _type: slot, observedAt: syncState[sys.id].lastSync, _key: e.key };
            // The native id goes down first so that a system whose primary key
            // *is* the employee number (Workday's worker ID, a payroll number)
            // keeps the real value rather than a generated one. Getting this
            // backwards silently breaks identity matching for that system.
            rec[p.id] = generated;
            Object.keys(p.fields).forEach((canon) => {
              let v = valueFor(e, sys.id, canon);
              if (extraOverrides && Object.prototype.hasOwnProperty.call(extraOverrides, canon)) v = extraOverrides[canon];
              rec[p.fields[canon]] = v === undefined ? null : v;
            });
            if (rec[p.id] == null) rec[p.id] = generated;
            if (slot === 'event') rec.eventLabelKey = e.key;
            if (slot === 'worker' && p.badge) rec._badge = 'BDG-' + String(90000 + e.idx * 11).slice(-5);
            if (p.extra) Object.assign(rec, p.extra(e, world));
            if (slot === 'worker' && e.scheduled && sys.id === sysRoles.hr) {
              rec._scheduled = { field: e.scheduled.field, value: e.scheduled.value, effectiveFrom: e.scheduled.from };
            }
            if (slot === 'worker' && sys.id === sysRoles.hr) {
              rec._groupEffectiveFrom = e.groupEffectiveFrom || e.f.hireDate;
              rec._statusEffectiveFrom = e.statusEffectiveFrom || e.terminatedAt || e.f.hireDate;
            }
            records[sys.id].push(rec);
            if (!e.nat) e.nat = {};
            if (!suffix) e.nat[sys.id] = rec[p.id];
          };
          make(null, null);
          (e.extraRecords || []).forEach((x) => { if (x.system === sys.id) make(x.suffix, x.overrides); });
        });
      });
    });

    /* ---------------------------------------------------------- the adapters */
    const adapters = {};
    spec.systems.forEach((sys) => {
      const effectiveDating = sys.id === sysRoles.hr;
      adapters[sys.id] = {
        collection: sys.id,
        effectiveDating,
        identity: (r) => {
          const p = sys.provides[r._type];
          if (!p) return null;
          const canon = {};
          Object.keys(p.fields).forEach((c) => { canon[c] = r[p.fields[c]]; });
          canon._badge = r._badge;
          const allKeys = KEY_BUILDERS[r._type](canon, r) || {};
          const keys = {};
          (p.keys || Object.keys(allKeys)).forEach((k) => { if (allKeys[k] != null) keys[k] = allKeys[k]; });
          const nameField = { worker: 'fullName', client: 'fullName', group: 'groupName', site: 'siteName', event: 'eventLabel' }[r._type];
          return {
            nativeId: r[p.id],
            name: canon[nameField],
            detail: p.detail ? p.detail(canon, r) : null,
            active: canon.employmentStatus ? canon.employmentStatus === 'Active' : true,
            keys,
          };
        },
        assertions: (r) => {
          const p = sys.provides[r._type];
          if (!p) return [];
          const t = r.observedAt;
          const out = [];
          Object.keys(p.fields).forEach((canon) => {
            let effectiveFrom = t;
            if (effectiveDating && r._type === 'worker') {
              if (canon === 'homeGroup') effectiveFrom = r._groupEffectiveFrom || t;
              else if (canon === 'employmentStatus') effectiveFrom = r._statusEffectiveFrom || t;
            }
            out.push({ field: canon, value: r[p.fields[canon]], observedAt: t, effectiveFrom });
          });
          if (r._scheduled) out.push({ field: r._scheduled.field, value: r._scheduled.value, observedAt: t, effectiveFrom: r._scheduled.effectiveFrom, scheduled: true });
          return out;
        },
      };
    });

    /* ------------------------------------------------------------- the edges */
    const master = sysRoles.master;
    const hr = sysRoles.hr || master;
    const edges = [];
    const workerRef = (e) => ({ type: 'worker', sys: (e.present[hr] === false ? sysRoles.primary : hr), id: e.nat && e.nat[e.present[hr] === false ? sysRoles.primary : hr] });
    const groupRef = (code) => {
      const g = entities.group.find((x) => x.key === code);
      return g && g.nat ? { type: 'group', sys: master, id: g.nat[master] } : null;
    };
    const siteRef = (code) => {
      const s = entities.site.find((x) => x.key === code);
      return s && s.nat ? { type: 'site', sys: master, id: s.nat[master] } : null;
    };
    const byKey = {};
    ['worker', 'client', 'event'].forEach((slot) => entities[slot].forEach((e) => { byKey[slot + ':' + e.key] = e; }));
    const resolvable = (e) => !!e && !e.orphanIn && e.present[hr] !== false && !!e.nat && !!e.nat[hr];

    entities.group.forEach((g) => {
      const gr = groupRef(g.key), sr = siteRef(g.site);
      if (gr && sr) edges.push({ type: 'part_of', from: gr, to: sr, systemId: master });
    });

    entities.worker.forEach((e) => {
      if (!resolvable(e)) return;
      const wr = workerRef(e);
      if (!wr.id) return;
      if (e.managerKey) {
        const m = byKey['worker:' + e.managerKey];
        if (resolvable(m)) edges.push({ type: 'reports_to', from: wr, to: workerRef(m), fromTs: e.f.hireDate, toTs: e.terminatedAt || null, systemId: hr });
      }
      if (e.group) {
        const gr = groupRef(e.group);
        if (gr) {
          if (e.priorGroup) {
            const pg = groupRef(e.priorGroup);
            if (pg) edges.push({ type: 'assigned_to', from: wr, to: pg, fromTs: e.f.hireDate, toTs: e.groupEffectiveFrom, systemId: sysRoles.schedule || hr });
            edges.push({ type: 'assigned_to', from: wr, to: gr, fromTs: e.groupEffectiveFrom, toTs: e.terminatedAt || null, systemId: sysRoles.schedule || hr });
          } else if (world.h.chance(0.28)) {
            // A rotation somewhere in their history, so the roster has a past.
            const prior = groupRef(world.h.pick(entities.group.filter((g) => g.key !== e.group)).key);
            const switched = e.f.hireDate + Math.floor((asOf - e.f.hireDate) * (0.3 + world.rand() * 0.4));
            if (prior) edges.push({ type: 'assigned_to', from: wr, to: prior, fromTs: e.f.hireDate, toTs: switched, systemId: sysRoles.schedule || hr });
            edges.push({ type: 'assigned_to', from: wr, to: gr, fromTs: switched, toTs: e.terminatedAt || null, systemId: sysRoles.schedule || hr });
          } else {
            edges.push({ type: 'assigned_to', from: wr, to: gr, fromTs: e.f.hireDate, toTs: e.terminatedAt || null, systemId: sysRoles.schedule || hr });
          }
        }
      }
    });

    entities.event.forEach((e) => {
      if (!e.nat) return;
      const er = { type: 'event', sys: master, id: e.nat[master] };
      if (!er.id) return;
      const c = byKey['client:' + e.clientKey];
      if (c && c.nat && c.nat[master]) edges.push({ type: 'event_client', from: er, to: { type: 'client', sys: master, id: c.nat[master] }, systemId: master });
      const gr = groupRef(e.groupKey);
      if (gr) edges.push({ type: 'event_group', from: er, to: gr, systemId: master });
      e.teamKeys.forEach((k) => {
        const wk = byKey['worker:' + k];
        if (!resolvable(wk)) return;
        edges.push({ type: 'event_team', from: er, to: workerRef(wk),
          role: k === e.leadKey ? (spec.world.leadRole || 'Lead') : (spec.world.memberRole || 'Support'), systemId: master });
      });
    });

    // Primary-relationship history: who looks after this client, and who used to.
    entities.client.forEach((c, i) => {
      if (!c.nat || !c.nat[master]) return;
      const g = entities.group[i % entities.group.length];
      const roster = entities.worker.filter((x) => x.group === g.key && resolvable(x));
      if (!roster.length) return;
      const cur = roster[i % roster.length];
      const cr = { type: 'client', sys: master, id: c.nat[master] };
      if (roster.length > 1 && world.h.chance(0.35)) {
        const prev = roster[(i + 1) % roster.length];
        const changed = asOf - world.h.between(60, 520) * DAY;
        edges.push({ type: 'served_by', from: cr, to: workerRef(prev), fromTs: changed - 700 * DAY, toTs: changed, systemId: master });
        edges.push({ type: 'served_by', from: cr, to: workerRef(cur), fromTs: changed, toTs: null, systemId: master });
      } else {
        edges.push({ type: 'served_by', from: cr, to: workerRef(cur), fromTs: asOf - world.h.between(200, 1400) * DAY, toTs: null, systemId: master });
      }
    });

    const recordCounts = {};
    spec.systems.forEach((s) => { recordCounts[s.id] = records[s.id].length * (s.volume || 3); });

    return { records, edges, syncState, recordCounts, notes, asOf, adapters };
  }

  /* ------------------------------------------------------------- definition */

  function define(spec) {
    const V = spec.types;
    const L = spec.labels || {};
    const label = (slot, key, dflt) => (L[slot + '.' + key] || L[key] || dflt);

    const entityTypes = ['site', 'group', 'worker', 'client', 'event'].filter((s) => V[s]).map((slot) => {
      const t = V[slot];
      const base = {
        site: { titleField: 'siteName', subtitle: ['siteType', 'city'], keyFacts: ['siteCode', 'city', 'siteType', 'capacity'] },
        group: { titleField: 'groupName', subtitle: ['category', 'siteCode'], keyFacts: ['groupCode', 'category', 'siteCode', 'capacity', 'costCenter'] },
        worker: { titleField: 'fullName', subtitle: ['jobTitle', 'credential'], keyFacts: ['jobTitle', 'credential', 'homeGroup', 'employmentType', 'employeeId', 'credentialExpiry'] },
        client: { titleField: 'fullName', subtitle: ['clientRef', 'plan'], keyFacts: ['clientRef', 'plan', 'clientStatus', 'phone', 'email', 'dob'] },
        event: { titleField: 'eventLabel', subtitle: ['eventType', 'outcome'], dateField: 'startAt', keyFacts: ['eventType', 'startAt', 'endAt', 'outcome', 'quantity', 'eventStatus'] },
      }[slot];
      const masters = { site: [spec.systemRoles.master], group: [spec.systemRoles.master], worker: [spec.systemRoles.hr || spec.systemRoles.master],
        client: [spec.systemRoles.master], event: [spec.systemRoles.master] }[slot];
      return Object.assign({}, base, {
        id: slot, label: t.label, plural: t.plural, kind: t.kind, glyph: t.glyph,
        masterSystems: masters,
        expectedSystems: t.expected || masters,
        requireMaster: t.requireMaster !== false,
      });
    });

    const carried = {};
    spec.systems.forEach((s) => Object.keys(s.provides || {}).forEach((slot) => {
      Object.keys(s.provides[slot].fields).forEach((f) => {
        const k = slot + '.' + f;
        (carried[k] || (carried[k] = [])).push(s.id);
      });
    }));

    const fields = FIELD_SPECS
      .filter(([slot, key]) => V[slot] && carried[slot + '.' + key])
      .map(([slot, key, dflt, group, sensitivity, weight, tolerance]) => ({
        entity: slot, key, group,
        label: label(slot, key, dflt),
        contributors: carried[slot + '.' + key],
        sensitivity: (spec.sensitivity && spec.sensitivity[slot + '.' + key]) || sensitivity,
        weight, tolerance,
        impact: (spec.impact && spec.impact[key]) || null,
      }));

    const policy = {};
    fields.forEach((f) => {
      const declared = spec.policy && spec.policy[f.key];
      policy[f.key] = (declared || f.contributors).filter((s) => f.contributors.indexOf(s) >= 0);
      if (!policy[f.key].length) policy[f.key] = f.contributors.slice();
    });

    const edgeTypes = EDGE_SPECS.filter(([, from, to]) => V[from] && V[to]).map(([id, from, to, temporal, roled]) => ({
      id, from, to, temporal, roled,
      label: (spec.edgeLabels && spec.edgeLabels[id] && spec.edgeLabels[id][0]) || id,
      inverse: (spec.edgeLabels && spec.edgeLabels[id] && spec.edgeLabels[id][1]) || id,
    }));

    let built = null;
    const pack = {
      id: spec.id,
      label: spec.label,
      industry: spec.industry,
      tenantName: spec.tenantName,
      tagline: spec.tagline,
      systems: spec.systems.map((s) => ({ id: s.id, name: s.name, category: s.category, deepLink: s.deepLink,
        syncCadence: s.syncCadence, blurb: s.blurb })),
      entityTypes,
      edgeTypes,
      fields,
      policy,
      rationale: spec.rationale || {},
      roles: spec.roles,
      hierarchy: spec.hierarchy || [
        { key: 'system', label: spec.label, entity: null },
        { key: 'siteCode', label: V.site ? V.site.label : 'Site', entity: 'group' },
        { key: 'category', label: 'Category', entity: 'group' },
        { key: 'groupName', label: V.group ? V.group.label : 'Group', entity: 'group' },
      ],
      codeRefs: { homeGroup: ['group', 'groupCode'], siteCode: ['site', 'siteCode'] },
      searchTypes: entityTypes.map((t) => t.id),
      personaRules: spec.personaRules || {},
      build() {
        if (!built) built = build(spec);
        return built;
      },
      get adapters() {
        if (!built) built = build(spec);
        return built.adapters;
      },
    };

    SOT.stats.register(spec.id, statsFor(spec));
    SOT.packs = SOT.packs || {};
    SOT.packs[spec.id] = pack;
    return pack;
  }

  SOT.kit = { define, FIELD_SPECS, EDGE_SPECS };
})(window.SOT || (window.SOT = {}));
</script>
<script>
/* --- core/packs/health.js --- */
/* SOT — Health System vertical pack.
 *
 * Declares what exists in a hospital (staff, patients, units, facilities,
 * visits), which systems know about each of them, how they relate over time,
 * and what statistics each thing has. Then it fabricates a whole health system
 * to prove it.
 *
 * Everything is synthetic. The people, patients, medical record numbers,
 * diagnoses and visits are generated from a fixed seed and correspond to no
 * real person or organization. No live system is contacted anywhere in this
 * prototype.
 */
(function (SOT) {
  'use strict';

  const DAY = 86400000;

  /* ------------------------------------------------------------- systems */

  const SYSTEMS = [
    { id: 'epic', name: 'Epic', category: 'EHR', deepLink: 'https://epic.stalwyn.example/hyperspace/{id}',
      syncCadence: 'Every 15 minutes', blurb: 'Charts, encounters, departments, provider records.' },
    { id: 'workday', name: 'Workday', category: 'HRIS', deepLink: 'https://wd5.myworkday.com/stalwyn/worker/{id}',
      syncCadence: 'Nightly, 02:00', blurb: 'Workers, positions, departments, employment status.' },
    { id: 'ukg', name: 'UKG Dimensions', category: 'Workforce', deepLink: 'https://stalwyn.ukg.example/people/{id}',
      syncCadence: 'Hourly', blurb: 'Scheduling, timekeeping, unit rosters, cost centres.' },
    { id: 'symplr', name: 'symplr', category: 'Credentialing', deepLink: 'https://credentialing.symplr.example/provider/{id}',
      syncCadence: 'Daily, 05:00', blurb: 'Licences, privileges, expirations, provider numbers.' },

  function build(seed) {
    const rand = SOT.gen.mulberry32(seed == null ? 20260210 : seed);
    const h = SOT.gen.helpers(rand);
    const namer = SOT.gen.makeNamer(rand);
    const asOf = Date.parse('2026-02-10T14:20:00Z');

    const syncState = {
      epic: { lastSync: asOf - 9 * 60000, status: 'healthy' },
      workday: { lastSync: asOf - 11 * 3600000, status: 'healthy' },
      ukg: { lastSync: asOf - 38 * 60000, status: 'healthy' },
      symplr: { lastSync: asOf - 10 * 3600000, status: 'healthy' },
      waystar: { lastSync: asOf - 3 * 3600000, status: 'healthy' },
      lenel: { lastSync: asOf - 11 * DAY, status: 'degraded',
        message: 'Service account password expired on 30 Jan. 1,140 polls failed since.' },
    };
    const obs = (s) => syncState[s].lastSync;

    /* ---- internal roster, used only to generate records then discarded ---- */
    const staff = [];
    let sSeq = 0;
    function newStaff(spec) {
      sSeq++;
      const n = namer();
      const p = Object.assign({
        rid: 'r' + sSeq,
        name: n.full,
        email: (n.first + '.' + n.last).toLowerCase() + '@stalwyn.example',
        workerId: 'WD-2' + String(20000 + sSeq * 7).slice(-5),
        epicUserId: 'EPU' + String(41000 + sSeq * 3).slice(-5),
        ukgId: 'UKG' + String(70000 + sSeq * 11).slice(-5),
        badgeId: 'BDG-' + String(90000 + sSeq * 13).slice(-5),
        npi: null,
        status: 'Active',
        employmentType: 'Employee',
        hireDate: asOf - h.between(200, 4200) * DAY,
        terminationDate: null,
        licenseExpiry: asOf + h.between(60, 900) * DAY,
        privilege: 'Active',
        assignments: [],
      }, spec);
      staff.push(p);
      return p;
    }

    // Leadership
    const ceo = newStaff({ title: 'Chief Executive Officer', credential: 'MHA', dept: 'Administration', unit: null, kind: 'exec', managerRid: null });
    const coo = newStaff({ title: 'Chief Operating Officer', credential: 'MHA', dept: 'Administration', unit: null, kind: 'exec', managerRid: ceo.rid });
    const cno = newStaff({ title: 'Chief Nursing Officer', credential: 'RN, MSN', dept: 'Nursing Administration', unit: null, kind: 'exec', managerRid: coo.rid });
    const cmo = newStaff({ title: 'Chief Medical Officer', credential: 'MD', dept: 'Medical Staff', unit: null, kind: 'exec', managerRid: ceo.rid, npi: '1' + h.between(100000000, 999999999) });
    const workforceDir = newStaff({ title: 'Director, Workforce Systems', credential: 'SHRM-SCP', dept: 'Human Resources', unit: null, kind: 'admin', managerRid: coo.rid });
    const identityMgr = newStaff({ title: 'Manager, Identity Governance', credential: 'CISM', dept: 'Information Services', unit: null, kind: 'admin', managerRid: coo.rid });

    // Units: a nurse manager, a medical director, nurses, providers, techs
    const unitStaff = {};
    UNITS.forEach((u) => {
      const mgr = newStaff({
        title: 'Nurse Manager', credential: 'RN, BSN', dept: 'Nursing — ' + u.name, unit: u.code,
        kind: 'manager', managerRid: cno.rid, npi: '1' + h.between(100000000, 999999999),
      });
      const dir = newStaff({
        title: 'Medical Director', credential: 'MD', dept: u.line, unit: u.code, kind: 'provider',
        managerRid: cmo.rid, npi: '1' + h.between(100000000, 999999999),
      });
      const roster = { mgr, dir, nurses: [], providers: [dir], techs: [] };
      for (let i = 0; i < u.nurses; i++) {
        roster.nurses.push(newStaff({
          title: h.pick(NURSE_TITLES), credential: 'RN', dept: 'Nursing — ' + u.name, unit: u.code,
          kind: 'nurse', managerRid: mgr.rid, npi: '1' + h.between(100000000, 999999999),
        }));
      }
      for (let i = 0; i < u.providers - 1; i++) {
        const t = h.pick(PROVIDER_TITLES);
        roster.providers.push(newStaff({
          title: t, credential: t === 'Nurse Practitioner' ? 'NP' : t === 'Physician Assistant' ? 'PA-C' : 'MD',
          dept: u.line, unit: u.code, kind: 'provider', managerRid: dir.rid,
          npi: '1' + h.between(100000000, 999999999),
        }));
      }
      for (let i = 0; i < 2; i++) {
        roster.techs.push(newStaff({
          title: h.pick(TECH_TITLES), credential: 'CNA', dept: 'Nursing — ' + u.name, unit: u.code,
          kind: 'tech', managerRid: mgr.rid,
        }));
      }
      unitStaff[u.code] = roster;
    });

    const clinicalStaff = staff.filter((s) => s.unit);

    /* --------------------------------- deliberate, documented discrepancies */
    const notes = [];
    const note = (kind, who, detail) => notes.push({ kind, who, detail });

    // 1. Licence lapsed but still scheduled and still charting.
    const lapsed = h.shuffle(clinicalStaff.filter((s) => s.kind === 'nurse' || s.kind === 'provider')).slice(0, 3);
    lapsed.forEach((s) => {
      s.licenseExpiry = asOf - h.between(4, 40) * DAY;
      s.privilege = 'Expired';
      note('licence-lapsed', s.name, 'Licence expired but the person is still on the schedule and still has chart access.');
    });

    // 2. Terminated in Workday, still active in the EHR and on the door.
    const ghosts = h.shuffle(clinicalStaff.filter((s) => s.kind === 'nurse' || s.kind === 'tech')).slice(0, 2);
    ghosts.forEach((s) => {
      s.status = 'Terminated';
      s.terminationDate = asOf - h.between(20, 70) * DAY;
      s.epicStillActive = true;
      note('ghost-access', s.name, 'Terminated in Workday; Epic account and badge both still active.');
    });

    // 2b. Offboarded five days ago. The badge system has not been read since,
    //     so its disagreement is lag — it is behind, not wrong, and raising it
    //     as a defect would be noise.
    const recentlyLeft = h.shuffle(clinicalStaff.filter((s) => s.status === 'Active' && s.kind === 'tech')).slice(0, 2);
    recentlyLeft.forEach((s) => {
      s.status = 'Terminated';
      s.terminationDate = asOf - 5 * DAY;
      note('badge-lag', s.name, 'Left five days ago. Only the stalled badge connector still shows them active.');
    });

    // 3. Ward transfer four days ago: scheduling knows, HR has not caught up.
    const transferred = h.shuffle(clinicalStaff.filter((s) => s.kind === 'nurse' && s.status === 'Active')).slice(0, 5);
    transferred.forEach((s) => {
      const to = h.pick(UNITS.filter((u) => u.code !== s.unit));
      s.priorUnit = s.unit;
      s.unit = to.code;
      s.unitEffectiveFrom = asOf - 4 * DAY;
      s.workdayStillOldUnit = true;
      note('unit-transfer', s.name, 'Moved wards four days ago. Systems that have not re-read the record are behind, not wrong.');
    });

    // 4. Credential display copy in the EHR never updated after a promotion.
    const credDrift = h.shuffle(clinicalStaff.filter((s) => s.credential === 'RN')).slice(0, 6);
    credDrift.forEach((s) => {
      s.epicCredential = 'LPN';
      note('credential-drift', s.name, 'Epic still shows the credential this person held before qualifying.');
    });

    // 5. NPI missing from the EHR record.
    const npiGap = h.shuffle(clinicalStaff.filter((s) => s.npi)).slice(0, 5);
    npiGap.forEach((s) => { s.epicNoNpi = true; note('npi-gap', s.name, 'Provider number is blank on the Epic record.'); });

    // 6. Agency nurses: scheduled, badged, charting, no worker record at all.
    const agency = [];
    for (let i = 0; i < 3; i++) {
      const n = namer();
      const u = h.pick(UNITS);
      agency.push({
        name: n.full, email: (n.first + '.' + n.last).toLowerCase() + '@agency.example',
        epicUserId: 'EPU9' + String(100 + i), ukgId: 'UKG9' + String(100 + i), badgeId: 'BDG-99' + String(100 + i),
        unit: u.code, title: 'Registered Nurse (Agency)',
      });
      note('no-hr-record', n.full, 'Agency nurse with scheduling, badge and chart access but no Workday worker record.');
    }

    // 7. Future-dated leave — recorded, correctly not a conflict.
    const scheduledLeave = h.shuffle(clinicalStaff.filter((s) => s.status === 'Active')).slice(0, 3);
    scheduledLeave.forEach((s) => {
      s.scheduledStatus = { value: 'On leave', from: asOf + h.between(14, 40) * DAY };
      note('scheduled-change', s.name, 'Leave of absence begins next month. A future fact, not a discrepancy.');
    });

    /* ---------------------------------------------------------- patients */
    const patients = [];
    for (let i = 0; i < 92; i++) {
      const n = namer();
      const dob = Date.parse('1940-01-01') + Math.floor(rand() * (Date.parse('2012-01-01') - Date.parse('1940-01-01')));
      patients.push({
        rid: 'p' + i,
        mrn: 'MRN-' + String(400000 + i * 37).slice(-6),
        accountId: 'WS-' + String(880000 + i * 41).slice(-6),
        name: n.full,
        dob,
        sex: h.pick(['Female', 'Male']),
        phone: '(555) ' + h.between(200, 989) + '-' + String(h.between(1000, 9999)),
        address: h.between(12, 980) + ' ' + h.street() + ', ' + h.pick(['Aldwyn', 'Northgate', 'Riverside']) + ', OH',
        insurance: h.pick(PAYERS),
        status: 'Active',
      });
    }

    // 8. A duplicate medical record — the classic, and the expensive one.
    const dupe = patients[7];
    dupe.duplicate = { mrn: 'MRN-' + String(400000 + 9999).slice(-6), accountId: 'WS-' + String(889999).slice(-6) };
    note('duplicate-mrn', dupe.name, 'Two Epic medical record numbers share a name and date of birth. Chart is split across both.');

    // 9. Date of birth transposed in billing.
    const dobDrift = h.shuffle(patients).slice(0, 4);
    dobDrift.forEach((p) => {
      p.billingDob = p.dob + h.between(1, 3) * 365 * DAY;
      note('dob-mismatch', p.name, 'Registration and billing disagree on date of birth — a wrong-patient and claim-denial risk.');
    });

    // 10. Stale contact details in billing.
    h.shuffle(patients).slice(0, 6).forEach((p) => { p.billingPhone = '(555) ' + h.between(200, 989) + '-' + String(h.between(1000, 9999)); });

    /* -------------------------------------------------------- encounters */
    const encounters = [];
    let eSeq = 0;
    patients.forEach((p) => {
      const visits = h.between(1, 8);
      const panelUnit = h.pick(UNITS);
      for (let i = 0; i < visits; i++) {
        eSeq++;
        const u = h.chance(0.55) ? panelUnit : h.pick(UNITS);
        const roster = unitStaff[u.code];
        const admit = asOf - h.between(2, 700) * DAY - h.between(0, 20) * 3600000;
        const inpatient = u.type === 'Inpatient' || (u.type === 'Emergency' && h.chance(0.25));
        const losHours = inpatient ? h.between(20, 260) : h.between(1, 7);
        const discharge = admit + losHours * 3600000;
        if (discharge > asOf) continue;
        const attending = h.pick(roster.providers);
        const nurses = h.shuffle(roster.nurses).slice(0, h.between(1, 3));
        const tech = h.chance(0.5) ? h.pick(roster.techs) : null;
        encounters.push({
          csn: 'ENC-' + String(100000 + eSeq * 7).slice(-6),
          claimId: 'CLM-' + String(500000 + eSeq * 11).slice(-6),
          patientRid: p.rid,
          unit: u.code,
          fac: u.fac,
          type: inpatient ? 'Inpatient' : u.type === 'Emergency' ? 'Emergency' : u.type === 'Clinic' ? 'Clinic visit' : u.type === 'Procedural' ? 'Procedure' : 'Outpatient',
          admit,
          discharge,
          losDays: Math.max(1, Math.round((discharge - admit) / DAY)),
          disposition: h.pick(DISPOSITIONS),
          diagnosis: h.pick(DIAGNOSES),
          payer: p.insurance,
          claimStatus: h.pick(['Paid', 'Paid', 'Submitted', 'Denied', 'In review']),
          attendingRid: attending.rid,
          nurseRids: nurses.map((n) => n.rid),
          techRid: tech ? tech.rid : null,
        });
      }
    });

    // 11. Billed days disagree with the clinical stay.
    h.shuffle(encounters.filter((e) => e.type === 'Inpatient')).slice(0, 7).forEach((e) => {
      e.billedDays = e.losDays + h.pick([-1, 1, 2]);
      if (e.billedDays < 1) e.billedDays = e.losDays + 1;
      note('los-mismatch', e.csn, 'Clinical length of stay and billed days differ on the same visit.');
    });

    /* ----------------------------------------------------- emit records */
    const records = { epic: [], workday: [], ukg: [], symplr: [], waystar: [], lenel: [] };
    const staffByRid = Object.fromEntries(staff.map((s) => [s.rid, s]));
    const patientByRid = Object.fromEntries(patients.map((p) => [p.rid, p]));
    const unitByCode = Object.fromEntries(UNITS.map((u) => [u.code, u]));

    FACILITIES.forEach((f) =>
      records.epic.push({ _type: 'facility', facilityCode: f.code, name: f.name, city: f.city, licensedBeds: f.beds, facilityType: f.type, observedAt: obs('epic') })
    );

    UNITS.forEach((u) => {
      records.epic.push({ _type: 'unit', deptCode: u.code, deptName: u.name, facilityCode: u.fac, serviceLine: u.line, staffedBeds: u.beds, unitType: u.type, observedAt: obs('epic') });
      records.ukg.push({ _type: 'unit', costCenter: 'CC-' + u.code, unitCode: u.code, name: u.name, observedAt: obs('ukg') });
      records.workday.push({ _type: 'unit', departmentId: 'DEP-' + u.code, unitCode: u.code, name: u.name, costCenter: 'CC-' + u.code, observedAt: obs('workday') });
    });
    // 12. Scheduling and finance disagree on one cost centre.
    const ccDrift = records.ukg.find((r) => r._type === 'unit' && r.unitCode === 'ONC');
    if (ccDrift) { ccDrift.costCenter = 'CC-ONC2'; note('cost-centre', 'Oncology Infusion', 'Scheduling and finance carry different cost centres for the same unit.'); }

    staff.forEach((s) => {
      const mgr = s.managerRid ? staffByRid[s.managerRid] : null;
      records.workday.push({
        _type: 'staff', workerId: s.workerId, legalName: s.name, workEmail: s.email, jobTitle: s.title,
        department: s.dept, unitCode: s.workdayStillOldUnit ? s.priorUnit : s.unit,
        managerWorkerId: mgr ? mgr.workerId : null, employmentType: s.employmentType,
        employmentStatus: s.status, hireDate: s.hireDate, terminationDate: s.terminationDate,
        unitEffectiveFrom: s.workdayStillOldUnit ? s.hireDate : (s.unitEffectiveFrom || s.hireDate),
        scheduledChange: s.scheduledStatus ? { field: 'employmentStatus', value: s.scheduledStatus.value, effectiveFrom: s.scheduledStatus.from } : null,
        observedAt: obs('workday'),
      });

      if (s.status !== 'Terminated' || s.epicStillActive) {
        records.epic.push({
          _type: 'staff', userId: s.epicUserId, providerName: s.name, loginEmail: s.email,
          npi: s.epicNoNpi ? null : s.npi, epicTitle: s.title, credential: s.epicCredential || s.credential,
          primaryDeptCode: s.unit, employeeNumber: s.workerId, accountStatus: 'Active',
          lastChartAccess: asOf - h.between(0, 12) * DAY, observedAt: obs('epic'),
        });
      }

      if (s.unit) {
        records.ukg.push({
          _type: 'staff', personNumber: s.ukgId, displayName: s.name, employeeNumber: s.workerId,
          homeUnit: s.unit, homeCostCenter: 'CC-' + s.unit, jobCode: s.title, badgeId: s.badgeId,
          employmentStatus: s.status === 'Terminated' ? 'Inactive' : 'Active',
          scheduledHours: h.between(24, 40), observedAt: obs('ukg'),
        });
      }

      if (s.npi || s.credential === 'RN' || s.kind === 'provider' || s.kind === 'nurse' || s.kind === 'manager') {
        records.symplr.push({
          _type: 'staff', providerId: 'CR-' + String(7000 + parseInt(s.rid.slice(1), 10)), name: s.name,
          employeeNumber: s.workerId, npi: s.npi, credential: s.credential, licenseNumber: 'L' + h.between(100000, 999999),
          licenseExpiry: s.licenseExpiry, privilegeStatus: s.privilege,
          primaryFacility: s.unit ? unitByCode[s.unit].fac : 'SARMC', observedAt: obs('symplr'),
        });
      }

      records.lenel.push({
        _type: 'staff', badgeId: s.badgeId, holderName: s.name, employeeNumber: s.workerId,
        accessLevel: s.kind === 'exec' ? 'All areas' : s.unit ? unitByCode[s.unit].fac + ' — clinical' : 'Administration',
        badgeStatus: 'Active', lastSwipe: asOf - h.between(0, 26) * DAY, observedAt: obs('lenel'),
      });
    });

    agency.forEach((a) => {
      records.epic.push({ _type: 'staff', userId: a.epicUserId, providerName: a.name, loginEmail: a.email, npi: null,
        epicTitle: a.title, credential: 'RN', primaryDeptCode: a.unit, employeeNumber: null, accountStatus: 'Active',
        lastChartAccess: asOf - h.between(0, 4) * DAY, observedAt: obs('epic') });
      records.ukg.push({ _type: 'staff', personNumber: a.ukgId, displayName: a.name, employeeNumber: null,
        homeUnit: a.unit, homeCostCenter: 'CC-' + a.unit, jobCode: a.title, badgeId: a.badgeId,
        employmentStatus: 'Active', scheduledHours: 36, observedAt: obs('ukg') });
      records.lenel.push({ _type: 'staff', badgeId: a.badgeId, holderName: a.name, employeeNumber: null,
        accessLevel: unitByCode[a.unit].fac + ' — clinical', badgeStatus: 'Active',
        lastSwipe: asOf - h.between(0, 3) * DAY, observedAt: obs('lenel') });
    });

    // 12b. A rehire with two chart logins, both carrying the same worker
    //      number, so both resolve to one person and the duplicate surfaces.
    const rehire = clinicalStaff.find((s) => s.kind === 'provider' && s.status === 'Active' && !s.epicNoNpi);
    if (rehire) {
      records.epic.push({ _type: 'staff', userId: rehire.epicUserId + 'X', providerName: rehire.name,
        loginEmail: rehire.email.replace('@', '.prior@'), npi: rehire.npi, epicTitle: rehire.title,
        credential: rehire.credential, primaryDeptCode: rehire.unit, employeeNumber: rehire.workerId,
        accountStatus: 'Active', lastChartAccess: asOf - h.between(300, 700) * DAY, observedAt: obs('epic') });
      note('duplicate-account', rehire.name, 'Two active Epic logins share this worker number after a rehire.');
    }

    // 13. An orphaned shared login nobody owns.
    records.epic.push({ _type: 'staff', userId: 'EPU00099', providerName: 'ED Training Account', loginEmail: 'ed.training@stalwyn.example',
      npi: null, epicTitle: null, credential: null, primaryDeptCode: 'ED', employeeNumber: null,
      accountStatus: 'Active', lastChartAccess: asOf - 3 * DAY, observedAt: obs('epic') });
    note('orphan-account', 'ED Training Account', 'Shared Epic login with chart access and no owner.');

    patients.forEach((p) => {
      records.epic.push({ _type: 'patient', mrn: p.mrn, legalName: p.name, dob: p.dob, sex: p.sex,
        phone: p.phone, addressLine: p.address, patientStatus: p.status, observedAt: obs('epic') });
      records.waystar.push({ _type: 'patient', accountId: p.accountId, mrnRef: p.mrn, patientName: p.name,
        dateOfBirth: p.billingDob || p.dob, phone: p.billingPhone || p.phone, addressLine: p.address,
        insurancePlan: p.insurance, observedAt: obs('waystar') });
      if (p.duplicate) {
        records.epic.push({ _type: 'patient', mrn: p.duplicate.mrn, legalName: p.name, dob: p.dob, sex: p.sex,
          phone: p.phone, addressLine: p.address, patientStatus: 'Active', observedAt: obs('epic') });
      }
    });

    encounters.forEach((e) => {
      const p = patientByRid[e.patientRid];
      records.epic.push({ _type: 'encounter', csn: e.csn, patientMrn: p.mrn, deptCode: e.unit, facilityCode: e.fac,
        encounterType: e.type, admitAt: e.admit, dischargeAt: e.discharge, disposition: e.disposition,
        primaryDiagnosis: e.diagnosis, lengthOfDays: e.losDays, observedAt: obs('epic') });
      records.waystar.push({ _type: 'encounter', claimId: e.claimId, csnRef: e.csn, billedDays: e.billedDays || e.losDays,
        payer: e.payer, claimStatus: e.claimStatus, totalCharges: e.losDays * h.between(1800, 6400), observedAt: obs('waystar') });
    });

    /* ---------------------------------------------------------- the edges */
    const edges = [];
    const staffRef = (s) => ({ type: 'staff', sys: 'workday', id: s.workerId });
    const unitRef = (code) => ({ type: 'unit', sys: 'epic', id: code });
    const facRef = (code) => ({ type: 'facility', sys: 'epic', id: code });

    staff.forEach((s) => {
      if (s.managerRid) {
        edges.push({ type: 'reports_to', from: staffRef(s), to: staffRef(staffByRid[s.managerRid]),
          fromTs: s.hireDate, toTs: s.terminationDate, systemId: 'workday' });
      }
      if (s.unit) {
        // Prior wards are kept as closed intervals — this is what makes
        // "who used to work here" answerable at all.
        if (s.priorUnit) {
          edges.push({ type: 'assigned_to', from: staffRef(s), to: unitRef(s.priorUnit),
            fromTs: s.hireDate, toTs: s.unitEffectiveFrom, role: s.title, systemId: 'ukg' });
          edges.push({ type: 'assigned_to', from: staffRef(s), to: unitRef(s.unit),
            fromTs: s.unitEffectiveFrom, toTs: s.terminationDate, role: s.title, systemId: 'ukg' });
        } else {
          const rotated = h.chance(0.3);
          if (rotated) {
            const prior = h.pick(UNITS.filter((u) => u.code !== s.unit));
            const switchedAt = s.hireDate + Math.floor((asOf - s.hireDate) * (0.3 + rand() * 0.4));
            edges.push({ type: 'assigned_to', from: staffRef(s), to: unitRef(prior.code),
              fromTs: s.hireDate, toTs: switchedAt, role: s.title, systemId: 'ukg' });
            edges.push({ type: 'assigned_to', from: staffRef(s), to: unitRef(s.unit),
              fromTs: switchedAt, toTs: s.terminationDate, role: s.title, systemId: 'ukg' });
          } else {
            edges.push({ type: 'assigned_to', from: staffRef(s), to: unitRef(s.unit),
              fromTs: s.hireDate, toTs: s.terminationDate, role: s.title, systemId: 'ukg' });
          }
        }
        edges.push({ type: 'privileged_at', from: staffRef(s), to: facRef(unitByCode[s.unit].fac),
          fromTs: s.hireDate, toTs: s.privilege === 'Expired' ? s.licenseExpiry : s.terminationDate, systemId: 'symplr' });
      }
    });

    UNITS.forEach((u) => edges.push({ type: 'part_of', from: unitRef(u.code), to: facRef(u.fac), fromTs: null, toTs: null, systemId: 'epic' }));

    encounters.forEach((e) => {
      const encRef = { type: 'encounter', sys: 'epic', id: e.csn };
      edges.push({ type: 'encounter_of', from: encRef, to: { type: 'patient', sys: 'epic', id: patientByRid[e.patientRid].mrn }, systemId: 'epic' });
      edges.push({ type: 'occurred_at', from: encRef, to: unitRef(e.unit), systemId: 'epic' });
      edges.push({ type: 'care_team', from: encRef, to: staffRef(staffByRid[e.attendingRid]), role: 'Attending', systemId: 'epic' });
      e.nurseRids.forEach((rid) => edges.push({ type: 'care_team', from: encRef, to: staffRef(staffByRid[rid]), role: 'Nurse', systemId: 'epic' }));
      if (e.techRid) edges.push({ type: 'care_team', from: encRef, to: staffRef(staffByRid[e.techRid]), role: 'Technician', systemId: 'epic' });
    });

    // Primary care panels, including who the provider used to be.
    patients.forEach((p, i) => {
      const u = UNITS[i % UNITS.length];
      const providers = unitStaff[u.code].providers;
      const current = providers[i % providers.length];
      const pRef = { type: 'patient', sys: 'epic', id: p.mrn };
      if (h.chance(0.35) && providers.length > 1) {
        const previous = providers[(i + 1) % providers.length];
        const changed = asOf - h.between(60, 500) * DAY;
        edges.push({ type: 'panel_of', from: pRef, to: staffRef(previous), fromTs: changed - 700 * DAY, toTs: changed, systemId: 'epic' });
        edges.push({ type: 'panel_of', from: pRef, to: staffRef(current), fromTs: changed, toTs: null, systemId: 'epic' });
      } else {
        edges.push({ type: 'panel_of', from: pRef, to: staffRef(current), fromTs: asOf - h.between(200, 1400) * DAY, toTs: null, systemId: 'epic' });
      }
    });

    const recordCounts = {
      epic: records.epic.length + encounters.length * 12,
      workday: records.workday.length * 3,
      ukg: records.ukg.length * 26,
      symplr: records.symplr.length * 4,
      waystar: records.waystar.length * 3,
      lenel: records.lenel.length * 180,
    };

    return { records, edges, syncState, recordCounts, notes, asOf };
  }

  /* ------------------------------------------------------------ adapters */

  const N = () => SOT.schema.norm;

  const ADAPTERS = {
    epic: {
      collection: 'epic', effectiveDating: false,
      identity: (r) => {
        if (r._type === 'staff') return { nativeId: r.userId, name: r.providerName, detail: r.epicTitle || 'No title',
          active: r.accountStatus === 'Active', keys: { email: r.loginEmail, employeeId: r.employeeNumber, npi: r.npi, name: N().name(r.providerName) } };
        if (r._type === 'patient') return { nativeId: r.mrn, name: r.legalName, detail: 'MRN ' + r.mrn, active: true,
          keys: { mrn: r.mrn, nameDob: N().name(r.legalName) + '|' + r.dob } };
        if (r._type === 'unit') return { nativeId: r.deptCode, name: r.deptName, detail: r.serviceLine, active: true, keys: { code: r.deptCode } };
        if (r._type === 'facility') return { nativeId: r.facilityCode, name: r.name, detail: r.city, active: true, keys: { code: r.facilityCode } };
        if (r._type === 'encounter') return { nativeId: r.csn, name: r.encounterType + ' — ' + r.deptCode, detail: r.csn, active: true, keys: { code: r.csn } };
        return null;
      },
      assertions: (r) => {
        const t = r.observedAt;
        const a = (list) => list.map((x) => Object.assign({ observedAt: t, effectiveFrom: t }, x));
        if (r._type === 'staff') return a([
          { field: 'fullName', value: r.providerName }, { field: 'workEmail', value: r.loginEmail },
          { field: 'employeeId', value: r.employeeNumber }, { field: 'npi', value: r.npi },
          { field: 'jobTitle', value: r.epicTitle }, { field: 'credential', value: r.credential },
          { field: 'homeUnit', value: r.primaryDeptCode },
          { field: 'employmentStatus', value: r.accountStatus === 'Active' ? 'Active' : 'Terminated' },
          { field: 'accessStatus', value: r.accountStatus },
        ]);
        if (r._type === 'patient') return a([
          { field: 'fullName', value: r.legalName }, { field: 'mrn', value: r.mrn }, { field: 'dob', value: r.dob },
          { field: 'sex', value: r.sex }, { field: 'phone', value: r.phone }, { field: 'address', value: r.addressLine },
          { field: 'patientStatus', value: r.patientStatus },
        ]);
        if (r._type === 'unit') return a([
          { field: 'unitName', value: r.deptName }, { field: 'unitCode', value: r.deptCode },
          { field: 'facilityCode', value: r.facilityCode }, { field: 'serviceLine', value: r.serviceLine },
          { field: 'unitType', value: r.unitType }, { field: 'beds', value: r.staffedBeds },
        ]);
        if (r._type === 'facility') return a([
          { field: 'facilityName', value: r.name }, { field: 'facilityCode', value: r.facilityCode },
          { field: 'city', value: r.city }, { field: 'facilityType', value: r.facilityType },
          { field: 'licensedBeds', value: r.licensedBeds },
        ]);
        if (r._type === 'encounter') return a([
          { field: 'encounterLabel', value: r.encounterType + ' · ' + new Date(r.admitAt).toISOString().slice(0, 10) },
          { field: 'encounterType', value: r.encounterType }, { field: 'admitAt', value: r.admitAt },
          { field: 'dischargeAt', value: r.dischargeAt }, { field: 'disposition', value: r.disposition },
          { field: 'primaryDiagnosis', value: r.primaryDiagnosis }, { field: 'lengthOfDays', value: r.lengthOfDays },
        ]);
        return [];
      },
    },

    workday: {
      collection: 'workday', effectiveDating: true,
      identity: (r) => {
        if (r._type === 'staff') return { nativeId: r.workerId, name: r.legalName, detail: r.jobTitle,
          active: r.employmentStatus === 'Active',
          keys: { employeeId: r.workerId, email: r.workEmail, name: N().name(r.legalName) } };
        if (r._type === 'unit') return { nativeId: r.departmentId, name: r.name, detail: r.costCenter, active: true, keys: { code: r.unitCode } };
        return null;
      },
      assertions: (r) => {
        const t = r.observedAt;
        if (r._type === 'staff') {
          const out = [
            { field: 'fullName', value: r.legalName, effectiveFrom: r.hireDate },
            { field: 'workEmail', value: r.workEmail, effectiveFrom: r.hireDate },
            { field: 'employeeId', value: r.workerId, effectiveFrom: r.hireDate },
            { field: 'jobTitle', value: r.jobTitle, effectiveFrom: r.hireDate },
            { field: 'department', value: r.department, effectiveFrom: r.hireDate },
            { field: 'homeUnit', value: r.unitCode, effectiveFrom: r.unitEffectiveFrom },
            { field: 'employmentType', value: r.employmentType, effectiveFrom: r.hireDate },
            { field: 'employmentStatus', value: r.employmentStatus, effectiveFrom: r.terminationDate || r.hireDate },
            { field: 'hireDate', value: r.hireDate, effectiveFrom: r.hireDate },
          ];
          if (r.scheduledChange)
            out.push({ field: r.scheduledChange.field, value: r.scheduledChange.value, effectiveFrom: r.scheduledChange.effectiveFrom, scheduled: true });
          return out.map((x) => Object.assign({ observedAt: t }, x));
        }
        if (r._type === 'unit') return [
          { field: 'unitName', value: r.name, observedAt: t, effectiveFrom: t },
          { field: 'unitCode', value: r.unitCode, observedAt: t, effectiveFrom: t },
          { field: 'costCenter', value: r.costCenter, observedAt: t, effectiveFrom: t },
        ];
        return [];
      },
    },

    ukg: {
      collection: 'ukg', effectiveDating: false,
      identity: (r) => {
        if (r._type === 'staff') return { nativeId: r.personNumber, name: r.displayName, detail: r.jobCode,
          active: r.employmentStatus === 'Active',
          keys: { employeeId: r.employeeNumber, badge: r.badgeId, nameGroup: N().name(r.displayName) + '|' + r.homeUnit, name: N().name(r.displayName) } };
        if (r._type === 'unit') return { nativeId: r.costCenter, name: r.name, detail: r.costCenter, active: true, keys: { code: r.unitCode } };
        return null;
      },
      assertions: (r) => {
        const t = r.observedAt;
        if (r._type === 'staff') return [
          { field: 'fullName', value: r.displayName }, { field: 'employeeId', value: r.employeeNumber },
          { field: 'homeUnit', value: r.homeUnit },
        ].map((x) => Object.assign({ observedAt: t, effectiveFrom: t }, x));
        if (r._type === 'unit') return [
          { field: 'unitName', value: r.name, observedAt: t, effectiveFrom: t },
          { field: 'unitCode', value: r.unitCode, observedAt: t, effectiveFrom: t },
          { field: 'costCenter', value: r.costCenter, observedAt: t, effectiveFrom: t },
        ];
        return [];
      },
    },

    symplr: {
      collection: 'symplr', effectiveDating: true,
      identity: (r) => ({ nativeId: r.providerId, name: r.name, detail: r.credential, active: true,
        keys: { employeeId: r.employeeNumber, npi: r.npi, name: N().name(r.name) } }),
      assertions: (r) => [
        { field: 'fullName', value: r.name }, { field: 'npi', value: r.npi }, { field: 'credential', value: r.credential },
        { field: 'licenseNumber', value: r.licenseNumber }, { field: 'licenseExpiry', value: r.licenseExpiry },
        { field: 'privilegeStatus', value: r.privilegeStatus },
      ].map((x) => Object.assign({ observedAt: r.observedAt, effectiveFrom: r.observedAt }, x)),
    },

    waystar: {
      collection: 'waystar', effectiveDating: false,
      identity: (r) => {
        if (r._type === 'patient') return { nativeId: r.accountId, name: r.patientName, detail: r.insurancePlan, active: true,

  const INSTALLATIONS = [

  const RANKS = ['PVT', 'PFC', 'SPC', 'SGT', 'SSG', 'SFC', '1SG', '2LT', '1LT', 'CPT', 'MAJ', 'LTC'];

<script>
/* --- core/store.js --- */
/* SOT — application store.
 *
 * Owns the small amount of state a user can change (vertical pack, role,
 * policy, task status, confirmed identity links) and re-runs the whole
 * pipeline whenever any of it moves:
 *
 *   source records → identities → assertions → policy → resolved entities
 *                                                     → graph → statistics
 *
 * The pipeline is a few milliseconds over this dataset, so the application
 * recomputes rather than maintaining caches. At real scale the same functions
 * run server-side and incrementally; the shape does not change, which is the
 * point of keeping the engine free of storage and interface concerns.
 */
(function (SOT) {
  'use strict';

  const KEY = 'kaliris.sot.v2';
  const DAY = 86400000;

  function load() {
    try { return JSON.parse(window.localStorage.getItem(KEY) || 'null'); } catch (e) { return null; }
  }
  function save(state) {
    try {
      window.localStorage.setItem(KEY, JSON.stringify({
        packId: state.packId, roleId: state.roleId, policies: state.policies,
        taskStatus: state.taskStatus, forcedLinks: state.forcedLinks, dismissedKeys: state.dismissedKeys,
        audit: state.audit.slice(0, 120),
      }));
    } catch (e) { /* storage disabled — the app just forgets between reloads */ }
  }

  /** Values are stored raw; this is the engine-side rendering used in task text. */
  function formatValue(field, value) {
    if (value === null || value === undefined || value === '') return '—';
    if (/At$|Date$|Expiry$|dob/i.test(field) && typeof value === 'number' && Math.abs(value) > 1e11)
      return new Date(value).toLocaleDateString('en-GB', { day: 'numeric', month: 'short', year: 'numeric' });
    return String(value);
  }

  /* A little history so the log is not empty on first open. Anything the user
     does in this session is appended to the top of it. */
  function seedAudit() {
    const now = Date.now();
    const H = 3600000;
    return [
      { ts: now - 6 * H, actor: 'r.okafor@kalirislabs.example', tenant: 'health', action: 'policy.change',
        detail: 'Home unit → UKG Dimensions (was Workday)' },
      { ts: now - 27 * H, actor: 'system', tenant: 'freight', action: 'connector.degraded',
        detail: 'DOT Qualification File stopped responding' },
      { ts: now - 31 * H, actor: 'j.mensah@kalirislabs.example', tenant: 'edu', action: 'identity.confirm',
        detail: 'Campus Card credential linked to a faculty record' },
      { ts: now - 49 * H, actor: 'r.okafor@kalirislabs.example', tenant: 'wealth', action: 'tenant.provision',
        detail: 'Halyard Wealth Partners provisioned · 5 connectors' },
      { ts: now - 73 * H, actor: 'system', tenant: 'salon', action: 'sync.complete',
        detail: 'Initial load: 3,484 records across 5 connectors' },
    ];
  }

  function create() {
    const packs = SOT.packs;
    const saved = load() || {};

    const state = {
      packId: saved.packId && packs[saved.packId] ? saved.packId : 'health',
      roleId: saved.roleId || null,
      policies: saved.policies || {},
      taskStatus: saved.taskStatus || {},
      forcedLinks: saved.forcedLinks || [],
      dismissedKeys: saved.dismissedKeys || [],
      audit: saved.audit || seedAudit(),
      signedIn: false,
      owner: false,
    };

    const prepared = {};
    function preparePack(id) {
      if (prepared[id]) return prepared[id];
      const base = packs[id];
      const built = base.build();
      const pack = Object.assign({}, base, built);
      pack.systemById = Object.fromEntries(pack.systems.map((s) => [s.id, s]));
      pack.typeById = Object.fromEntries(pack.entityTypes.map((t) => [t.id, t]));
      pack.edgeTypeById = Object.fromEntries(pack.edgeTypes.map((e) => [e.id, e]));
      pack.fieldByKey = {};
      pack.fields.forEach((f) => { pack.fieldByKey[f.entity + '.' + f.key] = f; });
      prepared[id] = pack;
      return pack;
    }

    const listeners = [];
    let view = null;
    let platformCache = null;

    function audit(action, detail, tenant) {
      state.audit.unshift({ ts: Date.now(), actor: 'you', tenant: tenant || state.packId, action, detail });
      if (state.audit.length > 200) state.audit.length = 200;
    }

    function policyFor(pack) {
      const override = state.policies[pack.id] || {};
      const merged = {};
      Object.keys(pack.policy).forEach((k) => { merged[k] = (override[k] || pack.policy[k]).slice(); });
      return merged;
    }

    function recompute() {
      const pack = preparePack(state.packId);
      const policy = policyFor(pack);

      const identity = SOT.identity.resolveIdentities(pack, {
        forcedLinks: state.forcedLinks.filter((f) => f.pack === pack.id),
        dismissedKeys: state.dismissedKeys.filter((k) => k.indexOf(pack.id + '::') === 0).map((k) => k.split('::')[1]),
      });

      const resolution = SOT.resolve.resolveAll(pack, identity, policy, pack.asOf);
      const graph = SOT.graph.build(identity.entities, pack.edges, identity.entityIdOf);

      const ctx = { graph, profiles: resolution.profiles, asOf: pack.asOf, pack };
      const statsByEntity = {};
      Object.keys(resolution.profiles).forEach((id) => {
        statsByEntity[id] = SOT.stats.compute(pack.id, resolution.profiles[id], ctx);
      });

      const tasks = SOT.tasks.generate(pack, resolution, identity, formatValue).map((t) =>
        Object.assign({}, t, { status: state.taskStatus[pack.id + '::' + t.id] || 'open' })
      );

      const role = pack.roles.find((r) => r.id === state.roleId) || pack.roles[0];
      const persona = pickPersona(pack, resolution, graph, role);
      const scope = computeScope(pack, resolution, graph, role, persona);

      const codeIndex = {};
      Object.keys(pack.codeRefs || {}).forEach((fieldKey) => {
        const [typeId, codeField] = pack.codeRefs[fieldKey];
        Object.values(resolution.profiles).forEach((p) => {
          if (p.type !== typeId) return;
          const code = p.get(codeField);
          if (code != null) codeIndex[typeId + '|' + code] = p.entity.id;
        });
      });

      view = {
        pack, policy, identity, graph, tasks, role, persona, scope, codeIndex,
        profiles: resolution.profiles,
        conflicts: resolution.conflicts,
        stats: statsByEntity,
        asOf: pack.asOf,
        summary: summarize(pack, resolution, identity, graph, scope),
        searchIndex: buildSearchIndex(pack, resolution, graph),
      };
      return view;
    }

    /* --------------------------------------------------- structural roles
     *
     * The scope rules below have to work whether the pack calls its people
     * "staff", "personnel" or "drivers". Rather than hard-coding vocabulary,
     * derive the structural role of each entity type from the edges: the
     * worker type is whatever is assigned to a group over time, the client
     * type is whatever an event is about, and so on.
     */
    function shape(pack) {
      if (pack._shape) return pack._shape;
      const kind = (id) => (pack.typeById[id] || {}).kind;
      const groupType = (pack.entityTypes.find((t) => t.kind === 'group') || {}).id;
      const eventType = (pack.entityTypes.find((t) => t.kind === 'event') || {}).id;
      const assignEdge = pack.edgeTypes.find((e) => e.temporal && e.to === groupType && kind(e.from) === 'person');
      const workerType = assignEdge ? assignEdge.from : (pack.entityTypes.find((t) => t.kind === 'person') || {}).id;
      const eventWorkerEdge = pack.edgeTypes.find((e) => e.from === eventType && e.to === workerType);
      const eventClientEdge = pack.edgeTypes.find((e) => e.from === eventType && kind(e.to) === 'person' && e.to !== workerType);
      const clientType = eventClientEdge ? eventClientEdge.to : null;
      const eventGroupEdge = pack.edgeTypes.find((e) => e.from === eventType && e.to === groupType);
      const clientWorkerEdge = pack.edgeTypes.find((e) => e.from === clientType && e.to === workerType);
      pack._shape = { groupType, eventType, workerType, clientType, assignEdge, eventWorkerEdge, eventClientEdge, eventGroupEdge, clientWorkerEdge };
      return pack._shape;
    }

    /* ------------------------------------------------------------ persona */

    function pickPersona(pack, resolution, graph, role) {
      const sh = shape(pack);
      if (!sh.workerType) return null;
      const all = Object.values(resolution.profiles).filter((p) => p.type === sh.workerType);
      const rule = (pack.personaRules || {})[role.id];
      if (rule) {
        const field = rule.field || 'jobTitle';
        const re = rule.match ? new RegExp(rule.match) : (rule instanceof RegExp ? rule : new RegExp(rule));
        const matches = all.filter((p) => re.test(p.get(field) || ''));
        if (matches.length) {
          // Prefer whoever has the most attached to them — the busiest example
          // makes for the most useful demonstration of the role.
          return matches.sort((a, b) =>
            graph.edgesOf(b.entity.id).length - graph.edgesOf(a.entity.id).length)[0];
        }
      }
      return null;
    }

    /* -------------------------------------------------------------- scope
     *
     * Which entities this role may open at all, as explicit id sets so the
     * interface can never leak a record into a count, a search result or a
     * related-items list.
     *
     *   all    everything of that type
     *   none   nothing — the records are not in scope at all
     *   group  whatever hangs off the persona's current group
     *   book   whatever the persona personally handles
     */
    function computeScope(pack, resolution, graph, role, persona) {
      const sh = shape(pack);
      // Packs may phrase the same two rules in their own words.
      const norm = (r) => (r === 'unit' ? 'group' : r === 'care' ? 'book' : r || 'all');
      const scopes = {};
      Object.keys(role.scopes || {}).forEach((k) => { scopes[k] = norm(role.scopes[k]); });

      const allowed = {};
      pack.entityTypes.forEach((t) => {
        allowed[t.id] = (scopes[t.id] || 'all') === 'all' ? null : new Set();
      });
      if (!persona) return { allowed, rule: scopes };
      const groupId = sh.assignEdge
        ? (() => { const n = graph.neighbour(persona.entity.id, sh.assignEdge.id, { dir: 'out', at: pack.asOf }); return n ? n.entity.id : null; })()
        : null;

      const events = new Set();
      const clients = new Set();
      const workers = new Set([persona.entity.id]);

      const wantsGroup = Object.keys(scopes).some((k) => scopes[k] === 'group');
      if (wantsGroup && groupId) {
        if (sh.eventGroupEdge) graph.neighbours(groupId, sh.eventGroupEdge.id, { dir: 'in' }).forEach((n) => events.add(n.entity.id));
        if (sh.assignEdge) graph.neighbours(groupId, sh.assignEdge.id, { dir: 'in' }).forEach((n) => workers.add(n.entity.id));
      }
      const wantsBook = Object.keys(scopes).some((k) => scopes[k] === 'book');
      if (wantsBook) {
        if (sh.eventWorkerEdge) graph.neighbours(persona.entity.id, sh.eventWorkerEdge.id, { dir: 'in' }).forEach((n) => events.add(n.entity.id));
        if (sh.clientWorkerEdge) graph.neighbours(persona.entity.id, sh.clientWorkerEdge.id, { dir: 'in' }).forEach((n) => clients.add(n.entity.id));
      }
      if (sh.eventClientEdge) {
        events.forEach((eid) => {
          const c = graph.neighbour(eid, sh.eventClientEdge.id, { dir: 'out' });
          if (c) clients.add(c.entity.id);
        });
      }

      if (sh.workerType && (scopes[sh.workerType] === 'group' || scopes[sh.workerType] === 'book')) allowed[sh.workerType] = workers;
      if (sh.eventType && (scopes[sh.eventType] === 'group' || scopes[sh.eventType] === 'book')) allowed[sh.eventType] = events;
      if (sh.clientType && (scopes[sh.clientType] === 'group' || scopes[sh.clientType] === 'book')) allowed[sh.clientType] = clients;

      return { allowed, rule: scopes, groupId };
    }

    function canOpen(id) {
      const p = view.profiles[id];
      if (!p) return false;
      const set = view.scope.allowed[p.type];
      return set === null || set === undefined ? true : set.has(id);
    }

    function visible(type) {
      const set = view.scope.allowed[type];
      const all = Object.values(view.profiles).filter((p) => p.type === type);
      if (set === null || set === undefined) return all;
      return all.filter((p) => set.has(p.entity.id));
    }

    /* ------------------------------------------------------------ summary */

    function summarize(pack, resolution, identity, graph, scope) {
      const visibleIds = (type) => {
        const set = scope.allowed[type];
        return Object.values(resolution.profiles)
          .filter((p) => p.type === type && (set === null || set === undefined || set.has(p.entity.id)))
          .map((p) => p.entity.id);
      };
      const counts = {};
      pack.entityTypes.forEach((t) => { counts[t.id] = visibleIds(t.id).length; });

      const inScope = new Set([].concat.apply([], pack.entityTypes.map((t) => visibleIds(t.id))));
      const conflicts = resolution.conflicts.filter((c) => inScope.has(c.entityId));
      const bySeverity = { critical: 0, high: 0, medium: 0, low: 0 };
      const byKind = { divergence: 0, lag: 0, gap: 0 };
      conflicts.forEach((c) => { bySeverity[c.severity]++; byKind[c.kind]++; });

      const profiles = Object.values(resolution.profiles).filter((p) => inScope.has(p.entity.id));
      const alignment = profiles.length ? Math.round(profiles.reduce((s, p) => s + p.alignment, 0) / profiles.length) : 100;

      return {
        counts, conflicts: conflicts.length,
        actionable: conflicts.filter((c) => c.actionable).length,
        bySeverity, byKind, alignment,
        identity: identity.stats,
        inScope,
      };
    }

    /* ------------------------------------------------------------- search */

    function buildSearchIndex(pack, resolution, graph) {
      return Object.values(resolution.profiles).map((p) => {
        const type = pack.typeById[p.type];
        const subtitle = (type.subtitle || []).map((k) => p.get(k)).filter(Boolean).join(' · ');
        const terms = [p.name, subtitle]
          .concat((type.keyFacts || []).map((k) => p.get(k)))
          .filter((v) => v != null && typeof v !== 'object')
          .join(' ')
          .toLowerCase();
        return {
          id: p.entity.id, type: p.type, typeLabel: type.label, glyph: type.glyph,
          title: p.name, subtitle, terms, href: '#/e/' + p.entity.id,
        };
      });
    }

    /* ------------------------------------------------------------ actions */

    function emit() { platformCache = null; recompute(); save(state); listeners.forEach((fn) => fn(view)); }

    /* ----------------------------------------------------------- platform
     *
     * The operator's view: every tenant on the instance, resolved through the
     * same engine. Statistics are skipped here — this is a control plane, not
     * a reporting surface, and running them for every tenant would cost more
     * than the page is worth.
     */
    function platform() {
      if (platformCache) return platformCache;
      const tenants = Object.keys(packs).map((id) => {
        const pack = preparePack(id);
        const policy = policyFor(pack);
        const identity = SOT.identity.resolveIdentities(pack, {
          forcedLinks: state.forcedLinks.filter((f) => f.pack === id),
          dismissedKeys: state.dismissedKeys.filter((k) => k.indexOf(id + '::') === 0).map((k) => k.split('::')[1]),
        });
        const resolution = SOT.resolve.resolveAll(pack, identity, policy, pack.asOf);
        const graph = SOT.graph.build(identity.entities, pack.edges, identity.entityIdOf);
        const profiles = Object.values(resolution.profiles);
        const counts = {};
        pack.entityTypes.forEach((t) => { counts[t.id] = profiles.filter((p) => p.type === t.id).length; });
        const degraded = pack.systems.filter((sy) => pack.syncState[sy.id].status !== 'healthy');
        const openTasks = SOT.tasks.generate(pack, resolution, identity, formatValue)
          .filter((t) => (state.taskStatus[id + '::' + t.id] || 'open') === 'open').length;
        return {
