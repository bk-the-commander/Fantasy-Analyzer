    recentlyLeft.forEach((s) => {
      s.status = 'Terminated';
      s.terminationDate = asOf - 5 * DAY;
      note('badge-lag', s.name, 'Left five days ago. Only the stalled badge connector still shows them active.');
    });

    // 3. Ward transfer four days ago: scheduling knows, HR has not caught up.
    const transferred = h.shuffle(clinicalStaff.filter((s) => s.kind === 'nurse' && s.status === 'Active')).slice(0, 5);
    transferred.forEach((s) => {
      const to = h.pick(UNITS.filter((u) => u.code !== s.unit));
      s.priorUnit = s.unit;
      s.unit = to.code;
      s.unitEffectiveFrom = asOf - 4 * DAY;
      s.workdayStillOldUnit = true;
      note('unit-transfer', s.name, 'Moved wards four days ago. Systems that have not re-read the record are behind, not wrong.');
    });

    // 4. Credential display copy in the EHR never updated after a promotion.
    const credDrift = h.shuffle(clinicalStaff.filter((s) => s.credential === 'RN')).slice(0, 6);
    credDrift.forEach((s) => {
      s.epicCredential = 'LPN';
      note('credential-drift', s.name, 'Epic still shows the credential this person held before qualifying.');
    });

    // 5. NPI missing from the EHR record.
    const npiGap = h.shuffle(clinicalStaff.filter((s) => s.npi)).slice(0, 5);
    npiGap.forEach((s) => { s.epicNoNpi = true; note('npi-gap', s.name, 'Provider number is blank on the Epic record.'); });

    // 6. Agency nurses: scheduled, badged, charting, no worker record at all.
    const agency = [];
    for (let i = 0; i < 3; i++) {
      const n = namer();
      const u = h.pick(UNITS);
      agency.push({
        name: n.full, email: (n.first + '.' + n.last).toLowerCase() + '@agency.example',
        epicUserId: 'EPU9' + String(100 + i), ukgId: 'UKG9' + String(100 + i), badgeId: 'BDG-99' + String(100 + i),
        unit: u.code, title: 'Registered Nurse (Agency)',
      });
      note('no-hr-record', n.full, 'Agency nurse with scheduling, badge and chart access but no Workday worker record.');
    }

    // 7. Future-dated leave — recorded, correctly not a conflict.
    const scheduledLeave = h.shuffle(clinicalStaff.filter((s) => s.status === 'Active')).slice(0, 3);
    scheduledLeave.forEach((s) => {
      s.scheduledStatus = { value: 'On leave', from: asOf + h.between(14, 40) * DAY };
      note('scheduled-change', s.name, 'Leave of absence begins next month. A future fact, not a discrepancy.');
    });

    /* ---------------------------------------------------------- patients */
    const patients = [];
    for (let i = 0; i < 92; i++) {
      const n = namer();
      const dob = Date.parse('1940-01-01') + Math.floor(rand() * (Date.parse('2012-01-01') - Date.parse('1940-01-01')));
      patients.push({
        rid: 'p' + i,
        mrn: 'MRN-' + String(400000 + i * 37).slice(-6),
        accountId: 'WS-' + String(880000 + i * 41).slice(-6),
        name: n.full,
        dob,
        sex: h.pick(['Female', 'Male']),
        phone: '(555) ' + h.between(200, 989) + '-' + String(h.between(1000, 9999)),
        address: h.between(12, 980) + ' ' + h.street() + ', ' + h.pick(['Aldwyn', 'Northgate', 'Riverside']) + ', OH',
        insurance: h.pick(PAYERS),
        status: 'Active',
      });
    }

    // 8. A duplicate medical record — the classic, and the expensive one.
    const dupe = patients[7];
    dupe.duplicate = { mrn: 'MRN-' + String(400000 + 9999).slice(-6), accountId: 'WS-' + String(889999).slice(-6) };
    note('duplicate-mrn', dupe.name, 'Two Epic medical record numbers share a name and date of birth. Chart is split across both.');

    // 9. Date of birth transposed in billing.
    const dobDrift = h.shuffle(patients).slice(0, 4);
    dobDrift.forEach((p) => {
      p.billingDob = p.dob + h.between(1, 3) * 365 * DAY;
      note('dob-mismatch', p.name, 'Registration and billing disagree on date of birth — a wrong-patient and claim-denial risk.');
    });

    // 10. Stale contact details in billing.
    h.shuffle(patients).slice(0, 6).forEach((p) => { p.billingPhone = '(555) ' + h.between(200, 989) + '-' + String(h.between(1000, 9999)); });

    /* -------------------------------------------------------- encounters */
    const encounters = [];
    let eSeq = 0;
    patients.forEach((p) => {
      const visits = h.between(1, 8);
      const panelUnit = h.pick(UNITS);
      for (let i = 0; i < visits; i++) {
        eSeq++;
        const u = h.chance(0.55) ? panelUnit : h.pick(UNITS);
        const roster = unitStaff[u.code];
        const admit = asOf - h.between(2, 700) * DAY - h.between(0, 20) * 3600000;
        const inpatient = u.type === 'Inpatient' || (u.type === 'Emergency' && h.chance(0.25));
        const losHours = inpatient ? h.between(20, 260) : h.between(1, 7);
        const discharge = admit + losHours * 3600000;
        if (discharge > asOf) continue;
        const attending = h.pick(roster.providers);
        const nurses = h.shuffle(roster.nurses).slice(0, h.between(1, 3));
        const tech = h.chance(0.5) ? h.pick(roster.techs) : null;
        encounters.push({
          csn: 'ENC-' + String(100000 + eSeq * 7).slice(-6),
          claimId: 'CLM-' + String(500000 + eSeq * 11).slice(-6),
          patientRid: p.rid,
          unit: u.code,
          fac: u.fac,
          type: inpatient ? 'Inpatient' : u.type === 'Emergency' ? 'Emergency' : u.type === 'Clinic' ? 'Clinic visit' : u.type === 'Procedural' ? 'Procedure' : 'Outpatient',
          admit,
          discharge,
          losDays: Math.max(1, Math.round((discharge - admit) / DAY)),
          disposition: h.pick(DISPOSITIONS),
          diagnosis: h.pick(DIAGNOSES),
          payer: p.insurance,
          claimStatus: h.pick(['Paid', 'Paid', 'Submitted', 'Denied', 'In review']),
          attendingRid: attending.rid,
          nurseRids: nurses.map((n) => n.rid),
          techRid: tech ? tech.rid : null,
        });
      }
    });

    // 11. Billed days disagree with the clinical stay.
    h.shuffle(encounters.filter((e) => e.type === 'Inpatient')).slice(0, 7).forEach((e) => {
      e.billedDays = e.losDays + h.pick([-1, 1, 2]);
      if (e.billedDays < 1) e.billedDays = e.losDays + 1;
      note('los-mismatch', e.csn, 'Clinical length of stay and billed days differ on the same visit.');
    });

    /* ----------------------------------------------------- emit records */
    const records = { epic: [], workday: [], ukg: [], symplr: [], waystar: [], lenel: [] };
    const staffByRid = Object.fromEntries(staff.map((s) => [s.rid, s]));
    const patientByRid = Object.fromEntries(patients.map((p) => [p.rid, p]));
    const unitByCode = Object.fromEntries(UNITS.map((u) => [u.code, u]));

    FACILITIES.forEach((f) =>
      records.epic.push({ _type: 'facility', facilityCode: f.code, name: f.name, city: f.city, licensedBeds: f.beds, facilityType: f.type, observedAt: obs('epic') })
    );

    UNITS.forEach((u) => {
      records.epic.push({ _type: 'unit', deptCode: u.code, deptName: u.name, facilityCode: u.fac, serviceLine: u.line, staffedBeds: u.beds, unitType: u.type, observedAt: obs('epic') });
      records.ukg.push({ _type: 'unit', costCenter: 'CC-' + u.code, unitCode: u.code, name: u.name, observedAt: obs('ukg') });
      records.workday.push({ _type: 'unit', departmentId: 'DEP-' + u.code, unitCode: u.code, name: u.name, costCenter: 'CC-' + u.code, observedAt: obs('workday') });
    });
    // 12. Scheduling and finance disagree on one cost centre.
    const ccDrift = records.ukg.find((r) => r._type === 'unit' && r.unitCode === 'ONC');
    if (ccDrift) { ccDrift.costCenter = 'CC-ONC2'; note('cost-centre', 'Oncology Infusion', 'Scheduling and finance carry different cost centres for the same unit.'); }

    staff.forEach((s) => {
      const mgr = s.managerRid ? staffByRid[s.managerRid] : null;
      records.workday.push({
        _type: 'staff', workerId: s.workerId, legalName: s.name, workEmail: s.email, jobTitle: s.title,
        department: s.dept, unitCode: s.workdayStillOldUnit ? s.priorUnit : s.unit,
        managerWorkerId: mgr ? mgr.workerId : null, employmentType: s.employmentType,
        employmentStatus: s.status, hireDate: s.hireDate, terminationDate: s.terminationDate,
        unitEffectiveFrom: s.workdayStillOldUnit ? s.hireDate : (s.unitEffectiveFrom || s.hireDate),
        scheduledChange: s.scheduledStatus ? { field: 'employmentStatus', value: s.scheduledStatus.value, effectiveFrom: s.scheduledStatus.from } : null,
        observedAt: obs('workday'),
      });

      if (s.status !== 'Terminated' || s.epicStillActive) {
        records.epic.push({
          _type: 'staff', userId: s.epicUserId, providerName: s.name, loginEmail: s.email,
          npi: s.epicNoNpi ? null : s.npi, epicTitle: s.title, credential: s.epicCredential || s.credential,
          primaryDeptCode: s.unit, employeeNumber: s.workerId, accountStatus: 'Active',
          lastChartAccess: asOf - h.between(0, 12) * DAY, observedAt: obs('epic'),
        });
      }

      if (s.unit) {
        records.ukg.push({
          _type: 'staff', personNumber: s.ukgId, displayName: s.name, employeeNumber: s.workerId,
          homeUnit: s.unit, homeCostCenter: 'CC-' + s.unit, jobCode: s.title, badgeId: s.badgeId,
          employmentStatus: s.status === 'Terminated' ? 'Inactive' : 'Active',
          scheduledHours: h.between(24, 40), observedAt: obs('ukg'),
        });
      }

      if (s.npi || s.credential === 'RN' || s.kind === 'provider' || s.kind === 'nurse' || s.kind === 'manager') {
        records.symplr.push({
          _type: 'staff', providerId: 'CR-' + String(7000 + parseInt(s.rid.slice(1), 10)), name: s.name,
          employeeNumber: s.workerId, npi: s.npi, credential: s.credential, licenseNumber: 'L' + h.between(100000, 999999),
          licenseExpiry: s.licenseExpiry, privilegeStatus: s.privilege,
          primaryFacility: s.unit ? unitByCode[s.unit].fac : 'SARMC', observedAt: obs('symplr'),
        });
      }

      records.lenel.push({
        _type: 'staff', badgeId: s.badgeId, holderName: s.name, employeeNumber: s.workerId,
        accessLevel: s.kind === 'exec' ? 'All areas' : s.unit ? unitByCode[s.unit].fac + ' — clinical' : 'Administration',
        badgeStatus: 'Active', lastSwipe: asOf - h.between(0, 26) * DAY, observedAt: obs('lenel'),
      });
    });

    agency.forEach((a) => {
      records.epic.push({ _type: 'staff', userId: a.epicUserId, providerName: a.name, loginEmail: a.email, npi: null,
        epicTitle: a.title, credential: 'RN', primaryDeptCode: a.unit, employeeNumber: null, accountStatus: 'Active',
        lastChartAccess: asOf - h.between(0, 4) * DAY, observedAt: obs('epic') });
      records.ukg.push({ _type: 'staff', personNumber: a.ukgId, displayName: a.name, employeeNumber: null,
        homeUnit: a.unit, homeCostCenter: 'CC-' + a.unit, jobCode: a.title, badgeId: a.badgeId,
        employmentStatus: 'Active', scheduledHours: 36, observedAt: obs('ukg') });
      records.lenel.push({ _type: 'staff', badgeId: a.badgeId, holderName: a.name, employeeNumber: null,
        accessLevel: unitByCode[a.unit].fac + ' — clinical', badgeStatus: 'Active',
        lastSwipe: asOf - h.between(0, 3) * DAY, observedAt: obs('lenel') });
    });

    // 12b. A rehire with two chart logins, both carrying the same worker
    //      number, so both resolve to one person and the duplicate surfaces.
    const rehire = clinicalStaff.find((s) => s.kind === 'provider' && s.status === 'Active' && !s.epicNoNpi);
    if (rehire) {
      records.epic.push({ _type: 'staff', userId: rehire.epicUserId + 'X', providerName: rehire.name,
        loginEmail: rehire.email.replace('@', '.prior@'), npi: rehire.npi, epicTitle: rehire.title,
        credential: rehire.credential, primaryDeptCode: rehire.unit, employeeNumber: rehire.workerId,
        accountStatus: 'Active', lastChartAccess: asOf - h.between(300, 700) * DAY, observedAt: obs('epic') });
      note('duplicate-account', rehire.name, 'Two active Epic logins share this worker number after a rehire.');
    }

    // 13. An orphaned shared login nobody owns.
    records.epic.push({ _type: 'staff', userId: 'EPU00099', providerName: 'ED Training Account', loginEmail: 'ed.training@stalwyn.example',
      npi: null, epicTitle: null, credential: null, primaryDeptCode: 'ED', employeeNumber: null,
      accountStatus: 'Active', lastChartAccess: asOf - 3 * DAY, observedAt: obs('epic') });
    note('orphan-account', 'ED Training Account', 'Shared Epic login with chart access and no owner.');

    patients.forEach((p) => {
      records.epic.push({ _type: 'patient', mrn: p.mrn, legalName: p.name, dob: p.dob, sex: p.sex,
        phone: p.phone, addressLine: p.address, patientStatus: p.status, observedAt: obs('epic') });
      records.waystar.push({ _type: 'patient', accountId: p.accountId, mrnRef: p.mrn, patientName: p.name,
        dateOfBirth: p.billingDob || p.dob, phone: p.billingPhone || p.phone, addressLine: p.address,
        insurancePlan: p.insurance, observedAt: obs('waystar') });
      if (p.duplicate) {
        records.epic.push({ _type: 'patient', mrn: p.duplicate.mrn, legalName: p.name, dob: p.dob, sex: p.sex,
          phone: p.phone, addressLine: p.address, patientStatus: 'Active', observedAt: obs('epic') });
      }
    });

    encounters.forEach((e) => {
      const p = patientByRid[e.patientRid];
      records.epic.push({ _type: 'encounter', csn: e.csn, patientMrn: p.mrn, deptCode: e.unit, facilityCode: e.fac,
        encounterType: e.type, admitAt: e.admit, dischargeAt: e.discharge, disposition: e.disposition,
        primaryDiagnosis: e.diagnosis, lengthOfDays: e.losDays, observedAt: obs('epic') });
      records.waystar.push({ _type: 'encounter', claimId: e.claimId, csnRef: e.csn, billedDays: e.billedDays || e.losDays,
        payer: e.payer, claimStatus: e.claimStatus, totalCharges: e.losDays * h.between(1800, 6400), observedAt: obs('waystar') });
    });

    /* ---------------------------------------------------------- the edges */
    const edges = [];
    const staffRef = (s) => ({ type: 'staff', sys: 'workday', id: s.workerId });
    const unitRef = (code) => ({ type: 'unit', sys: 'epic', id: code });
    const facRef = (code) => ({ type: 'facility', sys: 'epic', id: code });

    staff.forEach((s) => {
      if (s.managerRid) {
        edges.push({ type: 'reports_to', from: staffRef(s), to: staffRef(staffByRid[s.managerRid]),
          fromTs: s.hireDate, toTs: s.terminationDate, systemId: 'workday' });
      }
      if (s.unit) {
        // Prior wards are kept as closed intervals — this is what makes
        // "who used to work here" answerable at all.
        if (s.priorUnit) {
          edges.push({ type: 'assigned_to', from: staffRef(s), to: unitRef(s.priorUnit),
            fromTs: s.hireDate, toTs: s.unitEffectiveFrom, role: s.title, systemId: 'ukg' });
          edges.push({ type: 'assigned_to', from: staffRef(s), to: unitRef(s.unit),
            fromTs: s.unitEffectiveFrom, toTs: s.terminationDate, role: s.title, systemId: 'ukg' });
        } else {
          const rotated = h.chance(0.3);
          if (rotated) {
            const prior = h.pick(UNITS.filter((u) => u.code !== s.unit));
            const switchedAt = s.hireDate + Math.floor((asOf - s.hireDate) * (0.3 + rand() * 0.4));
            edges.push({ type: 'assigned_to', from: staffRef(s), to: unitRef(prior.code),
              fromTs: s.hireDate, toTs: switchedAt, role: s.title, systemId: 'ukg' });
            edges.push({ type: 'assigned_to', from: staffRef(s), to: unitRef(s.unit),
              fromTs: switchedAt, toTs: s.terminationDate, role: s.title, systemId: 'ukg' });
          } else {
            edges.push({ type: 'assigned_to', from: staffRef(s), to: unitRef(s.unit),
              fromTs: s.hireDate, toTs: s.terminationDate, role: s.title, systemId: 'ukg' });
          }
        }
        edges.push({ type: 'privileged_at', from: staffRef(s), to: facRef(unitByCode[s.unit].fac),
          fromTs: s.hireDate, toTs: s.privilege === 'Expired' ? s.licenseExpiry : s.terminationDate, systemId: 'symplr' });
      }
    });

    UNITS.forEach((u) => edges.push({ type: 'part_of', from: unitRef(u.code), to: facRef(u.fac), fromTs: null, toTs: null, systemId: 'epic' }));

    encounters.forEach((e) => {
      const encRef = { type: 'encounter', sys: 'epic', id: e.csn };
      edges.push({ type: 'encounter_of', from: encRef, to: { type: 'patient', sys: 'epic', id: patientByRid[e.patientRid].mrn }, systemId: 'epic' });
      edges.push({ type: 'occurred_at', from: encRef, to: unitRef(e.unit), systemId: 'epic' });
      edges.push({ type: 'care_team', from: encRef, to: staffRef(staffByRid[e.attendingRid]), role: 'Attending', systemId: 'epic' });
      e.nurseRids.forEach((rid) => edges.push({ type: 'care_team', from: encRef, to: staffRef(staffByRid[rid]), role: 'Nurse', systemId: 'epic' }));
      if (e.techRid) edges.push({ type: 'care_team', from: encRef, to: staffRef(staffByRid[e.techRid]), role: 'Technician', systemId: 'epic' });
    });

    // Primary care panels, including who the provider used to be.
    patients.forEach((p, i) => {
      const u = UNITS[i % UNITS.length];
      const providers = unitStaff[u.code].providers;
      const current = providers[i % providers.length];
      const pRef = { type: 'patient', sys: 'epic', id: p.mrn };
      if (h.chance(0.35) && providers.length > 1) {
        const previous = providers[(i + 1) % providers.length];
        const changed = asOf - h.between(60, 500) * DAY;
        edges.push({ type: 'panel_of', from: pRef, to: staffRef(previous), fromTs: changed - 700 * DAY, toTs: changed, systemId: 'epic' });
        edges.push({ type: 'panel_of', from: pRef, to: staffRef(current), fromTs: changed, toTs: null, systemId: 'epic' });
      } else {
        edges.push({ type: 'panel_of', from: pRef, to: staffRef(current), fromTs: asOf - h.between(200, 1400) * DAY, toTs: null, systemId: 'epic' });
      }
    });

    const recordCounts = {
      epic: records.epic.length + encounters.length * 12,
      workday: records.workday.length * 3,
      ukg: records.ukg.length * 26,
      symplr: records.symplr.length * 4,
      waystar: records.waystar.length * 3,
      lenel: records.lenel.length * 180,
    };

    return { records, edges, syncState, recordCounts, notes, asOf };
  }

  /* ------------------------------------------------------------ adapters */

  const N = () => SOT.schema.norm;

  const ADAPTERS = {
    epic: {
      collection: 'epic', effectiveDating: false,
      identity: (r) => {
        if (r._type === 'staff') return { nativeId: r.userId, name: r.providerName, detail: r.epicTitle || 'No title',
          active: r.accountStatus === 'Active', keys: { email: r.loginEmail, employeeId: r.employeeNumber, npi: r.npi, name: N().name(r.providerName) } };
        if (r._type === 'patient') return { nativeId: r.mrn, name: r.legalName, detail: 'MRN ' + r.mrn, active: true,
          keys: { mrn: r.mrn, nameDob: N().name(r.legalName) + '|' + r.dob } };
        if (r._type === 'unit') return { nativeId: r.deptCode, name: r.deptName, detail: r.serviceLine, active: true, keys: { code: r.deptCode } };
        if (r._type === 'facility') return { nativeId: r.facilityCode, name: r.name, detail: r.city, active: true, keys: { code: r.facilityCode } };
        if (r._type === 'encounter') return { nativeId: r.csn, name: r.encounterType + ' — ' + r.deptCode, detail: r.csn, active: true, keys: { code: r.csn } };
        return null;
      },
      assertions: (r) => {
        const t = r.observedAt;
        const a = (list) => list.map((x) => Object.assign({ observedAt: t, effectiveFrom: t }, x));
        if (r._type === 'staff') return a([
          { field: 'fullName', value: r.providerName }, { field: 'workEmail', value: r.loginEmail },
          { field: 'employeeId', value: r.employeeNumber }, { field: 'npi', value: r.npi },
          { field: 'jobTitle', value: r.epicTitle }, { field: 'credential', value: r.credential },
          { field: 'homeUnit', value: r.primaryDeptCode },
          { field: 'employmentStatus', value: r.accountStatus === 'Active' ? 'Active' : 'Terminated' },
          { field: 'accessStatus', value: r.accountStatus },
        ]);
        if (r._type === 'patient') return a([
          { field: 'fullName', value: r.legalName }, { field: 'mrn', value: r.mrn }, { field: 'dob', value: r.dob },
          { field: 'sex', value: r.sex }, { field: 'phone', value: r.phone }, { field: 'address', value: r.addressLine },
          { field: 'patientStatus', value: r.patientStatus },
        ]);
        if (r._type === 'unit') return a([
          { field: 'unitName', value: r.deptName }, { field: 'unitCode', value: r.deptCode },
          { field: 'facilityCode', value: r.facilityCode }, { field: 'serviceLine', value: r.serviceLine },
          { field: 'unitType', value: r.unitType }, { field: 'beds', value: r.staffedBeds },
        ]);
        if (r._type === 'facility') return a([
          { field: 'facilityName', value: r.name }, { field: 'facilityCode', value: r.facilityCode },
          { field: 'city', value: r.city }, { field: 'facilityType', value: r.facilityType },
          { field: 'licensedBeds', value: r.licensedBeds },
        ]);
        if (r._type === 'encounter') return a([
          { field: 'encounterLabel', value: r.encounterType + ' · ' + new Date(r.admitAt).toISOString().slice(0, 10) },
          { field: 'encounterType', value: r.encounterType }, { field: 'admitAt', value: r.admitAt },
          { field: 'dischargeAt', value: r.dischargeAt }, { field: 'disposition', value: r.disposition },
          { field: 'primaryDiagnosis', value: r.primaryDiagnosis }, { field: 'lengthOfDays', value: r.lengthOfDays },
        ]);
        return [];
      },
    },

    workday: {
      collection: 'workday', effectiveDating: true,
      identity: (r) => {
        if (r._type === 'staff') return { nativeId: r.workerId, name: r.legalName, detail: r.jobTitle,
          active: r.employmentStatus === 'Active',
          keys: { employeeId: r.workerId, email: r.workEmail, name: N().name(r.legalName) } };
        if (r._type === 'unit') return { nativeId: r.departmentId, name: r.name, detail: r.costCenter, active: true, keys: { code: r.unitCode } };
        return null;
      },
      assertions: (r) => {
        const t = r.observedAt;
        if (r._type === 'staff') {
          const out = [
            { field: 'fullName', value: r.legalName, effectiveFrom: r.hireDate },
            { field: 'workEmail', value: r.workEmail, effectiveFrom: r.hireDate },
            { field: 'employeeId', value: r.workerId, effectiveFrom: r.hireDate },
            { field: 'jobTitle', value: r.jobTitle, effectiveFrom: r.hireDate },
            { field: 'department', value: r.department, effectiveFrom: r.hireDate },
            { field: 'homeUnit', value: r.unitCode, effectiveFrom: r.unitEffectiveFrom },
            { field: 'employmentType', value: r.employmentType, effectiveFrom: r.hireDate },
            { field: 'employmentStatus', value: r.employmentStatus, effectiveFrom: r.terminationDate || r.hireDate },
            { field: 'hireDate', value: r.hireDate, effectiveFrom: r.hireDate },
          ];
          if (r.scheduledChange)
            out.push({ field: r.scheduledChange.field, value: r.scheduledChange.value, effectiveFrom: r.scheduledChange.effectiveFrom, scheduled: true });
          return out.map((x) => Object.assign({ observedAt: t }, x));
        }

    /* --------------------------------------------------------- edges */
    const edges = [];
    const memberRef = (m) => ({ type: 'member', sys: 'personnel', id: m.dodId });
    const unitRef = (uic) => ({ type: 'unit', sys: 'personnel', id: uic });
    const instRef = (code) => ({ type: 'installation', sys: 'personnel', id: code });

    members.forEach((m) => {
      if (m.priorUnit) {
        edges.push({ type: 'assigned_to', from: memberRef(m), to: unitRef(m.priorUnit), fromTs: m.joined, toTs: m.unitEffectiveFrom, role: m.role, systemId: 'personnel' });
        edges.push({ type: 'assigned_to', from: memberRef(m), to: unitRef(m.unit), fromTs: m.unitEffectiveFrom, toTs: null, role: m.role, systemId: 'personnel' });
      } else {
        edges.push({ type: 'assigned_to', from: memberRef(m), to: unitRef(m.unit), fromTs: m.joined, toTs: null, role: m.role, systemId: 'personnel' });
      }
      if (m.role === 'Commander') edges.push({ type: 'commands', from: memberRef(m), to: unitRef(m.unit), fromTs: m.joined, toTs: null, systemId: 'personnel' });
    });
    units.forEach((u) => {
      if (u.parent) edges.push({ type: 'subordinate_to', from: unitRef(u.uic), to: unitRef(u.parent), systemId: 'personnel' });
      edges.push({ type: 'stationed_at', from: unitRef(u.uic), to: instRef(u.inst), systemId: 'personnel' });
    });
    const memberByRid = Object.fromEntries(members.map((m) => [m.rid, m]));
    events.forEach((e) => {
      const ref = { type: 'event', sys: 'training', id: e.id };
      edges.push({ type: 'completed_by', from: ref, to: memberRef(memberByRid[e.memberRid]), role: 'Participant', systemId: 'training' });
      edges.push({ type: 'conducted_at', from: ref, to: unitRef(e.unit), systemId: 'training' });
    });

    const recordCounts = {
      personnel: records.personnel.length * 4,
      training: records.training.length * 2,
      medical: records.medical.length * 9,
      security: records.security.length * 3,
      access: records.access.length * 240,
    };

    return { records, edges, syncState, recordCounts, notes, asOf };
  }

  const N = () => SOT.schema.norm;

  const ADAPTERS = {
    personnel: {
      collection: 'personnel', effectiveDating: true,
      identity: (r) => {
        if (r._type === 'member') return { nativeId: r.dodId, name: r.name, detail: r.rank + ' · ' + r.mos, active: true,
          keys: { serviceNumber: r.dodId, name: N().name(r.name) } };
        if (r._type === 'unit') return { nativeId: r.uic, name: r.name, detail: r.echelon, active: true, keys: { code: r.uic } };
        if (r._type === 'installation') return { nativeId: r.code, name: r.name, detail: r.state, active: true, keys: { code: r.code } };
        return null;
      },
      assertions: (r) => {
        const t = r.observedAt;
        if (r._type === 'member') return [
          { field: 'fullName', value: r.name, effectiveFrom: t }, { field: 'serviceNumber', value: r.dodId, effectiveFrom: t },
          { field: 'rank', value: r.rank, effectiveFrom: t }, { field: 'mos', value: r.mos, effectiveFrom: t },
          { field: 'unitCode', value: r.unitUic, effectiveFrom: r.assignedFrom },
          { field: 'dutyStatus', value: r.dutyStatus, effectiveFrom: t }, { field: 'deployable', value: r.deployable, effectiveFrom: t },
        ].map((x) => Object.assign({ observedAt: t }, x));
        if (r._type === 'unit') return [
          { field: 'unitName', value: r.name }, { field: 'uic', value: r.uic }, { field: 'echelon', value: r.echelon },
          { field: 'installationCode', value: r.installationCode }, { field: 'authorizedStrength', value: r.authorizedStrength },
        ].map((x) => Object.assign({ observedAt: t, effectiveFrom: t }, x));
        if (r._type === 'installation') return [
          { field: 'installationName', value: r.name }, { field: 'installationCode', value: r.code },
          { field: 'state', value: r.state }, { field: 'installationType', value: r.type },
        ].map((x) => Object.assign({ observedAt: t, effectiveFrom: t }, x));
        return [];
      },
    },
    training: {
      collection: 'training', effectiveDating: false,
      identity: (r) => {
        if (r._type === 'member') return { nativeId: r.traineeId, name: r.name, detail: r.mos, active: true,
          keys: { serviceNumber: r.traineeId.slice(1) && 'D' + r.traineeId.slice(1), nameGroup: N().name(r.name) + '|' + r.rosterUic, name: N().name(r.name) } };
        if (r._type === 'unit') return { nativeId: r.rosterUic, name: r.rosterName, detail: 'Training roster', active: true, keys: { code: r.rosterUic } };
        if (r._type === 'event') return { nativeId: r.eventId, name: r.eventName, detail: r.eventType, active: true, keys: { code: r.eventId } };
        return null;
      },
      assertions: (r) => {
        const t = r.observedAt;
        if (r._type === 'member') return [
          { field: 'fullName', value: r.name }, { field: 'rank', value: r.rank },
          { field: 'mos', value: r.mos }, { field: 'unitCode', value: r.rosterUic },
        ].map((x) => Object.assign({ observedAt: t, effectiveFrom: t }, x));
        if (r._type === 'unit') return [
          { field: 'unitName', value: r.rosterName }, { field: 'uic', value: r.rosterUic },
        ].map((x) => Object.assign({ observedAt: t, effectiveFrom: t }, x));
        if (r._type === 'event') return [
          { field: 'eventName', value: r.eventName }, { field: 'eventType', value: r.eventType },
          { field: 'eventDate', value: r.eventDate }, { field: 'result', value: r.result },
          { field: 'expiresOn', value: r.expiresOn },
        ].map((x) => Object.assign({ observedAt: t, effectiveFrom: t }, x));
        return [];
      },
    },
    medical: {
      collection: 'medical', effectiveDating: false,
      identity: (r) => ({ nativeId: r.patientId, name: r.name, detail: r.readinessStatus, active: true,
        keys: { serviceNumber: r.dodId, name: N().name(r.name) } }),
      assertions: (r) => [
        { field: 'fullName', value: r.name }, { field: 'serviceNumber', value: r.dodId },
        { field: 'medicalReadiness', value: r.readinessStatus }, { field: 'deployable', value: r.deployable },
      ].map((x) => Object.assign({ observedAt: r.observedAt, effectiveFrom: r.observedAt }, x)),
    },
    security: {
      collection: 'security', effectiveDating: false,
      identity: (r) => ({ nativeId: r.subjectId, name: r.name, detail: r.clearanceLevel, active: true,
        keys: { serviceNumber: 'D' + r.subjectId.slice(1), name: N().name(r.name) } }),
      assertions: (r) => [
        { field: 'fullName', value: r.name }, { field: 'clearanceLevel', value: r.clearanceLevel },
        { field: 'clearanceExpiry', value: r.expiresOn },
      ].map((x) => Object.assign({ observedAt: r.observedAt, effectiveFrom: r.observedAt }, x)),
    },
    access: {
      collection: 'access', effectiveDating: false,
      identity: (r) => ({ nativeId: r.credentialId, name: r.holder, detail: r.credentialStatus, active: r.credentialStatus === 'Active',
        keys: { serviceNumber: r.dodId, name: N().name(r.holder) } }),
      assertions: (r) => [
        { field: 'fullName', value: r.holder }, { field: 'serviceNumber', value: r.dodId },
        { field: 'unitCode', value: r.unitUic }, { field: 'accessStatus', value: r.credentialStatus },
      ].map((x) => Object.assign({ observedAt: r.observedAt, effectiveFrom: r.observedAt }, x)),
    },
  };

  /* Statistics for this vertical. Same engine, different questions. */
  const DAYS = 86400000;
  SOT.stats.register('defense', {
    member: [
      { id: 'events12', label: 'Readiness events', hint: 'Last 12 months', fmt: 'int',
        calc: (p, ctx) => ctx.graph.neighbours(p.entity.id, 'completed_by', { dir: 'in' })
          .filter((n) => ctx.profiles[n.entity.id].get('eventDate') > ctx.asOf - 365 * DAYS).length },
      { id: 'current', label: 'Qualifications current', hint: 'Not yet expired', fmt: 'int',
        calc: (p, ctx) => ctx.graph.neighbours(p.entity.id, 'completed_by', { dir: 'in' })
          .filter((n) => ctx.profiles[n.entity.id].get('expiresOn') > ctx.asOf && ctx.profiles[n.entity.id].get('result') === 'Go').length },
      { id: 'expired', label: 'Qualifications lapsed', hint: 'Past their currency date', fmt: 'int', invert: true,
        calc: (p, ctx) => ctx.graph.neighbours(p.entity.id, 'completed_by', { dir: 'in' })
          .filter((n) => ctx.profiles[n.entity.id].get('expiresOn') <= ctx.asOf).length },
      { id: 'units', label: 'Units served', hint: 'Including previous assignments', fmt: 'int',
        calc: (p, ctx) => new Set(ctx.graph.neighbours(p.entity.id, 'assigned_to', { dir: 'out' }).map((n) => n.entity.id)).size },
      { id: 'timeInUnit', label: 'Time in unit', hint: 'Current assignment', fmt: 'years',
        calc: (p, ctx) => {
          const n = ctx.graph.neighbour(p.entity.id, 'assigned_to', { dir: 'out', at: ctx.asOf });
          return n && n.edge.fromTs ? Number(((ctx.asOf - n.edge.fromTs) / (365 * DAYS)).toFixed(1)) : null;
        } },
    ],
    unit: [
      { id: 'assigned', label: 'Assigned strength', hint: 'Currently assigned', fmt: 'int',
        calc: (p, ctx) => ctx.graph.neighbours(p.entity.id, 'assigned_to', { dir: 'in', when: 'current', at: ctx.asOf }).length },
      { id: 'authorized', label: 'Authorised strength', hint: 'On the books', fmt: 'int', calc: (p) => p.get('authorizedStrength') },
      { id: 'fill', label: 'Fill', hint: 'Assigned against authorised', fmt: 'pct',
        calc: (p, ctx) => {
          const a = ctx.graph.neighbours(p.entity.id, 'assigned_to', { dir: 'in', when: 'current', at: ctx.asOf }).length;
          const auth = p.get('authorizedStrength');
          return auth ? Math.round((a / auth) * 100) : null;
        } },
      { id: 'deployable', label: 'Deployable', hint: 'Of those assigned', fmt: 'pct',
        calc: (p, ctx) => {
          const ppl = ctx.graph.neighbours(p.entity.id, 'assigned_to', { dir: 'in', when: 'current', at: ctx.asOf })
            .map((n) => ctx.profiles[n.entity.id]);
          if (!ppl.length) return null;
          return Math.round((ppl.filter((m) => m.get('deployable') === 'Yes').length / ppl.length) * 100);
        } },
      { id: 'everAssigned', label: 'Ever assigned', hint: 'Including past personnel', fmt: 'int',
        calc: (p, ctx) => new Set(ctx.graph.neighbours(p.entity.id, 'assigned_to', { dir: 'in' }).map((n) => n.entity.id)).size },
      { id: 'events90', label: 'Readiness events', hint: 'Last 90 days', fmt: 'int',
        calc: (p, ctx) => ctx.graph.neighbours(p.entity.id, 'conducted_at', { dir: 'in' })
          .filter((n) => ctx.profiles[n.entity.id].get('eventDate') > ctx.asOf - 90 * DAYS).length },
    ],
    installation: [
      { id: 'units', label: 'Units stationed', hint: 'Directly stationed here', fmt: 'int',
        calc: (p, ctx) => ctx.graph.neighbours(p.entity.id, 'stationed_at', { dir: 'in' }).length },
      { id: 'people', label: 'Personnel', hint: 'Across stationed units', fmt: 'int',
        calc: (p, ctx) => {
          let n = 0;
          ctx.graph.neighbours(p.entity.id, 'stationed_at', { dir: 'in' }).forEach((u) => {
            n += ctx.graph.neighbours(u.entity.id, 'assigned_to', { dir: 'in', when: 'current', at: ctx.asOf }).length;
          });
          return n;
        } },
    ],
    event: [
      { id: 'participants', label: 'Personnel', hint: 'On this record', fmt: 'int',
        calc: (p, ctx) => ctx.graph.neighbours(p.entity.id, 'completed_by', { dir: 'out' }).length },
      { id: 'daysAgo', label: 'Days ago', hint: 'Since the event', fmt: 'int',
        calc: (p, ctx) => (p.get('eventDate') ? Math.round((ctx.asOf - p.get('eventDate')) / DAYS) : null) },
    ],
  });

  SOT.packs = SOT.packs || {};
  SOT.packs.defense = {
    id: 'defense',
    label: 'Defence command',
    tenantName: 'Joint Task Force Meridian',
    tagline: 'One battalion, five systems, one answer about who is ready.',
    systems: SYSTEMS,
    entityTypes: ENTITY_TYPES,
    edgeTypes: EDGE_TYPES,
    fields: FIELDS,
    policy: POLICY,
    rationale: RATIONALE,
    roles: ROLES,
    hierarchy: HIERARCHY,
    adapters: ADAPTERS,
    build,
    searchTypes: ['member', 'unit', 'installation', 'event'],
    codeRefs: { unitCode: ['unit', 'uic'], installationCode: ['installation', 'installationCode'] },
  };
})(window.SOT || (window.SOT = {}));
</script>
<script>
/* --- core/store.js --- */
/* SOT — application store.
 *
 * Owns the small amount of state a user can change (vertical pack, role,
 * policy, task status, confirmed identity links) and re-runs the whole
 * pipeline whenever any of it moves:
 *
 *   source records → identities → assertions → policy → resolved entities
 *                                                     → graph → statistics
 *
 * The pipeline is a few milliseconds over this dataset, so the application
 * recomputes rather than maintaining caches. At real scale the same functions
 * run server-side and incrementally; the shape does not change, which is the
 * point of keeping the engine free of storage and interface concerns.
 */
(function (SOT) {
  'use strict';

  const KEY = 'kaliris.sot.v2';
  const DAY = 86400000;

  function load() {
    try { return JSON.parse(window.localStorage.getItem(KEY) || 'null'); } catch (e) { return null; }
  }
  function save(state) {
    try {
      window.localStorage.setItem(KEY, JSON.stringify({
        packId: state.packId, roleId: state.roleId, policies: state.policies,
        taskStatus: state.taskStatus, forcedLinks: state.forcedLinks, dismissedKeys: state.dismissedKeys,
      }));
    } catch (e) { /* storage disabled — the app just forgets between reloads */ }
  }

  /** Values are stored raw; this is the engine-side rendering used in task text. */
  function formatValue(field, value) {
    if (value === null || value === undefined || value === '') return '—';
    if (/At$|Date$|Expiry$|dob/i.test(field) && typeof value === 'number' && value > 1e11)
      return new Date(value).toLocaleDateString('en-GB', { day: 'numeric', month: 'short', year: 'numeric' });
    return String(value);
  }

  function create() {
    const packs = SOT.packs;
    const saved = load() || {};

    const state = {
      packId: saved.packId && packs[saved.packId] ? saved.packId : 'health',
      roleId: saved.roleId || null,
      policies: saved.policies || {},
      taskStatus: saved.taskStatus || {},
      forcedLinks: saved.forcedLinks || [],
      dismissedKeys: saved.dismissedKeys || [],
      signedIn: false,
    };

    const prepared = {};
    function preparePack(id) {
      if (prepared[id]) return prepared[id];
      const base = packs[id];
      const built = base.build();
      const pack = Object.assign({}, base, built);
      pack.systemById = Object.fromEntries(pack.systems.map((s) => [s.id, s]));
      pack.typeById = Object.fromEntries(pack.entityTypes.map((t) => [t.id, t]));
      pack.edgeTypeById = Object.fromEntries(pack.edgeTypes.map((e) => [e.id, e]));
      pack.fieldByKey = {};
      pack.fields.forEach((f) => { pack.fieldByKey[f.entity + '.' + f.key] = f; });
      prepared[id] = pack;
      return pack;
    }

    const listeners = [];
    let view = null;

    function policyFor(pack) {
      const override = state.policies[pack.id] || {};
      const merged = {};
      Object.keys(pack.policy).forEach((k) => { merged[k] = (override[k] || pack.policy[k]).slice(); });
      return merged;
    }

    function recompute() {
      const pack = preparePack(state.packId);
      const policy = policyFor(pack);

      const identity = SOT.identity.resolveIdentities(pack, {
        forcedLinks: state.forcedLinks.filter((f) => f.pack === pack.id),
        dismissedKeys: state.dismissedKeys.filter((k) => k.indexOf(pack.id + '::') === 0).map((k) => k.split('::')[1]),
      });

      const resolution = SOT.resolve.resolveAll(pack, identity, policy, pack.asOf);
      const graph = SOT.graph.build(identity.entities, pack.edges, identity.entityIdOf);

      const ctx = { graph, profiles: resolution.profiles, asOf: pack.asOf, pack };
      const statsByEntity = {};
      Object.keys(resolution.profiles).forEach((id) => {
        statsByEntity[id] = SOT.stats.compute(pack.id, resolution.profiles[id], ctx);
      });

      const tasks = SOT.tasks.generate(pack, resolution, identity, formatValue).map((t) =>
        Object.assign({}, t, { status: state.taskStatus[pack.id + '::' + t.id] || 'open' })
      );

      const role = pack.roles.find((r) => r.id === state.roleId) || pack.roles[0];
      const persona = pickPersona(pack, resolution, graph, role);
      const scope = computeScope(pack, resolution, graph, role, persona);

      const codeIndex = {};
      Object.keys(pack.codeRefs || {}).forEach((fieldKey) => {
        const [typeId, codeField] = pack.codeRefs[fieldKey];
        Object.values(resolution.profiles).forEach((p) => {
          if (p.type !== typeId) return;
          const code = p.get(codeField);
          if (code != null) codeIndex[typeId + '|' + code] = p.entity.id;
        });
      });

      view = {
        pack, policy, identity, graph, tasks, role, persona, scope, codeIndex,
        profiles: resolution.profiles,
        conflicts: resolution.conflicts,
        stats: statsByEntity,
        asOf: pack.asOf,
        summary: summarize(pack, resolution, identity, graph, scope),
        searchIndex: buildSearchIndex(pack, resolution, graph),
      };
      return view;
    }

    /* ------------------------------------------------------------ persona */

    function pickPersona(pack, resolution, graph, role) {
      const all = Object.values(resolution.profiles).filter((p) => p.type === 'staff');
      const byTitle = (re) => all.find((p) => re.test(p.get('jobTitle') || ''));
      if (role.id === 'physician') {
        const candidates = all.filter((p) => /Hospitalist|Attending Physician/.test(p.get('jobTitle') || ''));
        return candidates.sort((a, b) =>
          graph.neighbours(b.entity.id, 'care_team', { dir: 'in' }).length -
          graph.neighbours(a.entity.id, 'care_team', { dir: 'in' }).length)[0] || null;
      }
      if (role.id === 'nurse_manager') {
        const mgrs = all.filter((p) => /Nurse Manager/.test(p.get('jobTitle') || ''));
        return mgrs.find((p) => p.get('homeUnit') === '4W') || mgrs[0] || null;
      }
      if (role.id === 'exec') return byTitle(/Chief Operating Officer/) || null;
      if (role.id === 'workforce') return byTitle(/Workforce Systems/) || null;
      if (role.id === 'compliance') return byTitle(/Identity Governance/) || null;
      return null;
    }

    /* -------------------------------------------------------------- scope
     *
     * Which entities this role may open at all. Kept as explicit id sets so
     * the interface can never accidentally leak a patient into a count, a
     * search result or a related-items list.
     */
    function computeScope(pack, resolution, graph, role, persona) {
      const allowed = {};
      const all = (type) => Object.values(resolution.profiles).filter((p) => p.type === type).map((p) => p.entity.id);

      pack.entityTypes.forEach((t) => {
        const rule = (role.scopes && role.scopes[t.id]) || 'all';
        if (rule === 'all') { allowed[t.id] = null; return; }   // null = everything
        if (rule === 'none') { allowed[t.id] = new Set(); return; }
        allowed[t.id] = new Set();
      });

      if (!persona) return { allowed, rule: role.scopes || {} };

      const unitId = (() => {
        const n = graph.neighbour(persona.entity.id, 'assigned_to', { dir: 'out', at: pack.asOf });
        return n ? n.entity.id : null;
      })();

      const scopedEncounters = new Set();
      const scopedPatients = new Set();
      const scopedStaff = new Set();

      if ((role.scopes.encounter === 'unit' || role.scopes.patient === 'unit' || role.scopes.staff === 'unit') && unitId) {
        graph.neighbours(unitId, 'occurred_at', { dir: 'in' }).forEach((n) => scopedEncounters.add(n.entity.id));
        graph.neighbours(unitId, 'assigned_to', { dir: 'in' }).forEach((n) => scopedStaff.add(n.entity.id));
        scopedStaff.add(persona.entity.id);
      }
      if (role.scopes.encounter === 'care' || role.scopes.patient === 'care') {
        graph.neighbours(persona.entity.id, 'care_team', { dir: 'in' }).forEach((n) => scopedEncounters.add(n.entity.id));
        graph.neighbours(persona.entity.id, 'panel_of', { dir: 'in' }).forEach((n) => scopedPatients.add(n.entity.id));
      }
      scopedEncounters.forEach((eid) => {
        const p = graph.neighbour(eid, 'encounter_of', { dir: 'out' });
        if (p) scopedPatients.add(p.entity.id);
      });

      if (role.scopes.staff === 'unit') allowed.staff = scopedStaff;
      if (role.scopes.encounter === 'unit' || role.scopes.encounter === 'care') allowed.encounter = scopedEncounters;
      if (role.scopes.patient === 'unit' || role.scopes.patient === 'care') allowed.patient = scopedPatients;

      return { allowed, rule: role.scopes || {}, unitId };
    }

    function canOpen(id) {
      const p = view.profiles[id];
      if (!p) return false;
      const set = view.scope.allowed[p.type];
      return set === null || set === undefined ? true : set.has(id);
    }

    function visible(type) {
      const set = view.scope.allowed[type];
      const all = Object.values(view.profiles).filter((p) => p.type === type);
      if (set === null || set === undefined) return all;
      return all.filter((p) => set.has(p.entity.id));
    }

    /* ------------------------------------------------------------ summary */

    function summarize(pack, resolution, identity, graph, scope) {
      const visibleIds = (type) => {
        const set = scope.allowed[type];
        return Object.values(resolution.profiles)
          .filter((p) => p.type === type && (set === null || set === undefined || set.has(p.entity.id)))
          .map((p) => p.entity.id);
      };
      const counts = {};
      pack.entityTypes.forEach((t) => { counts[t.id] = visibleIds(t.id).length; });

      const inScope = new Set([].concat.apply([], pack.entityTypes.map((t) => visibleIds(t.id))));
      const conflicts = resolution.conflicts.filter((c) => inScope.has(c.entityId));
      const bySeverity = { critical: 0, high: 0, medium: 0, low: 0 };
      const byKind = { divergence: 0, lag: 0, gap: 0 };
      conflicts.forEach((c) => { bySeverity[c.severity]++; byKind[c.kind]++; });

      const profiles = Object.values(resolution.profiles).filter((p) => inScope.has(p.entity.id));
      const alignment = profiles.length ? Math.round(profiles.reduce((s, p) => s + p.alignment, 0) / profiles.length) : 100;

      return {
        counts, conflicts: conflicts.length,
        actionable: conflicts.filter((c) => c.actionable).length,
        bySeverity, byKind, alignment,
        identity: identity.stats,
        inScope,
      };
    }

    /* ------------------------------------------------------------- search */

    function buildSearchIndex(pack, resolution, graph) {
      return Object.values(resolution.profiles).map((p) => {
        const type = pack.typeById[p.type];
        const subtitle = (type.subtitle || []).map((k) => p.get(k)).filter(Boolean).join(' · ');
        const terms = [p.name, subtitle]
          .concat((type.keyFacts || []).map((k) => p.get(k)))
          .filter((v) => v != null && typeof v !== 'object')
          .join(' ')
          .toLowerCase();
        return {
          id: p.entity.id, type: p.type, typeLabel: type.label, glyph: type.glyph,
          title: p.name, subtitle, terms, href: '#/e/' + p.entity.id,
        };
      });
    }

    /* ------------------------------------------------------------ actions */

    function emit() { recompute(); save(state); listeners.forEach((fn) => fn(view)); }

    const api = {
      get state() { return state; },
      get view() { return view || recompute(); },
      packs: Object.keys(packs).map((k) => ({ id: k, label: packs[k].label, tenantName: packs[k].tenantName, tagline: packs[k].tagline })),

      subscribe(fn) { listeners.push(fn); return () => listeners.splice(listeners.indexOf(fn), 1); },

      signIn(roleId) { state.roleId = roleId; state.signedIn = true; emit(); },
      signOut() { state.signedIn = false; emit(); },
      setRole(roleId) { state.roleId = roleId; emit(); },
      setPack(packId) {
        if (!packs[packId]) return;
        state.packId = packId;
        const pack = preparePack(packId);
        state.roleId = pack.roles[0].id;
        emit();
      },

      setSystemOfRecord(field, systemId) {
        const pack = view.pack;
        const cur = (state.policies[pack.id] && state.policies[pack.id][field]) || pack.policy[field] || [];
        const next = [systemId].concat(cur.filter((s) => s !== systemId));
        state.policies[pack.id] = Object.assign({}, state.policies[pack.id], { [field]: next });
        emit();
      },
      resetPolicy() { delete state.policies[view.pack.id]; emit(); },
      policyChanged() {
        const o = state.policies[view.pack.id] || {};
        return Object.keys(o).filter((k) => o[k].join(',') !== (view.pack.policy[k] || []).join(','));
      },

      setTaskStatus(id, status) { state.taskStatus[view.pack.id + '::' + id] = status; emit(); },
      bulkTaskStatus(ids, status) { ids.forEach((id) => { state.taskStatus[view.pack.id + '::' + id] = status; }); emit(); },

      confirmLink(entityId, system, nativeId) {
        const e = view.identity.entityById[entityId];
        if (!e) return;
        const anchor = e.links.find((l) => l.method === 'anchor') || e.links[0];
        state.forcedLinks.push({ pack: view.pack.id, a: anchor.system + ':' + anchor.nativeId, b: system + ':' + nativeId });
        emit();
      },
      dismissRecord(system, nativeId) { state.dismissedKeys.push(view.pack.id + '::' + system + ':' + nativeId); emit(); },

      resetAll() {
        state.policies = {}; state.taskStatus = {}; state.forcedLinks = []; state.dismissedKeys = [];
        emit();
      },

      canOpen, visible, formatValue,
      /** A coded value that points at another entity, resolved to that entity. */
      resolveCode(fieldKey, value) {

        if (!ref || value == null) return null;
        const id = view.codeIndex[ref[0] + '|' + value];

      canSee: (sensitivity) => SOT.schema.canSee(api.view.role, sensitivity),
      statsFor: (id) => view.stats[id] || [],

    return api;

<script>
/* --- ui/components.js --- */
/* SOT — presentation primitives.
 *
 * Plain functions returning HTML strings. No framework: the dataset is small
 * enough that re-rendering the whole view on any change is imperceptible, and
 * it keeps the prototype dependency-free. In a production build these become
 * components with the same signatures.
 */
(function (SOT) {
  'use strict';

  const esc = (s) =>
    String(s === null || s === undefined ? '' : s)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
  const at = esc;

  /* --------------------------------------------------------------- format */

  const DATEY = /(^|[a-z])(At|Date|Expiry|ExpiresOn|expiresOn|dob|CurrentTo)$|^dob$|^admitAt$|^eventDate$/;

  function date(ts) {
    if (!ts && ts !== 0) return '—';
    return new Date(ts).toLocaleDateString('en-GB', { day: 'numeric', month: 'short', year: 'numeric' });
  }
  function dateTime(ts) {
    if (!ts) return '—';
    return new Date(ts).toLocaleString('en-GB', { day: 'numeric', month: 'short', year: 'numeric', hour: '2-digit', minute: '2-digit' });
  }
  function ago(ts, now) {
    if (!ts) return 'never';
    const d = (now || Date.now()) - ts;
    if (d < 0) return 'in ' + ago(now - (ts - now), now);
    const m = Math.round(d / 60000);
    if (m < 1) return 'just now';
    if (m < 60) return m + ' min ago';
    const hh = Math.round(m / 60);
    if (hh < 24) return hh + (hh === 1 ? ' hour ago' : ' hours ago');
    const dd = Math.round(hh / 24);
    if (dd < 45) return dd + (dd === 1 ? ' day ago' : ' days ago');
    return date(ts);
  }

  /** Field values are stored raw; prose happens here and nowhere else. */
  function value(key, v) {
    if (v === null || v === undefined || v === '') return '—';
    if (typeof v === 'number' && Math.abs(v) > 1e10 && DATEY.test(key)) return date(v);
    if (key === 'lengthOfDays') return v + (v === 1 ? ' day' : ' days');
    if (key === 'beds' || key === 'licensedBeds' || key === 'authorizedStrength') return String(v);
    return String(v);
  }

  function statValue(s) {
    if (s.value === null || s.value === undefined) return '—';
    switch (s.fmt) {
      case 'pct': return s.value + '%';
      case 'days': return s.value + (s.value === 1 ? ' day' : ' days');
      case 'daysAgo': return s.value + 'd';
      case 'years': return s.value + ' yr';
      case 'ratio': return s.value + '×';
      case 'date': return date(s.value);
      default: return typeof s.value === 'number' ? s.value.toLocaleString('en-US') : String(s.value);
    }
  }

  /* -------------------------------------------------------------- visuals */

  function initials(name) {
    return String(name || '?').split(/\s+/).filter(Boolean).slice(0, 2).map((w) => w[0]).join('').toUpperCase();
  }

  /** People get initials, everything else gets its type glyph. */
  function avatar(profile, pack, cls) {
    const t = pack.typeById[profile.type];
    const person = t.kind === 'person';
    return '<span class="av ' + (person ? '' : 'sq ') + (cls || '') + '" aria-hidden="true">' +
      (person ? esc(initials(profile.name)) : esc(t.glyph)) + '</span>';
  }

  function tag(text, cls) { return '<span class="tag ' + (cls || '') + '">' + esc(text) + '</span>'; }
  function severityTag(sev) { return '<span class="tag ' + sev + '"><i class="dot"></i>' + esc(sev) + '</span>'; }
  function kindTag(kind) {
    const label = { divergence: 'Divergence', gap: 'Gap', lag: 'Lag', identity: 'Identity' }[kind] || kind;
    const cls = { divergence: 'critical', gap: 'medium', lag: 'low', identity: 'line' }[kind] || '';
    return '<span class="tag ' + cls + '">' + esc(label) + '</span>';
  }
  function systemTag(pack, id) {
    const s = pack.systemById[id];
    if (!s) return '';
    return '<span class="systag"><i class="sysdot"></i>' + esc(s.name) + '</span>';
  }
  function systemLink(pack, id, nativeId) {
    const s = pack.systemById[id];
    if (!s) return '';
    return '<a class="btn sm" href="' + at(s.deepLink.replace('{id}', encodeURIComponent(nativeId))) +
      '" target="_blank" rel="noopener noreferrer">' + esc(s.name) + ' ↗</a>';
  }

  function ring(pct, size) {
    const s = size || 54;
    const r = s / 2 - 4;
    const c = 2 * Math.PI * r;
    const on = (Math.max(0, Math.min(100, pct)) / 100) * c;
    const colour = pct >= 95 ? 'var(--ok)' : pct >= 80 ? 'var(--sev-medium)' : 'var(--sev-critical)';
    return '<div class="ring" style="width:' + s + 'px;height:' + s + 'px">' +
      '<svg width="' + s + '" height="' + s + '" viewBox="0 0 ' + s + ' ' + s + '" style="transform:rotate(-90deg)">' +
      '<circle cx="' + s / 2 + '" cy="' + s / 2 + '" r="' + r + '" fill="none" stroke="var(--surface-3)" stroke-width="4"/>' +
      '<circle cx="' + s / 2 + '" cy="' + s / 2 + '" r="' + r + '" fill="none" stroke="' + colour +
      '" stroke-width="4" stroke-linecap="round" stroke-dasharray="' + on.toFixed(1) + ' ' + c.toFixed(1) + '"/></svg>' +
      '<span class="v" style="color:' + colour + '">' + Math.round(pct) + '</span></div>';
  }

  function stat(k, v, h, cls) {
    return '<div class="card stat ' + (cls || '') + '"><div class="k">' + esc(k) + '</div>' +
      '<div class="v">' + (typeof v === 'string' && v.indexOf('<') === 0 ? v : esc(String(v))) + '</div>' +
      (h ? '<div class="h">' + esc(h) + '</div>' : '') + '</div>';
  }

  function statTile(s) {
    return '<div class="card stat"><div class="k">' + esc(s.label) + '</div>' +
      '<div class="v">' + esc(statValue(s)) + '</div>' +
      '<div class="h">' + esc(s.hint || '') + '</div></div>';
  }

  function entityLine(profile, pack, sub) {
    const t = pack.typeById[profile.type];
    const subtitle = sub !== undefined ? sub : (t.subtitle || []).map((k) => profile.get(k)).filter(Boolean).join(' · ');
    return '<span class="eline">' + avatar(profile, pack, 'sm') +
      '<span style="min-width:0"><span class="n">' + esc(profile.name) + '</span>' +
      (subtitle ? '<br><span class="s">' + esc(subtitle) + '</span>' : '') + '</span></span>';
  }

  function entityCard(profile, pack, extra) {
    const t = pack.typeById[profile.type];
    const sub = (t.subtitle || []).map((k) => profile.get(k)).filter(Boolean).join(' · ');
    const open = profile.conflicts.filter((c) => c.actionable).length;
    return '<button class="ecard" data-go="#/e/' + at(profile.entity.id) + '">' +
      '<span class="top">' + avatar(profile, pack) +
      '<span style="min-width:0"><span class="nm">' + esc(profile.name) + '</span><br>' +
      '<span class="ti">' + esc(sub || t.label) + '</span></span></span>' +
      '<span class="meta">' + (extra || '') +
      '<span style="margin-left:auto">' +
      (open ? '<span class="tag critical">' + open + ' open</span>' : '<span class="tag ok">' + profile.alignment + '%</span>') +
      '</span></span></button>';
  }

  function tabs(items, current, action) {
    return '<div class="tabs">' + items.map((t) =>
      '<button class="' + (t.id === current ? 'on' : '') + '" data-act="' + at(action) + '" data-tab="' + at(t.id) + '">' +
      esc(t.label) + (t.count !== undefined && t.count !== null ? '<span class="c">' + t.count + '</span>' : '') +
      '</button>').join('') + '</div>';
  }

  function empty(text) { return '<div class="empty">' + esc(text) + '</div>'; }

  const MARK =
    '<svg class="mark" viewBox="0 0 32 32" fill="none" aria-hidden="true">' +
    '<g stroke="currentColor" stroke-width="2.2" stroke-linecap="round">' +
    '<path d="M3 6.5C12 6.5 12.5 16 20 16" opacity=".34"/>' +
    '<path d="M3 16H20" opacity=".62"/>' +
    '<path d="M3 25.5C12 25.5 12.5 16 20 16" opacity=".34"/></g>' +
    '<circle cx="23.4" cy="16" r="4.6" fill="currentColor"/></svg>';

  function wordmark(cls) {
    return '<span class="wordmark">' + MARK.replace('class="mark"', 'class="mark ' + (cls || '') + '"') +
      '<span><span class="wm-name">SOT</span><span class="wm-sub">Source of Truth</span></span></span>';
  }

  SOT.ui = {
    esc, at, date, dateTime, ago, value, statValue, initials, avatar, tag, severityTag, kindTag,
    systemTag, systemLink, ring, stat, statTile, entityLine, entityCard, tabs, empty, wordmark, MARK,
  };
})(window.SOT || (window.SOT = {}));
</script>
<script>
/* --- ui/views.js --- */
/* SOT — dashboard, type browser, and the universal entity page.
 *
 * There is one entity page, not five. A clinician, a patient, a ward, a
 * facility and a visit all render through the same function, because in the
 * model they are the same kind of thing: something with resolved fields,
 * provenance, statistics and typed relationships. That is what lets a user
 * click from a doctor to a ward to a visit to a patient to the nurse who was
 * on that visit without ever leaving the same interface.
 */
(function (SOT) {
  'use strict';

  const U = () => SOT.ui;
  const S = SOT.schema;

  /** A field value, rendered as a link when it points at another entity. */
  function fieldHtml(ctx, key, value) {
    const u = U();
    const target = ctx.store.resolveCode(key, value);
    if (!target) return u.esc(u.value(key, value));
    return '<a class="link" data-go="#/e/' + u.at(target.entity.id) + '" href="#/e/' + u.at(target.entity.id) + '">' +
      u.esc(target.name) + '</a>';
  }

  /* ============================================================= DASHBOARD */

  function dashboard(ctx) {
    const u = U();
    const { view, store } = ctx;
    const pack = view.pack;
    const sum = view.summary;
    const degraded = pack.systems.filter((s) => pack.syncState[s.id].status !== 'healthy');

    const typeCards = pack.entityTypes.map((t) => {
      const n = sum.counts[t.id];
      const denied = view.scope.allowed[t.id] instanceof Set && view.scope.allowed[t.id].size === 0;
      return '<button class="ecard" data-go="#/t/' + u.at(t.id) + '"' + (denied ? ' disabled style="opacity:.45"' : '') + '>' +
        '<span class="top"><span class="av sq">' + u.esc(t.glyph) + '</span>' +
        '<span><span class="nm num">' + (denied ? '—' : n.toLocaleString('en-US')) + '</span><br>' +
        '<span class="ti">' + u.esc(t.plural) + '</span></span></span>' +
        '<span class="meta">' + (denied ? 'Not visible to ' + u.esc(view.role.name) : 'Browse all ' + u.esc(t.plural.toLowerCase())) + '</span></button>';
    }).join('');

    // Most recent event-kind entities in scope — the pulse of the organisation.
    const eventType = pack.entityTypes.find((t) => t.kind === 'event');
    let recent = [];
    if (eventType) {
      recent = store.visible(eventType.id)
        .filter((p) => p.get(eventType.dateField))
        .sort((a, b) => b.get(eventType.dateField) - a.get(eventType.dateField))
        .slice(0, 7);
    }

    const worst = view.conflicts.filter((c) => sum.inScope.has(c.entityId) && c.actionable).slice(0, 6);

    return (
      '<div class="head"><div><h1>' + u.esc(pack.tenantName) + '</h1>' +
      '<div class="sub">' + u.esc(view.role.blurb) + ' Every figure below is resolved from ' + pack.systems.length +
      ' connected systems under the current system-of-record policy — nothing here is stored as a merged record.</div></div>' +
      '<div class="acts"><span class="tag line">As of ' + u.esc(u.date(view.asOf)) + '</span>' +
      '<a class="btn" href="#/integrity">Data integrity</a></div></div>' +

      (degraded.length
        ? '<div class="note medium" style="margin-bottom:12px"><span>▲</span><div><b>' + u.esc(degraded[0].name) +
          ' has not been read in ' + u.esc(u.ago(pack.syncState[degraded[0].id].lastSync, view.asOf).replace(' ago', '')) + '.</b> ' +
          u.esc(pack.syncState[degraded[0].id].message || '') +
          ' Its disagreements are being reported as lag rather than conflict. <a class="link" href="#/systems">Connector status</a></div></div>'
        : '') +

      '<div class="grid g-cards" style="margin-bottom:12px">' + typeCards + '</div>' +

      '<div class="grid g-stat" style="margin-bottom:12px">' +
      u.stat('Open findings', sum.actionable, sum.bySeverity.critical + ' critical · ' + sum.bySeverity.high + ' high', sum.bySeverity.critical ? 'hot' : '') +
      u.stat('Classified as lag', sum.byKind.lag, 'Behind, not wrong — excluded from the queue') +
      u.stat('System alignment', sum.alignment + '%', 'Weighted across every reconciled field') +
      u.stat('Identity queue', sum.identity.needsReview, 'Records awaiting a human decision') +
      u.stat('Relationships', view.graph.edges.length.toLocaleString('en-US'), 'Typed and time-bounded') +
      '</div>' +

      '<div class="split"><div class="grid" style="gap:12px">' +
      '<div class="card"><div class="card-h"><h3>Needs attention</h3>' +
      '<div class="right"><a class="btn sm" href="#/tasks">Remediation queue</a></div></div>' +
      '<div class="card-b flush">' +
      (worst.length
        ? '<table class="tbl"><tbody>' + worst.map((c) =>
            '<tr class="go" data-drawer="conflict:' + u.at(c.id) + '"><td>' +
            '<div style="font-weight:560">' + u.esc(c.fieldLabel) + ' — ' + u.esc(c.entityName) + '</div>' +
            '<div class="dim" style="font-size:11px;margin-top:2px">' +
            u.esc(pack.systemById[c.resolvedSystem].name) + ' says “' + u.esc(store.formatValue(c.field, c.resolvedValue)) + '”, ' +
            u.esc(c.offenders.map((o) => pack.systemById[o.systemId].name + (o.kind === 'gap' ? ' has nothing' : ' says “' + store.formatValue(c.field, o.value) + '”')).join('; ')) +
            '</div></td><td style="text-align:right;white-space:nowrap">' + u.severityTag(c.severity) + '</td></tr>').join('') + '</tbody></table>'
        : u.empty('Nothing outstanding in your scope.')) +
      '</div></div>' +

      (recent.length
        ? '<div class="card"><div class="card-h"><h3>Recent ' + u.esc(eventType.plural.toLowerCase()) + '</h3>' +
          '<div class="right"><a class="btn sm" href="#/t/' + u.at(eventType.id) + '">All</a></div></div>' +
          '<div class="card-b flush"><table class="tbl"><tbody>' +
          recent.map((e) => {
            const unit = view.graph.neighbours(e.entity.id, pack.id === 'health' ? 'occurred_at' : 'conducted_at', { dir: 'out' })[0];
            return '<tr class="go" data-go="#/e/' + u.at(e.entity.id) + '">' +
              '<td>' + u.entityLine(e, pack) + '</td>' +
              '<td class="dim">' + (unit ? u.esc(view.profiles[unit.entity.id].name) : '') + '</td>' +
              '<td style="text-align:right;white-space:nowrap" class="dim">' + u.esc(u.ago(e.get(eventType.dateField), view.asOf)) + '</td></tr>';
          }).join('') + '</tbody></table></div></div>'
        : '') +
      '</div>' +

      '<div class="grid" style="gap:12px">' +
      '<div class="card"><div class="card-h"><h3>Findings by kind</h3></div><div class="card-b">' +
      ['divergence', 'gap', 'lag'].map((k) => {
        const n = sum.byKind[k];
        const total = sum.conflicts || 1;
        return '<div style="margin-bottom:11px"><div style="display:flex;gap:8px;align-items:center;margin-bottom:4px">' +
          u.kindTag(k) + '<span class="num dim" style="margin-left:auto;font-size:12px">' + n + '</span></div>' +
          '<div class="bar"><i style="width:' + Math.round((n / total) * 100) + '%"></i></div>' +
          '<div class="dim" style="font-size:11px;margin-top:4px">' + u.esc(S.CONFLICT_KINDS[k].blurb) + '</div></div>';
      }).join('') +
      '</div></div>' +

      '<div class="card"><div class="card-h"><h3>Connected systems</h3><div class="right"><a class="btn sm" href="#/systems">Details</a></div></div>' +
      '<div class="card-b flush"><table class="tbl"><tbody>' +
      pack.systems.map((s) => {
        const st = pack.syncState[s.id];
        return '<tr><td>' + u.systemTag(pack, s.id) + '</td>' +
          '<td class="dim" style="text-align:right;font-size:11px">' + u.esc(u.ago(st.lastSync, view.asOf)) + '</td>' +
          '<td style="width:1%">' + (st.status === 'healthy' ? u.tag('OK', 'ok') : u.tag('Stale', 'medium')) + '</td></tr>';
      }).join('') + '</tbody></table></div></div>' +
      '</div></div>'
    );
  }

  /* ========================================================== TYPE BROWSER */

  function browse(ctx) {
    const u = U();
    const { view, store, state, route } = ctx;
    const pack = view.pack;
    const type = pack.typeById[route.parts[1]];
    if (!type) return u.empty('Unknown type.');

    let rows = store.visible(type.id);
    const denied = view.scope.allowed[type.id] instanceof Set && view.scope.allowed[type.id].size === 0;
    if (denied) {
      return '<div class="head"><h1>' + u.esc(type.plural) + '</h1></div>' +
        '<div class="note critical"><span>✕</span><div><b>Not visible at your permission level.</b> ' +
        'The ' + u.esc(view.role.name) + ' role has no access to ' + u.esc(type.plural.toLowerCase()) +
        '. This is enforced on the data, not hidden in the interface — the records are not in scope at all.</div></div>';
    }

    const q = (state.browseQ || '').trim().toLowerCase();
    if (q) rows = rows.filter((p) => (p.name + ' ' + (type.keyFacts || []).map((k) => p.get(k)).join(' ')).toLowerCase().includes(q));
    if (state.browseIssues) rows = rows.filter((p) => p.conflicts.some((c) => c.actionable));

    const statDefs = SOT.stats.forType(pack.id, type.id).slice(0, 3);
    const dateField = type.dateField;
    rows = rows.sort((a, b) => (dateField ? (b.get(dateField) || 0) - (a.get(dateField) || 0) : a.name.localeCompare(b.name)));

    const cols = (type.keyFacts || []).slice(0, 3);

    return (
      '<div class="head"><div><h1>' + u.esc(type.plural) + '</h1>' +
      '<div class="sub">' + rows.length.toLocaleString('en-US') + ' in scope. Every row opens a full record — ' +
      'resolved fields, statistics, relationships and the systems each value came from.</div></div>' +
      '<div class="acts">' +
      '<input class="in" id="browse-q" placeholder="Filter…" value="' + u.at(state.browseQ || '') + '" style="width:170px">' +
      '<button class="chip ' + (state.browseIssues ? 'on' : '') + '" data-act="browse-issues">Only with findings</button>' +
      '</div></div>' +

      '<div class="card"><div class="card-b flush"><div class="xs">' +
      (rows.length
        ? '<table class="tbl"><thead><tr><th>' + u.esc(type.label) + '</th>' +
          cols.map((c) => '<th>' + u.esc((pack.fieldByKey[type.id + '.' + c] || { label: c }).label) + '</th>').join('') +
          statDefs.map((s) => '<th class="num">' + u.esc(s.label) + '</th>').join('') +
          '<th class="num">Alignment</th></tr></thead><tbody>' +
          rows.slice(0, 250).map((p) => {
            const stats = store.statsFor(p.entity.id);
            const open = p.conflicts.filter((c) => c.actionable).length;
            return '<tr class="go" data-go="#/e/' + u.at(p.entity.id) + '">' +
              '<td>' + u.entityLine(p, pack) + '</td>' +
              cols.map((c) => {
                const f = pack.fieldByKey[type.id + '.' + c];
                if (f && !store.canSee(f.sensitivity)) return '<td class="dim">restricted</td>';
                return '<td>' + fieldHtml(ctx, c, p.get(c)) + '</td>';
              }).join('') +
              statDefs.map((sd) => {
                const s = stats.find((x) => x.id === sd.id);
                if (s && !store.canSee(s.sensitivity)) return '<td class="num dim">—</td>';
                return '<td class="num">' + u.esc(s ? u.statValue(s) : '—') + '</td>';
              }).join('') +
              '<td class="num">' + (open ? '<span class="tag critical">' + open + '</span>' : '<span class="dim">' + p.alignment + '%</span>') + '</td>' +
              '</tr>';
          }).join('') + '</tbody></table>'
        : u.empty('Nothing matches.')) +
      '</div></div></div>' +
      (rows.length > 250 ? '<div class="dim" style="margin-top:8px;font-size:11.5px">Showing the first 250 of ' + rows.length.toLocaleString('en-US') + '.</div>' : '')
    );
  }

  /* ======================================================== ENTITY PROFILE */

  function entity(ctx) {
    const u = U();
    const { view, store, state, route } = ctx;
    const pack = view.pack;
    const id = route.parts[1];
    const p = view.profiles[id];
    if (!p) return u.empty('Not in the resolved graph.');

    const type = pack.typeById[p.type];

    if (!store.canOpen(id)) {
      return '<div class="head"><h1>' + u.esc(type.label) + '</h1></div>' +
        '<div class="note critical"><span>✕</span><div><b>Outside your permission scope.</b> ' +
        'The ' + u.esc(view.role.name) + ' role can see ' + u.esc(describeScope(view.role, p.type)) +
        '. Switch role in the top bar to open this record.</div></div>';
    }

    const tab = route.query.tab || 'overview';
    const conns = connectionGroups(ctx, p);
    const connCount = conns.reduce((n, g) => n + g.rows.length, 0);
    const timeline = timelineOf(ctx, p);
    const open = p.conflicts.filter((c) => c.actionable).length;

    const facts = (type.keyFacts || []).map((k) => {
      const f = pack.fieldByKey[p.type + '.' + k];
      const label = f ? f.label : k;
      const val = f && !store.canSee(f.sensitivity) ? '<span class="dim">restricted</span>' : fieldHtml(ctx, k, p.get(k));
      return '<div><div class="dim" style="font-size:10.5px">' + u.esc(label) + '</div>' +
        '<div style="font-weight:550;margin-top:1px">' + val + '</div></div>';
    }).join('');

    const statusTags = statusFor(ctx, p).join(' ');

    const header =
      '<div class="card" style="margin-bottom:14px"><div class="card-b" style="display:flex;gap:16px;align-items:flex-start;flex-wrap:wrap">' +
      u.avatar(p, pack, 'lg') +
      '<div style="flex:1;min-width:220px">' +
      '<div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap">' +
      '<h1 style="font-size:20px">' + u.esc(p.name) + '</h1>' + u.tag(type.label, 'line') + statusTags + '</div>' +
      '<div class="muted" style="margin-top:3px;font-size:12.5px">' +
      u.esc((type.subtitle || []).map((k) => p.get(k)).filter(Boolean).join(' · ') || '—') + '</div>' +
      '<div style="display:flex;gap:16px;flex-wrap:wrap;margin-top:12px;font-size:12.5px">' + facts + '</div>' +
      '</div>' +
      '<div style="text-align:center">' + u.ring(p.alignment) +
      '<div class="dim" style="font-size:10px;margin-top:4px">alignment</div></div>' +
      '</div>' +
      '<div style="border-top:1px solid var(--border);padding:9px 14px;display:flex;gap:6px;flex-wrap:wrap;align-items:center">' +
      '<span class="dim" style="font-size:10.5px;letter-spacing:.09em;text-transform:uppercase;margin-right:2px">Open in</span>' +
      pack.systems.map((s) => {
        const link = (p.entity.bySystem[s.id] || [])[0];
        return link ? u.systemLink(pack, s.id, link.nativeId)
          : '<span class="btn sm" style="opacity:.35;cursor:default">' + u.esc(s.name) + '</span>';
      }).join('') +
      (open ? '<a class="btn sm solid" style="margin-left:auto" href="#/e/' + u.at(id) + '?tab=integrity">' + open + ' open</a>' : '') +
      '</div></div>';

    const body =
      tab === 'connections' ? connectionsTab(ctx, p, conns) :
      tab === 'timeline' ? timelineTab(ctx, p, timeline) :
      tab === 'systems' ? systemsTab(ctx, p) :
      tab === 'integrity' ? integrityTab(ctx, p) :
      overviewTab(ctx, p, conns);

    return header + u.tabs([
      { id: 'overview', label: 'Overview' },
      { id: 'connections', label: 'Connections', count: connCount },
      { id: 'timeline', label: 'Timeline', count: timeline.length },
      { id: 'systems', label: 'Systems', count: p.linkedSystems.length },
      { id: 'integrity', label: 'Integrity', count: p.conflicts.length },
    ], tab, 'ent-tab') + body;
  }

  function describeScope(role, typeId) {
    const rule = (role.scopes || {})[typeId];
    if (rule === 'none') return 'no records of this kind at all';
    if (rule === 'unit') return 'only records attached to their own unit';
    if (rule === 'care') return 'only records for people in their care';
    return 'everything';
  }

  function statusFor(ctx, p) {
    const u = U();
    const out = [];
    const status = p.get('employmentStatus') || p.get('patientStatus') || p.get('dutyStatus');
    if (status && /Terminated|Inactive|Deceased/i.test(status)) out.push(u.tag(status, 'critical'));
    const expiry = p.get('licenseExpiry') || p.get('clearanceExpiry');
    if (expiry && expiry < ctx.view.asOf) out.push(u.tag('Expired ' + (p.get('licenseExpiry') ? 'licence' : 'clearance'), 'critical'));
    if (p.get('privilegeStatus') === 'Expired') out.push(u.tag('Privileges lapsed', 'critical'));
    if (p.get('medicalReadiness') === 'Overdue') out.push(u.tag('Readiness overdue', 'high'));
    p.entity.flags.forEach((f) => out.push(u.tag(f.label, f.severity === 'critical' ? 'critical' : 'high')));
    if (p.scheduled.length) out.push(u.tag(p.scheduled.length + ' scheduled change' + (p.scheduled.length === 1 ? '' : 's'), 'low'));
    return out;
  }

  /* ------------------------------------------------------- connections ---
   *
   * Grouped by edge type and direction, split into current and previous. The
   * "previous" half is the point of the whole model: it is how the product
   * answers who used to hold a territory, a ward or a caseload.
   */
  function connectionGroups(ctx, p) {
    const { view, store } = ctx;
    const pack = view.pack;
    const groups = [];
    pack.edgeTypes.forEach((et) => {
      [['out', et.label, et.to], ['in', et.inverse, et.from]].forEach(([dir, label, otherType]) => {
        if ((dir === 'out' && et.from !== p.type) || (dir === 'in' && et.to !== p.type)) return;
        const rows = view.graph.neighbours(p.entity.id, et.id, { dir })
          .filter((n) => store.canOpen(n.entity.id))
          .map((n) => ({
            profile: view.profiles[n.entity.id],
            edge: n.edge,
            current: !et.temporal || S.activeAt(n.edge.fromTs, n.edge.toTs, view.asOf),
          }))
          .sort((a, b) => (b.edge.fromTs || 0) - (a.edge.fromTs || 0));
        if (!rows.length) return;
        groups.push({ edgeType: et, dir, label, otherType, rows });
      });
    });
    return groups;
  }

  function connectionsTab(ctx, p, groups) {
    const u = U();
    const { view, state } = ctx;
    const pack = view.pack;
    if (!groups.length) return '<div class="card"><div class="card-b">' + u.empty('Nothing is connected to this record.') + '</div></div>';

    return '<div class="grid g-2">' + groups.map((g) => {
      const showPast = state.showPast[g.edgeType.id + g.dir] !== false;
      const current = g.rows.filter((r) => r.current);
      const past = g.rows.filter((r) => !r.current);
      const rowHtml = (r) =>
        '<tr class="go" data-go="#/e/' + u.at(r.profile.entity.id) + '">' +
        '<td>' + u.entityLine(r.profile, pack) + '</td>' +
        (g.edgeType.roled ? '<td class="dim">' + u.esc(r.edge.role || '') + '</td>' : '') +
        '<td style="text-align:right;white-space:nowrap" class="dim">' +
        (g.edgeType.temporal
          ? (r.current
              ? (r.edge.fromTs ? 'since ' + u.esc(u.date(r.edge.fromTs)) : 'current')
              : u.esc(u.date(r.edge.fromTs)) + ' – ' + u.esc(u.date(r.edge.toTs)))
          : '') + '</td></tr>';

      return '<div class="card"><div class="card-h"><h3>' + u.esc(g.label) + '</h3>' +
        '<span class="sub">' + current.length + (past.length ? ' current · ' + past.length + ' previous' : '') + '</span>' +
        (past.length ? '<div class="right"><button class="chip ' + (showPast ? 'on' : '') + '" data-act="toggle-past" data-key="' +
          u.at(g.edgeType.id + g.dir) + '">Show previous</button></div>' : '') +
        '</div><div class="card-b flush"><div class="xs"><table class="tbl"><tbody>' +
        current.slice(0, 40).map(rowHtml).join('') +
        (past.length && showPast
          ? '<tr><td colspan="4" style="background:var(--surface-2);font-size:10px;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-3);font-weight:650">Previously</td></tr>' +
            past.slice(0, 40).map(rowHtml).join('')
          : '') +
        '</tbody></table></div></div></div>';
    }).join('') + '</div>';
  }

  /* ---------------------------------------------------------- timeline --- */

  function timelineOf(ctx, p) {
    const { view, store } = ctx;
    const pack = view.pack;
    const events = [];

    pack.edgeTypes.forEach((et) => {
      if (!et.temporal) return;
      [['out', et.label], ['in', et.inverse]].forEach(([dir, label]) => {
        if ((dir === 'out' && et.from !== p.type) || (dir === 'in' && et.to !== p.type)) return;
        view.graph.neighbours(p.entity.id, et.id, { dir }).forEach((n) => {
          if (!store.canOpen(n.entity.id)) return;
          const other = view.profiles[n.entity.id];
          if (n.edge.fromTs) events.push({ ts: n.edge.fromTs, text: label + ' — ' + other.name, href: '#/e/' + other.entity.id, kind: 'start' });
          if (n.edge.toTs) events.push({ ts: n.edge.toTs, text: 'Ended: ' + label.toLowerCase() + ' — ' + other.name, href: '#/e/' + other.entity.id, kind: 'end' });
        });
      });
    });

    // Event-kind entities attached to this one, whichever edge type carries them.
    pack.entityTypes.filter((t) => t.kind === 'event').forEach((et) => {
      pack.edgeTypes.forEach((edge) => {
        const dir = edge.from === et.id && edge.to === p.type ? 'in' : edge.to === et.id && edge.from === p.type ? 'out' : null;
        if (!dir) return;
        view.graph.neighbours(p.entity.id, edge.id, { dir }).forEach((n) => {
          const e = view.profiles[n.entity.id];
          if (!e || e.type !== et.id || !store.canOpen(e.entity.id)) return;
