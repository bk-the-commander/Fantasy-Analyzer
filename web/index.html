<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Dynasty Analytics — Fantasy Points, Every Player, Your Scoring</title>
<meta name="description" content="Put your own league scoring in and see how any player in history would have scored for you. All-time leaderboards, era-adjusted ratings, advanced metrics and projections.">
<meta name="author" content="Kaliris Labs">
<meta name="theme-color" content="#0a0810">
<meta name="color-scheme" content="light dark">
<meta property="og:site_name" content="Dynasty Analytics">
<meta property="og:title" content="Dynasty Analytics — Fantasy Points, Your Scoring">
<meta property="og:description" content="Every player in history, scored by your league's own rules.">
<meta property="og:type" content="website">
<meta name="twitter:card" content="summary">
<meta name="twitter:title" content="Dynasty Analytics">
<meta name="twitter:description" content="Every player in history, scored by your league's own rules.">
<link rel="stylesheet" href="styles.css">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='8' fill='%230a0810'/><circle cx='16' cy='16' r='10.5' fill='none' stroke='%23a855f7' stroke-width='2.5'/><path d='M12 10.5h3.6c3.3 0 5.4 2.2 5.4 5.5s-2.1 5.5-5.4 5.5H12z' fill='%23f5f0ff'/></svg>">
<script>
  // Set the theme before first paint so the page never flashes the wrong one.
  (function () {
    try {
      var stored = localStorage.getItem('fa-theme');
      var theme = (stored === 'light' || stored === 'dark') ? stored
        : (window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
      document.documentElement.setAttribute('data-theme', theme);
    } catch (e) {
      document.documentElement.setAttribute('data-theme', 'dark');
    }
  })();
</script>
</head>
<body>

<!-- The shell: a control panel down the left, everything else to its right.
     On a phone the panel becomes a drawer behind the menu button, so the top
     of the screen carries only what you need to find something. -->
<div class="shell">

  <aside class="sidebar" id="sidebar" aria-label="Main navigation">
    <a class="brand" href="#/home" aria-label="Dynasty Analytics home">
      <span class="brand-mark" aria-hidden="true">
        <!-- A D inside a ring: the dynasty mark. -->
        <svg viewBox="0 0 40 40" width="30" height="30">
          <circle cx="20" cy="20" r="17" fill="none" stroke="var(--brand-deep)" stroke-width="5"/>
          <circle cx="20" cy="20" r="17" fill="none" stroke="var(--brand)" stroke-width="2.4"/>
          <path d="M13.5 11h6.2c5.4 0 8.8 3.6 8.8 9s-3.4 9-8.8 9h-6.2z" fill="var(--text-strong)"/>
          <path d="M17.6 15.1h2.1c2.7 0 4.4 1.9 4.4 4.9s-1.7 4.9-4.4 4.9h-2.1z" fill="var(--surface)"/>
        </svg>
      </span>
      <span class="brand-name">DYNASTY <em>ANALYTICS</em></span>
    </a>

    <div class="side-league">
      <span class="side-label">League</span>
      <div class="sport-switch" id="sportSwitch" role="group" aria-label="Choose league"></div>
    </div>

    <nav class="side-nav" id="sideNav" aria-label="Sections"></nav>

    <div class="side-foot">
      <a id="tierBadge" class="tier-badge" href="#/pricing">FREE</a>
      <button id="themeToggle" class="theme-btn" type="button"
              aria-label="Switch colour theme"></button>
    </div>
  </aside>

  <div class="content">
    <header class="topbar">
      <button id="menuToggle" class="menu-btn" type="button"
              aria-label="Open navigation" aria-expanded="false">
        <span></span><span></span><span></span>
      </button>
      <div class="search-wrap">
        <input id="globalSearch" type="search" autocomplete="off" spellcheck="false"
               placeholder="Search any player…" aria-label="Search players">
        <div id="searchResults" class="search-results" hidden></div>
      </div>
      <span class="topbar-context" id="topbarContext"></span>
    </header>

    <main id="app">
      <div class="boot">
        <div class="boot-spinner"></div>
        <p><em>Loading…</em></p>
      </div>
    </main>

    <footer class="site-foot" id="siteFoot"></footer>
  </div>

  <div class="drawer-scrim" id="drawerScrim" hidden></div>
</div>

<script src="app.js"></script>
</body>
</html>
