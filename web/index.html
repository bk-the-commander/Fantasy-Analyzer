<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Dynasty Analytics — Fantasy Points, Every Player, Your Scoring</title>
<meta name="description" content="Put your own league scoring in and see how any player in history would have scored for you. All-time leaderboards, era-adjusted ratings, advanced metrics and projections.">
<meta name="author" content="Kaliris Labs">
<meta name="theme-color" content="#0b0810">
<meta name="color-scheme" content="light dark">
<meta property="og:site_name" content="Dynasty Analytics">
<meta property="og:title" content="Dynasty Analytics — Fantasy Points, Your Scoring">
<meta property="og:description" content="Every player in history, scored by your league's own rules.">
<meta property="og:type" content="website">
<meta name="twitter:card" content="summary">
<meta name="twitter:title" content="Dynasty Analytics">
<meta name="twitter:description" content="Every player in history, scored by your league's own rules.">
<link rel="stylesheet" href="styles.css">
<!-- Favicon: the D-and-ring mark, drawn small enough to read at 16px. -->
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='8' fill='%230b0810'/><circle cx='16' cy='16' r='10.5' fill='none' stroke='%23a855f7' stroke-width='2.5'/><path d='M12 10.5h3.6c3.3 0 5.4 2.2 5.4 5.5s-2.1 5.5-5.4 5.5H12z' fill='%23f5f0ff'/></svg>">
<script>
  // Set the theme before first paint so the page never flashes the wrong one.
  // Daytime on the visitor's own clock gets the light treatment, night gets dark.
  (function () {
    try {
      var pref = localStorage.getItem('fa-theme') || 'auto';
      var hour = new Date().getHours();
      var resolved = pref === 'auto' ? ((hour >= 7 && hour < 19) ? 'light' : 'dark') : pref;
      document.documentElement.setAttribute('data-theme', resolved);
    } catch (e) {
      document.documentElement.setAttribute('data-theme', 'dark');
    }
  })();
</script>
</head>
<body>

<header class="topbar">
  <div class="topbar-inner">
    <a class="brand" href="#/player" aria-label="Dynasty Analytics home">
      <span class="brand-mark" aria-hidden="true">
        <!-- A D inside a ring: the dynasty mark. Both take the active accent,
             so the logo belongs to whichever league is on screen. -->
        <svg viewBox="0 0 40 40" width="34" height="34">
          <circle cx="20" cy="20" r="17" fill="none"
                  stroke="var(--accent-deep)" stroke-width="5"/>
          <circle cx="20" cy="20" r="17" fill="none"
                  stroke="var(--accent)" stroke-width="2.4"/>
          <path d="M13.5 11h6.2c5.4 0 8.8 3.6 8.8 9s-3.4 9-8.8 9h-6.2z"
                fill="var(--text-strong)"/>
          <path d="M17.6 15.1h2.1c2.7 0 4.4 1.9 4.4 4.9s-1.7 4.9-4.4 4.9h-2.1z"
                fill="var(--bg)"/>
        </svg>
      </span>
      <span class="brand-text">
        <span class="brand-name">DYNASTY <em>ANALYTICS</em></span>
        <span class="brand-sub"><em>MLB · scored by your league’s rules</em></span>
      </span>
    </a>

    <div class="topbar-tools">
      <div class="sport-switch" id="sportSwitch" role="group" aria-label="Choose league"></div>
      <div class="search-wrap">
        <input id="globalSearch" type="search" autocomplete="off" spellcheck="false"
               placeholder="Search any player, 1871–present…" aria-label="Search players">
        <div id="searchResults" class="search-results" hidden></div>
      </div>
      <a id="tierBadge" class="tier-badge" href="#/pricing">FREE</a>
      <button id="themeToggle" class="theme-btn" type="button"
              aria-label="Switch colour theme" title="Theme: auto"></button>
    </div>
  </div>

  <nav class="tabs" id="tabs" aria-label="Primary">
    <a href="#/player"   data-view="player">Player Lookup</a>
    <a href="#/career"   data-view="career">Career Leaders</a>
    <a href="#/season"   data-view="season">Season Leaders</a>
    <a href="#/year"     data-view="year">Year Explorer</a>
    <a href="#/live"     data-view="live">This Season</a>
    <a href="#/compare"  data-view="compare">Compare</a>
    <a href="#/settings" data-view="settings" class="tab-feature">My League</a>
    <span class="tab-divider" aria-hidden="true"></span>
    <a href="#/chat"    data-view="chat" class="tab-feature">Ask AI</a>
    <a href="#/trends"  data-view="trends" class="tab-secondary">Trends</a>
    <a href="#/scoring" data-view="scoring" class="tab-secondary">Scoring</a>
    <a href="#/pricing" data-view="pricing" class="tab-secondary">Plans</a>
    <a href="#/about"   data-view="about" class="tab-secondary">About</a>
    <a href="#/health"  data-view="health" class="tab-health">Health</a>
  </nav>
</header>

<main id="app">
  <div class="boot">
    <div class="boot-spinner"></div>
    <p><em>Loading 150 seasons…</em></p>
  </div>
</main>

<footer class="site-foot" id="siteFoot"></footer>

<script src="app.js"></script>
</body>
</html>
