<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fantasy Analyzer — All-Time MLB Fantasy Points</title>
<meta name="description" content="Every MLB player since 1871, scored in our 12-team H2H points league.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="styles.css">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><text y='26' font-size='26'>⚾</text></svg>">
</head>
<body>

<header class="topbar">
  <div class="brand">
    <div class="brand-mark" aria-hidden="true">
      <svg viewBox="0 0 32 32" width="30" height="30">
        <circle cx="16" cy="16" r="14" fill="url(#bg)" stroke="var(--p-400)" stroke-width="1.5"/>
        <path d="M7 7c5 4 5 14 0 18M25 7c-5 4-5 14 0 18" fill="none" stroke="var(--p-300)" stroke-width="1.6" stroke-linecap="round"/>
        <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0" stop-color="#4c1d95"/><stop offset="1" stop-color="#a855f7"/>
        </linearGradient></defs>
      </svg>
    </div>
    <div class="brand-text">
      <span class="brand-name">FANTASY <em>ANALYZER</em></span>
      <span class="brand-sub">All-time MLB · league scoring</span>
    </div>
  </div>

  <nav class="tabs" id="tabs">
    <a href="#/player" data-view="player">Player Lookup</a>
    <a href="#/career" data-view="career">Career Leaders</a>
    <a href="#/season" data-view="season">Season Leaders</a>
    <a href="#/year"   data-view="year">Year Explorer</a>
    <a href="#/compare" data-view="compare">Compare</a>
    <a href="#/scoring" data-view="scoring">Scoring</a>
  </nav>

  <div class="search-wrap">
    <input id="globalSearch" type="search" autocomplete="off" spellcheck="false"
           placeholder="Search any player, 1871–present…" aria-label="Search players">
    <div id="searchResults" class="search-results" hidden></div>
  </div>
</header>

<main id="app">
  <div class="boot">
    <div class="boot-spinner"></div>
    <p>Loading 150 seasons of baseball…</p>
  </div>
</main>

<footer class="site-foot">
  <span id="footMeta"></span>
  <span class="foot-sep">·</span>
  <span>Data: Lahman / Chadwick Bureau Baseball Databank</span>
  <span class="foot-sep">·</span>
  <span>Scoring: your 12-team H2H points league</span>
</footer>

<script src="app.js"></script>
</body>
</html>
