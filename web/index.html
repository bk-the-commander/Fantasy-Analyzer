<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fantasy Analyzer — All-Time MLB Fantasy Points</title>
<meta name="description" content="Look up any MLB player since 1871 and see their career scored in fantasy points. All-time leaderboards, era-adjusted ratings, season explorer.">
<meta name="theme-color" content="#0b0810">
<meta property="og:title" content="Fantasy Analyzer — All-Time MLB Fantasy Points">
<meta property="og:description" content="Every MLB player since 1871, scored in fantasy points.">
<meta property="og:type" content="website">
<link rel="stylesheet" href="styles.css">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><text y='26' font-size='26'>⚾</text></svg>">
<script>
  // Set the theme before first paint so the page never flashes the wrong one.
  // Daytime on the visitor's own clock gets the light treatment, night gets dark.
  (function () {
    try {
      var pref = localStorage.getItem('fa-theme') || 'auto';
      var hour = new Date().getHours();
      var resolved = pref === 'auto' ? ((hour >= 7 && hour < 19) ? 'light' : 'dark') : pref;
      document.documentElement.setAttribute('data-theme', resolved);
    } catch (e) {
      document.documentElement.setAttribute('data-theme', 'dark');
    }
  })();
</script>
</head>
<body>

<header class="topbar">
  <div class="topbar-inner">
    <a class="brand" href="#/player" aria-label="Fantasy Analyzer home">
      <span class="brand-mark" aria-hidden="true">
        <svg viewBox="0 0 32 32" width="32" height="32">
          <circle cx="16" cy="16" r="14" fill="url(#bgGrad)" stroke="var(--accent)" stroke-width="1.5"/>
          <path d="M7 7c5 4 5 14 0 18M25 7c-5 4-5 14 0 18" fill="none"
                stroke="var(--accent-soft)" stroke-width="1.6" stroke-linecap="round"/>
          <defs><linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="#4c1d95"/><stop offset="1" stop-color="#a855f7"/>
          </linearGradient></defs>
        </svg>
      </span>
      <span class="brand-text">
        <span class="brand-name">FANTASY <em>ANALYZER</em></span>
        <span class="brand-sub"><em>All-time MLB · scored in your league’s points</em></span>
      </span>
    </a>

    <div class="topbar-tools">
      <div class="search-wrap">
        <input id="globalSearch" type="search" autocomplete="off" spellcheck="false"
               placeholder="Search any player, 1871–present…" aria-label="Search players">
        <div id="searchResults" class="search-results" hidden></div>
      </div>
      <button id="themeToggle" class="theme-btn" type="button"
              aria-label="Switch colour theme" title="Theme: auto"></button>
    </div>
  </div>

  <nav class="tabs" id="tabs" aria-label="Primary">
    <a href="#/player"  data-view="player">Player Lookup</a>
    <a href="#/career"  data-view="career">Career Leaders</a>
    <a href="#/season"  data-view="season">Season Leaders</a>
    <a href="#/year"    data-view="year">Year Explorer</a>
    <a href="#/compare" data-view="compare">Compare</a>
    <a href="#/scoring" data-view="scoring">Scoring</a>
    <span class="tab-divider" aria-hidden="true"></span>
    <a href="#/about"   data-view="about" class="tab-secondary">About</a>
    <a href="#/contact" data-view="contact" class="tab-secondary">Contact</a>
  </nav>
</header>

<main id="app">
  <div class="boot">
    <div class="boot-spinner"></div>
    <p><em>Loading 150 seasons of baseball…</em></p>
  </div>
</main>

<footer class="site-foot" id="siteFoot"></footer>

<script src="app.js"></script>
</body>
</html>
