<script>
/* --- core/identity.js --- */
/* Source of Truth — identity resolution.
 *
 * Nothing else in the product works until this does. Every "discrepancy" is a
 * claim that two systems describe the same person differently, so a bad match
 * doesn't produce a small error — it produces a confident lie.
 *
 * The design consequence: matches are scored, only strong matches are applied
 * automatically, and everything in between goes to a human queue instead of
 * being guessed at. A visible queue of forty uncertain matches is a better
 * product than a silent one that invented forty facts.
 */
(function (SOT) {
  'use strict';

  const AUTO_LINK = 0.9;   // apply without asking
  const REVIEW = 0.4;      // propose to a human
  // Below REVIEW: not a match.

  const RULES = {
    'exact-email':  { score: 0.98, label: 'Work email matches exactly' },
    'employee-id':  { score: 0.96, label: 'Employee ID cross-referenced' },
    'name-and-team':{ score: 0.66, label: 'Full name and team match; email does not' },
    'name-only':    { score: 0.45, label: 'Full name matches; nothing else corroborates' },
    'confirmed':    { score: 1.00, label: 'Confirmed by a reviewer' },
  };

  const normEmail = (e) => (e || '').trim().toLowerCase();
  const normName = (n) =>
    (n || '')
      .normalize('NFD')
      .replace(/[̀-ͯ]/g, '')
      .toLowerCase()
      .replace(/[^a-z ]/g, '')
      .replace(/\s+/g, ' ')
      .trim();

  function makeUnionFind() {
    const parent = {};
    function find(x) {
      if (parent[x] === undefined) parent[x] = x;
      while (parent[x] !== x) { parent[x] = parent[parent[x]]; x = parent[x]; }
      return x;
    }
    function union(a, b) {
      const ra = find(a), rb = find(b);
      if (ra !== rb) parent[ra] = rb;
    }
    return { find, union };
  }

  function resolveIdentities(dataset, opts) {
    const adapters = SOT.adapters;
    opts = opts || {};
    const forcedLinks = opts.forcedLinks || [];   // [{a: recordKey, b: recordKey}]
    const dismissedKeys = new Set(opts.dismissedKeys || []);

    // 1. Flatten every source record into a comparable identity entry.
    const entries = [];
    Object.keys(adapters).forEach((sysId) => {
      const adapter = adapters[sysId];
      (dataset.records[adapter.collection] || []).forEach((record) => {
        const ident = adapter.identity(record);
        entries.push({
          key: sysId + ':' + ident.nativeId,
          system: sysId,
          nativeId: ident.nativeId,
          record,
          ident,
          email: normEmail(ident.email),
          name: normName(ident.name),
          employeeRef: ident.employeeRef || null,
          team: ident.team || null,
        });
      });
    });

    const byKey = Object.fromEntries(entries.map((e) => [e.key, e]));

    // 2. Score every candidate pair that shares any key at all. Bucketing on
    //    email / employee ref / name keeps this linear-ish rather than O(n²);
    //    a production implementation would use the same blocking strategy.
    const buckets = { email: {}, employeeRef: {}, name: {} };
    entries.forEach((e) => {
      if (e.email) (buckets.email[e.email] || (buckets.email[e.email] = [])).push(e);
      if (e.employeeRef) (buckets.employeeRef[e.employeeRef] || (buckets.employeeRef[e.employeeRef] = [])).push(e);
      if (e.name) (buckets.name[e.name] || (buckets.name[e.name] = [])).push(e);
    });

    const edges = new Map(); // "keyA|keyB" -> best edge
    function addEdge(a, b, rule) {
      if (a.key === b.key || a.system === b.system) {
        // Two records in the same system are a duplicate question, not an
        // identity question — but we still want them clustered so the
        // duplicate surfaces on the person rather than vanishing.
        if (a.key === b.key) return;
      }
      const id = a.key < b.key ? a.key + '|' + b.key : b.key + '|' + a.key;
      const existing = edges.get(id);
      const score = RULES[rule].score;
      if (!existing || existing.score < score) edges.set(id, { a: a.key, b: b.key, rule, score });
    }

    Object.values(buckets.email).forEach((group) => {
      for (let i = 0; i < group.length; i++)
        for (let j = i + 1; j < group.length; j++) addEdge(group[i], group[j], 'exact-email');
    });
    Object.values(buckets.employeeRef).forEach((group) => {
      for (let i = 0; i < group.length; i++)
        for (let j = i + 1; j < group.length; j++) addEdge(group[i], group[j], 'employee-id');
    });
    Object.values(buckets.name).forEach((group) => {
      for (let i = 0; i < group.length; i++)
        for (let j = i + 1; j < group.length; j++) {
          const a = group[i], b = group[j];
          if (a.email && b.email && a.email === b.email) continue; // already strong
          const rule = a.team && b.team && a.team === b.team ? 'name-and-team' : 'name-only';
          addEdge(a, b, rule);
        }
    });

    // 3. Apply only the confident edges.
    const uf = makeUnionFind();
    entries.forEach((e) => uf.find(e.key));
    const strong = [];
    const weak = [];
    const forcedSet = new Set(forcedLinks.map((f) => (f.a < f.b ? f.a + '|' + f.b : f.b + '|' + f.a)));
    edges.forEach((edge, id) => {
      if (forcedSet.has(id)) return; // handled below with full confidence
      if (edge.score >= AUTO_LINK) { uf.union(edge.a, edge.b); strong.push(edge); }
      else if (edge.score >= REVIEW) weak.push(edge);
    });
    // A human said these are the same person. That outranks every heuristic.
    forcedLinks.forEach((f) => {
      if (!byKey[f.a] || !byKey[f.b]) return;
      uf.union(f.a, f.b);
      strong.push({ a: f.a, b: f.b, rule: 'confirmed', score: 1 });
    });

    // 4. Turn clusters into people.
    const clusters = {};
    entries.forEach((e) => {
      const root = uf.find(e.key);
      (clusters[root] || (clusters[root] = [])).push(e);
    });

    const people = [];
    const unresolved = [];
    const dismissed = [];
    const personByRecordKey = {};

    Object.values(clusters).forEach((members) => {
      const workdayEntry = members.find((m) => m.system === 'workday');
      const activeSfdc = members.find((m) => m.system === 'salesforce' && m.ident.active);

      if (!workdayEntry && !activeSfdc) {
        // No worker record and no active CRM seat. This is an account, not a
        // person, until someone says otherwise.
        members.forEach((m) => {
          if (dismissedKeys.has(m.key)) { dismissed.push(m); return; }
          unresolved.push({
            key: m.key,
            system: m.system,
            nativeId: m.nativeId,
            name: m.ident.name,
            email: m.ident.email,
            reason: 'No HR record and no active CRM user could be matched to this seat.',
            recommendation: 'Confirm whether this is a real person, a shared seat, or a licence to reclaim.',
            suggestions: [],
          });
        });
        return;
      }

      const anchor = workdayEntry || activeSfdc;
      const id = workdayEntry ? 'P-' + workdayEntry.nativeId : 'P-SF-' + activeSfdc.nativeId;

      const links = members.map((m) => {
        const edge = strong.find(
          (e) => (e.a === m.key || e.b === m.key) && (e.a === anchor.key || e.b === anchor.key)
        );
        return {
          system: m.system,
          nativeId: m.nativeId,
          confidence: m === anchor ? 1 : edge ? edge.score : 0.9,
          method: m === anchor ? 'anchor' : edge ? edge.rule : 'transitive',
          methodLabel: m === anchor ? 'System of record for identity' : edge ? RULES[edge.rule].label : 'Linked through another matched system',
          record: m.record,
          active: m.ident.active,
        };
      });

      const flags = [];
      const bySystem = {};
      links.forEach((l) => { (bySystem[l.system] || (bySystem[l.system] = [])).push(l); });
      Object.keys(bySystem).forEach((sys) => {
        if (bySystem[sys].length > 1) {
          flags.push({
            kind: 'duplicate-source-record',
            system: sys,
            severity: 'high',
            label: bySystem[sys].length + ' ' + SOT.model.SYSTEM_BY_ID[sys].name + ' records resolve to this person',
          });
        }
      });
      if (!workdayEntry) {
        flags.push({
          kind: 'no-hr-record',
          system: 'workday',
          severity: 'critical',
          label: 'Active system access with no Workday worker record',
        });
      }

      const person = {
        id,
        anchorSystem: anchor.system,
        displayName: anchor.ident.name,
        email: anchor.ident.email,
        links,
        bySystem,
        flags,
        confidence: Math.min.apply(null, links.map((l) => l.confidence)),
        suggestions: [],
      };
      people.push(person);
      members.forEach((m) => { personByRecordKey[m.key] = person.id; });
    });

    const personById = Object.fromEntries(people.map((p) => [p.id, p]));

    // 5. Weak edges become proposals, attached to whichever side is a person.
    weak.forEach((edge) => {
      const pidA = personByRecordKey[edge.a];
      const pidB = personByRecordKey[edge.b];
      if (pidA && pidB && pidA !== pidB) return; // two known people who merely share a name
      const personId = pidA || pidB;
      if (!personId) return;
      const looseKey = pidA ? edge.b : edge.a;
      const loose = byKey[looseKey];
      if (!loose || personByRecordKey[looseKey]) return;
      if (dismissedKeys.has(looseKey)) return;

      const proposal = {
        personId,
        personName: personById[personId].displayName,
        system: loose.system,
        nativeId: loose.nativeId,
        name: loose.ident.name,
        email: loose.ident.email,
        score: edge.score,
        method: edge.rule,
        methodLabel: RULES[edge.rule].label,
      };
      personById[personId].suggestions.push(proposal);
      const entry = unresolved.find((u) => u.key === looseKey);
      if (entry) entry.suggestions.push(proposal);
      else
        unresolved.push({
          key: looseKey,
          system: loose.system,
          nativeId: loose.nativeId,
          name: loose.ident.name,
          email: loose.ident.email,
          reason: 'Matches a known person by name, but the email address does not correspond.',
          recommendation: 'Confirm the link so this system starts contributing to ' + proposal.personName + "'s profile.",
          suggestions: [proposal],
        });
    });

    // 6. Reference index: lets the resolver turn "manager = WD-10234" or
    //    "manager = someone@…" into a person ID, whichever dialect was used.
    const refIndex = { nativeId: {}, employeeRef: {}, email: {} };
    entries.forEach((e) => {
      const pid = personByRecordKey[e.key];
      if (!pid) return;
      refIndex.nativeId[e.system + ':' + e.nativeId] = pid;
      if (e.employeeRef) refIndex.employeeRef[e.system + ':' + e.employeeRef] = pid;
      if (e.email) refIndex.email[e.system + ':' + e.email] = pid;
      // Employee refs and emails are useful across systems too.
      if (e.employeeRef) refIndex.employeeRef['*:' + e.employeeRef] = pid;
      if (e.email) refIndex.email['*:' + e.email] = pid;
    });

    return {
      people,
      personById,
      unresolved,
      dismissed,
      personByRecordKey,
      refIndex,
      stats: {
        sourceRecords: entries.length,
        people: people.length,
        autoLinked: strong.length,
        needsReview: unresolved.length,
        dismissed: dismissed.length,
        systemsLinked: entries.length - unresolved.length,
      },
      thresholds: { AUTO_LINK, REVIEW },
      rules: RULES,
    };
  }

  function dereference(refIndex, reference) {
    if (!reference) return null;
    const { system, keyType, key } = reference;
    if (keyType === 'nativeId') return refIndex.nativeId[system + ':' + key] || null;
    if (keyType === 'employeeRef') return refIndex.employeeRef[system + ':' + key] || refIndex.employeeRef['*:' + key] || null;
    if (keyType === 'email') return refIndex.email[system + ':' + normEmail(key)] || refIndex.email['*:' + normEmail(key)] || null;
    return null;
  }

  SOT.identity = { resolveIdentities, dereference, normName, normEmail, RULES, AUTO_LINK, REVIEW };
})(window.SOT || (window.SOT = {}));
</script>
<script>
/* --- core/policy.js --- */
/* Source of Truth — resolution policy.
 *
 * The policy is the product's opinion made editable. For each canonical field
 * it holds an ordered list of systems: the first one with a current value wins,
 * the rest become corroboration or conflict.
 *
 * Because nothing merged is ever persisted, editing this list re-answers every
 * question in the application immediately — org chart, profiles, discrepancy
 * counts, remediation tasks. That is the whole architectural bet: truth is a
 * function of policy over assertions, not a table someone wrote to.
 */
(function (SOT) {
  'use strict';

  const DEFAULT_POLICY = {
    fullName:         ['workday', 'salesforce', 'clari', 'gong'],
    workEmail:        ['workday', 'salesforce', 'gong'],
    employeeId:       ['workday', 'salesforce'],
    workerType:       ['workday'],
    employmentStatus: ['workday', 'salesforce', 'gong'],
    startDate:        ['workday'],
    location:         ['workday', 'salesforce'],

    jobTitle:         ['workday', 'salesforce'],
    jobFamily:        ['workday'],
    positionId:       ['workday', 'salesforce'],
    managerId:        ['workday', 'salesforce', 'clari'],
    department:       ['workday', 'clari'],
    costCenter:       ['workday'],
    team:             ['workday', 'clari', 'gong'],
    businessUnit:     ['workday'],
    region:           ['workday', 'tps'],

    territory:        ['tps', 'salesforce', 'clari'],
    salesRole:        ['salesforce'],
    quota:            ['salesforce', 'clari'],
    segment:          ['salesforce', 'tps'],
  };

  const RATIONALE = {
    managerId: 'Workday holds the approved supervisory organization. CRM hierarchies are edited ad hoc for visibility and routinely drift.',
    territory: 'Territory Planning owns coverage. Salesforce reflects it, but reps and admins can overwrite the field directly.',
    quota: 'Quota is contractual. Salesforce carries the signed number; Clari carries a planning figure that changes during the quarter.',
    employmentStatus: 'Termination is an HR event. Any other system claiming a terminated worker is active is an access-control problem.',
    positionId: 'Positions exist in Workday. Salesforce stores a copy that is only as good as the last integration run.',
    department: 'Workday owns the cost-bearing department. Clari forecast nodes are a reporting convenience that drifts from it.',
  };

  function clone(policy) {
    const out = {};
    Object.keys(policy).forEach((k) => { out[k] = policy[k].slice(); });
    return out;
  }

  function systemOfRecord(policy, field) {
    const order = policy[field];
    return order && order.length ? order[0] : null;
  }

  /** Move a system to the front of a field's order, keeping the rest stable. */
  function promote(policy, field, systemId) {
    const next = clone(policy);
    const order = next[field] || [];
    next[field] = [systemId].concat(order.filter((s) => s !== systemId));
    return next;
  }

  function isDefault(policy) {
    return Object.keys(DEFAULT_POLICY).every(
      (k) => (policy[k] || []).join(',') === DEFAULT_POLICY[k].join(',')
    );
  }

  function diff(policy) {
    return Object.keys(DEFAULT_POLICY)
      .filter((k) => (policy[k] || []).join(',') !== DEFAULT_POLICY[k].join(','))
      .map((k) => ({ field: k, from: DEFAULT_POLICY[k], to: policy[k] }));
  }

  SOT.policy = { DEFAULT_POLICY, RATIONALE, clone, promote, systemOfRecord, isDefault, diff };
})(window.SOT || (window.SOT = {}));
</script>
<script>
/* --- core/resolve.js --- */
/* Source of Truth — resolution and conflict detection.
 *
 * Given assertions + a policy, produce (a) the resolved value of every field
 * for every person, with full provenance, and (b) the disagreements.
 *
 * The classification is the part that matters commercially. Anyone can diff
 * two systems and print the differences; that produces a spreadsheet nobody
 * opens twice. The product has to separate:
 *
 *   Divergence — two systems that have both been read recently disagree.
 *                Somebody has to fix something.
 *   Lag        — a system has not been read since the value changed. It is
 *                behind, not wrong, and raising it as a defect is noise.
 *   Gap        — a system that ought to carry the field is empty.
 *
 * Getting Lag wrong is how data-quality products die: they emit thousands of
 * findings, half of them resolve themselves overnight, and the customer stops
 * believing the other half.
 */
(function (SOT) {
  'use strict';

  const DAY = 86400000;

  function sameValue(a, b) {
    if (a === b) return true;
    if (a == null || b == null) return false;
    if (typeof a === 'number' && typeof b === 'number') return a === b;
    return String(a).trim().toLowerCase() === String(b).trim().toLowerCase();
  }

  const isEmpty = (v) => v === null || v === undefined || v === '';

  function severityFor(field, kind) {
    const w = field.weight;
    const base = w >= 5 ? 0 : w >= 4 ? 1 : w >= 2 ? 2 : 3; // index into SEVERITY_ORDER
    const shift = kind === 'divergence' ? 0 : kind === 'gap' ? 1 : 2;
    return SOT.model.SEVERITY_ORDER[Math.min(3, base + shift)];
  }

  /**
   * Build every person's assertion set, dereference cross-system pointers, and
   * resolve each field under the supplied policy.
   */
  function resolveAll(dataset, identityResult, policy, asOf) {
    const { FIELD_BY_KEY, FIELDS } = SOT.model;
    const adapters = SOT.adapters;
    asOf = asOf || dataset.company.asOf;

    /* ---- 0. what each system is even capable of saying ---------------------
     * A field can only be "missing" from a system that carries it at all. The
     * declared contributor list is intent; this is what the adapter actually
     * emits. Without the check, every field a vendor simply does not model
     * reports as a gap on every single person — which is how a reconciliation
     * tool ends up with ten thousand meaningless findings on day one.
     */
    if (!dataset._capabilities) {
      const caps = {};
      Object.keys(adapters).forEach((sysId) => {
        const set = new Set();
        (dataset.records[adapters[sysId].collection] || []).forEach((rec) => {
          adapters[sysId].assertions(rec).forEach((a) => set.add(a.field));
        });
        caps[sysId] = set;
      });
      dataset._capabilities = caps;
    }
    const capabilities = dataset._capabilities;

    /* ---- 1. assertions ---------------------------------------------------- */

    const assertionsByPerson = {};
    identityResult.people.forEach((person) => {
      const bucket = {};
      person.links.forEach((link) => {
        const adapter = adapters[link.system];
        adapter.assertions(link.record).forEach((a) => {
          if (isEmpty(a.value) && !a.ref) return;
          const entry = {
            field: a.field,
            value: a.value,
            ref: a.ref || null,
            systemId: link.system,
            nativeId: link.nativeId,
            observedAt: a.observedAt,
            effectiveFrom: a.effectiveFrom == null ? a.observedAt : a.effectiveFrom,
            scheduled: !!a.scheduled,
            effectiveDating: !!adapter.effectiveDating,
            linkConfidence: link.confidence,
          };
          (bucket[a.field] || (bucket[a.field] = [])).push(entry);
        });
      });
      assertionsByPerson[person.id] = bucket;
    });

    /* ---- 2. dereference person-valued fields ------------------------------ */

    Object.keys(assertionsByPerson).forEach((pid) => {
      const bucket = assertionsByPerson[pid];
      (bucket.managerId || []).forEach((a) => {
        a.value = SOT.identity.dereference(identityResult.refIndex, a.ref);
        a.unresolvedRef = a.ref && !a.value ? a.ref : null;
      });
      bucket.managerId = (bucket.managerId || []).filter((a) => a.value || a.unresolvedRef);
    });

    /* ---- 3. resolve ------------------------------------------------------- */

    const profiles = {};
    const conflicts = [];
    let conflictSeq = 0;

    identityResult.people.forEach((person) => {
      const bucket = assertionsByPerson[person.id];
      const linkedSystems = new Set(person.links.map((l) => l.system));
      const fields = {};
      const scheduledChanges = [];
      let weightTotal = 0;
      let weightLost = 0;

      FIELDS.forEach((field) => {
        const all = bucket[field.key] || [];
        const current = [];
        all.forEach((a) => {
          if (a.effectiveFrom > asOf || a.scheduled) scheduledChanges.push(Object.assign({ fieldLabel: field.label }, a));
          else current.push(a);
        });
        if (!current.length) {
          fields[field.key] = { field, value: null, systemId: null, assertions: [], conflict: null, absent: true };
          return;
        }

        // Winner: highest-priority system in the policy that has a value.
        const order = policy[field.key] || [];
        let winner = null;
        for (let i = 0; i < order.length && !winner; i++) {
          const candidates = current.filter((a) => a.systemId === order[i] && !isEmpty(a.value));
          if (candidates.length) {
            candidates.sort((x, y) => y.effectiveFrom - x.effectiveFrom);
            winner = candidates[0];
          }
        }
        if (!winner) {
          // No policy system has it; fall back to the freshest claim so the
          // profile is still useful, and say so.
          const fallback = current.filter((a) => !isEmpty(a.value)).sort((x, y) => y.observedAt - x.observedAt)[0];
          winner = fallback || null;
        }
        if (!winner) {
          fields[field.key] = { field, value: null, systemId: null, assertions: current, conflict: null, absent: true };
          return;
        }

        weightTotal += field.weight;

        /* --- disagreements ------------------------------------------------ */
        const offenders = [];
        current.forEach((a) => {
          if (a.systemId === winner.systemId) return;
          if (isEmpty(a.value)) return;
          if (sameValue(a.value, winner.value)) return;
          let kind;
          if (winner.effectiveDating && a.observedAt < winner.effectiveFrom) kind = 'lag';
          else if (asOf - a.observedAt > field.tolerance * DAY) kind = 'lag';
          else kind = 'divergence';
          offenders.push({ systemId: a.systemId, value: a.value, observedAt: a.observedAt, kind, assertion: a });
        });

        /* --- gaps --------------------------------------------------------- */
        field.contributors.forEach((sysId) => {
          if (sysId === winner.systemId) return;
          if (!linkedSystems.has(sysId)) return; // not connected for this person — not a gap
          if (!capabilities[sysId] || !capabilities[sysId].has(field.key)) return; // system does not model it
          const has = current.some((a) => a.systemId === sysId && !isEmpty(a.value));
          if (!has) offenders.push({ systemId: sysId, value: null, observedAt: dataset.syncState[sysId].lastSync, kind: 'gap' });
        });

        let conflict = null;
        if (offenders.length) {
          const kind = offenders.some((o) => o.kind === 'divergence')
            ? 'divergence'
            : offenders.some((o) => o.kind === 'gap') ? 'gap' : 'lag';
          const severity = severityFor(field, kind);
          conflictSeq++;
          conflict = {
            id: 'C' + String(conflictSeq).padStart(4, '0'),
            personId: person.id,
            personName: person.displayName,
            field: field.key,
            fieldLabel: field.label,
            group: field.group,
            kind,
            severity,
            resolvedValue: winner.value,
            resolvedSystem: winner.systemId,
            resolvedEffectiveFrom: winner.effectiveFrom,
            offenders,
            systems: [winner.systemId].concat(offenders.map((o) => o.systemId)),
            actionable: kind !== 'lag',
          };
          conflicts.push(conflict);
          weightLost += field.weight * (kind === 'lag' ? 0.34 : 1);
        }

        fields[field.key] = {
          field,
          value: winner.value,
          systemId: winner.systemId,
          effectiveFrom: winner.effectiveFrom,
          observedAt: winner.observedAt,
          assertions: current,
          agreeing: current.filter((a) => a.systemId !== winner.systemId && sameValue(a.value, winner.value)).map((a) => a.systemId),
          conflict,
          absent: false,
        };
      });

      const alignment = weightTotal ? Math.max(0, Math.round((1 - weightLost / weightTotal) * 100)) : 100;

      profiles[person.id] = {
        person,
        fields,
        scheduledChanges,
        alignment,
        conflicts: conflicts.filter((c) => c.personId === person.id),
        linkedSystems: Array.from(linkedSystems),
        get: (key) => (fields[key] ? fields[key].value : null),
      };
    });

    /* ---- 4. the org graph, derived from resolved managers ----------------- */

    const nodes = {};
    Object.keys(profiles).forEach((pid) => {
      nodes[pid] = { id: pid, managerId: profiles[pid].get('managerId') || null, reports: [] };
    });
    Object.keys(nodes).forEach((pid) => {
      const mid = nodes[pid].managerId;
      if (mid && nodes[mid] && mid !== pid) nodes[mid].reports.push(pid);
      else nodes[pid].managerId = null;
    });

    // Cycle guard. A CRM hierarchy edited by hand can absolutely contain one,
    // and an org chart that hangs the browser is not a good demo.
    const depthOf = (pid) => {
      let d = 0, cur = nodes[pid], seen = new Set();
      while (cur && cur.managerId && !seen.has(cur.id)) { seen.add(cur.id); cur = nodes[cur.managerId]; d++; if (d > 20) break; }
      return d;
    };
    Object.keys(nodes).forEach((pid) => { nodes[pid].depth = depthOf(pid); });

    const roots = Object.keys(nodes).filter((pid) => !nodes[pid].managerId);
    Object.keys(nodes).forEach((pid) => {
      nodes[pid].reports.sort((a, b) => profiles[a].person.displayName.localeCompare(profiles[b].person.displayName));
    });

    function descendants(pid, acc) {
      acc = acc || [];
      (nodes[pid] ? nodes[pid].reports : []).forEach((r) => { acc.push(r); descendants(r, acc); });
      return acc;
    }
    function chain(pid) {
      const out = [];
      let cur = nodes[pid] && nodes[pid].managerId;
      let guard = 0;
      while (cur && guard++ < 20) { out.push(cur); cur = nodes[cur].managerId; }
      return out;
    }

    conflicts.sort((a, b) => {
      const s = SOT.model.SEVERITY_ORDER.indexOf(a.severity) - SOT.model.SEVERITY_ORDER.indexOf(b.severity);
      return s !== 0 ? s : a.personName.localeCompare(b.personName);
    });

    const org = { nodes, roots, descendants, chain };
    const stats = summarize(profiles, conflicts, identityResult);

    return { profiles, conflicts, org, stats, assertionsByPerson, asOf, policy };
  }

  function summarize(profiles, conflicts, identityResult) {
    const people = Object.values(profiles);
    const active = people.filter((p) => p.get('employmentStatus') === 'Active');
    const bySeverity = { critical: 0, high: 0, medium: 0, low: 0 };
    const byKind = { divergence: 0, lag: 0, gap: 0 };
    const byField = {};
    const bySystem = {};
    conflicts.forEach((c) => {
      bySeverity[c.severity]++;
      byKind[c.kind]++;
      byField[c.field] = (byField[c.field] || 0) + 1;
      c.systems.forEach((s) => { bySystem[s] = (bySystem[s] || 0) + 1; });
    });

    const departments = {};
    const territories = {};
    const managers = new Set();
    people.forEach((p) => {
      const d = p.get('department');
      if (d) departments[d] = (departments[d] || 0) + 1;
      const t = p.get('territory');
      if (t) territories[t] = (territories[t] || 0) + 1;
      const m = p.get('managerId');
      if (m) managers.add(m);
    });

    const avgAlignment = people.length
      ? Math.round(people.reduce((s, p) => s + p.alignment, 0) / people.length)
      : 100;

    return {
      people: people.length,
      activePeople: active.length,
      departments: Object.keys(departments).length,
      departmentCounts: departments,
      territories: Object.keys(territories).length,
      territoryCounts: territories,
      managers: managers.size,
      conflicts: conflicts.length,
      actionable: conflicts.filter((c) => c.actionable).length,
      bySeverity,
      byKind,
      byField,
      bySystem,
      avgAlignment,
      identity: identityResult.stats,
    };
  }

  SOT.resolve = { resolveAll, severityFor, sameValue };
})(window.SOT || (window.SOT = {}));
</script>
<script>
/* --- core/tasks.js --- */
/* Source of Truth — remediation.
 *
 * Detection alone is a report. The product converts each actionable conflict
 * into a specific instruction — which system, which field, which value, and
 * the evidence behind it — that a named team can act on and close out.
 *
 * Deliberately *not* write-back. Pushing corrections into a customer's Workday
 * makes us liable for the state of their HRIS on day one, and no buyer grants
 * that access to a new vendor anyway. Land the recommendation and the audit
 * trail first; earn write access later.
 */
(function (SOT) {
  'use strict';

  const OWNER_BY_GROUP = {
    identity: 'People Operations',
    org: 'People Operations',
    gtm: 'Revenue Operations',
  };

  function fmt(v, field) {
    if (v === null || v === undefined || v === '') return '—';
    if (field === 'quota') return '$' + Number(v).toLocaleString('en-US');
    if (field === 'managerId') return v;
    if (field === 'startDate') return new Date(v).toISOString().slice(0, 10);
    return String(v);
  }

  function describe(conflict, resolution) {
    const sysName = (id) => SOT.model.SYSTEM_BY_ID[id].name;
    const nameOf = (v) =>
      conflict.field === 'managerId' && resolution.profiles[v] ? resolution.profiles[v].person.displayName : fmt(v, conflict.field);

    const targets = conflict.offenders.filter((o) => o.kind !== 'lag');
    const targetNames = targets.map((o) => sysName(o.systemId));
    const sor = sysName(conflict.resolvedSystem);
    const value = nameOf(conflict.resolvedValue);

    if (conflict.kind === 'gap') {
      return {
        title: 'Populate ' + conflict.fieldLabel.toLowerCase() + ' in ' + targetNames.join(' and '),
        instruction:
          'Write "' + value + '" to ' + conflict.fieldLabel.toLowerCase() + ' on the ' + targetNames.join(' and ') +
          ' record. ' + sor + ' is the system of record for this field and already holds the value.',
      };
    }
    return {
      title: 'Correct ' + conflict.fieldLabel.toLowerCase() + ' in ' + targetNames.join(' and '),
      instruction:
        'Set ' + conflict.fieldLabel.toLowerCase() + ' to "' + value + '" in ' + targetNames.join(' and ') +
        '. ' + sor + ' is the system of record and reports ' +
        (conflict.field === 'managerId' ? 'this reporting line' : 'this value') + '; the other systems drifted.',
    };
  }

  function impactOf(conflict) {
    switch (conflict.field) {
      case 'employmentStatus':
        return 'Active licences and CRM access for a worker who has left. Security exposure and recoverable spend.';
      case 'territory':
        return 'Commission and quota credit route on territory. A mismatch pays the wrong rep or nobody.';
      case 'quota':
        return 'Attainment, forecast rollup and commission all read quota. The two figures cannot both be right.';
      case 'managerId':
        return 'Approvals, forecast rollup and every org-based report follow the reporting line.';
      case 'department':
        return 'Departmental rollups and cost allocation diverge from the general ledger.';
      case 'positionId':
        return 'Position ID is the join key between HR and revenue reporting. Without it, headcount reconciliation fails.';
      default:
        return 'Reports built on this field will disagree depending on which system they query.';
    }
  }

  function generate(resolution) {
    const tasks = [];
    resolution.conflicts.forEach((c) => {
      if (!c.actionable) return;
      const d = describe(c, resolution);
      tasks.push({
        id: 'T' + c.id.slice(1),
        conflictId: c.id,
        personId: c.personId,
        personName: c.personName,
        field: c.field,
        fieldLabel: c.fieldLabel,
        kind: c.kind,
        severity: c.severity,
        owner: c.field === 'employmentStatus' ? 'People Operations' : OWNER_BY_GROUP[c.group],
        targets: c.offenders.filter((o) => o.kind !== 'lag').map((o) => o.systemId),
        title: d.title,
        instruction: d.instruction,
        impact: impactOf(c),
        status: 'open',
      });
    });

    // Identity problems are remediation work too, and they outrank field-level
    // conflicts: an unmatched seat means every other answer about that person
    // is missing a source.
    resolution.identity.unresolved.forEach((u, i) => {
      tasks.push({
        id: 'TID' + String(i + 1).padStart(3, '0'),
        conflictId: null,
        personId: u.suggestions.length ? u.suggestions[0].personId : null,
        personName: u.name,
        field: 'identity',
        fieldLabel: 'Identity',
        kind: 'identity',
        severity: u.suggestions.length ? 'medium' : 'high',
        owner: 'Revenue Operations',
        targets: [u.system],
        title: u.suggestions.length
          ? 'Confirm ' + SOT.model.SYSTEM_BY_ID[u.system].name + ' seat belongs to ' + u.suggestions[0].personName
          : 'Identify unmatched ' + SOT.model.SYSTEM_BY_ID[u.system].name + ' seat "' + u.name + '"',
        instruction: u.recommendation,
        impact: 'Until this seat is resolved, its activity and cost are attributed to nobody.',
        status: 'open',
      });
    });

    resolution.identity.people.forEach((p) => {
      p.flags.forEach((f, i) => {
        tasks.push({
          id: 'TFL' + p.id.replace(/[^A-Z0-9]/gi, '') + i,
          conflictId: null,
          personId: p.id,
          personName: p.displayName,
          field: 'identity',
          fieldLabel: 'Identity',
          kind: 'identity',
          severity: f.severity,
          owner: f.kind === 'no-hr-record' ? 'People Operations' : 'Revenue Operations',
          targets: [f.system],
          title: f.label,
          instruction:
            f.kind === 'duplicate-source-record'
              ? 'Deactivate or merge the stale record so this person resolves to a single seat per system.'
              : 'Confirm engagement type and create the corresponding worker record, or revoke access.',
          impact:
            f.kind === 'duplicate-source-record'
              ? 'Duplicate seats double-count activity and can split ownership of the same accounts.'
              : 'A person with system access and no HR record sits outside offboarding, review and audit.',
          status: 'open',
        });
      });
    });

    const order = SOT.model.SEVERITY_ORDER;
    tasks.sort((a, b) => order.indexOf(a.severity) - order.indexOf(b.severity) || a.personName.localeCompare(b.personName));
    return tasks;
  }

  SOT.tasks = { generate, describe, impactOf, OWNER_BY_GROUP };
})(window.SOT || (window.SOT = {}));
</script>
<script>
/* --- core/metrics.js --- */
/* Source of Truth — metric reconciliation.
 *
 * Scoped deliberately narrow. A general engine that explains any two numbers
 * from any two systems requires query lineage across the warehouse and the BI
 * layer — a different product, and a multi-year one. What is tractable, and
 * what buyers actually ask for in the first meeting, is this: take a metric
 * three systems all publish, hold the underlying records constant, and show
 * that the gap is entirely explained by differences in *definition* and
 * *freshness*.
 *
 * Every figure below is computed from the same opportunity set by applying
 * each system's real filters in sequence, so the waterfall reconciles to the
 * cent rather than being narrated.
 */
(function (SOT) {
  'use strict';

  const DAY = 86400000;

  const FX_TODAY = { USD: 1, EUR: 1.09, GBP: 1.27 };
  const FX_FY_START = { USD: 1, EUR: 1.04, GBP: 1.21 };

  const usd = (o, rates) => o.amountLocal * (rates[o.currency] || 1);
  const sum = (list, rates) => list.reduce((s, o) => s + usd(o, rates), 0);

  function pipelineReconciliation(dataset) {
    const { opportunities, company } = dataset;
    const q = company.quarter;
    const extractAge = 3 * DAY;

    // All three numbers describe "Q3 pipeline" over the same opportunities.
    // Step 0 — Salesforce: everything open with a Q3 close date, no filters.
    const sfSet = opportunities.filter((o) => o.closeDate >= q.start && o.closeDate <= q.end);
    const sfTotal = sum(sfSet, FX_TODAY);

    // Step 1 — Clari applies a stage floor: Discovery is not pipeline.
    const staged = sfSet.filter((o) => o.stage >= 2);
    const dropStage1 = sum(sfSet, FX_TODAY) - sum(staged, FX_TODAY);

    // Step 2 — Clari reports renewals in a separate forecast.
    const clariSet = staged.filter((o) => o.recordType !== 'Renewal');
    const dropRenewals = sum(staged, FX_TODAY) - sum(clariSet, FX_TODAY);
    const clariTotal = sum(clariSet, FX_TODAY);

    // Tableau starts from the same staged set, keeps renewals, reads a
    // three-day-old extract, and revalues at fiscal-year-opening FX.
    const tableauSet = staged.filter((o) => o.createdDate <= company.asOf - extractAge);
    const addRenewals = sum(staged.filter((o) => o.recordType === 'Renewal' && o.createdDate <= company.asOf - extractAge), FX_TODAY);
    const dropStaleExtract = sum(staged, FX_TODAY) - sum(tableauSet, FX_TODAY);
    const fxDelta = sum(tableauSet, FX_FY_START) - sum(tableauSet, FX_TODAY);
    const tableauTotal = sum(tableauSet, FX_FY_START);

    const definitions = [
      {
        system: 'salesforce',
        label: 'Q3 Open Pipeline',
        artefact: 'Report: \u201cGTM Open Pipeline \u2014 Current Quarter\u201d',
        total: sfTotal,
        count: sfSet.length,
        filters: [
          'Close date within ' + q.label,
          'All stages, including 1 \u2014 Discovery',
          'All record types, including Renewal',
          'Daily FX rate',
          'Live query',
        ],
      },
      {
        system: 'clari',
        label: 'Q3 Pipeline',
        artefact: 'Forecast view: \u201cQ3 FY26 \u2014 Pipeline\u201d',
        total: clariTotal,
        count: clariSet.length,
        filters: [
          'Close date within ' + q.label,
          'Stage 2 and above',
          'Renewal record type excluded',
          'Daily FX rate',
          'Synced hourly',
        ],
      },
      {
        system: 'tableau',
        label: 'Pipeline \u2014 Sales Ops dashboard',
        artefact: 'Workbook: \u201cRevenue Ops \u2014 Quarterly Pipeline\u201d',
        total: tableauTotal,
        count: tableauSet.length,
        filters: [
          'Close date within ' + q.label,
          'Stage 2 and above',
          'Renewals included',
          'FX fixed at fiscal-year opening rates',
          'Extract refreshed 3 days ago',
        ],
      },
    ];

    const waterfall = [
      { label: 'Salesforce \u2014 Q3 Open Pipeline', value: sfTotal, type: 'start' },
      { label: 'Stage 1 opportunities', value: -dropStage1, type: 'delta', reason: 'Clari applies a stage floor. Salesforce counts Discovery as pipeline; Clari does not.' },
      { label: 'Renewal record type', value: -dropRenewals, type: 'delta', reason: 'Renewals sit in a separate Clari forecast and are excluded from this view.' },
      { label: 'Clari \u2014 Q3 Pipeline', value: clariTotal, type: 'subtotal' },
      { label: 'Renewals added back', value: addRenewals, type: 'delta', reason: 'The Tableau workbook predates the renewals split and still includes them.' },
      { label: 'Created since last extract', value: -dropStaleExtract, type: 'delta', reason: 'The Tableau extract is three days old and cannot contain them.' },
      { label: 'FX revaluation', value: fxDelta, type: 'delta', reason: 'Tableau converts EUR and GBP at fiscal-year opening rates, not today\u2019s.' },
      { label: 'Tableau \u2014 Sales Ops dashboard', value: tableauTotal, type: 'end' },
    ];

    return {
      id: 'pipeline',
      name: 'Q3 FY26 Pipeline',
      question:
        'Why does Q3 pipeline read $' + (sfTotal / 1e6).toFixed(1) + 'M in Salesforce, $' +
        (clariTotal / 1e6).toFixed(1) + 'M in Clari and $' + (tableauTotal / 1e6).toFixed(1) + 'M in Tableau?',
      verdict:
        'All three are arithmetically correct. Three teams are asking three different questions of the same ' +
        sfSet.length + ' opportunities, and the entire $' + ((sfTotal - clariTotal) / 1e6).toFixed(1) +
        'M spread is accounted for by stage floor, record-type scope, extract age and FX basis. Nothing here is a data-quality defect \u2014 which is exactly what the argument in the QBR needs to establish.',
      definitions,
      waterfall,
      unexplained: 0,
    };
  }

  function headcountReconciliation(dataset, resolution) {
    const identity = resolution.identity;
    const workdayActive = dataset.records.workday.filter((r) => r.employmentStatus === 'Active').length;
    const sfdcActiveRecords = dataset.records.salesforce.filter((r) => r.isActive);
    const gongActive = dataset.records.gong.filter((r) => r.active).length;

    const personOf = (sys, nativeId) => identity.personByRecordKey[sys + ':' + nativeId];
    const seen = {};
    let contractors = 0, ghosts = 0, duplicates = 0;

    sfdcActiveRecords.forEach((r) => {
      const pid = personOf('salesforce', r.userId);
      const person = pid ? identity.personById[pid] : null;
      if (!person) { contractors++; return; }
      if (seen[pid]) { duplicates++; return; }
      seen[pid] = true;
      const wd = person.bySystem.workday && person.bySystem.workday[0];
      if (!wd) contractors++;
      else if (wd.record.employmentStatus !== 'Active') ghosts++;
    });

    const workdayNoSeat = dataset.records.workday.filter((r) => {
      if (r.employmentStatus !== 'Active') return false;
      const pid = personOf('workday', r.workerId);
      const person = pid ? identity.personById[pid] : null;
      return !person || !(person.bySystem.salesforce || []).some((l) => l.active);
    }).length;

    const sfdcActive = sfdcActiveRecords.length;
    const explained = workdayActive + contractors + ghosts + duplicates - workdayNoSeat;

    const waterfall = [
      { label: 'Workday — active workers', value: workdayActive, type: 'start' },
      { label: 'Active CRM users with no worker record', value: contractors, type: 'delta', reason: 'Contractors and agency staff provisioned in the CRM only.' },
      { label: 'CRM users whose worker is terminated', value: ghosts, type: 'delta', reason: 'Offboarding closed the Workday record but never deactivated the CRM user.' },
      { label: 'Duplicate CRM users', value: duplicates, type: 'delta', reason: 'A rehire created a second user; the original was never merged.' },
      { label: 'Active workers with no CRM seat', value: -workdayNoSeat, type: 'delta', reason: 'Non-revenue roles are not licensed for the CRM.' },
      { label: 'Salesforce — active users', value: sfdcActive, type: 'end' },
    ];

    return {
      id: 'headcount',
      name: 'Go-to-market headcount',
      question: 'Why does Workday report ' + workdayActive + ' active workers when Salesforce shows ' + sfdcActive + ' active users and Gong bills for ' + gongActive + ' seats?',
      verdict:
        ghosts + contractors > 0
          ? 'Two of the five differences are defects, not definitions: ' + ghosts + ' terminated workers still hold live CRM access, and ' +
            contractors + ' active users have no worker record at all. Both are open remediation items.'
          : 'Every difference is explained by licensing scope.',
      definitions: [
        { system: 'workday', label: 'Active workers', artefact: 'Worker report — status Active', total: workdayActive, count: workdayActive, unit: 'people', filters: ['Employment status = Active', 'Includes non-revenue roles', 'Excludes contractors without a worker record'] },
        { system: 'salesforce', label: 'Active users', artefact: 'Setup → Users, IsActive = true', total: sfdcActive, count: sfdcActive, unit: 'people', filters: ['IsActive = true', 'Includes contractors', 'Includes users never deactivated after termination'] },
        { system: 'gong', label: 'Billable seats', artefact: 'Team members — active', total: gongActive, count: gongActive, unit: 'people', filters: ['Licensed roles only', 'Includes shared and demo seats', 'Last synced 9 days ago'] },
      ],
      waterfall,
      unexplained: sfdcActive - explained,
    };
  }

  function build(dataset, resolution) {
    return [pipelineReconciliation(dataset), headcountReconciliation(dataset, resolution)];
  }

  SOT.metrics = { build, FX_TODAY, FX_FY_START };
})(window.SOT || (window.SOT = {}));
</script>
<script>
/* --- core/store.js --- */
/* Source of Truth — application store.
 *
 * Holds the small amount of mutable state a user can change (policy, role,
 * task status, confirmed identity links) and re-runs the pipeline whenever any
 * of it changes:
 *
 *     source records → identities → assertions → policy → resolved truth
 *
 * The whole pipeline runs in a few milliseconds over this dataset, so the
 * application simply recomputes rather than maintaining caches. At real scale
 * the same functions run server-side against a warehouse, incrementally; the
 * shape of the computation does not change, which is the point of keeping the
 * engine free of UI and storage concerns.
 */
(function (SOT) {
  'use strict';

  const STORAGE_KEY = 'kaliris.sot.state.v1';

  function loadPersisted() {
    try {
      const raw = window.localStorage.getItem(STORAGE_KEY);
      return raw ? JSON.parse(raw) : null;
    } catch (e) {
      return null;
    }
  }

  function persist(state) {
    try {
      window.localStorage.setItem(
        STORAGE_KEY,
        JSON.stringify({
          policy: state.policy,
          roleId: state.roleId,
          taskStatus: state.taskStatus,
          forcedLinks: state.forcedLinks,
          dismissedKeys: state.dismissedKeys,
          hierarchy: state.hierarchy,
        })
      );
    } catch (e) {
      /* Private browsing, or an embedded frame with storage disabled. The app
         works fine without persistence; it just forgets between reloads. */
    }
  }

  function create() {
    const dataset = SOT.seed.build();
    const saved = loadPersisted() || {};

    const state = {
      dataset,
      policy: saved.policy || SOT.policy.clone(SOT.policy.DEFAULT_POLICY),
      roleId: saved.roleId || 'exec',
      taskStatus: saved.taskStatus || {},
      forcedLinks: saved.forcedLinks || [],
      dismissedKeys: saved.dismissedKeys || [],
      hierarchy: saved.hierarchy || dataset.hierarchy.map((h) => Object.assign({}, h)),
      signedIn: false,
    };

    const listeners = [];
    let view = null;

    function recompute() {
      const identity = SOT.identity.resolveIdentities(dataset, {
        forcedLinks: state.forcedLinks,
        dismissedKeys: state.dismissedKeys,
      });
      const resolution = SOT.resolve.resolveAll(dataset, identity, state.policy, dataset.company.asOf);
      resolution.identity = identity;

      const tasks = SOT.tasks.generate(resolution).map((t) =>
        Object.assign({}, t, { status: state.taskStatus[t.id] || 'open' })
      );
      const metrics = SOT.metrics.build(dataset, resolution);

      view = Object.assign(resolution, {
        dataset,
        tasks,
        metrics,
        searchIndex: buildSearchIndex(dataset, resolution),
        role: SOT.model.ROLES.find((r) => r.id === state.roleId),
        persona: choosePersona(resolution, state.roleId),
      });
      return view;
    }

    function emit() {
      recompute();
      persist(state);
      listeners.forEach((fn) => fn(view));
    }

    /* --------------------------------------------------------- persona ----
     * The Sales Manager role is scoped to one real person's reporting line, so
     * the permission model is demonstrable rather than described.
     */
    function choosePersona(resolution, roleId) {
      const people = Object.values(resolution.profiles);
      const find = (pred) => (people.find(pred) || {}).person;
      if (roleId === 'manager') {
        const mgr = people
          .filter((p) => /^Manager, Enterprise Sales/.test(p.get('jobTitle') || ''))
          .sort((a, b) => resolution.org.descendants(b.person.id).length - resolution.org.descendants(a.person.id).length)[0];
        return mgr ? mgr.person : null;
      }
      if (roleId === 'exec') return find((p) => (p.get('jobTitle') || '') === 'Chief Revenue Officer');
      if (roleId === 'revops') return find((p) => /Revenue Operations$/.test(p.get('jobTitle') || ''));
      return null; // People Operations is not modelled inside the GTM roster
    }

    function buildSearchIndex(dataset, resolution) {
      const rows = [];
      Object.values(resolution.profiles).forEach((p) => {
        rows.push({
          type: 'person',
          id: p.person.id,
          title: p.get('fullName') || p.person.displayName,
          subtitle: [p.get('jobTitle'), p.get('team')].filter(Boolean).join(' · '),
          meta: p.get('territory') || p.get('department') || '',
          terms: [
            p.person.displayName,
            p.get('workEmail'),
            p.get('jobTitle'),
            p.get('team'),
            p.get('department'),
            p.get('territory'),
            p.get('employeeId'),
            p.get('positionId'),
          ]
            .filter(Boolean)
            .join(' ')
            .toLowerCase(),
          href: '#/person/' + p.person.id,
        });
      });

      const seenTeams = new Set();
      Object.values(resolution.profiles).forEach((p) => {
        const t = p.get('team');
        if (!t || seenTeams.has(t)) return;
        seenTeams.add(t);
        rows.push({
          type: 'team',
          id: t,
          title: t,
          subtitle: 'Team',
          meta: p.get('businessUnit') || '',
          terms: (t + ' ' + (p.get('businessUnit') || '')).toLowerCase(),
          href: '#/org?team=' + encodeURIComponent(t),
        });
      });

      Object.keys(resolution.stats.territoryCounts).forEach((t) => {
        rows.push({
          type: 'territory',
          id: t,
          title: t,
          subtitle: 'Territory · ' + resolution.stats.territoryCounts[t] + ' assigned',
          meta: '',
          terms: t.toLowerCase(),
          href: '#/org?territory=' + encodeURIComponent(t),
        });
      });

      dataset.accounts.forEach((a) => {
        rows.push({
          type: 'account',
          id: a.id,
          title: a.name,
          subtitle: 'Account · ' + a.segment,
          meta: '$' + Math.round(a.arr / 1000) + 'k ARR',
          terms: (a.name + ' ' + a.id).toLowerCase(),
          href: '#/account/' + a.id,
        });
      });

      return rows;
    }

    /* ------------------------------------------------------------ actions */

    const api = {
      get state() { return state; },
      get view() { return view || recompute(); },
      get dataset() { return dataset; },

      subscribe(fn) { listeners.push(fn); return () => listeners.splice(listeners.indexOf(fn), 1); },

      signIn(roleId) { state.roleId = roleId; state.signedIn = true; emit(); },
      signOut() { state.signedIn = false; emit(); },
      setRole(roleId) { state.roleId = roleId; emit(); },

      setSystemOfRecord(field, systemId) { state.policy = SOT.policy.promote(state.policy, field, systemId); emit(); },
      setFieldOrder(field, order) { state.policy = Object.assign(SOT.policy.clone(state.policy), { [field]: order }); emit(); },
      resetPolicy() { state.policy = SOT.policy.clone(SOT.policy.DEFAULT_POLICY); emit(); },

      setTaskStatus(taskId, status) { state.taskStatus[taskId] = status; emit(); },
      bulkTaskStatus(ids, status) { ids.forEach((id) => { state.taskStatus[id] = status; }); emit(); },

      confirmLink(personId, system, nativeId) {
        const person = view.identity.personById[personId];
        if (!person) return;
        const anchor = person.links.find((l) => l.method === 'anchor') || person.links[0];
        state.forcedLinks.push({ a: anchor.system + ':' + anchor.nativeId, b: system + ':' + nativeId });
        emit();
      },
      dismissRecord(system, nativeId) {
        state.dismissedKeys.push(system + ':' + nativeId);
        emit();
      },

      renameHierarchyLevel(index, label) { state.hierarchy[index].label = label; emit(); },
      moveHierarchyLevel(index, delta) {
        const to = index + delta;
        if (to < 1 || to >= state.hierarchy.length) return; // Company stays at the root
        const [item] = state.hierarchy.splice(index, 1);
        state.hierarchy.splice(to, 0, item);
        emit();
      },
      removeHierarchyLevel(index) {
        if (index === 0 || state.hierarchy.length <= 2) return;
        state.hierarchy.splice(index, 1);
        emit();
      },
      addHierarchyLevel(level) { state.hierarchy.push(level); emit(); },

      resetAll() {
        state.policy = SOT.policy.clone(SOT.policy.DEFAULT_POLICY);
        state.taskStatus = {};
        state.forcedLinks = [];
        state.dismissedKeys = [];
        state.hierarchy = dataset.hierarchy.map((h) => Object.assign({}, h));
        emit();
      },

      /** People the signed-in role is permitted to see. */
      visiblePeople() {
        const v = api.view;
        const all = Object.values(v.profiles);
        if (v.role.scope === 'all' || !v.persona) return all;
        const allowed = new Set([v.persona.id].concat(v.org.descendants(v.persona.id)));
        return all.filter((p) => allowed.has(p.person.id));
      },

      canSee(sensitivity) { return SOT.model.canSee(api.view.role, sensitivity); },
    };

    recompute();
    return api;
  }

  SOT.store = { create };
})(window.SOT || (window.SOT = {}));
</script>
<script>
/* --- ui/components.js --- */
/* Source of Truth — presentation primitives.
 *
 * Plain functions that return HTML strings. No framework: the dataset is small
 * enough that re-rendering a whole view on every state change is imperceptible,
 * and it keeps the prototype dependency-free and inspectable. If this grows
 * into the real product these become React components with the same signatures.
 */
(function (SOT) {
  'use strict';

  const esc = (s) =>
    String(s === null || s === undefined ? '' : s)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;').replace(/'/g, '&#39;');

  const attr = (s) => esc(s);

  /* ------------------------------------------------------------ formatting */

  function money(n, opts) {
    if (n === null || n === undefined) return '—';
    const abs = Math.abs(n);
    const sign = n < 0 ? '−' : (opts && opts.signed && n > 0 ? '+' : '');
    if (abs >= 1e6) return sign + '$' + (abs / 1e6).toFixed(abs >= 1e7 ? 1 : 2) + 'M';
    if (abs >= 1e3) return sign + '$' + Math.round(abs / 1e3) + 'k';
    return sign + '$' + Math.round(abs);
  }

  function date(ts) {
    if (!ts) return '—';
    return new Date(ts).toLocaleDateString('en-GB', { day: 'numeric', month: 'short', year: 'numeric' });
  }

  function ago(ts, now) {
    if (!ts) return 'never';
    const d = (now || Date.now()) - ts;
    const min = Math.round(d / 60000);
    if (min < 1) return 'just now';
    if (min < 60) return min + ' min ago';
    const h = Math.round(min / 60);
    if (h < 24) return h + (h === 1 ? ' hour ago' : ' hours ago');
    const days = Math.round(h / 24);
    if (days < 30) return days + (days === 1 ? ' day ago' : ' days ago');
    return date(ts);
  }

  /** Values live in the model as raw types; this is the only place they get prose. */
  function fieldValue(key, value, resolution) {
    if (value === null || value === undefined || value === '') return '—';
    if (key === 'managerId') {
      const p = resolution && resolution.profiles[value];
      return p ? (p.get('fullName') || p.person.displayName) : String(value);
    }
    if (key === 'quota') return '$' + Number(value).toLocaleString('en-US');
    if (key === 'startDate') return date(value);
    return String(value);
  }

  /* ---------------------------------------------------------------- avatar */

  const AVATAR_HUES = [212, 258, 340, 12, 158, 40, 288, 190];
  function avatar(name, cls) {
    const initials = String(name || '?')
      .split(/\s+/).filter(Boolean).slice(0, 2).map((w) => w[0]).join('').toUpperCase();
    let h = 0;
    for (let i = 0; i < String(name).length; i++) h = (h * 31 + String(name).charCodeAt(i)) >>> 0;
    const hue = AVATAR_HUES[h % AVATAR_HUES.length];
    return (
      '<span class="avatar ' + (cls || '') + '" aria-hidden="true" style="background:hsl(' + hue + ' 42% 44%)">' +
      esc(initials) + '</span>'
    );
  }

  /* ---------------------------------------------------------------- badges */

  const SEVERITY_CLASS = { critical: 'bad', high: 'bad', medium: 'warn', low: 'info' };
  const KIND_CLASS = { divergence: 'bad', gap: 'warn', lag: 'info', identity: 'accent' };

  function badge(text, cls, dot) {
    return '<span class="badge ' + (cls || '') + '">' + (dot ? '<i class="dot"></i>' : '') + esc(text) + '</span>';
  }

  function severityBadge(sev) {
    return badge(sev, SEVERITY_CLASS[sev] || '', true);
  }

  function kindBadge(kind) {
    const label = { divergence: 'Divergence', gap: 'Gap', lag: 'Lag', identity: 'Identity' }[kind] || kind;
    return badge(label, KIND_CLASS[kind] || '');
  }

  function systemTag(systemId, opts) {
    const s = SOT.model.SYSTEM_BY_ID[systemId];
    if (!s) return '';
    return (
      '<span class="systag"><i class="sysdot" style="background:' + s.color + '"></i>' +
      esc(opts && opts.short ? s.name.split(' ')[0] : s.name) + '</span>'
    );
  }

  function systemLink(systemId, nativeId) {
    const s = SOT.model.SYSTEM_BY_ID[systemId];
    if (!s) return '';
    const href = s.deepLink.replace('{id}', encodeURIComponent(nativeId));
    return (
      '<a class="btn sm" href="' + attr(href) + '" target="_blank" rel="noopener noreferrer">Open ' +
      esc(s.name) + ' ↗</a>'
    );
  }

  /* ------------------------------------------------------------------ misc */

  function ring(pct, size) {
    const s = size || 62;
    const r = s / 2 - 5;
    const c = 2 * Math.PI * r;
    const on = (Math.max(0, Math.min(100, pct)) / 100) * c;
    const colour = pct >= 90 ? 'var(--ok)' : pct >= 70 ? 'var(--warn)' : 'var(--bad)';
    return (
      '<div class="ring" style="width:' + s + 'px;height:' + s + 'px">' +
      '<svg width="' + s + '" height="' + s + '" viewBox="0 0 ' + s + ' ' + s + '">' +
      '<circle cx="' + s / 2 + '" cy="' + s / 2 + '" r="' + r + '" fill="none" stroke="var(--surface-3)" stroke-width="6"/>' +
      '<circle cx="' + s / 2 + '" cy="' + s / 2 + '" r="' + r + '" fill="none" stroke="' + colour +
      '" stroke-width="6" stroke-linecap="round" stroke-dasharray="' + on.toFixed(1) + ' ' + c.toFixed(1) + '"/>' +
      '</svg><span class="val" style="color:' + colour + '">' + Math.round(pct) + '</span></div>'
    );
  }

  function stat(k, v, d, cls) {
    return (
      '<div class="card stat ' + (cls || '') + '"><div class="k">' + esc(k) + '</div>' +
      '<div class="v">' + (typeof v === 'string' ? v : esc(String(v))) + '</div>' +
      (d ? '<div class="d">' + d + '</div>' : '') + '</div>'
    );
  }

  function personLine(profile, opts) {
    const sub = (opts && opts.sub) || [profile.get('jobTitle'), profile.get('team')].filter(Boolean).join(' · ');
    return (
      '<span class="person-line">' + avatar(profile.get('fullName') || profile.person.displayName, 'sm') +
      '<span style="min-width:0"><span class="pl-name">' + esc(profile.get('fullName') || profile.person.displayName) +
      '</span><br><span class="pl-sub">' + esc(sub) + '</span></span></span>'
    );
  }

  function personCard(profile, resolution) {
    const p = profile.person;
    const name = profile.get('fullName') || p.displayName;
    const open = profile.conflicts.filter((c) => c.actionable).length;
    const mgrId = profile.get('managerId');
    const mgr = mgrId && resolution.profiles[mgrId];
    const terminated = profile.get('employmentStatus') !== 'Active';
    return (
      '<button class="pcard" data-goto="#/person/' + attr(p.id) + '">' +
      '<span class="top">' + avatar(name) +
      '<span style="min-width:0"><span class="nm">' + esc(name) + '</span><br>' +
      '<span class="ti">' + esc(profile.get('jobTitle') || '—') + '</span></span></span>' +
      '<span class="meta">' +
      (terminated ? badge('Terminated', 'bad') : '') +
      (profile.get('territory') ? badge(profile.get('territory'), 'plain') : '') +
      '<span class="m">' + (mgr ? 'Reports to ' + esc(mgr.get('fullName') || mgr.person.displayName) : 'No manager') + '</span>' +
      '<span style="margin-left:auto">' +
      (open ? badge(open + (open === 1 ? ' issue' : ' issues'), 'bad') : badge(profile.alignment + '% aligned', 'ok')) +
      '</span></span></button>'
    );
  }

  function empty(title, sub) {
    return '<div class="empty"><div class="big">✓</div><div style="font-weight:600;color:var(--text-2)">' + esc(title) + '</div>' +
      (sub ? '<div style="margin-top:5px">' + esc(sub) + '</div>' : '') + '</div>';
  }

  function tabs(items, current, action) {
    return (
      '<div class="tabs">' +
      items.map((t) =>
        '<button class="' + (t.id === current ? 'on' : '') + '" data-action="' + attr(action) + '" data-tab="' + attr(t.id) + '">' +
        esc(t.label) + (t.count !== undefined ? ' <span style="opacity:.6">' + t.count + '</span>' : '') + '</button>'
      ).join('') + '</div>'
    );
  }

  SOT.ui = Object.assign(SOT.ui || {}, {
    esc, attr, money, date, ago, fieldValue, avatar, badge, severityBadge, kindBadge,
    systemTag, systemLink, ring, stat, personLine, personCard, empty, tabs,
    SEVERITY_CLASS, KIND_CLASS,
  });
})(window.SOT || (window.SOT = {}));
</script>
<script>
/* --- ui/views-org.js --- */
/* Source of Truth — dashboard, organization explorer, employee profile. */
(function (SOT) {
  'use strict';

  const U = () => SOT.ui;

  function levelValue(profile, key, company) {
    if (key === 'company') return company.name;
    return profile.get(key) || 'Unassigned';
  }

  /* ============================================================= DASHBOARD */

  function dashboard(ctx) {
    const u = U();
    const { view, store, state } = ctx;
    const people = store.visiblePeople();
    const ids = new Set(people.map((p) => p.person.id));
    const conflicts = view.conflicts.filter((c) => ids.has(c.personId));
    const openTasks = view.tasks.filter((t) => t.status === 'open' && (!t.personId || ids.has(t.personId)));
    const scoped = view.role.scope !== 'all';

    const active = people.filter((p) => p.get('employmentStatus') === 'Active').length;
    const managers = new Set(people.map((p) => p.get('managerId')).filter(Boolean)).size;
    const territories = new Set(people.map((p) => p.get('territory')).filter(Boolean)).size;
    const depts = new Set(people.map((p) => p.get('department')).filter(Boolean)).size;
    const avgAlign = people.length ? Math.round(people.reduce((s, p) => s + p.alignment, 0) / people.length) : 100;
    const critical = conflicts.filter((c) => c.severity === 'critical' || c.severity === 'high').length;

    const degraded = SOT.model.SYSTEMS.filter((s) => view.dataset.syncState[s.id].status !== 'healthy');

    /* -- organizational rollup by the first configured level below company -- */
    const level = state.hierarchy[1] || state.hierarchy[0];
    const groups = {};
    people.forEach((p) => {
      const k = levelValue(p, level.key, view.dataset.company);
      (groups[k] || (groups[k] = [])).push(p);
    });
    const rollup = Object.keys(groups).sort().map((k) => {
      const g = groups[k];
      const issues = view.conflicts.filter((c) => g.some((p) => p.person.id === c.personId) && c.actionable).length;
      const align = Math.round(g.reduce((s, p) => s + p.alignment, 0) / g.length);
      return { key: k, size: g.length, issues, align };
    });

    /* -- organizational change feed ---------------------------------------- */
    const changes = [];
    people.forEach((p) => {
      const f = p.fields.managerId;
      if (f && f.effectiveFrom && view.asOf - f.effectiveFrom < 45 * 86400000 && f.value) {
        const mgr = view.profiles[f.value];
        changes.push({
          ts: f.effectiveFrom,
          person: p,
          text: 'moved under ' + (mgr ? (mgr.get('fullName') || mgr.person.displayName) : 'a new manager'),
          tag: 'Reorganization',
        });
      }
      p.scheduledChanges.forEach((s) => {
        changes.push({
          ts: s.effectiveFrom,
          person: p,
          text: s.fieldLabel.toLowerCase() + ' becomes “' + s.value + '”',
          tag: 'Scheduled',
          future: true,
        });
      });
      if (p.get('employmentStatus') !== 'Active') {
        changes.push({ ts: view.asOf, person: p, text: 'terminated in Workday, still active elsewhere', tag: 'Exit', alarm: true });
      }
    });
    changes.sort((a, b) => b.ts - a.ts);

    const roleIntro = {
      exec: 'Whole-organization view. Every figure below is resolved from the connected systems under the current system-of-record policy.',
      revops: 'Revenue operations view. Territory, quota and ownership conflicts are surfaced first because they move money.',
      hr: 'People operations view. Worker records, positions and reporting lines, reconciled against every downstream system.',
      manager: 'Your reporting line only. Compensation figures are redacted at your permission level.',
    }[view.role.id];

    return (
      '<div class="page-head"><div><h1>' + u.esc(scoped && view.persona ? 'My organization' : view.dataset.company.name) + '</h1>' +
      '<div class="sub">' + u.esc(roleIntro) + '</div></div>' +
      '<div class="actions">' +
      '<span class="badge plain">As of ' + u.esc(u.date(view.asOf)) + '</span>' +
      '<a class="btn" href="#/integrity">Review data integrity</a></div></div>' +

      (degraded.length
        ? '<div class="banner warn" style="margin-bottom:14px"><span>⚠</span><div><b>' + u.esc(degraded[0].name) +
          ' connector is degraded.</b> ' + u.esc(view.dataset.syncState[degraded[0].id].message || '') +
          ' Values from it are ' + u.ago(view.dataset.syncState[degraded[0].id].lastSync, view.asOf) +
          ' and are being reported as lag rather than conflict. <a href="#/systems">Connector status</a></div></div>'
        : '') +

      '<div class="grid g-stats" style="margin-bottom:14px">' +
      u.stat('People', people.length, active + ' active · ' + (people.length - active) + ' exited') +
      u.stat('Departments', depts, territories + ' territories · ' + managers + ' managers') +
      u.stat('System alignment', avgAlign + '%', 'Weighted across ' + SOT.model.FIELDS.length + ' reconciled fields', avgAlign >= 90 ? 'good' : '') +
      u.stat('Open discrepancies', conflicts.filter((c) => c.actionable).length, critical + ' at high severity or above', critical ? 'alarm' : '') +
      u.stat('Remediation queue', openTasks.length, 'Assigned across RevOps and People Ops') +
      u.stat('Identity queue', view.identity.stats.needsReview, 'Seats awaiting a human decision') +
      '</div>' +

      '<div class="split">' +
      '<div class="grid" style="gap:14px">' +

      '<div class="card"><div class="card-head"><h3>' + u.esc(level.label) + ' rollup</h3>' +
      '<span class="sub">Resolved from ' + u.esc(SOT.model.SYSTEM_BY_ID[level.source] ? SOT.model.SYSTEM_BY_ID[level.source].name : 'the org graph') + '</span>' +
      '<div class="right"><a class="btn sm" href="#/org">Open explorer</a></div></div>' +
      '<div class="card-body tight"><div class="scroll-x"><table class="table">' +
      '<thead><tr><th>' + u.esc(level.label) + '</th><th class="num">People</th><th class="num">Open issues</th><th style="width:180px">Alignment</th></tr></thead><tbody>' +
      rollup.map((r) =>
        '<tr class="click" data-goto="#/org?' + encodeURIComponent(level.key) + '=' + encodeURIComponent(r.key) + '">' +
        '<td><b>' + u.esc(r.key) + '</b></td>' +
        '<td class="num">' + r.size + '</td>' +
        '<td class="num">' + (r.issues ? u.badge(String(r.issues), 'bad') : '<span style="color:var(--text-3)">0</span>') + '</td>' +
        '<td><div style="display:flex;align-items:center;gap:9px"><div class="bar" style="flex:1"><i style="width:' + r.align +
        '%;background:' + (r.align >= 90 ? 'var(--ok)' : r.align >= 70 ? 'var(--warn)' : 'var(--bad)') + '"></i></div>' +
        '<span class="num" style="font-size:11.5px;color:var(--text-2);width:32px;text-align:right">' + r.align + '%</span></div></td></tr>'
      ).join('') +
      '</tbody></table></div></div></div>' +

      '<div class="card"><div class="card-head"><h3>Organizational change</h3>' +
      '<span class="sub">Last 45 days and scheduled</span></div><div class="card-body tight">' +
      (changes.length
        ? '<table class="table"><tbody>' + changes.slice(0, 8).map((c) =>
            '<tr class="click" data-goto="#/person/' + u.attr(c.person.person.id) + '">' +
            '<td style="width:44%">' + u.personLine(c.person) + '</td>' +
            '<td>' + u.esc(c.text) + '</td>' +
            '<td style="text-align:right;white-space:nowrap">' +
            u.badge(c.tag, c.alarm ? 'bad' : c.future ? 'info' : 'plain') +
            '<div style="font-size:11px;color:var(--text-3);margin-top:3px">' +
            u.esc(c.future ? 'from ' + u.date(c.ts) : u.ago(c.ts, view.asOf)) + '</div></td></tr>'
          ).join('') + '</tbody></table>'
        : u.empty('No organizational change recorded')) +
      '</div></div>' +

      '</div>' +

      /* --------------------------------------------------------- right rail */
      '<div class="grid" style="gap:14px">' +
      '<div class="card"><div class="card-head"><h3>Discrepancies by severity</h3></div><div class="card-body">' +
      ['critical', 'high', 'medium', 'low'].map((sev) => {
        const n = conflicts.filter((c) => c.severity === sev).length;
        const pct = conflicts.length ? Math.round((n / conflicts.length) * 100) : 0;
        return '<div style="display:flex;align-items:center;gap:10px;margin-bottom:9px">' +
          '<span style="width:64px">' + u.severityBadge(sev) + '</span>' +
          '<div class="bar" style="flex:1"><i style="width:' + pct + '%;background:var(--' +
          (sev === 'critical' || sev === 'high' ? 'bad' : sev === 'medium' ? 'warn' : 'info') + ')"></i></div>' +
          '<span class="num" style="width:26px;text-align:right;font-size:12px">' + n + '</span></div>';
      }).join('') +
      '<div style="border-top:1px solid var(--border);margin-top:12px;padding-top:11px;font-size:11.5px;color:var(--text-2);line-height:1.55">' +
      '<b>' + view.stats.byKind.lag + '</b> further differences are classified as lag — a system that has not been read since the value changed. ' +
      'They are excluded from the queue because they resolve on the next sync.</div>' +
      '</div></div>' +

      '<div class="card"><div class="card-head"><h3>Needs attention</h3><div class="right"><a class="btn sm" href="#/tasks">All tasks</a></div></div>' +
