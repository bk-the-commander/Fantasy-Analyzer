<title>Source of Truth — Kaliris Labs</title>
<meta name="description" content="The organizational source of truth across disconnected business systems. A Kaliris Labs prototype.">
<style>
/* Source of Truth — interface.
 *
 * Enterprise density over marketing polish: small type, tight rhythm, one
 * accent colour, tabular numerals everywhere a figure appears. The palette is
 * defined once on :root and re-declared for dark so the page reads correctly
 * whichever theme the viewer is in.
 */

:root {
  --bg: #f6f7f9;
  --surface: #ffffff;
  --surface-2: #f1f3f6;
  --surface-3: #e9ecf1;
  --border: #e2e5ea;
  --border-strong: #ccd1d9;
  --text: #14171c;
  --text-2: #545c68;
  --text-3: #868e9a;
  --accent: #2557d6;
  --accent-2: #1c47b4;
  --accent-soft: #e9efff;
  --ok: #12703a;
  --ok-soft: #e4f4ea;
  --warn: #8d5a06;
  --warn-soft: #fbf1de;
  --bad: #b52424;
  --bad-soft: #fbeae9;
  --info: #1f5f8b;
  --info-soft: #e6f1f8;
  --shadow-sm: 0 1px 2px rgba(16, 24, 40, .05);
  --shadow: 0 4px 16px -4px rgba(16, 24, 40, .12), 0 1px 3px rgba(16, 24, 40, .06);
  --shadow-lg: 0 24px 48px -12px rgba(16, 24, 40, .28);
  --radius: 8px;
  --sidebar: 224px;
  --mono: ui-monospace, "SF Mono", SFMono-Regular, Menlo, Consolas, monospace;
  color-scheme: light;
}

@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0d0f13;
    --surface: #15181e;
    --surface-2: #1b1f26;
    --surface-3: #232831;
    --border: #262b34;
    --border-strong: #363d49;
    --text: #e7eaef;
    --text-2: #9ea7b4;
    --text-3: #6b7480;
    --accent: #7594ff;
    --accent-2: #96adff;
    --accent-soft: #18213b;
    --ok: #5cc98a;
    --ok-soft: #12251a;
    --warn: #dda44a;
    --warn-soft: #2a2115;
    --bad: #f0736c;
    --bad-soft: #2d1817;
    --info: #6fb3dd;
    --info-soft: #14232e;
    --shadow-sm: 0 1px 2px rgba(0, 0, 0, .4);
    --shadow: 0 4px 16px -4px rgba(0, 0, 0, .5);
    --shadow-lg: 0 24px 48px -12px rgba(0, 0, 0, .7);
    color-scheme: dark;
  }
}

:root[data-theme="dark"] {
  --bg: #0d0f13;
  --surface: #15181e;
  --surface-2: #1b1f26;
  --surface-3: #232831;
  --border: #262b34;
  --border-strong: #363d49;
  --text: #e7eaef;
  --text-2: #9ea7b4;
  --text-3: #6b7480;
  --accent: #7594ff;
  --accent-2: #96adff;
  --accent-soft: #18213b;
  --ok: #5cc98a;
  --ok-soft: #12251a;
  --warn: #dda44a;
  --warn-soft: #2a2115;
  --bad: #f0736c;
  --bad-soft: #2d1817;
  --info: #6fb3dd;
  --info-soft: #14232e;
  --shadow-sm: 0 1px 2px rgba(0, 0, 0, .4);
  --shadow: 0 4px 16px -4px rgba(0, 0, 0, .5);
  --shadow-lg: 0 24px 48px -12px rgba(0, 0, 0, .7);
  color-scheme: dark;
}

* { box-sizing: border-box; }

body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font: 400 13.5px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, "Helvetica Neue", Arial, sans-serif;
  -webkit-font-smoothing: antialiased;
  font-feature-settings: "cv02", "cv03", "cv04";
}

a { color: var(--accent); text-decoration: none; }
a:hover { text-decoration: underline; }
button { font: inherit; color: inherit; }
h1, h2, h3, h4 { margin: 0; font-weight: 600; letter-spacing: -.01em; }
.num { font-variant-numeric: tabular-nums; }
.mono { font-family: var(--mono); font-size: 12px; }

/* ------------------------------------------------------------------ login */

.login {
  min-height: 100vh;
  display: grid;
  grid-template-columns: 1.05fr .95fr;
  background: var(--surface);
}
.login-left {
  padding: clamp(32px, 6vw, 80px);
  display: flex;
  flex-direction: column;
  justify-content: center;
  gap: 28px;
  max-width: 640px;
}
.login-right {
  background:
    radial-gradient(900px 500px at 80% -10%, color-mix(in srgb, var(--accent) 16%, transparent), transparent 65%),
    var(--surface-2);
  border-left: 1px solid var(--border);
  padding: clamp(28px, 4vw, 56px);
  display: flex;
  flex-direction: column;
  justify-content: center;
  gap: 14px;
}
.wordmark { display: flex; align-items: center; gap: 10px; }
.wordmark .mark {
  width: 26px; height: 26px; border-radius: 6px;
  background: var(--accent); color: #fff;
  display: grid; place-items: center; font-weight: 700; font-size: 13px;
  flex: none;
}
.wordmark .parent { font-size: 11px; letter-spacing: .14em; text-transform: uppercase; color: var(--text-3); }
.wordmark .product { font-size: 15px; font-weight: 650; letter-spacing: -.01em; }
.login h1 { font-size: clamp(30px, 4vw, 42px); line-height: 1.08; letter-spacing: -.028em; }
.login .tagline { color: var(--text-2); font-size: 16px; max-width: 46ch; }
.login .note {
  font-size: 12px; color: var(--text-3); border-top: 1px solid var(--border);
  padding-top: 16px; max-width: 52ch;
}
.role-card {
  display: grid; grid-template-columns: 1fr auto; align-items: center; gap: 12px;
  width: 100%; text-align: left; cursor: pointer;
  background: var(--surface); border: 1px solid var(--border);
  border-radius: var(--radius); padding: 13px 15px;
  transition: border-color .12s, box-shadow .12s, transform .12s;
}
.role-card:hover { border-color: var(--accent); box-shadow: var(--shadow-sm); transform: translateY(-1px); }
.role-card .r-name { font-weight: 600; }
.role-card .r-persona { font-size: 11.5px; color: var(--text-3); margin-top: 1px; }
.role-card .r-blurb { font-size: 12px; color: var(--text-2); margin-top: 5px; }
.role-card .r-go { color: var(--text-3); font-size: 16px; }

/* ------------------------------------------------------------------ shell */

.shell { display: grid; grid-template-columns: var(--sidebar) 1fr; min-height: 100vh; }
.sidebar {
  background: var(--surface); border-right: 1px solid var(--border);
  display: flex; flex-direction: column; position: sticky; top: 0; height: 100vh;
}
.sidebar-head { padding: 14px 14px 12px; border-bottom: 1px solid var(--border); }
.nav { padding: 10px 8px; overflow-y: auto; flex: 1; }
.nav-label {
  font-size: 10.5px; text-transform: uppercase; letter-spacing: .09em;
  color: var(--text-3); padding: 12px 8px 5px; font-weight: 600;
}
.nav a {
  display: flex; align-items: center; gap: 9px;
  padding: 6.5px 8px; border-radius: 6px; color: var(--text-2);
  font-size: 13px; font-weight: 500; text-decoration: none;
}
.nav a:hover { background: var(--surface-2); color: var(--text); }
.nav a.active { background: var(--accent-soft); color: var(--accent); font-weight: 600; }
.nav a .ico { width: 15px; text-align: center; opacity: .85; flex: none; }
.nav a .count {
  margin-left: auto; font-size: 11px; font-variant-numeric: tabular-nums;
  background: var(--surface-3); color: var(--text-2); border-radius: 20px; padding: 1px 6px;
}
.nav a.active .count { background: var(--surface); color: var(--accent); }
.nav a .count.alarm { background: var(--bad-soft); color: var(--bad); }
.sidebar-foot { border-top: 1px solid var(--border); padding: 10px 12px; font-size: 11.5px; color: var(--text-3); }

.topbar {
  position: sticky; top: 0; z-index: 20;
  height: 54px; background: color-mix(in srgb, var(--surface) 88%, transparent);
  backdrop-filter: saturate(1.4) blur(8px);
  border-bottom: 1px solid var(--border);
  display: flex; align-items: center; gap: 12px; padding: 0 20px;
}
.searchbtn {
  flex: 1; max-width: 460px; display: flex; align-items: center; gap: 8px;
  background: var(--surface-2); border: 1px solid var(--border); border-radius: 7px;
  padding: 6px 10px; color: var(--text-3); cursor: pointer; font-size: 13px;
}
.searchbtn:hover { border-color: var(--border-strong); }
.kbd {
  font-family: var(--mono); font-size: 10.5px; border: 1px solid var(--border-strong);
  border-bottom-width: 2px; border-radius: 4px; padding: 1px 4px; color: var(--text-3);
  background: var(--surface);
}
.rolepick {
  margin-left: auto; display: flex; align-items: center; gap: 8px;
  background: var(--surface-2); border: 1px solid var(--border);
  border-radius: 7px; padding: 4px 8px 4px 10px; font-size: 12.5px;
}
.rolepick select { border: 0; background: transparent; font: inherit; font-weight: 600; color: var(--text); cursor: pointer; }
.rolepick .lbl { color: var(--text-3); font-size: 11px; }

/* Grid and flex children default to min-width:auto, which lets a wide table
   push the whole page sideways instead of scrolling inside its own container.
   Every level between the shell and a .scroll-x has to opt out. */
.shell > main, .grid > *, .split > *, .card-body, .card { min-width: 0; }

.content { padding: 22px 26px 72px; max-width: 1480px; }
.page-head { margin-bottom: 18px; display: flex; align-items: flex-start; gap: 16px; flex-wrap: wrap; }
.page-head h1 { font-size: 20px; letter-spacing: -.02em; }
.page-head .sub { color: var(--text-2); font-size: 13px; margin-top: 3px; max-width: 78ch; }
.page-head .actions { margin-left: auto; display: flex; gap: 8px; align-items: center; }

/* --------------------------------------------------------------- controls */

.btn {
  display: inline-flex; align-items: center; gap: 6px; cursor: pointer;
  background: var(--surface); border: 1px solid var(--border-strong);
  border-radius: 6px; padding: 5.5px 11px; font-size: 12.5px; font-weight: 550;
  box-shadow: var(--shadow-sm);
}
.btn:hover { background: var(--surface-2); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
.btn.primary:hover { background: var(--accent-2); }
.btn.ghost { background: transparent; border-color: transparent; box-shadow: none; color: var(--text-2); }
.btn.ghost:hover { background: var(--surface-2); color: var(--text); }
.btn.sm { padding: 3px 8px; font-size: 11.5px; }
.btn:disabled { opacity: .45; cursor: default; }

select.input, input.input {
  background: var(--surface); border: 1px solid var(--border-strong);
  border-radius: 6px; padding: 5px 9px; font: inherit; font-size: 12.5px; color: var(--text);
}
input.input::placeholder { color: var(--text-3); }

.chips { display: flex; gap: 6px; flex-wrap: wrap; }
.chip {
  cursor: pointer; border: 1px solid var(--border); background: var(--surface);
  border-radius: 20px; padding: 3.5px 11px; font-size: 12px; color: var(--text-2);
}
.chip:hover { border-color: var(--border-strong); color: var(--text); }
.chip.on { background: var(--accent-soft); border-color: color-mix(in srgb, var(--accent) 40%, transparent); color: var(--accent); font-weight: 600; }

/* ------------------------------------------------------------------ cards */

.card {
  background: var(--surface); border: 1px solid var(--border);
  border-radius: var(--radius); box-shadow: var(--shadow-sm);
}
.card-head {
  padding: 13px 16px; border-bottom: 1px solid var(--border);
  display: flex; align-items: center; gap: 10px;
}
.card-head h3 { font-size: 13.5px; }
.card-head .sub { font-size: 11.5px; color: var(--text-3); }
.card-head .right { margin-left: auto; display: flex; gap: 8px; align-items: center; }
.card-body { padding: 16px; }
.card-body.tight { padding: 0; }

.grid { display: grid; gap: 14px; }
.g-stats { grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); }
.g-2 { grid-template-columns: repeat(auto-fit, minmax(340px, 1fr)); }
.g-3 { grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); }
.g-people { grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); }
.split { display: grid; grid-template-columns: minmax(0, 2fr) minmax(300px, 1fr); gap: 14px; align-items: start; }

.stat { padding: 14px 16px; }
.stat .k { font-size: 11.5px; color: var(--text-2); font-weight: 550; display: flex; align-items: center; gap: 6px; }
.stat .v { font-size: 25px; font-weight: 620; letter-spacing: -.025em; margin-top: 5px; font-variant-numeric: tabular-nums; }
.stat .d { font-size: 11.5px; color: var(--text-3); margin-top: 3px; }
.stat.alarm .v { color: var(--bad); }
.stat.good .v { color: var(--ok); }

/* ----------------------------------------------------------------- badges */

.badge {
  display: inline-flex; align-items: center; gap: 5px; white-space: nowrap;
  font-size: 11px; font-weight: 600; border-radius: 5px; padding: 2px 7px;
  background: var(--surface-2); color: var(--text-2); border: 1px solid transparent;
}
.badge.ok { background: var(--ok-soft); color: var(--ok); }
.badge.warn { background: var(--warn-soft); color: var(--warn); }
.badge.bad { background: var(--bad-soft); color: var(--bad); }
.badge.info { background: var(--info-soft); color: var(--info); }
.badge.accent { background: var(--accent-soft); color: var(--accent); }
.badge.plain { border-color: var(--border); background: var(--surface); }
.dot { width: 7px; height: 7px; border-radius: 50%; background: currentColor; flex: none; }

.sysdot { width: 8px; height: 8px; border-radius: 2px; display: inline-block; flex: none; }
.systag {
  display: inline-flex; align-items: center; gap: 5px; font-size: 11.5px;
  color: var(--text-2); font-weight: 550;
}

/* ----------------------------------------------------------------- tables */

.table { width: 100%; border-collapse: collapse; font-size: 12.5px; }
.table th {
  text-align: left; font-size: 10.5px; text-transform: uppercase; letter-spacing: .07em;
  color: var(--text-3); font-weight: 650; padding: 8px 14px;
  border-bottom: 1px solid var(--border); background: var(--surface-2);
  position: sticky; top: 0; z-index: 1;
}
.table td { padding: 9px 14px; border-bottom: 1px solid var(--border); vertical-align: middle; }
.table tr:last-child td { border-bottom: 0; }
.table tbody tr.click { cursor: pointer; }
.table tbody tr.click:hover { background: var(--surface-2); }
.table td.num, .table th.num { text-align: right; font-variant-numeric: tabular-nums; }
.scroll-x { overflow-x: auto; }

/* ---------------------------------------------------------------- avatars */

.avatar {
  width: 32px; height: 32px; border-radius: 50%; flex: none;
  display: grid; place-items: center; font-size: 11.5px; font-weight: 650;
  color: #fff; letter-spacing: .02em; user-select: none;
}
.avatar.lg { width: 60px; height: 60px; font-size: 20px; }
.avatar.sm { width: 24px; height: 24px; font-size: 9.5px; }

.person-line { display: flex; align-items: center; gap: 9px; min-width: 0; }
.person-line .pl-name { font-weight: 560; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.person-line .pl-sub { font-size: 11.5px; color: var(--text-3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

.pcard {
  display: block; background: var(--surface); border: 1px solid var(--border);
  border-radius: var(--radius); padding: 13px; cursor: pointer; text-align: left;
  width: 100%; transition: border-color .12s, box-shadow .12s, transform .12s;
}
.pcard:hover { border-color: var(--border-strong); box-shadow: var(--shadow); transform: translateY(-1px); }
.pcard .top { display: flex; gap: 10px; align-items: center; }
.pcard .nm { font-weight: 600; font-size: 13.5px; }
.pcard .ti { font-size: 12px; color: var(--text-2); }
.pcard .meta { margin-top: 10px; padding-top: 9px; border-top: 1px solid var(--border); display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.pcard .meta .m { font-size: 11.5px; color: var(--text-3); }

/* ------------------------------------------------------------------- misc */

.ring { --pct: 0; width: 62px; height: 62px; position: relative; flex: none; }
.ring svg { transform: rotate(-90deg); }
.ring .val {
  position: absolute; inset: 0; display: grid; place-items: center;
  font-size: 14px; font-weight: 650; font-variant-numeric: tabular-nums;
}
.bar { height: 6px; border-radius: 4px; background: var(--surface-3); overflow: hidden; }
.bar > i { display: block; height: 100%; background: var(--accent); border-radius: 4px; }

.crumbs { display: flex; align-items: center; gap: 4px; flex-wrap: wrap; font-size: 12.5px; margin-bottom: 14px; }
.crumbs button { background: none; border: 0; cursor: pointer; color: var(--accent); padding: 2px 4px; border-radius: 4px; font-weight: 550; }
.crumbs button:hover { background: var(--accent-soft); }
.crumbs .sep { color: var(--text-3); }
.crumbs .cur { color: var(--text); font-weight: 600; padding: 2px 4px; }

.tabs { display: flex; gap: 2px; border-bottom: 1px solid var(--border); margin-bottom: 16px; overflow-x: auto; }
.tabs button {
  background: none; border: 0; cursor: pointer; padding: 8px 12px; font-size: 13px;
  color: var(--text-2); font-weight: 550; border-bottom: 2px solid transparent; white-space: nowrap;
}
.tabs button:hover { color: var(--text); }
.tabs button.on { color: var(--accent); border-bottom-color: var(--accent); }

.kv { display: grid; grid-template-columns: minmax(120px, 34%) 1fr; gap: 1px 14px; font-size: 12.5px; }
.kv dt { color: var(--text-3); padding: 5px 0; }
.kv dd { margin: 0; padding: 5px 0; font-weight: 520; overflow-wrap: anywhere; }

.empty { text-align: center; padding: 44px 20px; color: var(--text-3); font-size: 13px; }
.empty .big { font-size: 22px; margin-bottom: 8px; }

.banner {
  display: flex; gap: 11px; align-items: flex-start; padding: 11px 14px;
  border-radius: var(--radius); font-size: 12.5px; border: 1px solid transparent;
}
.banner.warn { background: var(--warn-soft); color: var(--warn); border-color: color-mix(in srgb, var(--warn) 24%, transparent); }
.banner.bad { background: var(--bad-soft); color: var(--bad); border-color: color-mix(in srgb, var(--bad) 24%, transparent); }
.banner.info { background: var(--accent-soft); color: var(--accent); border-color: color-mix(in srgb, var(--accent) 22%, transparent); }
.banner b { font-weight: 650; }

/* -------------------------------------------------------------- org tree */

.tree { font-size: 12.5px; }
.tree-node { position: relative; }
.tree-row {
  display: flex; align-items: center; gap: 8px; padding: 4px 8px; border-radius: 6px; cursor: pointer;
}
.tree-row:hover { background: var(--surface-2); }
.tree-kids { margin-left: 15px; padding-left: 13px; border-left: 1px solid var(--border); }
.tree-toggle {
  width: 15px; height: 15px; border-radius: 4px; border: 1px solid var(--border-strong);
  background: var(--surface); display: grid; place-items: center; font-size: 9px;
  color: var(--text-2); cursor: pointer; flex: none; line-height: 1;
}
.tree-row .tt { font-weight: 550; }
.tree-row .ts { color: var(--text-3); font-size: 11.5px; }

/* --------------------------------------------------------------- overlays */

.overlay {
  position: fixed; inset: 0; z-index: 60; background: rgba(12, 16, 24, .42);
  backdrop-filter: blur(2px); display: flex; justify-content: center; padding-top: 12vh;
}
.palette {
  width: min(620px, 92vw); max-height: 68vh; background: var(--surface);
  border: 1px solid var(--border); border-radius: 11px; box-shadow: var(--shadow-lg);
  display: flex; flex-direction: column; overflow: hidden; height: fit-content;
}
.palette input {
  border: 0; border-bottom: 1px solid var(--border); padding: 14px 16px;
  font: inherit; font-size: 15px; background: transparent; color: var(--text); outline: none;
}
.palette .results { overflow-y: auto; padding: 6px; }
.palette .res {
  display: flex; align-items: center; gap: 10px; padding: 8px 10px; border-radius: 6px; cursor: pointer;
}
.palette .res.on, .palette .res:hover { background: var(--surface-2); }
.palette .res .t { font-weight: 550; font-size: 13px; }
.palette .res .s { font-size: 11.5px; color: var(--text-3); }
.palette .res .type {
  margin-left: auto; font-size: 10px; text-transform: uppercase; letter-spacing: .07em;
  color: var(--text-3); font-weight: 600;
}
.palette .hint { border-top: 1px solid var(--border); padding: 8px 14px; font-size: 11px; color: var(--text-3); display: flex; gap: 14px; }

.drawer-wrap { position: fixed; inset: 0; z-index: 70; background: rgba(12, 16, 24, .38); display: flex; justify-content: flex-end; }
.drawer {
  width: min(560px, 96vw); background: var(--surface); height: 100%;
  border-left: 1px solid var(--border); box-shadow: var(--shadow-lg);
  display: flex; flex-direction: column; overflow: hidden;
}
.drawer header { padding: 16px 18px; border-bottom: 1px solid var(--border); display: flex; gap: 12px; align-items: flex-start; }
.drawer header h3 { font-size: 15px; }
.drawer .body { overflow-y: auto; padding: 18px; flex: 1; }
.drawer footer { border-top: 1px solid var(--border); padding: 12px 18px; display: flex; gap: 8px; justify-content: flex-end; }

.section-title {
  font-size: 10.5px; text-transform: uppercase; letter-spacing: .08em; color: var(--text-3);
  font-weight: 650; margin: 18px 0 8px;
}
.section-title:first-child { margin-top: 0; }

/* ------------------------------------------------------- provenance rows */

.prov { border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; }
.prov-row { border-bottom: 1px solid var(--border); }
.prov-row:last-child { border-bottom: 0; }
.prov-head {
  display: grid; grid-template-columns: 15px minmax(120px, 1.1fr) minmax(0, 1.5fr) auto auto;
  gap: 12px; align-items: center; padding: 8px 13px; cursor: pointer; width: 100%;
  background: none; border: 0; text-align: left;
}
.prov-head:hover { background: var(--surface-2); }
.prov-head .fname { font-size: 12.5px; font-weight: 550; }
.prov-head .fval { font-size: 12.5px; color: var(--text); overflow-wrap: anywhere; }
.prov-head .fsrc { font-size: 11px; color: var(--text-3); }

<script>
/* --- core/model.js --- */
/* Source of Truth — domain model.
 *
 * Nothing here knows about the mock dataset. This file defines *what kinds of
 * things exist*: connected systems, the canonical field catalog, the levels an
 * organization can be sliced by, and the shape of an assertion.
 *
 * The single most important idea in the product lives here: we never store a
 * merged "golden record". We store immutable per-source assertions and compute
 * the resolved value at read time from a policy. Change the policy and every
 * answer in the application changes, with no migration and no re-sync.
 */
(function (SOT) {
  'use strict';

  /* ---------------------------------------------------------------- sources */

  const SYSTEMS = [
    {
      id: 'workday',
      name: 'Workday',
      category: 'HRIS',
      color: '#0b6ba8',
      idLabel: 'Worker ID',
      deepLink: 'https://wd5.myworkday.com/cobalt/d/inst/{id}/rel-task/2998$26923.htmld',
      syncCadence: 'Nightly, 02:00 UTC',
      blurb: 'Workers, positions, supervisory organizations, effective-dated changes.',
    },
    {
      id: 'salesforce',
      name: 'Salesforce',
      category: 'CRM',
      color: '#0d9dda',
      idLabel: 'User ID',
      deepLink: 'https://cobalt.lightning.force.com/lightning/setup/ManageUsers/page?address=%2F{id}',
      syncCadence: 'Every 15 minutes',
      blurb: 'Users, role hierarchy, territories, accounts, opportunities, quotas.',
    },
    {
      id: 'clari',
      name: 'Clari',
      category: 'Revenue',
      color: '#5b3df5',
      idLabel: 'User ID',
      deepLink: 'https://app.clari.com/admin/users/{id}',
      syncCadence: 'Hourly',
      blurb: 'Forecast hierarchy, quota, commit and best-case rollups.',
    },
    {
      id: 'gong',
      name: 'Gong',
      category: 'Revenue Intelligence',
      color: '#8b2fd6',
      idLabel: 'User ID',
      deepLink: 'https://us-1234.app.gong.io/company/team-members?user={id}',
      syncCadence: 'Every 6 hours',
      blurb: 'Seats, team membership, call and activity volume.',
    },
    {
      id: 'tps',
      name: 'Territory Planning',
      category: 'Planning',
      color: '#0f766e',
      idLabel: 'Assignment ID',
      deepLink: 'https://territories.cobaltsystems.example/assignments/{id}',
      syncCadence: 'Weekly, Sunday 23:00 UTC',
      blurb: 'Territory definitions, coverage models and assignment history.',
    },
    {
      id: 'tableau',
      name: 'Tableau',
      category: 'BI',
      color: '#e8762d',
      idLabel: 'Site User',
      deepLink: 'https://tableau.cobaltsystems.example/#/users/{id}',
      syncCadence: 'Nightly, 04:00 UTC',
      blurb: 'Published dashboards, extracts and their refresh state.',
    },
  ];

  const SYSTEM_BY_ID = Object.fromEntries(SYSTEMS.map((s) => [s.id, s]));

  /* ------------------------------------------------------------ field catalog
   *
   * Every canonical field a person can have. `contributors` lists the systems
   * that are *expected* to carry the field — a linked system that is expected
   * and silent produces a Gap, which is a different problem from a Divergence.
   *
   * `sensitivity` drives redaction. `weight` drives the alignment score, so a
   * wrong manager costs more than a stale office location.
   */
  const FIELDS = [
    { key: 'fullName',         label: 'Full name',         group: 'identity', contributors: ['workday', 'salesforce', 'clari', 'gong'], sensitivity: 'public',     weight: 1, tolerance: 7 },
    { key: 'workEmail',        label: 'Work email',        group: 'identity', contributors: ['workday', 'salesforce', 'gong'],          sensitivity: 'public',     weight: 2, tolerance: 7 },
    { key: 'employeeId',       label: 'Employee ID',       group: 'identity', contributors: ['workday', 'salesforce'],                  sensitivity: 'internal',   weight: 2, tolerance: 30 },
    { key: 'workerType',       label: 'Worker type',       group: 'identity', contributors: ['workday'],                                sensitivity: 'internal',   weight: 2, tolerance: 30 },
    { key: 'employmentStatus', label: 'Employment status', group: 'identity', contributors: ['workday', 'salesforce', 'gong'],          sensitivity: 'internal',   weight: 5, tolerance: 2 },
    { key: 'startDate',        label: 'Start date',        group: 'identity', contributors: ['workday'],                                sensitivity: 'internal',   weight: 1, tolerance: 30 },
    { key: 'location',         label: 'Location',          group: 'identity', contributors: ['workday'],                                sensitivity: 'public',     weight: 1, tolerance: 30 },

    { key: 'jobTitle',         label: 'Job title',         group: 'org',      contributors: ['workday', 'salesforce'],                  sensitivity: 'public',     weight: 2, tolerance: 14 },
    { key: 'jobFamily',        label: 'Job family',        group: 'org',      contributors: ['workday'],                                sensitivity: 'internal',   weight: 1, tolerance: 30 },
    { key: 'positionId',       label: 'Position ID',       group: 'org',      contributors: ['workday', 'salesforce'],                  sensitivity: 'internal',   weight: 2, tolerance: 30 },
    { key: 'managerId',        label: 'Manager',           group: 'org',      contributors: ['workday', 'salesforce', 'clari'],         sensitivity: 'internal',   weight: 4, tolerance: 3 },
    { key: 'department',       label: 'Department',        group: 'org',      contributors: ['workday', 'clari'],                       sensitivity: 'internal',   weight: 3, tolerance: 14 },
    { key: 'costCenter',       label: 'Cost center',       group: 'org',      contributors: ['workday'],                                sensitivity: 'restricted', weight: 1, tolerance: 30 },
    { key: 'team',             label: 'Team',              group: 'org',      contributors: ['workday', 'clari', 'gong'],               sensitivity: 'internal',   weight: 2, tolerance: 14 },
    { key: 'businessUnit',     label: 'Business unit',     group: 'org',      contributors: ['workday'],                                sensitivity: 'public',     weight: 2, tolerance: 30 },
    { key: 'region',           label: 'Region',            group: 'org',      contributors: ['workday', 'tps'],                         sensitivity: 'public',     weight: 2, tolerance: 14 },

    { key: 'territory',        label: 'Territory',         group: 'gtm',      contributors: ['tps', 'salesforce', 'clari'],             sensitivity: 'internal',   weight: 4, tolerance: 7 },
    { key: 'salesRole',        label: 'Salesforce role',   group: 'gtm',      contributors: ['salesforce'],                             sensitivity: 'internal',   weight: 1, tolerance: 14 },
    { key: 'quota',            label: 'Annual quota',      group: 'gtm',      contributors: ['salesforce', 'clari'],                    sensitivity: 'restricted', weight: 4, tolerance: 7 },
    { key: 'segment',          label: 'Segment',           group: 'gtm',      contributors: ['salesforce', 'tps'],                      sensitivity: 'internal',   weight: 2, tolerance: 14 },
  ];

  const FIELD_BY_KEY = Object.fromEntries(FIELDS.map((f) => [f.key, f]));

  /* -------------------------------------------------------- hierarchy levels
   *
   * Deliberately data, not code. A tenant defines its own ladder; the org
   * explorer walks whatever is configured here. Two companies with completely
   * different shapes are a configuration change, not a fork.
   */
  const DEFAULT_HIERARCHY = [
    { key: 'company',      label: 'Company',       source: 'derived' },
    { key: 'businessUnit', label: 'Business Unit', source: 'workday' },
    { key: 'region',       label: 'Region',        source: 'tps' },
    { key: 'segment',      label: 'Segment',       source: 'salesforce' },
    { key: 'team',         label: 'Team',          source: 'workday' },
  ];

  /* ------------------------------------------------------------------- roles
   *
   * Role-based views. `scope` decides which people you can see at all;
   * `maxSensitivity` decides which fields are legible once you can see them.
   * In production this is enforced server-side; here it shapes the UI so the
   * permission model is visible in the demo rather than implied.
   */
  const ROLES = [
    {
      id: 'exec',
      name: 'Executive',
      persona: 'Chief Revenue Officer',
      scope: 'all',
      maxSensitivity: 'restricted',
      landing: '#/dashboard',
      blurb: 'Whole-organization rollup with drill-down into any team.',
    },
    {
      id: 'revops',
      name: 'RevOps',
      persona: 'Director, Revenue Operations',
      scope: 'all',
      maxSensitivity: 'restricted',
      landing: '#/integrity',
      blurb: 'Territory, quota, ownership and cross-system reconciliation.',
    },
    {
      id: 'hr',
      name: 'People Operations',
      persona: 'HRIS Manager',
      scope: 'all',
      maxSensitivity: 'restricted',
      landing: '#/dashboard',
      blurb: 'Workers, positions, reporting lines and organizational change.',
    },
    {
      id: 'manager',
      name: 'Sales Manager',
      persona: 'Manager, Enterprise Sales',
      scope: 'org',
      maxSensitivity: 'internal',
      landing: '#/dashboard',
      blurb: 'Their own reporting line only. Compensation data is redacted.',
    },
  ];

  const SENSITIVITY_RANK = { public: 0, internal: 1, restricted: 2 };

  function canSee(role, sensitivity) {
    return SENSITIVITY_RANK[sensitivity] <= SENSITIVITY_RANK[role.maxSensitivity];
  }

  /* ------------------------------------------------------------- assertions */

  /**
   * An assertion is one system's claim about one field of one entity at one
   * point in time. It is append-only: we never update an assertion, we record
   * a newer one. That is what makes "why did this change?" answerable later.
   *
   * observedAt    — when we read it from the source system (sync freshness)
   * effectiveFrom — when the source says the fact became true (business time)
   *
   * Keeping those apart is the difference between a product and a noise
   * generator: a promotion effective next month is not a data conflict.
   */
  function assertion(entityId, field, value, systemId, observedAt, effectiveFrom, extra) {
    return Object.assign(
      {
        entityId,
        field,
        value,
        systemId,
        observedAt,
        effectiveFrom: effectiveFrom || observedAt,
        effectiveTo: null,
      },
      extra || {}
    );
  }

  const CONFLICT_KINDS = {
    divergence: {
      label: 'Divergence',
      blurb: 'Systems that are both current disagree on the value.',
    },
    lag: {
      label: 'Lag',
      blurb: 'A system is behind. Its value was correct when it was last read.',
    },
    gap: {
      label: 'Gap',
      blurb: 'A system that should carry this field has no value for it.',
    },
  };

  const SEVERITY_ORDER = ['critical', 'high', 'medium', 'low'];

  SOT.model = {
    SYSTEMS,
    SYSTEM_BY_ID,
    FIELDS,
    FIELD_BY_KEY,
    DEFAULT_HIERARCHY,
    ROLES,
    SENSITIVITY_RANK,
    CONFLICT_KINDS,
    SEVERITY_ORDER,
    canSee,
    assertion,
  };
})(window.SOT || (window.SOT = {}));
</script>
<script>
/* --- core/seed.js --- */
/* Source of Truth — synthetic source systems.
 *
 * This file fabricates what six connected systems would hand us. It emits
 * *only* per-source records: there is deliberately no ground-truth roster in
 * the output. The application has to discover people the same way it would in
 * production — by resolving identities across systems — because a prototype
 * that quietly hands itself the right answer proves nothing.
 *
 * Every record is fictional. Names, IDs, domains and revenue figures are
 * generated; none of it corresponds to a real person or company.
 *
 * The dataset is deterministic: same seed, same world, every reload.
 */
(function (SOT) {
  'use strict';

  const DAY = 86400000;

  function mulberry32(a) {
    return function () {
      a |= 0;
      a = (a + 0x6d2b79f5) | 0;
      let t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

    // Global Sales
    ORG_SPEC[0].regions.forEach((reg) => {

      newPerson({
        title: 'Sales Development Representative', jobFamily: JOB_FAMILY['Sales Development Representative'],
        department: 'Sales Development', businessUnit: 'Global Sales', region: 'Americas', segment: 'Commercial',
        team: 'Sales Development', location: pick(['Austin, TX', 'Chicago, IL', 'Remote — US']),
        costCenter: 'CC-2400', managerRid: sdrMgr.rid, level: 4, territory: pick(['Central', 'Mountain', 'Southeast']),
        quota: between(4, 7) * 10000,
      });
    }

    // Customer Success
    const vpCs = newPerson({
      title: 'Vice President, Customer Success', jobFamily: 'Customer Success', department: 'Customer Success',
      businessUnit: 'Customer Success', region: 'Americas', segment: 'Corporate', team: 'CS Leadership',
      location: 'Boston, MA', costCenter: 'CC-3000', managerRid: ceo.rid, level: 1, territory: null,
    });
    [
      { team: 'Onboarding', title: 'Customer Success Manager', dept: 'Customer Success', n: 5 },
      { team: 'Renewals', title: 'Renewal Manager', dept: 'Renewals', n: 6 },
    ].forEach((g) => {
      const mgr = newPerson({
        title: 'Manager, ' + g.team, jobFamily: 'Customer Success', department: g.dept,
        businessUnit: 'Customer Success', region: 'Americas', segment: 'Corporate', team: g.team,
        location: pick(US_LOCATIONS), costCenter: 'CC-30' + between(10, 99), managerRid: vpCs.rid, level: 2,
        territory: null,
      });
      for (let i = 0; i < g.n; i++) {
        newPerson({
          title: g.title, jobFamily: JOB_FAMILY[g.title], department: g.dept, businessUnit: 'Customer Success',
          region: 'Americas', segment: 'Corporate', team: g.team, location: pick(US_LOCATIONS),
          costCenter: mgr.costCenter, managerRid: mgr.rid, level: 3, territory: null,
          quota: g.title === 'Renewal Manager' ? between(20, 40) * 100000 : 0,
        });
      }
    });

    // Revenue Operations
    const srDirOps = newPerson({
      title: 'Senior Director, Revenue Operations', jobFamily: 'Operations', department: 'Revenue Operations',
      businessUnit: 'Revenue Operations', region: 'Americas', segment: 'Corporate', team: 'RevOps Leadership',
      location: 'Denver, CO', costCenter: 'CC-4000', managerRid: cro.rid, level: 2, territory: null,
    });
    [
      { team: 'Sales Operations', title: 'Revenue Operations Analyst', dept: 'Revenue Operations', n: 4 },
      { team: 'Deal Desk', title: 'Deal Desk Analyst', dept: 'Deal Desk', n: 3 },
    ].forEach((g) => {
      const mgr = newPerson({
        title: 'Manager, ' + g.team, jobFamily: 'Operations', department: g.dept,
        businessUnit: 'Revenue Operations', region: 'Americas', segment: 'Corporate', team: g.team,
        location: pick(US_LOCATIONS), costCenter: 'CC-40' + between(10, 99), managerRid: srDirOps.rid, level: 3,
        territory: null,
      });
      for (let i = 0; i < g.n; i++) {
        newPerson({
          title: g.title, jobFamily: JOB_FAMILY[g.title], department: g.dept, businessUnit: 'Revenue Operations',
          region: 'Americas', segment: 'Corporate', team: g.team, location: pick(US_LOCATIONS),
          costCenter: mgr.costCenter, managerRid: mgr.rid, level: 4, territory: null,
        });
      }
    });

    const byRid = Object.fromEntries(roster.map((p) => [p.rid, p]));
    roster.forEach((p) => { if (p.managerRid) byRid[p.managerRid].reports.push(p.rid); });

    /* ------------------------------------------------------- accounts / opps */

    const accounts = [];
    const opportunities = [];
    const sellers = roster.filter((p) => p.quota > 0 && p.department !== 'Sales Development');
    let accSeq = 0;
    let oppSeq = 0;

    sellers.forEach((p) => {
      const n = p.segment === 'Enterprise' ? between(6, 11) : between(10, 16);
      for (let i = 0; i < n; i++) {
        accSeq++;
        const acc = {
          id: '001' + String(500000 + accSeq * 37).slice(-9),
          name: pick(ACCOUNT_PREFIX) + ' ' + pick(ACCOUNT_SUFFIX),
          ownerRid: p.rid,
          segment: p.segment,
          territory: p.territory,
          arr: between(20, 400) * 1000,
          renewalDate: asOf + between(20, 400) * DAY,
        };
        accounts.push(acc);

        if (rand() < 0.8) {
          oppSeq++;
          const stage = STAGES[Math.min(5, Math.floor(Math.pow(rand(), 1.3) * 6))];
          const isEmea = p.region === 'EMEA';
          const currency = isEmea ? (p.team === 'DACH' ? 'EUR' : 'GBP') : 'USD';
          const amountLocal = (p.segment === 'Enterprise' ? between(150, 950) : between(50, 260)) * 1000;
          const daysOut = between(-10, 190);
          opportunities.push({
            id: '006' + String(700000 + oppSeq * 41).slice(-9),
            name: acc.name + ' — ' + pick(['Platform Expansion', 'New Business', 'Renewal + Uplift', 'Pilot Conversion', 'Multi-Year Renewal']),
            accountId: acc.id,
            ownerRid: p.rid,
            amountLocal,
            currency,
            stage: stage.n,
            stageName: stage.name,
            probability: stage.prob,
            closeDate: asOf + daysOut * DAY,
            recordType: rand() < 0.14 ? 'Renewal' : rand() < 0.4 ? 'Expansion' : 'New Business',
            createdDate: asOf - between(1, 260) * DAY,
            forecastCategory: stage.n >= 5 ? 'Commit' : stage.n >= 3 ? 'Best Case' : 'Pipeline',
          });
        }
      }
    });

    // A handful of deals booked into the current quarter in the last two days.
    // They exist in the CRM and in Clari, and cannot exist in a BI extract that
    // last refreshed on Thursday — which is most of why the dashboard is short.
    opportunities.filter((_, i) => i % 47 === 5).slice(0, 7).forEach((o) => {
      o.createdDate = asOf - between(0, 2) * DAY;
      o.closeDate = company.quarter.start + Math.floor(rand() * (company.quarter.end - company.quarter.start));
      if (o.stage < 2) { o.stage = 2; o.stageName = STAGES[1].name; o.probability = STAGES[1].prob; }
    });

    /* --------------------------------------------------------- sync state
     * Gong's connector has been failing for nine days. That is not decoration:
     * it makes every Gong disagreement classify as Lag rather than Divergence,
     * which is exactly the distinction the product is selling.
     */
    const syncState = {
      salesforce: { lastSync: asOf - 12 * 60000, status: 'healthy' },
      workday:    { lastSync: asOf - 8 * 3600000, status: 'healthy' },
      clari:      { lastSync: asOf - 41 * 60000, status: 'healthy' },
      gong:       { lastSync: asOf - 9 * DAY, status: 'degraded', message: 'OAuth token expired — refresh failed 214 times since Jul 31.' },
      tps:        { lastSync: asOf - 6 * DAY, status: 'healthy', message: 'Weekly batch. Next run Sunday 23:00 UTC.' },
      tableau:    { lastSync: asOf - 9 * 3600000, status: 'healthy' },
    };

    /* ------------------------------------------------------------ anomalies
     * Chosen by predicate rather than index so the narrative survives changes
     * to the generator. Each entry is also the demo's answer key.
     */
    const notes = [];
    const flags = {};
    function flag(p, kind, detail) {
      (flags[p.rid] || (flags[p.rid] = [])).push(kind);
      notes.push({ rid: p.rid, name: p.name, kind, detail });
    }

    // Individual contributors on a team: everyone on it who does not manage it.
    const icsByTeam = (team) => roster.filter((p) => p.team === team && p.managerRid && !/^Manager,/.test(p.title));
    const allIcs = roster.filter((p) => p.managerRid && !/^(Manager|Director|Senior Director|Regional Vice|Vice President|Chief)/.test(p.title));

    // 1. Terminated in Workday, still live in Salesforce and Gong.
    const terminated = [icsByTeam('Southeast Enterprise')[1], icsByTeam('Central Commercial')[2]].filter(Boolean);
    terminated.forEach((p) => {
      p.status = 'Terminated';
      p.terminationDate = asOf - between(18, 46) * DAY;
      p.sfdcStillActive = true;
      flag(p, 'ghost-access', 'Terminated in Workday; Salesforce user still active and owns live accounts.');
    });

    // 2. Reorg three days ago. Workday and the fast connectors know about it.
    //    Gong has not run since July, so it still describes the old team —
    //    which is lag, not disagreement, and must not be reported as a defect.
    const reorgTeam = icsByTeam('Northeast Enterprise').slice(0, 4);
    const newMgr = roster.find((p) => p.team === 'Southeast Enterprise' && p.level === 4);
    reorgTeam.forEach((p) => {
      p.priorManagerRid = p.managerRid;
      p.priorTeam = p.team;
      p.managerRid = newMgr.rid;
      p.team = newMgr.team;
      p.managerEffectiveFrom = asOf - 3 * DAY;
      p.staleInSlowSystems = true;
      flag(p, 'reorg-lag', 'Moved teams three days ago. Systems that have not re-read the record are behind, not wrong.');
    });

    // 3. Salesforce role hierarchy edited by hand — a genuine divergence.
    const sfdcMgrDrift = [
      icsByTeam('West Enterprise')[0], icsByTeam('West Enterprise')[3],
      icsByTeam('UK & Ireland')[1], icsByTeam('Central Commercial')[0],
      icsByTeam('Renewals')[2],
    ].filter(Boolean);
    sfdcMgrDrift.forEach((p) => {
      const candidates = roster.filter((q) => q.level === 4 && q.rid !== p.managerRid && q.businessUnit === p.businessUnit);
      p.sfdcManagerRid = candidates.length ? candidates[Math.floor(rand() * candidates.length)].rid : null;
      if (p.sfdcManagerRid) flag(p, 'manager-divergence', 'Salesforce role hierarchy points at a different manager than Workday.');
    });

    // 4. Territory conflicts. Planning system is the system of record; CRM drifted.
    const territoryDrift = [
      icsByTeam('Southeast Enterprise')[0], icsByTeam('West Commercial')[1], icsByTeam('West Commercial')[4],
      icsByTeam('DACH')[0], icsByTeam('Northeast Enterprise')[5], icsByTeam('Central Commercial')[3],
    ].filter(Boolean);
    const NEIGHBOURS = { Northeast: 'Mid-Atlantic', Southeast: 'Southeast — Gulf', Pacific: 'Pacific Northwest', Central: 'Great Lakes', Mountain: 'Pacific', 'UK & Ireland': 'Nordics', DACH: 'Central Europe' };
    territoryDrift.forEach((p) => {
      p.sfdcTerritory = NEIGHBOURS[p.territory] || 'Unassigned';
      flag(p, 'territory-conflict', 'Salesforce and Clari carry a territory the planning system never assigned.');
    });

    // 5. Position ID never written back to the CRM.
    const noPositionId = allIcs.filter((_, i) => i % 9 === 4).slice(0, 8);
    noPositionId.forEach((p) => { p.sfdcNoPositionId = true; flag(p, 'position-gap', 'Position ID is blank on the Salesforce user record.'); });

    // 6. Title drift between HRIS and CRM.
    const titleDrift = allIcs.filter((p) => p.title === 'Senior Account Executive').slice(0, 7);
    titleDrift.forEach((p) => { p.sfdcTitle = 'Account Executive'; flag(p, 'title-drift', 'Promotion recorded in Workday was never reflected in Salesforce.'); });

    // 7. Effective-dated promotions. Correctly NOT a conflict today.
    const scheduled = allIcs.filter((p) => p.title === 'Account Executive' && !p.sfdcTitle).slice(0, 3);
    scheduled.forEach((p) => {
      p.scheduledTitle = 'Senior Account Executive';
      p.scheduledFrom = Date.parse('2026-09-01T00:00:00Z');
      flag(p, 'scheduled-change', 'Promotion effective 1 Sep 2026. Not a discrepancy — a future-dated fact.');
    });

    // 8. Quota loaded into Clari before the CRM was updated.
    const quotaDrift = sellers.filter((_, i) => i % 11 === 3).slice(0, 5);
    quotaDrift.forEach((p) => {
      p.clariQuota = Math.round(p.quota * (rand() < 0.5 ? 1.15 : 0.9) / 5000) * 5000;
      flag(p, 'quota-conflict', 'Clari quota does not match the Salesforce quota record.');
    });

    // 9. Forecast hierarchy mapped to the wrong department.
    const deptDrift = allIcs.filter((_, i) => i % 13 === 6).slice(0, 4);
    deptDrift.forEach((p) => {
      p.clariDepartment = p.department === 'Enterprise Sales' ? 'Commercial Sales' : 'Enterprise Sales';
      flag(p, 'department-conflict', 'Clari forecast node rolls this person into the wrong department.');
    });

    // 10. Duplicate Salesforce user left behind by a rehire.
    const dupe = icsByTeam('UK & Ireland')[3];
    if (dupe) { dupe.duplicateSfdcUser = true; flag(dupe, 'duplicate-identity', 'Two active Salesforce users share this person\'s name and employee number.'); }

    // 11. Gong seat under a personal alias — matches on name only, low confidence.
    const aliasGong = [icsByTeam('West Enterprise')[2], icsByTeam('Onboarding')[1]].filter(Boolean);
    aliasGong.forEach((p) => {
      p.gongAlias = (p.first[0] + p.last).toLowerCase().replace(/[^a-z]/g, '') + '@' + company.domain;
      flag(p, 'weak-identity', 'Gong seat uses an email alias that does not match any HRIS record.');
    });

    // 12. Contractors: live CRM users with no worker record at all.
    const contractors = [
      { name: 'Priya Ellsworth', title: 'Account Executive (Contract)', team: 'Central Commercial', territory: 'Central', segment: 'Commercial' },
      { name: 'Hugo Lindqvist', title: 'Solutions Engineer (Contract)', team: 'West Enterprise', territory: 'Pacific', segment: 'Enterprise' },
    ];

    // 13. Orphan Gong seats nobody owns.
    const orphanGongSeats = [
      { name: 'Sales Demo Account', email: 'sales.demo@' + company.domain },
      { name: 'C. Rowan', email: 'crowan@' + company.domain },
    ];

    /* ------------------------------------------------ emit per-source records */

    const obs = (sys) => syncState[sys].lastSync;
    const mgrOf = (p) => (p.managerRid ? byRid[p.managerRid] : null);

    const workday = roster.map((p) => {
      const mgr = mgrOf(p);
      return {
        workerId: p.workerId,
        positionId: p.positionId,
        legalName: p.name,
        workEmail: p.email,
        jobTitle: p.title,
        jobProfile: p.jobFamily,
        supervisoryOrg: (mgr ? mgr.name + "'s Org" : 'Board of Directors'),
        managerWorkerId: mgr ? mgr.workerId : null,
        department: p.department,
        businessUnit: p.businessUnit,
        region: p.region,
        team: p.team,
        costCenter: p.costCenter,
        location: p.location,
        workerType: p.workerType,
        employmentStatus: p.status,
        hireDate: p.hireDate,
        terminationDate: p.terminationDate,
        managerEffectiveFrom: p.managerEffectiveFrom || p.hireDate,
        teamEffectiveFrom: p.managerEffectiveFrom || p.hireDate,
        scheduledChange: p.scheduledTitle
          ? { field: 'jobTitle', value: p.scheduledTitle, effectiveFrom: p.scheduledFrom }
          : null,
        observedAt: obs('workday'),
      };
    });

    let sfdcSeq = 0;
    const salesforce = [];
    roster.forEach((p) => {
      if (p.status === 'Terminated' && !p.sfdcStillActive) return;
      sfdcSeq++;
      const mgrRid = p.sfdcManagerRid || p.managerRid;
      const mgr = mgrRid ? byRid[mgrRid] : null;
      const rec = {
        userId: '0055f' + String(100000 + sfdcSeq * 17).slice(-6) + 'AB',
        name: p.name,
        email: p.email,
        title: p.sfdcTitle || p.title,
        userRoleName: p.level >= 4 ? p.team + ' — Rep' : p.team + ' — Leadership',
        managerUserId: null, // stitched below
        managerRid: mgr ? mgr.rid : null,
        territory: p.sfdcTerritory || p.territory || null,
        segment: p.segment,
        quotaAnnual: p.quota || null,
        isActive: p.status !== 'Terminated' || !!p.sfdcStillActive,
        profileName: p.level >= 4 ? 'Standard Sales User' : 'Sales Manager',
        employeeNumber: p.sfdcNoPositionId && rand() < 0.4 ? null : p.workerId,
        positionId: p.sfdcNoPositionId ? null : p.positionId,
        lastLogin: asOf - between(0, 14) * DAY,
        observedAt: obs('salesforce'),
        _rid: p.rid,
      };
      salesforce.push(rec);

      if (p.duplicateSfdcUser) {
        sfdcSeq++;
        salesforce.push(Object.assign({}, rec, {
          userId: '0055f' + String(100000 + sfdcSeq * 17).slice(-6) + 'AB',
          email: p.email.replace('@', '.old@'),
          title: 'Account Executive',
          territory: 'Unassigned',
          quotaAnnual: null,
          positionId: null,
          lastLogin: asOf - between(200, 400) * DAY,
          _duplicate: true,
        }));
      }
    });

    contractors.forEach((c, i) => {
      sfdcSeq++;
      const mgr = roster.find((p) => p.team === c.team && p.level === 4);
      salesforce.push({
        userId: '0055f' + String(100000 + sfdcSeq * 17).slice(-6) + 'AB',
        name: c.name,
        email: c.name.toLowerCase().replace(/[^a-z ]/g, '').replace(/ /g, '.') + '@' + company.domain,
        title: c.title,
        userRoleName: c.team + ' — Rep',
        managerUserId: null,
        managerRid: mgr ? mgr.rid : null,
        territory: c.territory,
        segment: c.segment,
        quotaAnnual: 400000 + i * 50000,
        isActive: true,
        profileName: 'Standard Sales User',
        employeeNumber: null,
        positionId: null,
        lastLogin: asOf - between(0, 3) * DAY,
        observedAt: obs('salesforce'),
        _rid: null,
        _contractor: true,
      });
      notes.push({ rid: null, name: c.name, kind: 'no-hr-record', detail: 'Active Salesforce user with no Workday worker record.' });
    });

    // Stitch Salesforce manager pointers now that every user has an ID.
    const sfdcByRid = {};
    salesforce.forEach((r) => { if (r._rid && !r._duplicate) sfdcByRid[r._rid] = r; });
    salesforce.forEach((r) => {
      if (r.managerRid && sfdcByRid[r.managerRid]) r.managerUserId = sfdcByRid[r.managerRid].userId;
      delete r.managerRid;
    });

    let clariSeq = 0;
    const clari = roster
      .filter((p) => p.status !== 'Terminated' && (p.quota > 0 || p.level <= 4))
      .map((p) => {
        clariSeq++;
        const clariMgr = mgrOf(p);
        return {
          userId: 'clari_' + (8800 + clariSeq * 3),
          email: p.email,
          name: p.name,
          forecastNode: (p.clariDepartment || p.department) + ' / ' + p.team,
          department: p.clariDepartment || p.department,
          managerEmail: clariMgr ? clariMgr.email : null,
          territory: p.sfdcTerritory || p.territory || null,
          quota: p.clariQuota || p.quota || null,
          observedAt: obs('clari'),
          _rid: p.rid,
        };
      });

    let gongSeq = 0;
    const gong = roster
      .filter((p) => p.quota > 0 || p.level <= 4)
      .map((p) => {
        gongSeq++;
        return {
          userId: 'gong-' + (55000 + gongSeq * 11),
          emailAddress: p.gongAlias || p.email,
          name: p.name,
          title: p.title,
          teamName: p.priorTeam || p.team,
          active: p.status !== 'Terminated' || !!p.sfdcStillActive,
          callsLast30: between(4, 62),
          meetingsLast30: between(2, 28),
          talkRatioPct: between(38, 71),
          lastActivity: asOf - between(0, 20) * DAY,
          observedAt: obs('gong'),
          _rid: p.rid,
        };
      });

    orphanGongSeats.forEach((s, i) => {
      gongSeq++;
      gong.push({
        userId: 'gong-' + (55000 + gongSeq * 11),
        emailAddress: s.email,
        name: s.name,
        title: null,
        teamName: 'Unassigned',
        active: true,
        callsLast30: i === 0 ? 0 : between(1, 6),
        meetingsLast30: 0,
        talkRatioPct: 0,
        lastActivity: asOf - between(30, 120) * DAY,
        observedAt: obs('gong'),
        _rid: null,
        _orphan: true,
      });
    });

    let tpsSeq = 0;
    const tps = roster
      .filter((p) => p.territory && p.status !== 'Terminated')
      .map((p) => {
        tpsSeq++;
        return {
          assignmentId: 'TA-' + (3300 + tpsSeq * 7),
          assigneeEmail: p.email,
          assigneeName: p.name,
          territoryName: p.territory,
          region: p.region,
          segment: p.segment,
          coverageModel: p.segment === 'Enterprise' ? 'Named Accounts' : 'Geographic',
          effectiveFrom: asOf - between(60, 400) * DAY,
          observedAt: obs('tps'),
          _rid: p.rid,
        };
      });

    let tabSeq = 0;
    const tableau = roster
      .filter((p) => p.level <= 4)
      .map((p) => {
        tabSeq++;
        return {
          siteUserId: 'tab-' + (900 + tabSeq * 5),
          email: p.email,
          name: p.name,
          siteRole: p.level <= 2 ? 'Creator' : p.level === 3 ? 'Explorer' : 'Viewer',
          lastLogin: asOf - between(0, 40) * DAY,
          observedAt: obs('tableau'),
          _rid: p.rid,
        };
      });

    // Record counts advertised on the Systems page: people plus their objects.
    const recordCounts = {
      salesforce: salesforce.length + accounts.length + opportunities.length,
      workday: workday.length * 3,
      clari: clari.length + opportunities.length,
      gong: gong.length + gong.length * 41,
      tps: tps.length + 24,
      tableau: tableau.length + 68,
    };

    return {
      company,
      hierarchy: SOT.model.DEFAULT_HIERARCHY,
      records: { workday, salesforce, clari, gong, tps, tableau },
      accounts,
      opportunities,
      syncState,
      recordCounts,
      notes,
      _rosterSize: roster.length,
      _ridIndex: byRid, // used only by the metric example to attribute pipeline
    };
  }

  SOT.seed = { build, mulberry32 };
})(window.SOT || (window.SOT = {}));
</script>
<script>
/* --- core/adapters.js --- */
/* Source of Truth — source adapters.
 *
 * This is the integration seam. An adapter translates one vendor's schema into
 * two things the rest of the platform understands:
 *
 *   identity(record)   → the keys we can match a human being on
 *   assertions(record) → canonical field claims, with their timestamps
 *
 * Everything downstream — resolution, conflict detection, scoring, the whole
 * UI — is written against those two outputs and knows nothing about Workday or
 * Salesforce. Adding HubSpot or NetSuite later means writing one adapter of
 * about forty lines, not touching the engine.
 *
 * Replacing the mock data with real API calls also happens here and only here:
 * the fetch changes, the adapter's output shape does not.
 */
(function (SOT) {
  'use strict';

  // Manager fields point at another human, but each system names that human in
  // its own dialect. Adapters emit a reference; the resolver dereferences it
  // once identities exist.
  function ref(system, keyType, key) {
    return key == null ? null : { system, keyType, key };
  }

  const ADAPTERS = {
    workday: {
      system: 'workday',
      collection: 'workday',
      // Workday and the planning system record *when a fact became true*.
      // The CRM and the revenue tools only know what they hold right now.
      effectiveDating: true,
      identity: (r) => ({
        nativeId: r.workerId,
        email: r.workEmail,
        name: r.legalName,
        employeeRef: r.workerId,
        team: r.team,
        department: r.department,
        isAuthoritativeRoster: true,
        active: r.employmentStatus === 'Active',
        label: r.jobTitle,
      }),
      assertions: (r) => {
        const t = r.observedAt;
        const out = [
          { field: 'fullName', value: r.legalName, effectiveFrom: r.hireDate },
          { field: 'workEmail', value: r.workEmail, effectiveFrom: r.hireDate },
          { field: 'employeeId', value: r.workerId, effectiveFrom: r.hireDate },
          { field: 'workerType', value: r.workerType, effectiveFrom: r.hireDate },
          { field: 'employmentStatus', value: r.employmentStatus, effectiveFrom: r.terminationDate || r.hireDate },
          { field: 'startDate', value: r.hireDate, effectiveFrom: r.hireDate },
          { field: 'location', value: r.location, effectiveFrom: r.hireDate },
          { field: 'jobTitle', value: r.jobTitle, effectiveFrom: r.hireDate },
          { field: 'jobFamily', value: r.jobProfile, effectiveFrom: r.hireDate },
          { field: 'positionId', value: r.positionId, effectiveFrom: r.hireDate },
          { field: 'department', value: r.department, effectiveFrom: r.hireDate },
          { field: 'costCenter', value: r.costCenter, effectiveFrom: r.hireDate },
          { field: 'team', value: r.team, effectiveFrom: r.teamEffectiveFrom },
          { field: 'businessUnit', value: r.businessUnit, effectiveFrom: r.hireDate },
          { field: 'region', value: r.region, effectiveFrom: r.hireDate },
          { field: 'managerId', value: null, ref: ref('workday', 'employeeRef', r.managerWorkerId), effectiveFrom: r.managerEffectiveFrom },
        ];
        // Future-dated changes are recorded, not applied. A promotion that
        // starts on the first of next month is a fact about the future, and
        // reporting it as a conflict today is how these products lose trust.
        if (r.scheduledChange) {
          out.push({
            field: r.scheduledChange.field,
            value: r.scheduledChange.value,
            effectiveFrom: r.scheduledChange.effectiveFrom,
            scheduled: true,
          });
        }
        return out.map((a) => Object.assign({ observedAt: t }, a));
      },
    },

    salesforce: {
      system: 'salesforce',
      collection: 'salesforce',
      identity: (r) => ({
        nativeId: r.userId,
        email: r.email,
        name: r.name,
        employeeRef: r.employeeNumber,
        team: null,
        department: null,
        active: r.isActive,
        label: r.title,
      }),
      assertions: (r) => {
        const t = r.observedAt;
        return [
          { field: 'fullName', value: r.name },
          { field: 'workEmail', value: r.email },
          { field: 'employeeId', value: r.employeeNumber },
          { field: 'jobTitle', value: r.title },
          { field: 'positionId', value: r.positionId },
          { field: 'territory', value: r.territory },
          { field: 'segment', value: r.segment },
          { field: 'salesRole', value: r.userRoleName },
          { field: 'quota', value: r.quotaAnnual },
          { field: 'employmentStatus', value: r.isActive ? 'Active' : 'Terminated' },
          { field: 'managerId', value: null, ref: ref('salesforce', 'nativeId', r.managerUserId) },
        ].map((a) => Object.assign({ observedAt: t, effectiveFrom: t }, a));
      },
    },

    clari: {
      system: 'clari',
      collection: 'clari',
      identity: (r) => ({
        nativeId: r.userId,
        email: r.email,
        name: r.name,
        employeeRef: null,
        team: (r.forecastNode || '').split(' / ')[1] || null,
        department: r.department,
        active: true,
        label: r.forecastNode,
      }),
      assertions: (r) => {
        const t = r.observedAt;
        return [
          { field: 'fullName', value: r.name },
          { field: 'department', value: r.department },
          { field: 'team', value: (r.forecastNode || '').split(' / ')[1] || null },
          { field: 'territory', value: r.territory },
          { field: 'quota', value: r.quota },
          { field: 'managerId', value: null, ref: ref('clari', 'email', r.managerEmail) },
        ].map((a) => Object.assign({ observedAt: t, effectiveFrom: t }, a));
      },
    },

    gong: {
      system: 'gong',
      collection: 'gong',
      identity: (r) => ({
        nativeId: r.userId,
        email: r.emailAddress,
        name: r.name,
        employeeRef: null,
        team: r.teamName,
        department: null,
        active: r.active,
        label: r.title,
      }),
      assertions: (r) => {
        const t = r.observedAt;
        return [
          { field: 'fullName', value: r.name },
          { field: 'workEmail', value: r.emailAddress },
          { field: 'team', value: r.teamName === 'Unassigned' ? null : r.teamName },
          { field: 'employmentStatus', value: r.active ? 'Active' : 'Terminated' },
        ].map((a) => Object.assign({ observedAt: t, effectiveFrom: t }, a));

    tps: {
      system: 'tps',
      collection: 'tps',
      effectiveDating: true,
      identity: (r) => ({
        nativeId: r.assignmentId,
        email: r.assigneeEmail,
        name: r.assigneeName,
        employeeRef: null,
        team: null,
        department: null,
        active: true,
        label: r.territoryName,
      }),
      assertions: (r) => [
        { field: 'territory', value: r.territoryName, observedAt: r.observedAt, effectiveFrom: r.effectiveFrom },
        { field: 'segment', value: r.segment, observedAt: r.observedAt, effectiveFrom: r.effectiveFrom },
        { field: 'region', value: r.region, observedAt: r.observedAt, effectiveFrom: r.effectiveFrom },
      ],
    },

    tableau: {
      system: 'tableau',
      collection: 'tableau',
      identity: (r) => ({
        nativeId: r.siteUserId,
        email: r.email,
        name: r.name,
        employeeRef: null,
        team: null,
        department: null,
        active: true,
        label: r.siteRole,
